:"FL","h":"495 magnet schools","x":"Florida districts serve about 562,000 students in magnets — decades of running choice before facing competitors.","src":["Ballotpedia","https://ballotpedia.org/School_choice_in_Florida"],"id":"e036"},{"y":2014,"t":"post","j":"FL","h":"UCF Center for Community Schools","x":"A university builds capacity to strengthen existing public schools.","src":["UCF","https://ccie.ucf.edu/communityschools/about/"],"id":"e037"},{"y":2016,"t":"leg","j":"FL","h":"HB 7029 — controlled open enrollment","x":"Any Florida parent may enroll a child in any public school with capacity. Capacity becomes a district-controlled variable.","src":["FLDOE — HB 7029","https://www.fldoe.org/core/fileparse.php/7513/urlt/7029-16.pdf"],"id":"e038"},{"y":2017,"t":"leg","j":"FL","h":"HB 7069 — Schools of Hope","x":"Creates the only statutory carve-out from teacher certification, tied to a school type rather than an educator.","src":["PolitiFact review of § 1002.33","https://politifact.com/factchecks/2018/aug/15/gwen-graham/graham-misspeaks-charter-school-teacher-certificat/"],"id":"e039"},{"y":2017,"t":"post","j":"AZ","h":"ASU Prep Digital opens","x":"A university-run online K–12 school that later accepts Arizona ESA funds.","src":["ASU Prep Digital","https://en.wikipedia.org/wiki/ASU_Prep_Digital"],"id":"e040"},{"y":2020,"t":"law","j":"US","h":"Espinoza v. Montana","x":"A state that funds private schooling cannot exclude religious schools.","src":null,"id":"e041"},{"y":2021,"t":"leg","j":"FL","h":"Florida colleges may sponsor charters","x":"Statutory change lets Florida College System institutions authorize charter schools.","src":["Florida Charter Institute","https://flcharterinstitute.org/authorize/hei/"],"id":"e042"},{"y":2022,"t":"law","j":"US","h":"Carson v. Makin","x":"Extends Espinoza to Maine's town-tuitioning program.","src":null,"id":"e043"},{"y":2022,"t":"rhet","j":"Governor of Colorado","h":"Jared Polis — statement","x":"Public school choice is an asset to t buys a microschool model from a private operator founded by two of its former teachers.","src":["FEE","https://fee.org/articles/why-one-school-district-is-launching-new-microschool-inspired-classrooms/"],"id":"e050"},{"y":2025,"t":"dist","j":"NC","h":"Elizabeth City-Pasquotank microschool","x":"A rural district opens a 26-student microschool modeled on private designs.","src":["EdSurge","https://www.edsurge.com/news/2025-09-22-at-this-rural-microschool-students-will-study-with-ai-and-run-an-airbnb"],"id":"e051"},{"y":2025,"t":"leg","j":"TX","h":"Texas SB 2 — ESAs","x":"Written from day one to let districts sell fee-for-service offerings to non-enrolled ESA students.","src":["TEA letter","https://tea.texas.gov/taa-letters/senate-bill-2-education-savings-accounts-and-children-disabilities"],"id":"e052"},{"y":2025,"t":"post","j":"AZ","h":"Rio Salado's record dual-enrollment year","x":"408 high-school students on track for associate degrees; half from one charter network.","src":["Rio Salado","https://www.riosalado.edu/news/2025/400-high-school-students-track-earn-college-degrees-rio-salado-celebrates-record-dual-enrollment"],"id":"e053"},{"y":2026,"t":"dist","j":"FL","h":"Orange County closes seven schools","x":"After losing about 6,600–7,000 students in a year; no new campuses until 2031.","src":["Spectrum News 13","https://mynews13.com/fl/orlando/news/2026/08/05/students-in-central-florida-go-back-to-school-amid-districts-seeing-lower-enrollment-numbers"],"id":"e054"},{"y":2026,"t":"dist","j":"FL","h":"53 of 67 districts are vendors","x":"Approved or in process to sell to scholarship students they do not enroll.","src":["Next Steps","https://nextstepsblog.org/2026/07/panel-shares-florida-a-la-carte-learning-story-with-lawmakers-from-across-america/"],"id":"e055"},{"y":2026,"t":"leg","j":"CO","h":"Colorado SB 26-023","x":"Re-regulates part-time homeschool programs after the market matured; districts limited to their own boundaries.","src":["Chalkbeat Colorado","https://www.chalkbeat.org/colorado/2026/05/19/lawmakers-make-homeschool-enrichment-changes-but-not-to-funding-rate/"],"id":"e056"},{"y":2026,"t":"post","j":"IN","h":"Purdue Polytechnic closes a campus","x":"University-affiliated K–12 is not a guaranteed win.","src":["Chalkbeat Indiana","https://www.chalkbeat.org/indiana/2026/02/10/purdue-polytechnic-high-school-close-south-bend-campus/"],"id":"e057"},{"y":2026,"t":"rhet","j":"FL","h":"Jeb Bush on the “supply side”","x":"Calls for attention to the supply side of school choice — the prompt for WMFC's educator-pipeline work.","src":null,"id":"e058"},{"y":2026,"t":"rhet","j":"Democratic political organization","h":"Democrats for Education Reform — op-ed","x":"Published “Democrats, It’s Time to Embrace School Choice” in the New York Times, arguing the country is in a decade-long education depression and that families with the means to leave are already leaving.","src":["Democrats for Education Reform","https://dfer.org/2026/02/17/democrats-its-time-to-embrace-school-choice/"],"tag":"Democratic record","id":"e059"},{"y":2026,"t":"rhet","j":"Governor of Colorado","h":"Jared Polis — official act","x":"I’m proud that Colorado is the first Democratic state to come online.","src":["Colorado Springs Gazette / Colorado Newsline","https://coloradonewsline.com/2026/02/11/other-democratic-governors-are-wary-of-new-trump-school-funding-program-not-polis/"],"tag":"Democratic record","id":"e060"},{"y":2026,"t":"rhet","j":"Mayor of Providence 2015–2023; CEO, Democrats for Education Reform","h":"Jorge Elorza — statement","x":"Public education is a goal. It’s not a particular set of institutions.","src":["Fox News Digital","https://www.foxnews.com/media/former-democratic-mayor-goes-against-grain-backing-school-choice-calls-party-embrace.amp"],"tag":"Democratic record","id":"e061"},{"y":2026,"t":"rhet","j":"Pennsylvania House Majority Leader and caucus members","h":"Matt Bradford & PA House Democrats — legislative shift","x":"Bradford — who killed the 2023 scholarship program — called some uses of the new federal tax credits “intriguing.” A June 2025 letter signed by ten House Democrats, including five Philadelphians and the head of the Pennsylvania Legislative Black Caucus, asked leadership to expand tax-credit scholarships for students in the lowest-achieving districts.","src":["Philadelphia Inquirer","https://www.inquirer.com/politics/pennsylvania/school-choice-state-federal-funding-pennsylvania-democrats-josh-shapiro-20260628.html"],"tag":"Democratic record","id":"e062"},{"y":2027,"t":"leg","j":"US","h":"Federal scholarship tax credit takes effect","x":"Effective January 2027.","src":null,"id":"e063"}],"index":{"categories":{"Tier 1":{"label":"Built for sector","class":"p1","def":"Stated purpose is to prepare, credential, support or operate education outside district-run schools."},"Tier 2":{"label":"Names sector","class":"p2","def":"Institutional text explicitly names private, classical, charter or non-traditional settings — or a dedicated school-choice course exists."},"Tier 3":{"label":"Incidental","class":"p3","def":"Reaches these educators only as a side effect, or is explicitly built around district partnership."},"Tier 0":{"label":"Nothing found","class":"p0","def":"No offering identified. Absence of evidence, not evidence of absence."}},"depths":{"complete":{"label":"Systematic pass","class":"d1","def":"Every institution in the defined population was read individually. A Tier 0 row here means nothing was found after looking for it."},"partial":{"label":"Partial pass","class":"d2","def":"Some institutions read individually, the rest covered by a summary row. State totals are incomplete by design."},"placeholder":{"label":"Placeholder","class":"d3","def":"One or two rows surfaced by national search rather than a state scan. Records what was found, never what exists."}},"coverage":{"Florida":{"depth":"complete","note":"The State University System education units, three Florida College System baccalaureate providers, and the major private institutions."},"Michigan":{"depth":"complete","note":"All eight public universities that authorize charter schools, plus one row recording statewide authorizing context."},"Ohio":{"depth":"partial","note":"Two private institutions read individually. The public universities are covered by one summary row and have not been read one by one."},"Indiana":{"depth":"placeholder","note":"IU East surfaced in a national microschool search. Indiana has not been scanned."},"Arizona":{"depth":"placeholder","note":"Arizona State only. The largest ESA program in the country against the thinnest coverage in this table — the highest-value gap in the Index."},"Arkansas":{"depth":"placeholder","note":"The University of Arkansas only. Arkansas has not been scanned."},"West Virginia":{"depth":"placeholder","note":"One row covering both WVU and Marshall. Neither was read institution by institution."},"California":{"depth":"placeholder","note":"One summary row standing for the whole state, held as a low-choice control. No institution has been read individually."},"New York":{"depth":"placeholder","note":"One summary row standing for the whole state, held as a low-choice control. No institution has been read individually."}},"preparedness":[{"label":"Public district","value":87,"highlight":false},{"label":"Private","value":74,"highlight":false},{"label":"Charter","value":67,"highlight":false},{"label":"Religious","value":49,"highlight":false},{"label":"Microschools","value":34,"highlight":true}],"institutions":[{"name":"University of Florida","state":"Florida","tier":"Tier 0","checked":"2026-07-24","evidence":"Course-level pass completed: the School of Teaching &amp; Learning undergraduate course list was enumerated in full. Zero courses on school choice, vouchers, ESAs, homeschooling or microschools. UF also operates P.K. Yonge, a PreK-12 lab school that is a department of the College of Education.","source":"https://catalog.ufl.edu/UGRD/courses/school_of_teaching_and_learning/"},{"name":"Florida State University","state":"Florida","tier":"Tier 0","checked":"2026-07-24","evidence":"No choice centre or credential found. FSU operates Florida State University Schools, a lab school — vehicle present, unused for this purpose.","source":"https://registrar.fsu.edu/bulletin/undergraduate-departments/teacher-education"},{"name":"University of South Florida","state":"Florida","tier":"Tier 0","checked":"2026-07-24","evidence":"Homeschool-facing activity is admissions and dual enrolment only. The InED network of 125+ microschools serving 8,000+ students operates in the same metro area.","source":"https://admissions.usf.edu/blog/homeschool-guide-to-admissions"},{"name":"University of Central Florida","state":"Florida","tier":"Tier 3","checked":"2026-07-24","evidence":"Center for Community Schools scales a model that structurally requires a school district as a core partner.","source":"https://ccie.ucf.edu/communityschools/about/"},{"name":"Florida International University","state":"Florida","tier":"Tier 0","checked":"2026-07-24","evidence":"No education-unit choice program found. The micro-credential office sits in Student Affairs.","source":"https://dasa.fiu.edu/all-departments/office-of-micro-credentials/"},{"name":"Florida Atlantic University","state":"Florida","tier":"Tier 3","checked":"2026-07-24","evidence":"School Leaders Program is a formal university–district partnership whose stated aim is 'the best public education.'","source":"https://www.fau.edu/education/academicdepartments/el/school-leaders/masters-school-leaders/elite/overview/"},{"name":"University of North Florida","state":"Florida","tier":"Tier 0","checked":"2026-07-24","evidence":"Graduate portfolio is conventional: ESE, Special Education, C&amp;I doctorate, STEM and Digital Humanities certificates.","source":"https://www.unf.edu/uniquelyunf/graduateschool/coehs/index.html"},{"name":"Florida Gulf Coast University","state":"Florida","tier":"Tier 2","checked":"2026-07-24","evidence":"The M.A. Educational Leadership P-12 <b>non-certification<\/b> track names 'teachers working in private schools, charter schools, academies or non-traditional education settings.'","source":"https://onlinedegree.fgcu.edu/programs/maed-education-leadership-p-12-education/"},{"name":"University of West Florida","state":"Florida","tier":"Tier 1","checked":"2026-08-08","evidence":"<b>CORRECTED 8 AUGUST 2026 — was coded Tier 0.<\/b> The University of West Florida appears in the Florida Department of Education's own <i>Directory of Charter School Sponsoring Entities<\/i> as an approved sponsor (entity 87), and its Board of Trustees has approved the university as authorizer of a Somerset Academy charter elementary school. Our July pass read only the School of Education program roster — CAEP-accredited through 2030, nothing choice-facing — and coded the institution Tier 0 on that basis. <b>That was the precise error this Index exists to avoid.<\/b> Our own method states that operating and authorizing moves are coded, not just programs, because a catalog scan misses the main event. We then made the catalog-scan mistake in our own home state. Recoded Tier 1 for the authorizing move. The education-unit finding is unchanged and stands alongside it: no program built for the sector was identified in the School of Education.","source":"https://web01.fldoe.org/CSA/PostToWeb/CharterSchoolSponsoringEntities"},{"name":"Florida A&amp;M University","state":"Florida","tier":"Tier 0","checked":"2026-07-24","evidence":"Four departments, CAEP-accredited, entirely conventional.","source":"https://famu.catalog.acalog.com/preview_entity.php?catoid=8&ent_oid=653"},{"name":"New College of Florida","state":"Florida","tier":"Tier 0","checked":"2026-07-24","evidence":"No teacher preparation found despite the classical-education pivot. Standing alert if classical teacher prep launches.","source":"https://classicaldifference.com/classical-education-meets-new-college-of-florida/"},{"name":"Flagler College","state":"Florida","tier":"Tier 2","checked":"2026-07-24","evidence":"Institute for Classical Education (2023–): seminars, contracted PD, summer workshop with a Classical School Leadership track. Audience overwhelmingly choice-funded. Crucially <b>non-credit<\/b>.","source":"https://www.flagler.edu/academics/graduate-and-education-programs/institute-classical-education"},{"name":"Trinity College of Florida","state":"Florida","tier":"Tier 2","checked":"2026-07-24","evidence":"B.A. Elementary Education explicitly places interns in 'Christian schools, public schools, charter schools or overseas mission schools.'","source":"https://www.trinitycollege.edu/academics/bachelor-of-arts-elementary-education-major/"},{"name":"Nova Southeastern University","state":"Florida","tier":"Tier 0","checked":"2026-08-08","evidence":"<b>THE ONLY CONFIRMED RETRENCHMENT IN THE SCAN.<\/b> Nova Southeastern built a choice-sector program and no longer offers it. The evidence is the university's own: NSUWorks, NSU's institutional repository, holds a Program Overview titled <i>&ldquo;NSU Master's Degree in Charter School Education/Leadership&rdquo;<\/i>, attributed to the Fischler Graduate School of Education and Human Services, indexed under keywords including <i>charter school<\/i>, <i>Miami-Dade<\/i>, <i>specialization<\/i> and <i>modified core<\/i>. The current master's roster of the Abraham S. Fischler College of Education &amp; School of Criminal Justice was read in full on 8 August 2026 (education.nova.edu/degrees/masters): Applied Behavior Analysis, Child Protection, Criminal Justice, Developmental Disabilities, Education, Educational Leadership, Leadership. No charter or choice-sector program appears. Coded Tier 0 because Tier reflects what is currently offered. <b>The limit:<\/b> the repository dates the document only as approximate (2002, deposited 2016) and it carries no discontinuation record. Existence and current absence are both documented; <b>the date the program ended is not<\/b>, and should not be asserted. <b>Why it matters:<\/b> every other Tier 0 row in this Index records an institution that has not built. This one records an institution that built and stopped. Those are different phenomena and the four competing explanations do not treat them the same way.","source":"https://nsuworks.nova.edu/abe_pgcoursecatalogs/237/"},{"name":"Palm Beach Atlantic University","state":"Florida","tier":"Tier 3","checked":"2026-07-24","evidence":"Feeds Christian schools by affiliation; no program names the sector.","source":"https://www.pba.edu/academics/schools/education-behavioral/"},{"name":"Southeastern University","state":"Florida","tier":"Tier 3","checked":"2026-07-24","evidence":"FLDOE-approved early childhood degree. Affiliation, not program design.","source":"https://seu.edu/about/"},{"name":"Stetson University","state":"Florida","tier":"Tier 0","checked":"2026-07-24","evidence":"Conventional teacher preparation; nothing surfaced across two searches.","source":"https://www.stetson.edu/artsci/education/home/"},{"name":"University of Miami","state":"Florida","tier":"Tier 0","checked":"2026-07-24","evidence":"The 'homeschool navigator' hit proved to be an advising role governing credit overloads. False positive cleared.","source":"https://bulletin.miami.edu/undergraduate-academic-programs/education-human-development/"},{"name":"Tallahassee State College","state":"Florida","tier":"Tier 1","checked":"2026-07-24","evidence":"First Florida College System institution approved as a charter authorizer (Jan 2023), then founded Tallahassee Collegiate Academy (Aug 2023) — from outside any college of education.","source":"https://www.wctv.tv/2023/01/31/tcc-is-first-college-florida-approved-by-fdoe-charter-school-authorizer/"},{"name":"Central Michigan University","state":"Michigan","tier":"Tier 1","checked":"2026-07-26","evidence":"<b>THE MICHIGAN FINDING.<\/b> College of Education &amp; Human Services offers an online M.A. in Educational Leadership with a <b>Charter School Leadership emphasis<\/b> — program text names 'public, private, charter, and virtual schools, educational service providers, authorizers.' The first preparation program built for the choice sector found anywhere in this scan. Context: CMU became the nation's first university charter authorizer (1994) and remains its largest — the Governor John Engler Center partners with roughly 70 schools serving about 30,000 students. The authorizing center sits outside the education college; the degree sits inside it.","source":"https://www.cmich.edu/academics/colleges/college-education-human-services/departments/counseling-educational-leadership-higher-education/educational-leadership-pk-12"},{"name":"Grand Valley State University","state":"Michigan","tier":"Tier 1","checked":"2026-07-26","evidence":"Charter Schools Office authorizes <b>78 schools serving 34,000+ students<\/b>. Beyond authorizing: 'Charter Through College' programs — campus visits, dedicated advising, and a Charter School Alumni Scholarship — build a student pipeline from its charter schools into the university. Institutional engagement at scale; no dedicated preparation degree found in this pass.","source":"https://www.gvsu.edu/cso/"},{"name":"Michigan (system context)","scope":"aggregate","state":"Michigan","tier":"Tier 1","checked":"2026-07-26","evidence":"Eight Michigan public universities and three community colleges authorize charters statewide; university authorizers may charter anywhere in the state. Michigan is the deepest university-charter ecosystem in the country. Six university authorizers remain unexamined.","source":"https://www.michigan.gov/mde/services/flexible-learning/options/psa/psa-faqs/partners/authorizers"},{"name":"Indiana University East","state":"Indiana","tier":"Tier 1","checked":"2026-07-24","evidence":"IU East High School — a microschool on campus, presented under the School of Education as 'an on-campus lab school.' Part of the Indiana Microschool Collaborative. The education unit is running a microschool.","source":"https://east.iu.edu/education/microschool/index.html"},{"name":"Arizona State University","state":"Arizona","tier":"Tier 1","checked":"2026-07-24","evidence":"ASU Prep runs microschools and a Microschool Entrepreneur Fellowship — housed in the charter arm, not the education college.","source":"https://www.asuprepglobal.org/microschool-fellowship/"},{"name":"University of Arkansas","state":"Arkansas","tier":"Tier 2","checked":"2026-07-24","evidence":"Department of Education Reform: Ph.D. with a dedicated parental school choice course. A research degree, facing no licensure constraint.","source":"https://edre.uark.edu/phd-education-policy/course-descriptions.php"},{"name":"Ohio public universities","scope":"aggregate","state":"Ohio","tier":"Tier 3","checked":"2026-07-24","evidence":"Ohio law permits university sponsorship; Bowling Green State sponsored Toledo School for the Arts. No education-unit program surfaced. Authority present, penetration high, little built.","source":"https://education.ohio.gov/Topics/Ohio-Education-Options/Ohio-School-Sponsorship-Program"},{"name":"University of Dayton","state":"Ohio","tier":"Tier 2","checked":"2026-07-24","evidence":"Ed Leadership M.S.E. prepares graduates for 'public, private, and parochial' sectors.","source":"https://udayton.edu/academics/programs/ed-leadership-mse/index.php"},{"name":"Ashland University","state":"Ohio","tier":"Tier 2","checked":"2026-07-26","evidence":"Operates a <b>Homeschool and Classical Learning Center<\/b> 'designed to help homeschooled and classical learning students transition into higher education.' Admissions-side engagement with the homeschool sector — the first Ohio institution found naming it. Softens, but does not overturn, Ohio's null: still no educator-preparation program.","source":"https://www.ashland.edu/homeschool-classical-learning-center"},{"name":"WVU / Marshall University","scope":"aggregate","state":"West Virginia","tier":"Tier 0","checked":"2026-07-24","evidence":"Despite a now-universal ESA (~$5,436/student), nothing surfaced at either flagship. Low search depth — provisional, should not be used as evidence yet.","source":"https://hopescholarshipwv.gov/"},{"name":"California institutions","scope":"aggregate","state":"California","tier":"Tier 0","checked":"2026-07-24","evidence":"<b>Control.<\/b> No ESA or voucher exists; no university program surfaced. Microschools operate privately without university involvement.","source":"https://numaschool.com/states/california/homeschool-funding"},{"name":"New York institutions","scope":"aggregate","state":"New York","tier":"Tier 0","checked":"2026-07-24","evidence":"<b>Control.<\/b> No funding mechanism. Teacher U left Hunter College in 2011 and became Relay — the choice sector's pipeline exited the university and formed its own accreditor.","source":"https://www.hunter.cuny.edu/news/hunter-education-school-debuts-suite-of-micro-credentials/"},{"name":"Oakland University","state":"Michigan","tier":"Tier 1","checked":"2026-08-08","evidence":"<b>THE DEEPEST STRUCTURAL INTEGRATION IN THE STATE — AND STILL NO PROGRAM.<\/b> The Office of Public School Academies is housed <i>inside<\/i> the School of Education and Human Services, in Pawley Hall, and reports through it. The authorizer's own text states the reason: the office's placement within SEHS &ldquo;demonstrates further our commitment to excellence, marshalling the strength of its programs and faculty to increase the proficiency and expertise of Academy teachers and administrators.&rdquo; Chartering policy adopted 1995; first school opened 1996; currently seven academies with over 4,800 students, deliberately capped and geographically restricted to Macomb, Oakland and Wayne counties. OU/PSA's stated vision is to &ldquo;advance excellence in public education through choice.&rdquo; Campus pipeline programs run across five units, plus academy-student scholarships. <b>And yet:<\/b> the SEHS Department of Organizational Leadership's M.Ed. and Ed.S. in Educational Leadership prepare candidates for building-level roles &mdash; principal, assistant principal, dean of students &mdash; with no charter, choice or non-district emphasis in the program text. Of all eight Michigan university authorizers, Oakland has bound authorizing most tightly to its education school and has built the least curriculum from it. This is the sharpest available test of whether proximity produces programs, and it comes back negative.","source":"https://www.oakland.edu/psa/about-us/"},{"name":"Saginaw Valley State University","state":"Michigan","tier":"Tier 1","checked":"2026-08-08","evidence":"<b>A PRICE MECHANISM, NOT A CURRICULUM.<\/b> The School/University Partnership Office was established by the SVSU Board of Control in 1995 and now serves over 10,000 students across 17 academies statewide; authorizer accreditation from AdvancED in 2017, renewed by Cognia through 2027. The engagement that reaches the education unit is financial: the PSA Teacher/Administrator Scholarship gives teachers and administrators of SVSU-authorized academies 50% tuition remission at 3&ndash;5 years of academy service and 75% at 6+, for up to 15 credits per year, explicitly &ldquo;to obtain continuing education credits or to complete a program through the College of Education.&rdquo; Coded Tier 1 because its stated purpose is to credential educators working outside district-run schools. <b>The limit matters as much as the finding:<\/b> the subsidy changes the price of the standard degree, not its content. No course, concentration or credential in the College of Education is built for the sector the scholarship recruits from.","source":"https://www.svsu.edu/supo/opportunities/psateacherleaderscholarships/"},{"name":"Northern Michigan University","state":"Michigan","tier":"Tier 2","checked":"2026-08-08","evidence":"<b>THE FLOW RUNS THE WRONG WAY.<\/b> NMU resolved to authorize in 1995 and currently holds nine academies, including two centred on Native American culture (Joseph K. Lumsden Bahweting Anishnabe, Nah Tah Wahsh) and one on academic service learning (North Star). The Charter Schools Office names the education unit explicitly &mdash; but as a beneficiary, not a provider: the academies &ldquo;provide an excellent opportunity for hands-on classroom experience for NMU's hundreds of elementary and secondary education majors&hellip; as they prepare for their student teaching experiences and professional careers.&rdquo; Charter schools are the practicum sites; the preparation they feed is conventional licensure. The School of Education, Leadership and Public Service offers an M.A.E. in Educational Administration: Administration and Supervision with no choice-sector content identified. The institution uses the sector to train teachers for the system, not the system to train teachers for the sector.","source":"https://nmu.edu/charterschools/school-information"},{"name":"Eastern Michigan University","state":"Michigan","tier":"Tier 2","checked":"2026-08-08","evidence":"Founded 1849 as the nation's first four-year teaching degree; the College of Education runs over 95 distinct programs. The Charter Schools Office oversees nine public school academies across Wayne, Oakland, Washtenaw, Genesee and Saginaw counties, and its own description places the education unit inside the arrangement &mdash; the office operates &ldquo;with the support of Eastern's College of Education, the Michigan Department of Education, and the Michigan Association of Public School Academies.&rdquo; That naming is the whole of the Tier 2 evidence. Nothing in the College of Education's catalogue answers it: Educational Leadership &mdash; K-12 Administration (M.A.), Educational Leadership (Sp.A., Ph.D.) and Curriculum &amp; Instruction &mdash; Leadership (M.A.) are written for conventional building and district administration. The largest teacher-preparation history in the state, nine schools of its own, and no offering built for either.","source":"https://www.emich.edu/charter-schools/index.php"},{"name":"Ferris State University","state":"Michigan","tier":"Tier 3","checked":"2026-08-08","evidence":"The Charter Schools Office reports through Academic Affairs, organisationally separate from the School of Education in the College of Arts, Sciences and Education &mdash; the opposite arrangement to Oakland's. Its published vision, mission and six core values concern oversight quality (academics, finances, operations, governance) and make no reference to preparing or credentialing anyone for the sector. On the education side, the M.S. in Educational Leadership is built around a sponsored internship in which candidates are &ldquo;sponsored and mentored by a local district or approved educational organization&rdquo; &mdash; district named first, the alternative left generic. Coded Tier 3 on that district-first framing. The authorized-schools roster was not enumerated in this pass; a third-party profile reports roughly 21 academies and 9,200 students, which is <b>not<\/b> a WMFC-verified figure and should not be cited as one.","source":"https://www.ferris.edu/administration/academicaffairs/charterschools/about.htm"},{"name":"Lake Superior State University","state":"Michigan","tier":"Tier 3","checked":"2026-08-08","evidence":"Nineteen academies on the published roster (enumerated in full, 8 August 2026), several of them explicitly non-conventional models &mdash; iCademy Global, Innocademy and Innocademy Allegan, Macomb Montessori Academy, two W-A-Y (Widening Advancements for Youth) academies. LSSU is actively expanding: an application window for new academies runs 18 May &ndash; 1 June 2026 for schools opening no earlier than 2028&ndash;29, and the office states it seeks applications offering &ldquo;a unique educational option not already available in the proposed area&rdquo; &mdash; an authorizer selecting for differentiation on purpose. The School of Education points the other way: its stated commitment is &ldquo;preparing teachers for small, rural schools&rdquo; through partnerships with districts in the Eastern Upper Peninsula and Ontario. Teacher Education (EDUC) offerings show no choice-sector content. The authorizing arm recruits novel school models; the preparation arm trains for rural districts.","source":"https://www.lssu.edu/charter-schools/"},{"name":"Miami Dade College","state":"Florida","tier":"Tier 1","checked":"2026-08-08","evidence":"<b>THE INFRASTRUCTURE MOVE.<\/b> Miami Dade College is an approved charter sponsor under the 2021 statutory change permitting Florida College System institutions to sponsor charters within their service area. It went considerably further than sponsoring: MDC <i>powers<\/i> the Florida Charter Institute, whose Authorizing Division reviews applications and conducts oversight on behalf of higher-education authorizers generally — including Pasco-Hernando State College. One college now operates the authorizing apparatus other colleges use. MDC's board approved its first six charter applications in February 2026. <b>Limits:<\/b> the MDC education unit has not yet been enumerated to WMFC standard, so this row codes the authorizing move only and no claim is made about MDC's teacher-preparation offerings in either direction. The institute sits outside the education unit, as at Tallahassee State College and Central Michigan University.","source":"https://flcharterinstitute.org/authorize/hei/"},{"name":"Pasco-Hernando State College","state":"Florida","tier":"Tier 1","checked":"2026-08-08","evidence":"Approved by the State Board of Education to sponsor charter schools; listed in FLDOE's Directory of Charter School Sponsoring Entities as entity 86 (PHSC K12). Its stated purpose is explicit about the sector: sponsorship is &ldquo;intended to offer additional, high-quality educational options for the communities located in the two PHSC service areas.&rdquo; The college issued its first charter to Dayspring Academy's Early College Academy — a school that had operated for roughly a decade under the Pasco County school board, meaning the move transferred an existing school from district to college oversight rather than creating a new one. PHSC accepts applications only by RFP and partners with the Florida Charter Institute to review them. <b>Limits:<\/b> the PHSC education unit has not been enumerated to WMFC standard; this row codes the authorizing move only.","source":"https://flcharterinstitute.org/authorize/hei/"}],"hypotheses":[{"id":"H1","name":"No relationship between policy and response","status":"Rejected","detail":"High-policy states both with and without engagement; zero-policy controls with none. Not random, not simple."},{"id":"H2","name":"Universities respond when they can hold or authorize a school","status":"Weakened by completing Michigan","detail":"This edition was designed to test H2 and the test came back negative. All eight Michigan public university authorizers are now coded. Six were added in August 2026 and none has a preparation program. Scale-of-holding does not rescue the hypothesis either: Grand Valley State holds 78 schools and 34,000+ students — more than Central Michigan — and has built no degree. Nor does organisational proximity: Oakland houses its authorizing office inside the School of Education and Human Services and states that the placement exists to raise the expertise of academy teachers, and its leadership degrees remain generic building-level preparation. Holding schools, holding many schools, and holding them inside the education college were each present without producing a program. H2 as stated no longer survives; whatever explains Central Michigan is more specific than the instrument."},{"id":"H3","name":"Accreditation and licensure define what can be built","status":"Strengthened by completing Michigan","detail":"Every form of engagement found in the six new Michigan institutions stops at the licensure boundary, without exception. Saginaw Valley State's tuition remission is for teachers and administrators of its academies — licensed roles — pursuing conventional College of Education credentials. Northern Michigan routes its academies into practicum placements for candidates seeking standard licensure. Eastern Michigan's leadership degrees are written for building and district administration. Nothing anywhere in the Index serves the unlicensed slice — microschools, homeschool co-ops, ESA vendors — which is where the 750,000 microschool students are. H3 now fits every observation in 39 institutions."},{"id":"H4","name":"No procurement channel to individual buyers","status":"Untested, but the Nova Southeastern case now bears on it","detail":"Central Michigan's program is fully online and sold to individuals — mild counter-evidence that the channel is impossible. The Nova Southeastern case is now documented rather than suspected: NSU's own repository holds a Program Overview for a Master's in Charter School Education/Leadership that no longer appears on its roster. A program in this space was built and did not survive. Whether it failed for want of buyers, for want of a channel to reach them, or for reasons internal to the institution is exactly what H4 asks and what the record does not yet answer. The discontinuation is undated, so no inference about timing or cause is available."}],"gaps":[{"id":"G1","title":"The snapshot never became a series","who":"EdChoice","body":"<i>Surfing the Pipeline<\/i> (2023) is the only systematic catalog scan of education schools for choice-sector offerings — published the very year Florida went universal, making it a near-perfect baseline. Baselines only matter if someone takes the second reading. Nobody has.","evidence":"Cheapest high-value study available in this space."},{"id":"G2","title":"'An enterprising dean' assumes the barrier is imagination","who":"EdChoice","body":"The 2023 recommendation locates the obstacle in vision and initiative. It never tests the alternatives: accreditation and licensure limits, or the absence of a sales channel to individual buyers. Michigan now suggests a third: time-with-the-instrument — CMU's program follows thirty years of authorizing.","evidence":"Three years of universal ESA money in Florida produced zero programs."},{"id":"G3","title":"Catalog scans cannot see what universities actually did","who":"EdChoice / Hanover","body":"The method searched catalogs for programs and classes. Most confirmed university entries — running a microschool, authorizing charters, founding a school — never appear in a course catalog. The dominant institutional response is invisible to the dominant research method.","evidence":"ASU Prep, IU East High School, Tallahassee Collegiate Academy and GVSU's 78 schools all return null in a catalog search."},{"id":"G4","title":"Policy adoption is tracked; workforce capacity is not","who":"ExcelinEd","body":"School Choice Matters analyses all 50 states across roughly 40 policy areas — a genuinely impressive instrument for measuring whether a state has passed the policy. It contains nothing on whether the educator workforce exists to staff what the policy enables.","evidence":"A state can score well on every policy dimension while having no trained supply."},{"id":"G5","title":"The quality tracker covers the wrong denominator","who":"NCTQ","body":"The Teacher Prep Review evaluates 1,244 elementary programs across 1,053 institutions — but only 59 non-traditional programs, because traditional routes produce 96% of prepared teachers. Defensible sampling for its purpose; it also means the fastest-growing school sector sits outside the field's main quality instrument.","evidence":"Standards are benchmarked to what new teachers need in conventional classrooms."},{"id":"G6","title":"The sector's own association is investing in the other direction","who":"AACTE","body":"Education bachelor's degrees fell from roughly 109,600 to 90,700 over two decades. The field's flagship 2026 response was a request for $2.5 billion in federal funding to rebuild the traditional pipeline — a bet on the existing model at the moment the demand side is being restructured.","evidence":"No comparable investment or position addressing non-district settings surfaced."},{"id":"G7","title":"Nobody has looked at the mature systems","who":"Everyone","body":"The Netherlands has funded school choice constitutionally since 1917, with roughly three-quarters of primary pupils in privately-run publicly-funded schools. Sweden since 1992, Chile since 1981. England deliberately moved teacher training out of universities into schools. These are the equilibrium cases — and Michigan's thirty-year story suggests exactly why maturity matters.","evidence":"US-only framing makes a century-old question look new."},{"id":"G8","title":"University leadership frames this as demography, not competition","who":"Higher ed","body":"Declining education enrolment is absorbed into the enrolment-cliff story — US high school graduates peaked in 2025 and are projected to fall 13% through 2041. That is real. But it converts a structural shift in where students and educators go into a demographic story that implies waiting it out.","evidence":"Sixteen non-profit colleges closed in 2025 and eight more in Q1 2026 — the pressure is read as demographic across the board."},{"id":"G9","title":"No one owns the seam","who":"Field-wide","body":"EdChoice measures families, programs and fiscal effects. ExcelinEd measures policy adoption. NCTQ measures preparation quality. NACSA measures authorizers. AACTE represents the preparation pipeline. Each does its own job well. Whether the workforce exists to staff what the policy enables falls between all of them.","evidence":"Every other gap on this list is a symptom of this one."}],"context":[{"metric":"Florida home education students","value":"152,871","year":"2024-25","source":"FLDOE Home Education Annual Report"},{"metric":"Florida PEP (ESA) participants","value":"59,925","year":"2024-25","source":"Step Up For Students"},{"metric":"Florida FES-EO + FTC participants","value":"286,284","year":"2024-25","source":"Step Up For Students"},{"metric":"Florida total scholarships awarded","value":"524,000+","year":"2024-25","source":"Executive Office of the Governor"},{"metric":"Florida students using any choice option","value":"~1.4 million","year":"2024-25","source":"Executive Office of the Governor"},{"metric":"US students in microschools","value":"750,000+","year":"2025","source":"National Microschooling Center"},{"metric":"Microschool operators who are licensed educators","value":">70%","year":"2025","source":"Education Next"},{"metric":"US education bachelor's degrees","value":"109,622 → 90,710","year":"2003-04 → 2022-23","source":"AACTE / EdWeek"},{"metric":"AACTE federal ask to rebuild teacher preparation","value":"$2.5 billion","year":"2026","source":"EdWeek"}],"corrections":[{"id":"02","date":"August 2026","iso":"2026-08-08","title":"We coded the University of West Florida Tier 0. It is a registered charter school sponsor.","detail":"Our July pass read UWF's School of Education program roster, found nothing built for the portable-funding sector, and coded the institution Tier 0 — nothing found. UWF is listed in the Florida Department of Education's Directory of Charter School Sponsoring Entities as an approved sponsor, and its Board of Trustees has approved it as authorizer of a Somerset Academy charter elementary school. The row is recoded Tier 1. The error matters more than the row. This Index's central methodological claim is that catalog scans miss the main event, because universities enter this sector by operating and authorizing schools rather than by listing courses. We made exactly that mistake, in Florida, which is our most heavily covered state. It was caught by reading the state's own sponsor directory — a source we should have read in the first pass and have now added to the method.","source":"https://web01.fldoe.org/CSA/PostToWeb/CharterSchoolSponsoringEntities"}]},"atlas":{"counts":{"1":29,"2":12,"3":134},"rows":{"ARG":{"name":"Argentina","tier":1,"since":null,"mech_type":"salary-subsidy","mechanism":"State subsidy of private-school teacher salaries","summary":"Argentina funds the teacher, not the child. State subsidies to private schools are calculated and paid against the school's teaching payroll, which makes this the clearest salary-side mechanism in the Americas and a direct test of whether funding the workforce produces a different result from funding the pupil.","findings":[{"t":"<b>The mechanism.<\/b> Subsidies are paid as a proportion of teachers' salary costs. Fee-free schools run by non-profit entities may receive up to 100%; fee-charging schools are banded — category A 80%, B 60%, C 40% of teacher salary costs. To be paid, a school submits its teaching payroll, listing staff, posts, hours and salaries, to the education authority.","src":"Chequeado; Argentinos por la Educación","checked":"Aug 2026"},{"t":"Just over 70% of private schools receive state subsidies. About 22% of all students attend subsidized private-management schools, rising to 39% in the City of Buenos Aires, 29% in Córdoba and 26% in Buenos Aires province.","src":"Chequeado; Infobae","checked":"Aug 2026"},{"t":"For every 100 pesos the state spends on a public-school student it spends about 55 on a subsidized private-school student (2021).","src":"Infobae","checked":"Aug 2026"},{"t":"<b>Why this is the case to watch.<\/b> Every other system in this Atlas moves money with the pupil and leaves the labour market to sort itself out. Argentina attaches public money directly to teaching posts in non-state schools — the workforce question is inside the funding formula rather than downstream of it.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"The money follows the teacher, not the child","shortlist_reason":null},"BEL":{"name":"Belgium","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":null},"BHS":{"name":"The Bahamas","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":"The anglophone Caribbean grant-aided pattern is likely to apply, but no Bahamian source establishing it was located in this pass. Shortlisted rather than coded by regional analogy — assuming the pattern is exactly the error this Atlas is meant to avoid."},"BLZ":{"name":"Belize","tier":1,"since":null,"mech_type":"grant-aided","mechanism":"Church–state grant-aided schools; the state pays the teachers","summary":"Belize runs one of the most thoroughly pluralistic systems in the hemisphere and almost nobody outside it knows. Denominational and community grant-aided schools are about 62% of all institutions; directly state-managed schools are about 20%. The churches own and manage; the government pays the staff.","findings":[{"t":"<b>The mechanism is a payroll, not a voucher.<\/b> Grant-aided schools are owned by a religious denomination or community group and funded by government through school service grants or direct payment of teachers' salaries.","src":"UNESCO Education Profiles — Belize; Notre Dame Education Law Project, country report","checked":"Aug 2026"},{"t":"From 2024 the government committed to 100% of salaries, full pensions and service benefits for 879 teachers and lecturers at grant-aided secondary and tertiary institutions. The 728 teachers at 30 grant-aided secondary schools are 50.7% of all secondary teachers in the country.","src":"Breaking Belize News; Love FM Belize","checked":"Aug 2026"},{"t":"<b>Why it matters to the workforce question.<\/b> Where the state pays the teacher directly, the state holds the workforce lever whoever owns the school. Belize is the clearest case in the Americas of provider pluralism with centralized staffing finance.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"The state pays the teachers, the church runs the schools","shortlist_reason":null},"BOL":{"name":"Bolivia","tier":1,"since":null,"mech_type":"convenio","mechanism":"Church–state convenio schools; teacher training nationalized","summary":"Bolivia funds church-run provision through longstanding convenio agreements and then did something no other country in this Atlas has done so explicitly: it nationalized teacher preparation. Law 070 of 2010 made the State solely responsible for training new teachers.","findings":[{"t":"Written agreements between government and the Catholic Church formalize church provision in education, with limited state financial support; in many remote areas Catholic-run schools are the only schooling available.","src":"US State Department religious freedom reporting; Agenzia Fides","checked":"Aug 2026"},{"t":"<b>The credentialing move.<\/b> Law 070 (2010) nationalized teacher training, through which the State assumes sole responsibility for producing new teachers for a secular state. The Catholic teacher-training institute Sedes Sapientiae was closed; the Bolivian Episcopal Conference has pursued the case internationally.","src":"Agenzia Fides","checked":"Aug 2026"},{"t":"<b>Why this is the sharpest case in the Atlas for WMFC's question.<\/b> Bolivia kept provider pluralism at the school level and eliminated it at the preparation level. England moved teacher training away from universities and supply fell; Bolivia moved it to the state outright. Both are experiments in who is permitted to make teachers — and both were run without anyone measuring the workforce consequence.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"Schools plural, teacher training nationalized","shortlist_reason":null},"BRA":{"name":"Brazil","tier":1,"since":null,"mech_type":"none","mechanism":"FUNDEB funds public enrolment only","summary":"Brazil's main basic-education funding mechanism, FUNDEB, distributes resources according to enrolment in public schools. Private basic schools receive no subsidy. The country's best-known choice-adjacent programme, PROUNI, operates at higher education and works through tax exemption rather than portability.","findings":[{"t":"FUNDEB resources are distributed by the number of students enrolled annually in public schools maintained by each government entity, with a federal top-up to a minimum per-student value. The formula is per-pupil but not portable — it does not follow a child into a private school.","src":"OECD, Education in Brazil; Brazilian constitutional framework","checked":"Aug 2026"},{"t":"Brazil does not subsidize private basic-education schools.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"},{"t":"<b>The instructive contrast.<\/b> PROUNI grants tax exemptions to private higher-education institutions in exchange for scholarships. Brazil has therefore built a large portable-ish mechanism at university level and none at school level — the reverse of the American sequence.","src":"PROUNI programme documentation","checked":"Aug 2026"}],"code_label":"Per-pupil funding that is not portable","shortlist_reason":null},"CAN":{"name":"Canada","tier":1,"since":1994,"mech_type":"charter","mechanism":"Provincial charter and independent-school funding","summary":"Canada has no national school-choice policy and never has. Education is a provincial power, and one province went considerably further than the rest. Alberta passed charter legislation in 1994 — still the only Canadian province with charter schools — and funds students in independent schools at 70% of the public per-pupil rate, the highest level in the country. The federal government has no role in any of it.","findings":[{"t":"Alberta's charter legislation passed in 1994; the first three schools opened in 1995. Charter schools cannot charge tuition and receive the same per-pupil funding as other public schools. As of 2022–23 roughly 11,000 students were enrolled, about 1.4% of the province's students — three decades of availability at very small scale.","src":"The Canadian Encyclopedia; CBC News","checked":"Aug 2026"},{"t":"Alberta funds independent-school students at 70% of the public rate, the highest in Canada, and has moved to partially fund independent school construction — a provincial first.","src":"CBC News","checked":"Aug 2026"},{"t":"<b>The workforce finding.<\/b> Alberta's Teaching Quality Standard is the basis of certification for all Alberta teachers and applies across all of the province's publicly funded school authorities, including its charter school divisions. Alberta diversified who may operate a school without changing who may teach in one. Provider pluralism, single credential.","src":"Alberta.ca — Professional Practice Standards","checked":"Aug 2026"}],"code_label":"Portability is provincial, not national","shortlist_reason":null},"CHL":{"name":"Chile","tier":1,"since":1981,"mech_type":"voucher","mechanism":"Nationwide voucher, later centralized admissions","summary":"The longest-running universal voucher, introduced in 1981 on a Chicago-school design. About 91% of enrollment sat under a voucher scheme by 2018, with for-profit operation permitted for nearly 30 years — the most complete arc from deregulation to re-regulation anywhere.","findings":[{"t":"The 2015 Ley de Inclusión banned profit-taking in publicly funded schools (two-thirds of voucher schools were for-profit), ended copayments, and replaced school-side selection with a centralized lottery — forcing a restructuring of who may operate.","src":"Review of Education (Bellei)","checked":"Jul 2026"},{"t":"The widely cited verdict: unregulated choice produced flat scores and widening rich–poor gaps; only added regulation began to deliver gains. Segregation moved on fee rules, not choice itself.","src":"FutureEd, Georgetown","checked":"Jul 2026"}],"code_label":"Re-regulating the provider side","shortlist_reason":null},"COL":{"name":"Colombia","tier":1,"since":1991,"mech_type":"voucher","mechanism":"PACES vouchers (1991–98), then concession schools and subsidies","summary":"Colombia ran the most rigorously evaluated voucher programme ever built and then stopped running it. PACES was established in late 1991, reached more than 125,000 pupils, allocated places by lottery where demand exceeded supply, and was wound up by the late 1990s. What replaced it — concession schools and subsidies to non-profit private schools — is quieter and still in place.","findings":[{"t":"PACES vouchers covered roughly half the cost of private secondary schooling for children in the two lowest socioeconomic strata, and were allocated by lottery when oversubscribed. Lottery winners were about 15 percentage points more likely to attend private school, completed more schooling, and scored about 0.2 standard deviations higher; secondary completion rose 15–20%.","src":"J-PAL; Angrist, Bettinger, Bloom, King & Kremer","checked":"Aug 2026"},{"t":"<b>The supply side is where it failed.<\/b> Low-quality for-profit schools were created to capture voucher revenue, prompting restrictions on which schools could participate. Many established private schools declined to take part — just under half of private schools in the ten largest cities accepted vouchers in 1993. Voucher value was not indexed and eroded with inflation, and payments to schools were delayed. Colombian scholarship describes the programme as <i>una experiencia fallida<\/i>.","src":"Bettinger, Lessons from Private-School Vouchers in Colombia; Colombian programme literature","checked":"Aug 2026"},{"t":"Colombia today subsidizes non-profit private schools, religious and secular, and funds <i>concesionadas<\/i> — non-profit secular charter-type schools operating with public money.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"},{"t":"<b>The lesson for the workforce question.<\/b> Demand-side money produced entry by providers who could not sustain quality, and non-entry by providers who could. Nobody in the PACES literature asks where the teachers for the new schools were to come from — which is precisely the seam.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"The best-measured voucher, discontinued","shortlist_reason":null},"CRI":{"name":"Costa Rica","tier":1,"since":null,"mech_type":"none","mechanism":"Free compulsory state provision since 1869","summary":"Costa Rica made education free and compulsory in 1869, among the earliest anywhere, and built a strong state system around that commitment. Private schools operate and charge fees; public money does not follow students into them.","findings":[{"t":"Preschool and basic education are free and compulsory, a constitutional commitment dating to 1869. The system's identity is built on universal state provision rather than provider choice.","src":"Education in Costa Rica — country overview","checked":"Aug 2026"},{"t":"<b>Limit.<\/b> Costa Rica does not appear in the IDB's regional classification of subsidized private-school categories, and no national subsidy mechanism was identified in this pass. Coded as no portability found, not as no portability possible.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"Universal state provision, no portability found","shortlist_reason":null},"CUB":{"name":"Cuba","tier":1,"since":null,"mech_type":"none","mechanism":"State monopoly; private education prohibited","summary":"Cuba nationalized all schools in 1961 and has maintained the most complete state monopoly in the hemisphere since. There are no faith schools, no charter schools and no semi-private academies. Recent regulation has reaffirmed the prohibition on private education businesses.","findings":[{"t":"Schools were nationalized in 1961; regulatory updates have reaffirmed the prohibition on private education enterprises, keeping the state monopoly intact.","src":"Right to Education country review — Cuba; Independent Institute","checked":"Aug 2026"},{"t":"<b>The value of the case.<\/b> Cuba is the region's zero point. Any claim that portable funding is inevitable, or that provider pluralism follows automatically from demand, has to account for a system that has held the opposite line for sixty-five years.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"The hemisphere's zero point","shortlist_reason":null},"DNK":{"name":"Denmark","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":null},"DOM":{"name":"Dominican Republic","tier":1,"since":null,"mech_type":"subsidy","mechanism":"Subsidies to private schools, religious and secular","summary":"The Dominican Republic subsidizes private schools — for-profit and non-profit, religious and secular. Private enrolment has been stable at about 26%, one of the larger private shares in the region.","findings":[{"t":"Private for-profit and non-profit schools, religious and secular, receive government subsidies; a parallel non-subsidized private sector operates alongside them.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"},{"t":"Private enrolment has been stagnant at about 26% over the decade to 2014 — a large sector that is not growing, in contrast to Chile, Colombia, Argentina, Brazil and Peru.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"}],"code_label":"Large subsidized sector, flat share","shortlist_reason":null},"ECU":{"name":"Ecuador","tier":1,"since":null,"mech_type":"salary-subsidy","mechanism":"Fiscomisional schools — subsidized to pay teacher salaries","summary":"Ecuador operates a distinct category: fiscomisional schools, religious schools holding an agreement with the government that receives subsidies to pay teacher salaries. Ecuador is also the only country in the region's classification that prohibits for-profit non-subsidized schools.","findings":[{"t":"Fiscomisional schools are religious schools with a government agreement, subsidized specifically to pay teacher salaries — a second salary-side mechanism in the region alongside Argentina's.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"},{"t":"Ecuador is the only country in the IDB's regional classification that bans for-profit non-subsidized private schools. The state regulates the ownership form, not only the funding.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"},{"t":"Private enrolment has been stable at about 27% over the decade to 2014.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"}],"code_label":"Subsidy tied to teacher salaries, for-profit barred","shortlist_reason":null},"FLK":{"name":"Falkland Islands","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":"A British overseas territory with a very small school system. Whether UK funding arrangements apply in any portable form was not established. Shortlisted."},"GBR":{"name":"United Kingdom","tier":1,"since":2010,"mech_type":"charter","mechanism":"Academies + school-led teacher training","summary":"England (coded under GBR) is the case that speaks to WMFC's exact institutional question. From 2010 the government deliberately moved initial teacher training away from universities toward schools — treating university-led training as 'the problem' — via School Direct and a target of at least 50% school-led places.","findings":[{"t":"Relocating credentialing off the university campus suppressed supply: School Direct ran at ~45% of places filled in an early year, projected to yield thousands fewer teachers, as university places were capped faster than school routes filled.","src":"BBC News / The Conversation","checked":"Jul 2026"},{"t":"The transferable lesson: decentralizing credentialing does not automatically create throughput, and can reduce it unless deliberately resourced.","src":"Journal of Education for Teaching","checked":"Jul 2026"}],"code_label":"Credentialing moved, throughput fell","shortlist_reason":null},"GRL":{"name":"Greenland","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":"Greenland runs its own school system under a Danish constitutional framework. Whether Denmark's free-school funding model extends to it was not established. Shortlisted pending a Greenlandic or Danish source."},"GTM":{"name":"Guatemala","tier":1,"since":null,"mech_type":"conditional-subsidy","mechanism":"Targeted subsidy conditioned on free provision","summary":"Guatemala funds some non-state provision, but narrowly and on condition. Private schools may be subsidized only where they provide services free, serve low-income populations and pursue quality or pedagogical innovation. Cooperative schools are funded jointly by municipality, parents and ministry.","findings":[{"t":"Subsidies to qualifying private schools ran to about USD 13.8 million in 2017 — 0.6% of education spending. Non-profit cooperative schools received a further USD 22 million across 1,108 schools, 0.9% of public education spending. Portability exists and is very small.","src":"UNESCO Education Profiles — Guatemala","checked":"Aug 2026"},{"t":"Public education spending has stayed between 2.8% and 3.3% of GDP since 2006, below the UNESCO benchmark of 4–6%. The constraint on this system is the size of the total envelope, not the rules on who may receive it.","src":"UNESCO Education Profiles — Guatemala","checked":"Aug 2026"}],"code_label":"Subsidy conditioned on free provision","shortlist_reason":null},"GUF":{"name":"French Guiana","tier":1,"since":1959,"mech_type":"contract","mechanism":"French contract system (Loi Debré) applied in an overseas département","summary":"French Guiana is a French département, so French national education law applies in full. That includes the 1959 Loi Debré contract system, under which private schools contracting with the state teach the national curriculum and have their teachers paid by the state.","findings":[{"t":"Under the French contract system, schools sous contrat teach the national programme and their teachers are remunerated by the state — a salary-side mechanism rather than a per-pupil voucher, in continuous operation since 1959.","src":"Loi Debré (1959), French national education law","checked":"Aug 2026"},{"t":"<b>Limit, stated plainly.<\/b> This entry is coded from the metropolitan legal framework that governs the territory, not from a territory-specific reading of provision on the ground in French Guiana. Treat the mechanism as established and the local practice as unverified.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"Metropolitan law, territorial practice unread","shortlist_reason":null},"GUY":{"name":"Guyana","tier":1,"since":null,"mech_type":"none","mechanism":"Nationalized in 1976; universal free state provision","summary":"Guyana is the reversal case. In 1976 the government took over the country's church and private schools — close to 696 of them — abolished fees at every level and made free education a constitutional right. The dual system the rest of the anglophone Caribbean retained was dismantled here.","findings":[{"t":"Close to 696 schools, most privately financed or owned by church organisations, came under state control in 1976. Universal free education from nursery to university was introduced by constitutional amendment that year and entrenched in the 1980 constitution.","src":"Stabroek News; Guyana country education histories","checked":"Aug 2026"},{"t":"<b>The stated reason was a staffing question.<\/b> Before 1976 the churches held major influence over who taught in their schools, who attended and what was taught. Nationalization was justified as ending a dual system in which employment and attendance turned on religion — a portable-funding arrangement undone specifically on who-may-teach grounds.","src":"Stabroek News; Guyana country education histories","checked":"Aug 2026"}],"code_label":"Portability reversed on staffing grounds","shortlist_reason":null},"HND":{"name":"Honduras","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":"Private enrolment is roughly 20% and financed mainly by family fees; Honduras does not appear among the subsidizing countries in the IDB regional classification. A Notre Dame Education Law Project country report exists and has not yet been read in full. Shortlisted rather than coded because the funding position is inferred from absence rather than read from a Honduran source."},"HTI":{"name":"Haiti","tier":1,"since":null,"mech_type":"subsidy","mechanism":"Subsidies into an overwhelmingly non-state system","summary":"Haiti is the inverse of every other case in this Atlas. Non-state schools are not an alternative to the state system; they are substantially the system. Subsidies reach private for-profit and non-profit schools, religious and secular.","findings":[{"t":"Haiti subsidizes private for-profit and non-profit schools, both religious and secular, alongside a large unsubsidized private sector.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"},{"t":"<b>Why the direction matters.<\/b> Elsewhere portable funding is a policy choice layered onto an existing state system. In Haiti non-state provision arose from the absence of state capacity, and subsidy follows that reality rather than creating it. Read as an equilibrium case only with that caveat attached.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"Non-state by default, not by design","shortlist_reason":null},"IDN":{"name":"Indonesia","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":null},"IND":{"name":"India","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":null},"IRL":{"name":"Ireland","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":null},"JAM":{"name":"Jamaica","tier":1,"since":null,"mech_type":"grant-aided","mechanism":"Government-funded church schools within the public system","summary":"Jamaica inherited the British colonial dual system and kept it. A substantial share of primary and secondary schools are run by religious denominations — Anglican, Catholic and others — and receive government funding while retaining their religious character.","findings":[{"t":"Church-run schools frequently receive government funding while keeping their denominational identity. Religious schools receiving public funds must admit students of all faiths and meet ministry standards — funding is conditioned on open admission.","src":"US State Department, International Religious Freedom Report — Jamaica","checked":"Aug 2026"},{"t":"A separate independent sector, governed by its own boards and funded by fees, endowment and donations, sits outside the funded system.","src":"Education financing in Jamaica — country overview","checked":"Aug 2026"}],"code_label":"The colonial dual system, retained","shortlist_reason":null},"MEX":{"name":"Mexico","tier":1,"since":null,"mech_type":"none","mechanism":"Private provision authorized, not publicly funded","summary":"Article 3 of the 1917 Constitution makes the State the provider of free compulsory education. Private entities may operate schools, but only with prior and explicit official recognition of studies, and they teach the national syllabus. Money does not follow the child.","findings":[{"t":"Mexico does not subsidize private schools. Private enrolment has been stable at about 9% — the lowest share among the larger Latin American systems and flat over the decade to 2014.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"},{"t":"Private schools must obtain prior authorization from the education authorities and teach to the same purposes, criteria and syllabus as public schools, including for teacher-training colleges. The regulated variable is permission to operate, not funding.","src":"Political Constitution of the United Mexican States, Art. 3; Notre Dame Education Law Project, country report","checked":"Aug 2026"}],"code_label":"Permission to operate, no public money","shortlist_reason":null},"NIC":{"name":"Nicaragua","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":"No national subsidy mechanism was identified and Nicaragua does not appear in the IDB regional classification. No Notre Dame country report is published. Shortlisted because a null this thin should not be published as a coded finding."},"NLD":{"name":"Netherlands","tier":1,"since":1917,"mech_type":"constitutional","mechanism":"Constitutional equal funding (Article 23)","summary":"After the century-long <em>Schoolstrijd<\/em>, the 1917 constitutional settlement funded privately governed schools on equal terms with state schools, subject to central inspection. Roughly 70% of Dutch schools are now run by private boards, all funded equally.","findings":[{"t":"A century of the most pluralistic provider system in the world did not immunize the teaching workforce: the Netherlands entered a structural teacher shortage (<em>lerarentekort<\/em>) flagged since 2011, driven partly by workload and teachers' reported lack of autonomy.","src":"researchgate.net / AOb","checked":"Jul 2026"},{"t":"Freedom to establish is inseparable from an obligation to be inspected — portability here is anchored by a strong central Inspectorate, not a free market.","src":"onderwijsinspectie.nl","checked":"Jul 2026"}],"code_label":"Portability ≠ workforce sufficiency","shortlist_reason":null},"NZL":{"name":"New Zealand","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":null},"PAN":{"name":"Panama","tier":1,"since":null,"mech_type":"none","mechanism":"Private schools operate without subsidy","summary":"Panama has a substantial private sector of about 17% of enrolment, stable over the last decade, funded by fees. The state does not subsidize it.","findings":[{"t":"Panama's private schools — for-profit and non-profit, religious and secular — receive no government subsidies. Private enrolment has been flat at roughly 17%.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"}],"code_label":"Large private sector, no public money","shortlist_reason":null},"PER":{"name":"Peru","tier":1,"since":1998,"mech_type":"deregulation","mechanism":"Deregulated private supply, minimal subsidy","summary":"Peru is the deregulation case. A 1998 legal decree promoted private investment in education by loosening constraints on opening schools, permitting for-profit operation and offering tax credits to investors. Supply responded sharply. Public subsidy did not follow.","findings":[{"t":"The 1998 decree reduced legislative constraints on opening private schools, allowed for-profit operation and offered generous tax credits to investors. Private enrolment rose from 13% in 1998 to 26% in 2014; in Lima non-state participation went from 29% in 2004 to 50% in 2014.","src":"Balarin, NORRAG; Right to Education Initiative","checked":"Aug 2026"},{"t":"Public money barely follows. Peru subsidizes only the Fe y Alegría chain of Catholic schools, under 2% of total enrolment.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"},{"t":"<b>The supply-quality result.<\/b> In mathematics the share of low-achieving students in the low-fee private sector is about three times the public-sector share, and at secondary level the low-fee private sector is the single private modality performing worse than public schools. Regulatory capacity did not scale with the sector: licences are granted by local authorities that perform no regular supervision.","src":"OECD, Education and Skills in Peru; Education International","checked":"Aug 2026"},{"t":"<b>Read against Chile.<\/b> Peru deregulated supply without making money portable; Chile made money portable and then re-regulated supply. Both ended up legislating about who may operate.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"Supply deregulated, funding withheld","shortlist_reason":null},"PRI":{"name":"Puerto Rico","tier":1,"since":2018,"mech_type":"voucher","mechanism":"Act 85 of 2018 — charter schools and capped vouchers","summary":"Puerto Rico is the Atlas's clearest example of a court deciding the question twice. Vouchers were ruled unconstitutional in 1994. Act 85 of 2018 created charter-style 'alianza' schools and private-school vouchers, and in 2019 the island's Supreme Court upheld them.","findings":[{"t":"Act 85 authorized a public charter system capped at 10% of all public schools and private-school vouchers capped at 3% of students from 2019–20. Both caps are unusually explicit; most systems in this Atlas cap nothing.","src":"EdChoice; CBS News","checked":"Aug 2026"},{"t":"A 1994 ruling had held vouchers unconstitutional. In <i>Asociación de Maestros v. Departamento de Educación<\/i> (2019) the Supreme Court of Puerto Rico held that they were constitutional, overturning a lower court that had relied on the 1994 decision.","src":"Education Week","checked":"Aug 2026"},{"t":"<b>Operator restriction is the workforce-relevant clause.<\/b> A ruling limited operation of alianza schools to the University of Puerto Rico and the island's municipalities — a rare case of a system naming a university as an eligible school operator in statute.","src":"CBS News; National Center for the Study of Privatization in Education","checked":"Aug 2026"}],"code_label":"Decided by courts, twice, opposite ways","shortlist_reason":null},"PRY":{"name":"Paraguay","tier":1,"since":null,"mech_type":"subsidy","mechanism":"State funding for religious-group schools","summary":"Paraguay provides state funding to schools run by religious groups. The mechanism is documented in reporting on religious freedom rather than in education-finance literature, which is itself a finding about how visible these arrangements are.","findings":[{"t":"The government provides state funding for schools run by religious groups.","src":"US State Department, International Religious Freedom Report — Paraguay","checked":"Aug 2026"},{"t":"<b>Limit.<\/b> Scale, start year and funding formula were not established in this pass, and Paraguay's Notre Dame country report is listed but not yet published. The existence of the mechanism is documented; its size is not.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"Mechanism documented, scale unknown","shortlist_reason":null},"SLV":{"name":"El Salvador","tier":1,"since":null,"mech_type":"none","mechanism":"Unsubsidized private sector alongside state provision","summary":"El Salvador has a stable private sector of about 17% of enrolment which the state does not fund. The country is better known in this literature for EDUCO, which decentralized management of state schools to community associations without making the money portable.","findings":[{"t":"Private enrolment has been stagnant at about 17% over the decade to 2014, and El Salvador does not appear among the countries subsidizing private schools in the IDB's regional classification.","src":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","checked":"Aug 2026"},{"t":"<b>The distinction worth carrying.<\/b> Community management of public schools is not portable funding. EDUCO moved control of hiring and oversight to parent associations while the schools remained public — a governance reform, not a choice reform.","src":"WMFC coding, Aug 2026; Notre Dame Education Law Project, country report","checked":"Aug 2026"}],"code_label":"Management devolved, money did not move","shortlist_reason":null},"SUR":{"name":"Suriname","tier":2,"since":null,"mech_type":"unknown","mechanism":null,"summary":"","findings":[],"code_label":null,"shortlist_reason":"Suriname inherited the Dutch bijzonder onderwijs model, which would make it one of the more interesting cases in the hemisphere given the Netherlands entry. No Surinamese source was located in this pass. Shortlisted and flagged as a priority."},"SWE":{"name":"Sweden","tier":1,"since":1992,"mech_type":"voucher","mechanism":"Universal voucher, for-profit free schools (friskolor)","summary":"A 1992 reform let independent 'free schools' — including for-profit chains, some stock-market-listed — open with light requirements, charge no tuition, follow the national curriculum, and draw equal per-student funding. Free schools now enroll roughly 18% of students.","findings":[{"t":"The incentive structure reached teachers' own professional judgment: researchers and center-right politicians debate a documented grade-inflation pattern as a competitive response to enrollment-based funding.","src":"Institute of Economic Affairs","checked":"Jul 2026"},{"t":"By 2025 the government's own inquiry proposed barring new operators from extracting profit for five years and giving municipal schools more per-student funding for their duty to staff places for every child.","src":"The Local Sweden","checked":"Jul 2026"}],"code_label":"Re-regulating the provider side","shortlist_reason":null},"TTO":{"name":"Trinidad and Tobago","tier":1,"since":1960,"mech_type":"concordat","mechanism":"The Concordat of 1960 — state-funded denominational schools","summary":"Signed on 22 December 1960, the Concordat between the State and the denominational boards is one of the longest continuously running portable-funding arrangements in the Americas — sixty-six years. The state pays; the denominations own, manage and, within limits, select.","findings":[{"t":"Under the Concordat the state pays salaries and a share of upkeep at denominational schools, which became known as 'government assisted' schools. Ownership and the right of direct control and management remained with the denominations. The arrangement is known locally as the dual system.","src":"Concordat Watch; Trinidad and Tobago Newsday","checked":"Aug 2026"},{"t":"<b>The staffing clause is the point.<\/b> Teachers are selected by both government and denominational boards, and a denominational authority may request the removal of a teacher found unsatisfactory on moral or religious grounds. Denominational schools may also fill 20% of first-form places at their own discretion, the state filling the other 80% by examination.","src":"Concordat Watch — text of the 1960 Concordat","checked":"Aug 2026"},{"t":"<b>What sixty-six years has produced.<\/b> The arrangement remains politically live: national debate continues over equity in the school system and whether the 20% discretionary intake should survive. Duration has not settled the question.","src":"Trinidad and Tobago Newsday; Global Voices","checked":"Aug 2026"}],"code_label":"Sixty-six years, still contested","shortlist_reason":null},"URY":{"name":"Uruguay","tier":1,"since":null,"mech_type":"none","mechanism":"Predominantly public financing; small private sector","summary":"Uruguay built early and thoroughly on free public provision. Education is free at primary, secondary and most higher levels, financed mainly from public funds, with a small private sector alongside it.","findings":[{"t":"The system is mainly financed by public funds, with household contributions, a small private sector and some international aid. No national portable-funding mechanism was identified.","src":"Education financing in Uruguay —
