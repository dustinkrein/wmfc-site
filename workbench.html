 its own. Florida MACTE/AMS/AMI program count and annual credentials issued: **[UNCHK]**\n\n**Classical** — Hillsdale College Graduate School of Classical Education and Great Hearts' Academy for Classical Teachers identified as national providers. Florida enrollment: **[UNCHK]**\n\n**Not retrieved this round (rate limit):** EdChoice's [Prenda Survey Results](https://www.edchoice.org/research/prenda-survey-results/) and its [2026 Prenda guide survey](https://www.edchoice.org/2026-what-we-learned-about-prenda-microschools) — the best available data on who microschool guides are and what they did before. **Retrieve next session.**\n\n> **Tier 4 does not report.** Not to FLDOE, not to Title II, not to IPEDS. Every provider in it is a private organization with no disclosure obligation. **The only way to size it is to ask each provider directly, or to count job postings and staff pages.** That is a real research project — and it is the one that would let WMFC say something nobody else can.\n\n---\n\n## WHAT CHANGED THIS ROUND\n\n1. **The variance thesis is evidenced, not asserted.** N=10, split roughly evenly, with no legal explanation available.\n2. **The direction is the finding.** A private Christian university is the most open; a public research university is the most restrictive, by its own drafting.\n3. **Two documented nulls of real value:** placement setting is not reported by anyone in Florida; and the one existing certification exemption appears unused.\n4. **The flagship comparison:** UF, 106 Title II completers in 2023-24, against UWF's EPI at 735 in 2021-22.\n\n## NEXT FIVE\n\n1. **Public records request to UCF** — internship placements by site type, by term, five years. Cleanest single answer available; UCF is Ch. 119-covered.\n2. **Manual download of Title II S1.1 and S1.4** — Florida by route type, 2015–2024. Blocked by robots.txt, not by availability.\n3. **Extend the placement survey toward a census** — all 311 ITPs and 26 EPIs, coded open / district-framed / restrictive / silent. The variance deserves an N that supports a distribution.\n4. **Schools of Hope operating count and exemption use** — via the FLDOE charter school directory and operator staff pages.\n5. **Size tier 4 directly** — write to FACCS, Prenda, and Florida's MACTE-accredited programs. Retrieve the EdChoice Prenda survey first."},{"id":"fl-az-postsecondary","title":"Florida & Arizona: postsecondary and district response","group":"Postsecondary","blurb":"The channel exists in both states; about 0.7% of AZ ESA money uses it.","date":"2026-09-14","file":"claude_WMFC-FL-AZ-Postsecondary-Analysis.md","words":2680,"md":"# Florida & Arizona: Postsecondary and District Response to Portable Funding\n**WMFC research memo · 14 September 2026 · research only, nothing built**\n\nEvidence states used throughout: **[DOC]** documented with a primary source · **[NONE]** searched, nothing found · **[UNCHK]** not yet checked.\n\n---\n\n## 0. Why these two states\n\nHeritage's **2025 Education Freedom Report Card** ranks **Florida #1 for the fourth consecutive year and Arizona #2 for the fourth consecutive year.** Louisiana 5th, Texas 7th. Maine last; Connecticut, Massachusetts, Vermont and Rhode Island near the bottom. Scoring categories: education choice, teacher freedom, academic transparency, civics education, and return on investment for education spending. Category weights are not published in the press release. **[DOC]** ([Heritage, 2025 release](https://www.heritage.org/press/heritage-foundation-releases-2025-education-freedom-report-card))\n\nThese are the two states where portable funding has run longest and widest. If postsecondary institutions respond anywhere, it is here. If they don't respond here, the null result is strong.\n\n---\n\n## 1. THE HEADLINE FINDING\n\n> **Both states have opened a legal channel carrying K-12 choice money directly to postsecondary institutions. In Arizona, where we can measure it, roughly 0.7% of the money is moving through it.**\n\n**Arizona.** The ESA Parent Handbook (2025-26) authorizes ESA spending on **tuition, fees and required textbooks** at (1) Arizona community colleges as defined in A.R.S. §15-1401, (2) state universities under the Arizona Board of Regents, and (3) accredited private in-state or online postsecondary institutions. Students may use ESA funds for dual enrollment while still in secondary school. Room, board, meals and transportation are excluded. **[DOC]** ([AZ DOE ESA Handbook 2025-26](https://www.azed.gov/sites/default/files/2025/06/ESA%202025-2026%20Handbook.pdf))\n\n**Arizona, the measurement.** ESA FY26 Q3: **102,891 students enrolled**; annualized scholarship awards **$1,115,099,565**. Q3 approved expenses ≈ **$220.7 million**. Of that, \"tuition, textbooks, or fees at an eligible postsecondary institution\" accounted for **$12,969 through the Marketplace and $1,626,028 through pay-vendor/reimbursement/debit card — about $1.64 million, roughly 0.7% of Q3 spending.** The dominant category is K-12 qualified-school tuition at 59.5% of non-marketplace spending. **[DOC]** ([AZ DOE ESA FY26 Q3 Executive & Legislative Report](https://www.azed.gov/sites/default/files/2026/06/ESA%20FY26%20Q3%20Executive%20_%20%20Legislative%20Report.pdf))\n\n**Florida.** § 1009.30 establishes the **Dual Enrollment Scholarship Program**, under which the state reimburses postsecondary institutions for dual enrollment by **private school students** (fall/spring), **home education students** (fall/spring/summer), and **Personalized Education Program students** (all terms). Reimbursement is at the in-state resident rate for Florida College System institutions and district career centers, and at standard tuition rate for State University System and independent institutions, plus instructional materials costs. **Reimbursement depends on annual appropriation; if demand exceeds funding, institutional reimbursements are reduced proportionally.** **[DOC]** ([Fla. Stat. § 1009.30 (2025)](https://www.flsenate.gov/Laws/Statutes/2025/1009.30))\n\n**The research question this creates:** the channel exists in both states and is capped or unused in both. Is that a demand problem, an awareness problem, a capacity problem, or an institutional-unwillingness problem? That is answerable, and nobody has asked it.\n\n---\n\n## 2. A METHODOLOGICAL CORRECTION TO LENS B\n\n**In Florida, serving non-public K-12 students is not innovation. It is compliance.**\n\nFla. Stat. § 1007.271 requires each eligible postsecondary institution to develop a **home education articulation agreement annually by August 1**, specifying available courses, eligibility, and transportation. Private school articulation agreements must likewise be submitted to the Department of Education annually by August 1. Dual enrollment participants are **exempt from registration, tuition and laboratory fees**, and instructional materials are provided free of charge. District school boards **may not refuse** to enter a dual enrollment articulation agreement with a local Florida College System institution that has capacity. **[DOC]** ([Fla. Stat. § 1007.271](https://www.flsenate.gov/laws/statutes/2024/1007.271))\n\n**Consequence for the coding protocol.** Lens B (K-12 services to students not in public schools) cannot be scored the same way in Florida as elsewhere. Proposed recalibration:\n\n| Tier | Florida meaning |\n|---|---|\n| 0 | Non-compliant — no published home education articulation agreement |\n| 1 | Statutory minimum — agreement exists, posted, nothing beyond it |\n| 2 | Beyond the floor — dedicated homeschool advising, tailored pathways, marketing to non-public families, flexible scheduling |\n| 3 | Structural — a standing program, center, or operated school serving non-public K-12 students |\n\n**This also creates the single cheapest, most complete dataset in the project.** Every Florida postsecondary institution must publish these agreements every August 1. That is a near-census, on a fixed annual cycle, of institutional posture toward non-public K-12 students. **[UNCHK]** — whether all 28 Florida College System institutions and all 12 SUS institutions actually publish them is unverified and is the highest-value single check available.\n\n---\n\n## 3. UNIVERSITIES\n\n### 3.1 Who is on the U.S. News \"Most Innovative\" list\n\nThe ranking is a **peer-nomination survey** of presidents, provosts and admissions deans. It measures reputation, not behavior. **[DOC]** ([Axios Phoenix](https://www.axios.com/local/phoenix/2025/09/23/arizona-state-university-innovation-us-news-world-report))\n\n| Institution | State | Innovation standing | Evidence |\n|---|---|---|---|\n| **Arizona State University** | AZ | **#1 nationally, 11 consecutive years** — every year since the category existed | [DOC] ([Axios](https://www.axios.com/local/phoenix/2025/09/23/arizona-state-university-innovation-us-news-world-report)) |\n| **Georgia Tech** *(reference point)* | GA | #3, 2026 | [DOC] ([Georgia Tech](https://www.gatech.edu/news/2025/09/23/georgia-tech-secures-multiple-no-1-rankings)) |\n| **University of South Florida** | FL | **#19 nationally, 2026** | [DOC] ([WUSF](https://www.wusf.org/education/2025-09-23/usf-other-florida-universities-shine-2026-u-s-news-rankings)) |\n| **University of Central Florida** | FL | **Top 5 among publics; most innovative university in Florida seven consecutive years.** Exact national rank not stated in available sources | [DOC] / rank [UNCHK] ([UCF](https://www.ucf.edu/news/us-news-rankings-2025-best-colleges/), [Florida Politics](https://floridapolitics.com/archives/697387-ucf-stands-out-for-innovation-in-u-s-news-world-reports-rankings/)) |\n| University of Arizona, NAU | AZ | Presence on the innovation list | **[UNCHK]** |\n| UF, FSU, FIU | FL | Presence on the innovation list | **[UNCHK]** — WUSF's 2026 coverage names only USF |\n\n**Access note:** usnews.com returns HTTP 403 to automated fetches. Ranks 2 and 4–18 are **[UNCHK]** and will need manual capture. Record the retrieval method in the coding protocol.\n\n### 3.2 ASU — the one institution where reputation and behavior currently agree\n\n- **ASU Prep Digital** (founded 2017): a public charter university-preparatory school operating as an extension of ASU; grades K–12; **full-time, part-time, or hybrid**; serves students in Arizona and worldwide; **partners with Arizona districts**. **[DOC]** ([Wikipedia](https://en.wikipedia.org/wiki/ASU_Prep_Digital), [ASU Prep Digital](https://www.asuprepdigital.org/about/))\n- Enrollment pathways explicitly include **tuition-free Arizona public school, ESA — Empowerment Scholarship, and private-pay tuition.** **[DOC]** — Lens C documented.\n- **ASU Preparatory Academy serves ~10,000 students** across five Arizona campuses plus the international digital school. **[DOC]**\n- **Accelerate ASU** — dual enrollment with **\"no GPA or transcript required.\"** **ASU Universal Learner Courses** — transferable college credit online, **\"no application or GPA required.\"** **[DOC]** ([ASU for You K-12](https://asuforyou.asu.edu/k12))\n\n> The \"no transcript required\" design is the quiet finding. A homeschooled or microschooled student has no transcript a registrar recognizes. ASU built an admissions-free credit path around that problem. **Whether that was deliberate positioning for the choice sector is [UNCHK] and worth asking directly.**\n\n**ASU lens coding (provisional):** A **[UNCHK]** · B **[DOC] tier 3** · C **[DOC] tier 2–3** · D **[UNCHK]**\n\n### 3.3 Florida's university-operated K-12 schools — a structural asset the project has not used\n\nFla. Stat. § 1002.32 authorizes **developmental research (laboratory) schools** affiliated with state university colleges of education — public schools, **funded through the FEFP**, emphasizing sequential instruction and serving as vehicles for educational research. Generally one per university. Admission must be designed to produce \"a representative sample of public school enrollment based on gender, race, socioeconomic status, and academic ability.\" **[DOC]** ([Fla. Stat. § 1002.32](https://www.flsenate.gov/Laws/Statutes/2022/1002.32))\n\nConfirmed operating lab schools:\n\n| School | University |\n|---|---|\n| P.K. Yonge Developmental Research School | University of Florida |\n| Florida State University Schools (FSUS) | Florida State University |\n| FAU Lab Schools | Florida Atlantic University |\n| FAMU Developmental Research School | Florida A&M University |\n\n**[DOC]** ([P.K. Yonge](https://en.wikipedia.org/wiki/P._K._Yonge_Developmental_Research_School), [FSUS](https://en.wikipedia.org/wiki/Florida_State_University_Schools), [FAU Lab Schools](https://labschools.fau.edu/), [FAMU DRS](https://www.famudrs.org/apps/pages/index.jsp?uREC_ID=1524528&type=d&pREC_ID=1659893), [FSU Anne's College](https://annescollege.fsu.edu/about/lab-schools))\n\n**Why this matters:** Florida universities already operate K-12 schools drawing FEFP dollars. That is Lens B tier 3 by construction — but it **predates school choice**, which makes lab schools the perfect **responsiveness control**. Did any of the four change admissions, add part-time or à la carte enrollment, accept scholarship students, or serve homeschoolers after 2019? If a university already running a K-12 school did not adapt it when funding became portable, the null is very strong. **[UNCHK] — recommend this as the first coding task.**\n\n**Cross-state parallel:** Virginia's College Partnership Laboratory Schools (§ 22.1-349.1, 15 operating, community colleges eligible) are the same mechanism built *for* the choice era. Florida's are the same mechanism built before it. Comparing the two is a clean natural experiment. **[DOC]** ([Virginia DOE](https://www.doe.virginia.gov/teaching-learning-assessment/specialized-instruction/laboratory-schools))\n\n---\n\n## 4. STATE COLLEGES AND COMMUNITY COLLEGES\n\n### 4.1 Arizona — a community college is already taking the money\n\n**Estrella Mountain Community College** (Maricopa County Community College District) publishes an operational ESA page: **\"EMCC can only accept ESA funding for Credit Hour classes\"** — excluded are non-credit classes, Workforce Training, and KidsTeens College. Students **invoice the college through ClassWallet**; Student Business Services holds enrollment pending fund arrival. **[DOC]** ([EMCC](https://www.estrellamountain.edu/students/student-business-services/empowerment-scholarship-accounts-esa))\n\nThis is Lens C documented at the two-year level — and note what the page reveals: the college has built **an internal business process** for ESA money. That is a stronger signal than a policy statement.\n\n**[UNCHK]:** whether this is an EMCC practice or a district-wide MCCCD policy across all ten colleges; whether Pima, Yavapai, Coconino and the other Arizona districts do the same; whether the three ABOR universities accept ESA payment directly.\n\n### 4.2 Florida — 28 institutions, one statutory obligation, one capped reimbursement\n\nThe Florida College System's posture is largely set by statute rather than by institutional choice (§ 1007.271 and § 1009.30, above). The live questions are therefore about **behavior above the floor** and about **money**:\n\n- **[UNCHK]** Do all 28 FCS institutions publish a current home education articulation agreement?\n- **[UNCHK]** How much has dual enrollment by home education, private school and PEP students grown since 2023, and what share of FCS credit hours does it now represent?\n- **[UNCHK]** Has the § 1009.30 appropriation ever been prorated, and by how much? Proration means **colleges absorb the gap** — that is a direct, quantifiable cost of portable funding landing on postsecondary institutions, and it is the sharpest financial finding available in Florida.\n\n> § 1009.30's proration clause is the most underexplored sentence found in this round. If the appropriation has lagged demand, Florida's colleges are subsidizing school choice out of their own budgets — a claim that would be documented, not inferred.\n\n---\n\n## 5. DISTRICTS — the sharpest contrast in the memo\n\n### 5.1 Florida: districts are authorized to sell\n\nThe Personalized Education Program explicitly permits, as an eligible ESA use, **\"contracted services provided by a public school or school district, including classes.\"** PEP students receive \"the same flexibility and opportunities as home education program students,\" including participation in dual enrollment. **[DOC]** ([FLDOE PEP FAQs](https://www.fldoe.org/schools/school-choice/k-12-scholarship-programs/ftc/pep-faqs.stml))\n\nPEP's approved uses also include part-time/hybrid private school tuition, home education programs, dual enrollment at eligible postsecondary institutions (including NC-SARA participants), full-time private tutoring, approved online providers, **Florida Virtual School private-pay enrollment**, pre-apprenticeship programs, testing fees, part-time tutoring, and navigator services. **[DOC]** ([Step Up For Students, PEP](https://www.stepupforstudents.org/scholarships/personalized-education-program/))\n\n**Polk County Public Schools** operates a Home Education Program serving **over 5,100 students**, handling part-time enrollment, dual enrollment and virtual school inquiries through that office. **[DOC]** ([Polk County Public Schools](https://www.polkschoolsfl.com/quicklinks/homeeducation))\n\nProgram-integrity strain is visible in the data: **~23,000 students enrolled in both public and private schools during 2024-25**, and **over 27,000 matched in Q1 2025-26**; a **$47 million** DOE deficit; the department cannot split payments mid-semester; one district CFO reduced a budget by **$16 million \"without any real notification.\"** **[DOC]** ([Florida Trend](https://www.floridatrend.com/articles/2025/10/23/rapid-expansion-voucher-program-leaves-public-private-schools-underpaid/))\n\n### 5.2 Arizona: districts are closing\n\n**More than 20 public schools across the Phoenix Valley have closed or are closing since 2025.** Districts affected include Cave Creek, Gilbert, Isaac, Kyrene, Peoria, Phoenix Elementary, Roosevelt and Scottsdale Unified. **Roosevelt eliminated five schools; Kyrene closed six campuses.** Staff reductions: **Chandler and Phoenix Union 260+ positions; Mesa 400 laid off last year with 150 more planned** by the end of 2025-26. Cited causes: declining enrollment from lower birth rates, ESA expansion at roughly **$1 billion annually**, and Arizona ranking last nationally in K-12 funding. **[DOC]** ([Arizona PBS](https://azpbs.org/2026/02/more-than-20-valley-schools-close-esa-program-grows))\n\n*Counter-evidence to hold:* a 2024 analysis attributes Arizona public school enrollment decline primarily to **population shift rather than ESAs**. This belongs in the record as a competing explanation. **[DOC]** ([Cronkite News](https://cronkitenews.azpbs.org/2024/04/10/arizona-public-schools-enrollment-decline-esa-voucher-program/))\n\n### 5.3 The comparison, in the three-variable frame\n\n| Variable | Florida | Arizona |\n|---|---|---|\n| Setting-neutral funding | **Yes** — PEP funds non-school providers | **Yes** — ESA funds non-school providers |\n| **Districts may sell to non-enrolled students** | **Yes** — PEP expressly funds \"contracted services provided by a public school or school district, including classes\" **[DOC]** | **Not found** — no equivalent provision surfaced this round **[NONE, provisional]** |\n| Active intermediary recruiting providers | **Yes** — Step Up For Students operates the marketplace and recruits providers | **Partial** — ClassWallet is a payment processor; no equivalent recruiting function surfaced **[UNCHK]** |\n| **Observed district response** | **Unbundle / become a vendor** — home education offices, part-time enrollment, contracted services | **Restructure** — school closures and workforce reduction |\n\n> **This is the strongest claim in the memo.** Two states at the top of the same freedom ranking, with comparable setting-neutral funding, produce opposite district behavior — and the difference tracks exactly the two variables Florida has and Arizona appears to lack. Florida districts sell; Arizona districts close. **If that holds up under coding, it is a publishable finding and it validates the three-variable model on a second case.**\n\n---\n\n## 6. A LIVE FIGHT THAT PUTS UNIVERSITIES IN THE FRAME\n\nArizona ESA funds **roll over year to year and can be accumulated toward college**. The Arizona Education Association and Save Our Schools Arizona have filed a ballot initiative, **\"Protect Education, Accountability Now!\"**, that would **eliminate rollover** — directly ending families' ability to save ESA funds for college — and impose a **$150,000 income cap** removing roughly 15% of current participants. **[DOC]** ([AOL/azcentral](https://www.aol.com/news/arizona-law-allows-school-choice-163000303.html))\n\n**Arizona's public universities and community colleges have a direct financial stake in the outcome of a K-12 school-choice ballot measure.** Whether any of them has said anything about it is **[UNCHK]** — and it is the single best Lens D (discourse) question available in either state.\n\n**⚠ Source conflict to resolve.** The AOL/azcentral report says ESA funds may be used at \"out-of-state colleges.\" The AZ DOE Parent Handbook restricts eligible institutions to **in-state** community colleges, ABOR universities, and accredited private **in-state or online** institutions, noting the in-state restriction \"has been upheld by the State Board of Education and an Administrative Law Judge.\" **The handbook is the authoritative source; log this as a correction candidate and verify against statute (A.R.S. § 15-2402) before publishing either version.**\n\n---\n\n## 7. WHAT TO CODE NEXT — ranked by value per hour\n\n1. **The four Florida lab schools, 2019 vs. 2026.** Did universities already operating K-12 schools adapt them when funding became portable? Smallest dataset, cleanest test, strongest null if negative.\n2. **The § 1009.30 appropriation history.** Has dual enrollment reimbursement been prorated? By how much? This converts \"colleges are affected\" into a dollar figure.\n3. **The 28 FCS home education articulation agreements.** A statutory near-census on a fixed annual cycle. Code tier 0–3 against the recalibrated Lens B scale.\n4. **MCCCD district-wide ESA policy** and the other Arizona community college districts. Estrella Mountain proves the behavior exists; the question is whether it is one college or a system.\n5. **Arizona district-sell provision.** Confirm the absence in A.R.S. Title 15. A documented [NONE] here is what makes §5.3 a finding rather than a hypothesis.\n6. **Lens D on the Arizona ballot measure.** Has any ABOR institution, community college board, or faculty body commented on a measure affecting their own revenue?\n7. **US News innovation ranks 2 and 4–18**, captured manually, with the retrieval method logged.\n\n---\n\n## 8. RECORD COUNT FROM THIS ROUND\n\n| Category | Documented | Searched, none found | Not yet checked |\n|---|---|---|---|\n| State-level mechanisms | 6 | 1 | 2 |\n| Universities | 4 | 0 | 8 |\n| Two-year institutions | 1 | 0 | 4 |\n| Districts | 3 | 0 | 3 |\n| **Total** | **14** | **1** | **17** |\n\nOne source conflict logged for correction (§6)."},{"id":"asu-comparables","title":"Is anyone else doing what ASU is doing?","group":"Postsecondary","blurb":"FAU High, Rio Salado, MDC, GCU, UCF — and Purdue.","date":"2026-09-14","file":"claude_WMFC-ASU-Comparables.md","words":1160,"md":"# Is Anyone Else Doing What ASU Is Doing?\n**WMFC research addendum · 14 September 2026 · Florida and Arizona, plus one national counterexample**\n\n## The ASU composite — what has to be matched\n\n| Component | ASU |\n|---|---|\n| Operates its own K-12 schools | ASU Preparatory Academy, **~10,000 students**, five Arizona campuses + international digital school |\n| Online, at scale, beyond state lines | ASU Prep Digital (2017), full-time / part-time / hybrid, worldwide |\n| Accepts portable K-12 funds | **Arizona ESA** and private-pay alongside tuition-free public enrollment |\n| Acts as supplier to districts | Partners with Arizona districts |\n| Admissions-free college credit | Universal Learner (\"no application or GPA required\"); Accelerate ASU (\"no GPA or transcript required\") |\n| Reach | **23,000+ high school students · 550+ partner schools · 40+ countries**; ~1,000 arrive at ASU with credit already earned |\n\nSources: [ASU Prep Digital](https://www.asuprepdigital.org/about/), [ASU Prep Digital background](https://en.wikipedia.org/wiki/ASU_Prep_Digital), [ASU for You K-12](https://asuforyou.asu.edu/k12), [ASU Learning, 2025 year in review](https://learning.asu.edu/?p=4065)\n\n**Finding: no institution in either state assembles the full stack. Four are doing distinct pieces, and one is deliberately doing the opposite.**\n\n---\n\n## 1. FAU High School — the closest academic analogue (Florida) **[DOC]**\n\nA **public dual enrollment high school on Florida Atlantic University's campus**, Boca Raton and Jupiter, open since 2004, \"A\"-rated throughout. Ninth graders attend the school's own campus, then **move onto the university as tenth graders**, completing high school requirements while earning college credit. **A typical graduate leaves with three years of college credit; some receive the bachelor's degree before the high school diploma.** Tuition-free with no lab or book costs. Governed by FAU under the State University System, independent of the Palm Beach County School District. ([FAU High](https://fauhigh.fau.edu/aboutus/index.php))\n\n**Goes deeper than ASU academically; far narrower operationally.** Two campuses, selective admission, physical attendance, no online arm, no scholarship-funding channel, no out-of-state reach.\n\n## 2. Rio Salado College — the volume play (Arizona) **[DOC]**\n\n**~9,700 dual enrollment students across nearly 50 partner high schools.** A record **408 students on track to complete associate degrees in 2025, up nearly 30% year over year.** Serves public, private **and charter** schools — **Heritage Academy charter schools alone account for 200 of the 408 degree completions**, with 1,200+ Heritage students in dual classes. ([Rio Salado](https://www.riosalado.edu/news/2025/400-high-school-students-track-earn-college-degrees-rio-salado-celebrates-record-dual-enrollment))\n\n**A community college whose growth is coming substantially from the choice sector.** Not institution-building — throughput. But it is the clearest evidence in Arizona that a two-year institution is capturing choice-sector students at scale.\n\n## 3. Miami Dade College / School for Advanced Studies — the structural analogue (Florida) **[DOC]**\n\nA dual-enrollment secondary school across **five MDC campuses** (Homestead, Kendall, North, West, Wolfson). Students **earn an associate degree concurrent with their last two years of high school.** Operated by Miami-Dade County Public Schools; MDC supplies campus and coursework. Selective: 3.0 GPA minimum, qualifying exam scores, attendance record. ([School for Advanced Studies](https://en.wikipedia.org/wiki/School_for_Advanced_Studies), [MDC](https://mdc.edu/schoolforadvancedstudies/))\n\n**The inverse ownership structure.** MDC hosts; the district operates. ASU owns its schools outright. Worth coding as a distinct response type: *host* versus *operator*.\n\n## 4. Grand Canyon University — partner, not operator (Arizona, private) **[DOC]**\n\nGCU's K12 Educational Development \"works with K-12 schools, education agencies, colleges and businesses,\" supporting \"public, Christian and charter schools, in addition to alternative educational establishments such as **independent agencies and homeschools**.\" Offers high school dual enrollment, Canyon Professional Development for K-12 educators, scholarships and program discounts, free transfer-credit evaluation. No enrollment figures published. ([GCU Educational Alliances](https://www.gcu.edu/academics/educational-alliances.php))\n\n**Homeschools named explicitly in institutional program language is a Lens B signal worth coding.** Scale **[UNCHK]**.\n\n---\n\n## 5. The finding: UCF is doing the opposite, and it is also \"most innovative\" **[DOC]**\n\nUCF established the **Center for Community Schools in 2014** to scale Florida's **Community Partnership Schools** model — a school district, a university or college, a community nonprofit and a healthcare provider pooling resources inside an existing public school.\n\n- **43 Community Partnership Schools across Florida** — 18 UCF-certified, 25 in certification, 9 planning sites\n- **80+ core partners**, serving **nearly 50,000 students and families**\n- Florida's appropriation rose from **$11 million to $20.1 million in 2024**\n- Last year: 292,000+ tutoring hours, 12,000 behavioral health sessions, ~4,000 dental and vision checkups\n\n([UCF News](https://www.ucf.edu/news/state-funding-increase-to-drive-growth-in-community-partnership-schools/), [UCF Center for Community Schools](https://ccie.ucf.edu/communityschools/about/))\n\n> **Two universities, both carrying the \"most innovative\" label, responding in structurally opposite directions.** ASU built an institution that competes for portable dollars and sells into districts. UCF built statewide capacity to strengthen existing district schools — and got the legislature to fund it. Neither is a null result. Both are responses. **The four-lens protocol currently has no way to record the UCF response at all, because it only looks for market behavior.**\n\n**Recommended protocol amendment:** add a fifth coding to the institution record — **direction of response**: *compete* (build an alternative that takes portable funds) · *fortify* (strengthen the incumbent public system) · *supply* (sell services to whoever is buying) · *none observed*. Without it, an institution doing significant, funded, measurable work gets coded as a zero.\n\n---\n\n## 6. Counterexample to hold: Purdue Polytechnic High School **[DOC]**\n\nThe Purdue-affiliated charter network is **closing its South Bend campus** for financial reasons: **112 students against a planned capacity of 500**, down from a 154-student peak in 2023-24. Remaining: Englewood (Indianapolis) 617 and growing; Broad Ripple 220, down from 283 in 2022-23. A planned additional Indianapolis campus via Education One at Trine University **never executed a charter agreement.** ([Chalkbeat Indiana](https://www.chalkbeat.org/indiana/2026/02/10/purdue-polytechnic-high-school-close-south-bend-campus/))\n\n**University-operated K-12 is not a guaranteed win.** ASU's outcome may be ASU-specific — online infrastructure, enormous scale, and a founder who had already built Florida Virtual School. Carrying this case prevents the site from reading as advocacy.\n\n---\n\n## 7. What to do with this\n\n**Code the ASU model as a component checklist, not a single tier.** Six components (own school / online / accepts portable funds / district supplier / admissions-free credit / out-of-state reach). Each institution gets a filled-segment count. Most will reach one or two; the visual reads instantly and no institution is unfairly flattened to zero.\n\n**Then the honest headline is available:** *ASU is a category of one — and the components of what it built exist separately at four other institutions in these two states.*\n\n### Open questions\n- **[UNCHK]** Do FAU High, SAS or Rio Salado accept ESA or Step Up scholarship students, or is participation limited to enrolled public/charter students?\n- **[UNCHK]** MCCCD district-wide ESA policy across all ten colleges (Estrella Mountain's process is documented; the others are not).\n- **[UNCHK]** Do the other three Florida lab schools (P.K. Yonge, FSUS, FAMU DRS) have anything resembling FAU High's degree-completion model, or is FAU the outlier among them?\n- **[UNCHK]** Has UCF's community schools work ever been framed by UCF as a response to choice, or purely as community engagement? The framing matters for how it is coded.\n- **[NONE so far]** No Florida university operating an online K-12 school at ASU Prep Digital's scale surfaced in this round."},{"id":"field-scan","title":"The field scan and the Julie Young thread","group":"Postsecondary","blurb":"Five organizations, one seam; the career that carried the innovation.","date":"2026-09-13","file":"claude_WMFC-Research-Field-and-Postsecondary.md","words":1006,"md":"# WMFC — Field Scan and the ASU / Julie Young Thread\n*Research round, 13 September 2026. All claims below are sourced; links inline.*\n\n## Part 1 — The five organizations\n\n| Org | Who | What they publish | What they measure |\n|---|---|---|---|\n| **Cato — Center for Educational Freedom** | Neal McCluskey, director | [Public Schooling Battle Map](https://www.cato.org/public-schooling-battle-map) — interactive, filterable by state/year/district, full dataset downloadable as a sheet; mid-2000s→present | **Conflict**, not policy: public-school fights over rights, values, identity |\n| **Heritage Foundation** | Education Freedom Report Card | [educationreportcard.heritage.org](https://educationreportcard.heritage.org/) — 50 states + DC + PR, banded in tens, state cards, state-vs-state comparison, legislation tracker. Florida ranked first at launch | **Statute on the books** |\n| **EdChoice** | founded on Friedman's 1955 argument | [The ABCs of School Choice](https://www.edchoice.org/research/the-abcs-of-school-choice/) — 25th edition (2026), reorganized by state, adds the federal tax-credit program; plus Participation Rankings, the Friedman Index, Schooling in America survey, School Choice in America Dashboard | **Programs and participation** |\n| **Center for Education Reform** | Jeanne Allen, 32 years | [Parent Power Index](https://parentpowerindex.edreform.com/) — state grades | **Parent authority** — a different question from program count |\n| **ExcelinEd** | Tallahassee; Patricia Levesque | [2026 Education Policy Playbook](https://excelined.org/2026/01/09/8-education-policy-trends-for-state-lawmakers-in-2026/); 8 trends; Education Scorecard | **Legislative uptake** |\n\n**The gap, confirmed.** All five measure the K–12 supply side — programs, participation, parent authority, conflict volume, legislative uptake. None tracks how the institutions that *train teachers* respond. ExcelinEd comes closest: its 2026 trend #8 (Teacher Policy) calls for Educator Preparation Programs to adopt public report cards tracking graduate outcomes, and notes states passing ROI analyses of postsecondary programs — but it frames preparation as an **accountability** problem, not a **market** one. That seam is still open.\n\n**Method note from Cato worth stealing:** the Battle Map ships its entire dataset as a downloadable sheet. Publishing the data behind the visualization is a credibility move WMFC should copy.\n\n## Part 2 — Postsecondary: the reputation problem\n\n**U.S. News \"Most Innovative National Universities\" is a peer-nomination survey** — presidents, provosts and admissions deans vote. It measures what peers *say*, not what institutions *did*. ([Axios, Sept 2025](https://www.axios.com/local/phoenix/2025/09/23/arizona-state-university-innovation-us-news-world-report))\n\n- **Arizona State University: #1 for 11 consecutive years** — every year since the category was created.\n- **Georgia Tech: #3** for 2026 ([Georgia Tech newsroom](https://www.gatech.edu/news/2025/09/23/georgia-tech-secures-multiple-no-1-rankings))\n- U.S. News blocks automated access to the full list; ranks 2 and 4–10 remain **not yet verified**.\n\n**This is the research design.** Take the top 20 innovation-ranked universities and code them on WMFC's four lenses. The question writes itself: *does a reputation for innovation predict any behavior at all when funding becomes portable?* Either answer is publishable.\n\n## Part 3 — The Julie Young thread (the strongest single finding this round)\n\nA career, not an institution, carried the innovation:\n\n1. **1996** — Florida DOE awards a $200,000 \"Break the Mold\" grant to Orange and Alachua counties.\n2. **1997** — Julie Young founds **Florida Virtual School**, from a handful of students.\n3. **2003** — FLVS enters the Florida Education Finance Program and becomes **the first school in the country to tie funding directly to student performance**, via reporting of successful half-credit completions. ([Florida Virtual School](https://en.wikipedia.org/wiki/Florida_Virtual_School))\n4. **2017** — **ASU Prep Digital** opens: a public charter university-preparatory school operating as an extension of ASU, K–12, full-time / part-time / hybrid, serving students worldwide and partnering with Arizona districts. ([ASU Prep Digital](https://en.wikipedia.org/wiki/ASU_Prep_Digital))\n5. **Now** — Young is **Vice President of Education Outreach and Student Services** at ASU and Managing Director of ASU Prep Academy and ASU Prep Digital. She grew FLVS to over 2 million students in 50 states and 68 countries. ASU Prep Academy serves ~10,000 students across five Arizona campuses plus the international digital school. ([ASU profile](https://search.asu.edu/profile/3127527), [ASU Prep Digital about](https://www.asuprepdigital.org/about/))\n\n**ASU Prep Digital accepts Arizona Empowerment Scholarship Account funds and offers private-pay tuition** alongside tuition-free Arizona public enrollment. That is Lens C (market behavior) and Lens B (K–12 services to non-public students) **documented, at the #1-ranked innovative university.**\n\n*Unverified:* the year Young moved from FLVS to ASU, and the end of her FLVS tenure. Coded as \"not yet checked.\"\n\n## Part 4 — A second mechanism worth coding: Virginia lab schools\n\n**Virginia College Partnership Laboratory Schools**, § 22.1-349.1 — public, nonsectarian K-12 schools operated in partnership with higher education institutions, explicitly framed as \"incubators of educational innovation.\" **15 operational.** Eligible partners include public universities, TAG-eligible private colleges, *and community colleges* — Northern Virginia Community College and Eastern Shore Community College are named partners, alongside George Mason, Old Dominion and Roanoke College. ([Virginia DOE](https://www.doe.virginia.gov/teaching-learning-assessment/specialized-instruction/laboratory-schools))\n\nThis is a statutory channel by which universities and community colleges operate K–12 schools. It belongs in the Atlas state profile for Virginia and generates 15 institution records immediately.\n\n## Part 5 — The citation ladder (four rungs)\n\nRather than one link per claim, four:\n\n1. **Primary document** — the opinion, the statute, the agency report\n2. **Argument audio / video** — [Oyez](https://www.oyez.org/cases/2001/00-1751) synced audio, [C-SPAN](https://www.c-span.org/program/public-affairs-event/espinoza-v-montana-department-of-revenue-oral-argument/536685) oral argument video\n3. **Explainer** — [Federal Judicial Center Term Talk](https://www.fjc.gov/publications/term-talk-espinoza-v-montana-dep%E2%80%99t-revenue), Ballotpedia\n4. **Teaching resource** — [Harlan Institute lesson plans](https://harlaninstitute.org/lesson-plans/lesson-plan-espinoza-v-montana-department-of-revenue/)\n\n*Espinoza v. Montana* has all four. Rung 2 is the one almost no research site builds, and it costs one field in the JSON.\n\n## Five visual forms proposed from this research\n\n1. **The Carrier Line** — institutions as lanes, a person as a line crossing them. Innovation traveled with Julie Young; the institution kept only the plumbing.\n2. **The Mechanism Pair** — two money-flow diagrams, seat-time vs. completion-triggered. The entire policy difference is one gate in the drawing. Repeatable template for every ESA, voucher and tax-credit program.\n3. **The Reputation Ledger** — peer-voted rank on the left, coded behavior on the right, unchecked cells drawn honestly.\n4. **The Consensus Gap** — parallel coordinates across all five organizations' indices. WMFC's contribution is not a sixth ranking; it is the *disagreement* between the five. Requires no opinion and produces a finding nobody else is positioned to produce.\n5. **The Citation Ladder** — a four-segment bar on every citation marker showing which rungs exist."},{"id":"readiness-gap","title":"The Readiness Gap — 2026 baseline","group":"Postsecondary","blurb":"The inaugural Readiness Index report.","date":"2026-07","file":"WMFC-Readiness-Gap-2026.docx","words":3083,"md":"The Readiness Gap · WMFC Readiness Index 2026 Baseline\n\n**WHEN MONEY FOLLOWS THE CHILD**\n\nTHE READINESS INDEX · 2026 BASELINE\n\n**The Readiness Gap**\n\n*Are colleges of education responding to portable-funding policy?*\n\nThe first institution-by-institution measure of whether the schools that produce America's teachers are building anything for the schooling that portable funding now pays for — and an honest account of what could not yet be checked.\n\nInaugural annual edition · Prepared July 2026\n\nIndependent · Nonpartisan · Provenance-first\n\nwhenmoneyfollowsthechild.org\n\n# **Contents**\n\n# **Executive summary**\n\nThirty-plus states have made K-12 funding portable, and Florida alone now funds more than 500,000 students to learn outside district-run schools. That policy transformation is measured exhaustively. What is not measured is whether the institutions that produce teachers — the nation's colleges, schools, and departments of education — are responding to it. **This report is the first attempt to measure that response, one institution at a time.**\n\nThe 2026 baseline finds a wide gap between how far the policy has traveled and how far the institutions have moved. In Florida — the state with the most advanced portable-funding ecosystem in the country, an A-plus on policy penetration — the baseline codes **zero education programs built for the sector, three institutions that merely name it, and a single operating-or-authorizing move** across the institutions examined. The demand side has scaled faster than any part of the country; the supply-of-educators side has, so far, barely acknowledged it.\n\n| **The finding, and the honesty around it** Finding: where portable-funding policy is most advanced, the institutional response from colleges of education is minimal — coded engagement is rare, and where it exists it more often takes the form of operating or authorizing schools than of building programs to prepare educators for them. Discipline: this baseline is deliberately partial. It reports what was found and, with equal prominence, what could not yet be checked — 27 of Florida's 28 state colleges remain unscanned. A finding you cannot verify is not reported as a finding. |\n| --- |\n\n### **What both sides can take from this**\n\nThe Index codes institutional engagement as an observable behaviour, not a virtue, so the same rows support opposite readings. A reader who believes portable-funding policies harm public education can read the near-absence of institutional response as colleges *declining, appropriately, to build for a sector they have reason to doubt.* A reader who supports those policies can read it as colleges *lagging behind families and legislators.* The data privileges neither. That is the point: the field has needed a shared, checkable set of facts about the institutional response, and has not had one.\n\n### **Why this is the report only WMFC can write**\n\nOthers measure what families choose (EdChoice), which states adopt choice (ExcelinEd), and whether teacher preparation is good in general (NCTQ). This report measures something none of them do: whether preparation institutions are responding to the choice sector *specifically*, tracked over time. It builds directly on Michael McShane's *Surfing the Pipeline* (EdChoice, 2023) — with attribution — and its contribution is not that first scan but the questions left unasked after it.\n\n# **1. Why this measurement doesn****'****t exist yet**\n\nThe school-choice research field is dense on the demand and policy sides and nearly empty on one specific supply question. Understanding why reveals exactly what this report contributes.\n\nEvery major organization stops at the same edge. **EdChoice** catalogs every program and synthesizes 200-plus studies on the outcomes of choice, but its workforce-preparedness work is a one-off scan, not a standing series. **ExcelinEd** runs a serious teacher-pipeline workstream, but frames it around district and state shortages and model legislation — not whether prep programs serve non-district settings. **CRPE** studies how the teaching role is redesigned and whether microschools survive, but does not code whether degree-granting education schools are building programs for the sector. **NCTQ** audits whether teacher prep is good — at preparing teachers for conventional classrooms; its standards are silent on non-district settings. And the **National Microschooling Center** trains facilitators directly, precisely because the institutions do not — which is evidence for this report's thesis, not a substitute for it.\n\nThe result is a seam that sits downstream of policy adoption and upstream of school quality, and has therefore been nobody's job. This report occupies it.\n\n### **What this report adds to Surfing the Pipeline**\n\nMcShane's 2023 EdChoice work established that teacher-preparation programs gear their curriculum toward district schools, because that is where graduates are placed, leaving alternative models to build their own pipelines. This report takes that insight and makes three additions:\n\n- **A standing series, not a snapshot. **The coding is designed to be re-run annually so change over time becomes visible — the 2023 four-state baseline is folded in and re-measured with attribution.\n\n- **The operating-versus-teaching distinction. **Institutions engage the sector by running or authorizing schools at least as often as by building courses — a behaviour catalog scans miss entirely, and which this report codes as a distinct signal.\n\n- **The permissibility question. **Whether a choice-sector credential is even allowed under accreditation and licensure codes — flagged here as the question underneath the whole measurement, and the focus of year two.\n\n# **2. Method — read this before the findings**\n\nThe method is published before the findings on purpose. An index of institutional behaviour is only as trustworthy as its coding rules and its provenance, so both are laid out in full and open to challenge.\n\n## **2.1 The unit of analysis**\n\nThe unit is the **education unit** — the college, school, or department of education at a degree-granting institution. The Index does not code the university as a whole; it codes the part of it responsible for preparing educators.\n\n## **2.2 The four-category coding scheme**\n\nEach education unit is coded into exactly one category, based on the strongest evidence found in its own published program materials.\n\n| **Code** | **Definition** | **What it takes to earn it** |\n| --- | --- | --- |\n| Built for sector | The unit states a purpose to prepare educators for, or to operate within, non-district settings. | An explicit pathway, credential, department, or program purpose oriented to the choice sector. |\n| Names sector | The unit's materials name private, classical, charter, microschool, or other non-traditional settings. | Sector-naming text inside a broader program — but no dedicated offering built for it. |\n| Incidental | The unit reaches these educators only as a side effect of general certification. | No sector-naming text; graduates happen to enter these settings. |\n| Nothing found | A structured search identified no relevant offering. | Absence of evidence — explicitly not evidence of absence. |\n\n## **2.3 The operating / authorizing flag**\n\nSeparately from the coding, each unit is flagged for whether its institution **operates or authorizes** a school in the sector — for example, a university that authorizes charter schools. This is coded independently because it is a real form of engagement that curriculum-only scans overlook, and because a unit can score low on curriculum while its institution is deeply engaged as an operator. The two signals are kept distinct rather than blended into a single score.\n\n## **2.4 Nothing found is not nothing there**\n\nThe most important rule in the method. A *Nothing found* code means a structured search — for terms including microschool, homeschool support, ESA, education entrepreneurship, private- and classical-school leadership, and non-traditional settings — returned no match. It never means the offering does not exist. Every such row is marked and, where the full catalog has not been exhaustively reviewed, flagged unverified.\n\n## **2.5 Provenance and correction**\n\nEvery institutional claim carries the source that was read and the date it was checked. Rows are marked verified or unverified, and unverified rows are explicitly the first place readers are invited to challenge. When the Index is wrong, the correction is published on the record and kept there — corrections are not quietly absorbed. This is the mechanism that lets both sides trust the same rows.\n\n# **3. The Florida baseline**\n\nFlorida is the anchor case because it is the extreme case: the largest portable-funding ecosystem in the country, and the state where the gap between policy and institutional response is therefore most visible.\n\n## **3.1 The demand backdrop**\n\nSince HB 1 (2023) made eligibility universal, Florida has served **more than 500,000 scholarship students** across its programs, with application volume still setting records — more than 400,000 students had applied for 2026–27 by late February 2026. This is the demand context against which institutional response is measured: a policy operating at a scale no other state approaches.\n\n## **3.2 What the baseline found**\n\nAcross the Florida education units examined, coded against the scheme above:\n\n| **Measure** | **2026 baseline** | **Reading** |\n| --- | --- | --- |\n| Policy penetration | A+ | Portable funding is as advanced here as anywhere in the U.S. |\n| Programs built for the sector | 0 | No examined unit states a purpose to prepare or operate for it. |\n| Institutions naming the sector | 3 | Engagement exists, but as reference inside broader programs. |\n| Operating / authorizing moves | 1 | Where units engage most concretely, it is as operator, not teacher. |\n| Verification coverage | 63% | Just under two-thirds of coded claims are fully verified. |\n\n| **The gap, stated plainly** Florida scores an A+ on how far its portable-funding policy has traveled and a near-zero on how far its colleges of education have moved to prepare educators for what that policy funds. The distance between those two numbers is the readiness gap this report is named for. |\n| --- |\n\n## **3.3 The distribution layer is improvising the pipeline**\n\nBeneath the institutions, a private market — Choice Navigators, compliance tooling, microschool-support networks, and the National Microschooling Center's own training institute — has grown to prepare and support the sector's educators. That this improvised layer exists at all is itself a coded observation: the workforce is being assembled *in the absence* of an institutional pipeline, not through one. Whether the degree-granting institutions eventually respond is the question the Index will track year over year.\n\n# **4. Signals from the comparison states**\n\nBeyond Florida, the baseline examined institutions in several states chosen as **most-likely-case samples** — places where, if an institutional response existed anywhere, it would be most likely to appear. These are signals, not a census. They can prove that engagement exists; they can never prove it is absent.\n\n| **State signal** | **What the baseline observed** |\n| --- | --- |\n| Arizona | The clearest movement toward 'built for sector,' via institutions doing explicit design work on new staffing models and preparation for non-district settings — the leading edge of the sample. |\n| Arkansas | A standing university unit oriented to school-choice research and preparation registers as one of the few purpose-built cases found. |\n| Michigan | The operating/authorizing pattern is visible — a major university charter authorizer — even where the education unit's curriculum only names the sector. Two of eight university authorizers examined so far. |\n| Indiana & Tennessee | Policy coursework names choice and ESA contexts amid recent universal-choice adoption, but no dedicated pathway was found — 'names,' not 'built for.' |\n| Wisconsin & Texas | Notably, despite Wisconsin's founding role in modern vouchers and Texas's brand-new ESA program, the structured scan found no sector-built offering — coded 'nothing found,' unverified, and flagged as watch cases. |\n\nThe through-line across the sample matches Florida: where institutional engagement appears at all, it is more often *naming* or *operating* than *building programs to prepare educators*. The one exception worth watching is the small number of purpose-built units (Arizona, Arkansas), which are where year two's deeper scan will concentrate.\n\n# **5. What we could not check**\n\nThis section is given the same weight as the findings, because the credibility of an index of institutional behaviour rests on its willingness to publish its own limits before its conclusions. The following are the binding constraints on the 2026 baseline.\n\n- **Comparison states are samples, not a census. **They were chosen as most-likely cases and can only prove existence, never absence. No claim in this report should be read as 'no institution in state X does this.'\n\n- **Cases were found by searching for engagement. **This samples on the outcome, which biases any explanation of why engagement is rare. The Index reports the pattern; it does not yet explain it.\n\n- **27 of Florida****'****s 28 state colleges are unscanned. **And that state-college system is precisely where Florida's charter-authorizing pathway operates — the single largest coverage gap in the baseline.\n\n- **Course-level enumeration covers one institution of the set. **Most units are coded from program-level materials, not an exhaustive course-by-course review; Michigan's authorizing scan is two of eight deep.\n\n- **One possible retrenchment is unproven. **A Nova Southeastern charter-leadership master's appears in legacy catalogs but not the current roster. It is coded 'nothing found' and explicitly must not be cited as a retrenchment until archives are checked.\n\n- **This is a single point in time. **Coded July 2026. Scholarship rules, caps, and institutional offerings change annually; every figure is a snapshot to be re-verified.\n\n| **Why the limits are a feature** An index that overclaims is worth less than one that underclaims and says so. Publishing these constraints is what makes the verified rows trustworthy and gives both supporters and skeptics a reason to cite the Index rather than dispute it. The gaps above are not failures of the baseline — they are the agenda for the next edition. |\n| --- |\n\n# **6. What the next edition measures**\n\nEach limit above converts directly into a priority for the 2027 edition. The agenda is sequenced so that the highest-value coverage gaps close first.\n\n- **Complete the Florida state-college scan. **The 27 unscanned institutions, prioritized because that system runs the authorizing pathway — the fastest, highest-value closure of the baseline's largest gap.\n\n- **Finish Michigan****'****s university authorizers. **The remaining six, to establish whether the operating/authorizing pattern is systematic or anecdotal.\n\n- **Establish permissibility. **Read accreditation standards and two state licensure codes to determine whether a choice-sector credential is even allowed — the question underneath the whole measurement.\n\n- **Deepen the purpose-built cases. **Course-level enumeration for the Arizona and Arkansas units, to understand what 'built for sector' actually looks like in practice.\n\n- **Re-measure and expand. **Fold in additional universal-choice states and re-run the full baseline, making the first year-over-year comparison — the moment the Index becomes a genuine series.\n\n*The gap this report names is not a verdict on portable-funding policy. It is a measurement of one institutional response to it — a response that, in 2026, has barely begun. Whether that changes is exactly what an annual index exists to find out.*\n\n# **Appendix — the coded institution rows**\n\nThe full 2026 baseline, institution by institution. Each row carries its coding, whether the institution operates or authorizes a school in the sector, its verification status, and the date it was checked. This is the payload of the Index: every claim is inspectable and every unverified row is an open invitation to correct.\n\n| **Institution (education unit)** | **State** | **Coding** | **Op/Auth** | **Verified** | **Checked** |\n| --- | --- | --- | --- | --- | --- |\n| University of Arkansas — Educ. & Health Professions | AR | Built for sector | — | Yes | Jul 8 |\n| Arizona State — Mary Lou Fulton College | AZ | Built for sector | — | Yes | Jul 10 |\n| Grand Canyon University — College of Education | AZ | Names sector | — | Yes | Jul 11 |\n| Central Michigan — College of Education | MI | Names sector | Yes | Yes | Jul 9 |\n| Indiana University — School of Education | IN | Names sector | — | Yes | Jul 12 |\n| Vanderbilt — Peabody College | TN | Names sector | — | Yes | Jul 13 |\n| University of Florida — College of Education | FL | Names sector | — | Yes | Jul 14 |\n| University of Central Florida — CCIE | FL | Names sector | — | Yes | Jul 15 |\n| Florida State — College of Education | FL | Incidental | — | Yes | Jul 14 |\n| Western Michigan — CEHD | MI | Incidental | unexamined | No | Jul 17 |\n| UW–Madison — School of Education | WI | Incidental | — | No | Jul 16 |\n| Florida Atlantic — College of Education | FL | Nothing found | — | No | Jul 15 |\n| Nova Southeastern — Fischler College | FL | Nothing found* | — | No | Jul 16 |\n| UT Austin — College of Education | TX | Nothing found | — | No | Jul 17 |\n\n** Nova Southeastern carries an unproven possible-retrenchment flag: a charter-leadership master**'**s appears in legacy catalogs but not the current roster. Coded **'**nothing found**'** pending archival verification; must not be cited as a retrenchment.*\n\nRows shown are the inaugural coded set. Codings reflect the strongest evidence found in each unit's published materials as of the checked date; unverified rows are those not yet reviewed against the full catalog. Corrections: info@whenmoneyfollowsthechild.org — published, not absorbed.\n\n# **Sources ****&**** provenance**\n\n*This report combines original institutional coding (conducted July 2026 from each unit**'**s own published program materials) with published context figures. All figures are current-cycle snapshots and shift annually.*\n\nFoundational: M. Q. McShane, Surfing the Pipeline (EdChoice, Oct 2023), with catalog research by Hanover Research — the prior scan this Index builds on and re-measures with attribution.\n\nDemand context (Florida): Step Up For Students, 2025–26 Fast Facts and scholarship program pages; NextSteps application-volume updates (Feb 2026); Florida Dept. of Education school-choice pages.\n\nField landscape: EdChoice (ABCs and 123s of School Choice); ExcelinEd (School Choice Matters, Human Capital workstream); CRPE (Next Education Workforce, community-led innovation); NCTQ (Teacher Prep Review); National Microschooling Center (Sector Analysis, Training Institute).\n\nInstitutional codings: program pages, catalogs, and authorizing-office materials of each named education unit, read on the dates recorded in the appendix. Full per-claim provenance is available in the live Readiness Index.\n\nWMFC method: Readiness Index coding scheme and Method & Corrections page, whenmoneyfollowsthechild.org/method."},{"id":"research-analysis","title":"The portable-funding landscape and the workforce seam","group":"Postsecondary","blurb":"July 2026 research analysis.","date":"2026-07","file":"WMFC-Research-Analysis.docx","words":2823,"md":"When Money Follows the Child · Research Analysis\n\n**WHEN MONEY FOLLOWS THE CHILD**\n\n**The Portable-Funding Landscape and the Workforce Seam**\n\n*A research analysis of school choice in Florida, the United States, and worldwide — built to support, empower, and sharpen the WMFC research program*\n\nPrepared July 2026 · Independent · Nonpartisan · Longitudinal\n\nwhenmoneyfollowsthechild.org\n\n# **Contents**\n\n# **Executive summary**\n\nWMFC occupies a seam that no other organization in the school-choice field owns. Demand for portable funding is measured exhaustively; policy adoption is tracked state by state; the *quality* of teacher preparation is studied. But the question of whether the **educator workforce actually exists to staff what portable-funding policy enables** — and whether the institutions that produce that workforce are responding — falls between every existing organization. This report assembles the current evidence across three levels (Florida, the United States, and the mature international systems) to strengthen that thesis and to arm the Readiness Index with context its rows can be read against.\n\n| **The one-sentence case** Thirty-plus states have made K-12 funding portable and roughly 750,000-2 million children now learn in microschools — yet on the choice movement's own survey data, only about a third of teachers feel prepared to teach in that sector, a gap that has not moved since 2023. WMFC measures the institutional response to that gap. |\n| --- |\n\n### **What the evidence supports**\n\n- **The policy wave is real and accelerating. **At least 18 states now run universal or near-universal eligibility programs; multiple sources place the count of states with some portable-funding program above 30. Tennessee and Pennsylvania enacted universal programs in spring 2026, and several more states have universal bills live in their 2026 sessions.\n\n- **The workforce gap is durable, not transitional. **EdChoice's preparedness cliff — ~87% of teachers feeling prepared for district schools versus ~34% for microschools — has held flat across survey waves since 2023. This is the empirical spine of the WMFC thesis.\n\n- **The institutional response is thin and takes an unexpected form. **Where universities have engaged the choice sector, they have more often done it by operating or authorizing schools than by building degrees or courses — exactly the observation the Readiness Index is designed to capture and catalog scans miss.\n\n- **The mature systems abroad are the field****'****s natural laboratory. **Sweden, the Netherlands, Chile, and England have run portable-funding or school-choice architectures for decades. Their experience points repeatedly back to teacher supply and quality as the binding constraint — and England deliberately moved teacher training out of universities, the sharpest natural experiment available on WMFC's exact question.\n\n# **1. Florida — the baseline case**\n\nFlorida is WMFC's 2026 baseline for good reason: it operates the largest portable-funding ecosystem in the country, and it is where the university charter-authorizing pathway is actually being exercised. It is also the state where the workforce question is most acute, because the demand side has scaled faster here than anywhere else.\n\n## **1.1 The demand side is enormous and still growing**\n\nSince HB 1 (2023) converted Florida's voucher programs into universal education savings accounts, funds have flowed through Step Up For Students via the EMA platform. Florida now serves **more than 500,000 scholarship students** across its programs — the largest ESA ecosystem in the nation by enrollment.\n\n| **Program** | **Who it serves** | **Avg. award** | **Enrollment 2025–26** |\n| --- | --- | --- | --- |\n| FES-EO + FTC | Any K-12 student choosing private school | ~$8,000 | 286,284 |\n| FES-UA (Unique Abilities) | Students 3–22 with a diagnosed disability | ~$10,000 | 140,147 |\n| PEP (Personalized Ed.) | Homeschool-adjacent families | ~$8,000 | 76,274 |\n| Total (FES/FTC/PEP) | Across programs | — | 500,000+ |\n\nApplication volume keeps setting records: more than 400,000 students had applied for 2026–27 scholarships by late February 2026, an early-cycle increase of roughly 12% year over year. Of the ~425,000 applicants in the prior cycle, about 85,000 were first-time applicants — the cohort most in need of navigation and least served by existing infrastructure.\n\n| **Note for the Index** PEP — the homeschool-adjacent program where new learning models concentrate — is now at capacity for new students for 2026–27; renewals are prioritized and new applicants are waitlisted. This caps near-term growth in the highest-intent new-model segment even as the overall pool grows, and it is worth flagging in any Florida deep-dive brief. |\n| --- |\n\n## **1.2 The supply side is where WMFC lives**\n\nFlorida's colleges of education are the natural unit of analysis, and the early signal is stark. The WMFC 2026 baseline codes 19 Florida institutions and finds **zero programs built for the sector, three institutions naming it, and one operating-or-authorizing move** — against an A+ policy-penetration score. That gap between policy saturation and institutional response is the story.\n\nThe published limits matter here and are worth repeating in member-facing material: **27 of Florida****'****s 28 state colleges are unscanned**, and that state-college system is precisely where Florida's charter-authorizing pathway is being used. There is also an unproven possible retrenchment — a Nova Southeastern charter-school-leadership master's that appears in legacy catalogs but not the current roster — which is not citable until archives are checked. Both are strengths, not weaknesses: publishing what is not yet known is the credibility engine of the whole project.\n\n## **1.3 The distribution layer is consolidating around a services market**\n\nBeneath the institutions, a private services market has grown to fill the navigation gap: statutorily defined Choice Navigators, compliance-and-billing tooling for small providers, teletherapy aggregators for the disability program, and microschool-support networks. This layer matters to WMFC because it is where the workforce is being improvised in the *absence* of an institutional pipeline — the market is building its own credentialing pathways because the colleges of education have not. That improvisation is itself a coded observation the Index can track over time.\n\n# **2. The United States — the policy wave and the preparedness cliff**\n\n## **2.1 Portable funding is now the norm, not the exception**\n\nUniversal school choice has moved from fringe idea to mainstream state policy in under four years. West Virginia enacted the first near-universal ESA in 2021; Arizona expanded to universal in 2022; and the model has since spread across Republican-trifecta states and beyond.\n\n- At least 18 states now run universal or near-universal eligibility programs, with 30-plus operating some form of portable-funding program.\n\n- 2025 additions included Idaho, Indiana, New Hampshire, Tennessee, Texas, and Wyoming; Louisiana launched its LA GATOR program.\n\n- Spring 2026 saw Tennessee lift its income cap to full universality and Pennsylvania enact the PA Award. Texas, Ohio, North Carolina, Georgia, Indiana, and Missouri had universal bills moving in 2026 sessions.\n\n- Arizona's mature program surpassed 100,000 students in January 2026; Texas launched with a $1 billion cap and enrolled nearly 96,000 students for 2026–27.\n\nOne outlet estimated in May 2026 that universal programs are now law for roughly half of all US K-12 children, with the share potentially exceeding 60% by year-end if pending bills pass. Treat the exact fraction as a fast-moving, advocacy-adjacent figure worth re-verifying — but the direction is unambiguous.\n\n## **2.2 The learning models the money is flowing into**\n\nMicroschools are the sharpest edge of the new-model sector. Estimates vary widely by definition — the RAND Corporation put full-time enrollment between 750,000 and roughly 2 million, and the National Microschooling Center estimates on the order of 95,000 sites serving 1–1.5 million learners including part-time. Median enrollment is small (around 16–22 students) with most sites run by one or two educators, and a rising share of families now pay with state choice funds.\n\n| **Why this is WMFC****'****s sector, precisely** These schools are staffed largely by educators who left traditional systems, and they concentrate neurodiverse students and learning-difference cases that small staffs are not resourced to serve. The workforce is being assembled ad hoc — which is exactly why whether an institutional pipeline exists is the unanswered question WMFC is built to answer. |\n| --- |\n\n## **2.3 The preparedness cliff — the empirical spine**\n\nThe single most important US finding for WMFC is EdChoice's own survey evidence, first published in Michael McShane's *Surfing the Pipeline* (October 2023, with catalog research by Hanover Research across Florida, Arizona, Wisconsin, and Vermont). It is worth citing precisely because it comes from *inside* the choice movement, which insulates the finding from accusations of hostile framing.\n\n| **Setting** | **Teachers feeling prepared (approx.)** |\n| --- | --- |\n| Public district schools | 87% |\n| Private schools | 74% |\n| Charter schools | 67% |\n| Microschools | ~34% |\n\nThe gap between district and microschool preparedness — roughly 53 points — has **not moved since 2023**. McShane's own conclusion is the WMFC brief in miniature: most teacher-education programs gear their curriculum toward district schools because that is where graduates are placed, so alternative models must build their own pipelines or invest heavily in retraining — a structural disadvantage. His follow-on scan found few courses in even the most choice-rich states designed to prepare teachers for these models.\n\nThis is the seam WMFC formalizes. *Surfing the Pipeline* scanned; WMFC's contribution — corrected and stated plainly on its own method page — is not the first scan but **the questions left unasked after it**: whether the institutional response has changed since 2023, whether it takes the form of operating rather than teaching, and whether a choice-sector credential is even permissible under accreditation and licensure codes.\n\n# **3. Worldwide — the mature systems as a laboratory**\n\nThe method page names four systems that have run choice or portable-funding architectures long enough to reveal second-order effects. Each speaks directly to the workforce question, and together they let WMFC argue that the US is re-running an experiment whose bottleneck is already known.\n\n## **3.1 Sweden — the cautionary case on teacher supply**\n\nSweden introduced one of the world's most sweeping voucher systems in the early 1990s, letting tax money follow students to independent *friskolor*. The independent-school share rose from roughly 4% (2003) to 14% (2012). Two decades on, the central debate is whether marketization contributed to Sweden's sharp PISA decline — and the mechanism most often cited is workforce. Independent schools were found to employ **fewer qualified and experienced teachers**, to run higher student-teacher ratios, and to struggle with teacher supply; an OECD review faulted the country's muddled teacher training. Research suggested the profit motive frequently outran quality control.\n\n| **The Sweden lesson for WMFC** A generous, universal portability regime does not by itself produce a qualified workforce for the new schools it enables — and where the pipeline lags, quality can erode even as choice expands. This is the strongest single argument that WMFC's question is the one that determines whether portable funding succeeds. |\n| --- |\n\n## **3.2 The Netherlands — a century of constitutional choice**\n\nThe Netherlands has funded school choice constitutionally since 1917: public and private (largely denominational) schools are financed on equal per-pupil terms, and roughly two-thirds of Dutch pupils attend privately-run, publicly-funded schools. It is the world's longest-running demonstration that near-universal portability can be institutionally stable. For WMFC it is the natural counterpoint to Sweden — the case where a mature, regulated teacher-supply and inspection infrastructure grew up alongside choice rather than lagging it. A deep-dive comparing the Dutch teacher-preparation pipeline against the improvised US one would be high-value.\n\n## **3.3 Chile — voucher scale and stratification**\n\nChile has run a nationwide voucher system since 1981 — one of the oldest and most studied. Its long-run record is central to the international debate on whether universal vouchers raise achievement or mainly sort students, and later reforms (notably the 2015 Inclusion Law) responded to stratification concerns. Chile gives WMFC a multi-decade dataset on what happens to the teaching workforce and school quality when portability is taken to national scale and left largely to the market — the scenario several US states are now approaching.\n\n## **3.4 England — the sharpest natural experiment on WMFC****'****s exact question**\n\nEngland is the most directly relevant international case because it deliberately did the thing WMFC studies: it moved teacher training **out of universities** and toward schools. From 2010, School Direct and a rapid expansion of School-Centred Initial Teacher Training (SCITT) shifted recruitment, selection, and training toward school-led providers, with a stated aim of allocating at least half of training places to school-led routes by 2015. The 2021–22 ITT market review forced providers through a reaccreditation process that observers described as an existential threat to university involvement and a risk to teacher supply.\n\nEngland therefore answers the question a US state will face next: *if the pipeline moves out of the university and into the sector itself, what happens to supply and quality?* The English evidence — contested, well-documented, and politically live — is the closest analog to the future WMFC is positioned to track in the US, and re-reading it inside the Index (as the method page proposes) would be a distinctive contribution.\n\n# **4. How this strengthens the WMFC program**\n\nPulling the three levels together, here is where the evidence most directly supports, empowers, and sharpens the initiative.\n\n### **Reinforce the core claim with converging evidence**\n\n- Pair the US preparedness cliff (durable since 2023) with Sweden's workforce-quality erosion and England's pipeline relocation. Three independent bodies of evidence point to the same bottleneck. That convergence is more persuasive than any single statistic.\n\n### **Protect the neutrality architecture**\n\n- Every headline figure here has a version usable by both sides: a supporter reads the preparedness cliff as a market opportunity for new preparation programs; a skeptic reads it as evidence that expansion outran capacity. Keep sourcing figures like the 'half of US K-12' estimate to their advocacy origins and re-verifying them — the credibility of the Index depends on never inheriting a number uncritically.\n\n### **Sequence the research the method page already prioritizes**\n\n- Complete Florida's state-college scan (27 of 28 unscanned) — the highest-value gap, and where the authorizing pathway actually operates.\n\n- Complete Michigan's remaining university authorizers to test whether the Central Michigan pattern repeats.\n\n- Re-measure the 2023 Surfing the Pipeline four-state baseline inside the Index, with full attribution — turning a one-time scan into a longitudinal series.\n\n- Read CAEP standards and two state licensure codes to establish whether a choice-sector credential is even permissible — the permissibility question underneath the whole workforce question.\n\n- Publish an England / Netherlands / Sweden / Chile comparative brief, framing the US as re-running a known experiment.\n\n### **Turn the international cases into a distinctive product line**\n\n- No US-focused choice organization systematically reads the mature foreign systems for the workforce lesson specifically. A recurring 'what the old systems already learned' brief would be genuinely differentiated and hard for others to copy without the same neutral, provenance-first method.\n\n*Bottom line: the field measures what families do and what policymakers pass. WMFC measures whether the institutions that make teachers are building the workforce those policies require — and the Florida baseline, the US preparedness cliff, and the four mature systems abroad all point to the same conclusion: that question is unowned, it is answerable, and it may be the one that decides whether portable funding delivers.*\n\n# **Sources ****&**** notes**\n\n*Figures in this report are drawn from the following sources, retrieved July 2026. Enrollment, award, and policy figures are set annually and shift; re-verify current-cycle specifics before publication.*\n\n### **Policy landscape (US)**\n\nBallotpedia, States with and without universal school choice programs (Feb 2026). Education Commission of the States, How Are Universal School Choice Programs Designed (Jan 2026). America First Policy Institute (Feb 2026). State Policy Network; Americans for Prosperity (Jan 2026). Idiocracy News Media, universal choice reaching eight states (May 2026) — advocacy-adjacent, re-verify. State ESA Tracker.\n\n### **Microschools ****&**** workforce**\n\nThe 74 / National Microschooling Center, 7 Things to Know About Microschools in 2026 (June 2026). RAND Corporation, Microschools as an Emerging Education Model. Education Next, Why Microschools Are Multiplying (2026). National Microschooling Center sector analyses (2024–2025).\n\n### **The preparedness cliff**\n\nM. Q. McShane, Surfing the Pipeline (EdChoice, Oct 2023, with Hanover Research). EdChoice, A Bleak Look at Teaching in America (Oct 2025); Six Lessons Microschools Can Learn from the Charter Sector (Education Next, Nov 2025); EdChoice podcast Ep. 391.\n\n### **Florida**\n\nStep Up For Students, 2025–26 Fast Facts, program pages, and Provider/PEP handbooks. NextSteps blog application-volume updates (Feb 2026). Florida Department of Education school-choice pages. (Internal WMFC baseline: 2026 Readiness Index, 19 Florida institutions.)\n\n### **International**\n\nSweden: LLAKES/UCL IOE, OECD teacher-training review; Böhlmark & Lindahl (Economica, 2015); Hinnerich & Vlachos (Labour Economics, 2017). England: House of Lords Library, ITT providers market (2021); Glazzard & Tate (2025); Tandfonline ITE policy histories; DfE ITT census. Netherlands & Chile: standard comparative literature on constitutional choice (1917) and the 1981 voucher system — to be read into the Index directly per the WMFC method page."},{"id":"district-responses","title":"How school districts have responded to school choice","group":"Districts","blurb":"Florida 1976–2026 and the national frontier.","date":"2026-08-15","file":"district-responses-to-school-choice.md","words":3654,"md":"# How School Districts Have Responded to School Choice\n\n**Part I: Florida, 1976–2026 · Part II: The National Innovation Frontier**\n\nResearch memo — August 15, 2026\n\n---\n\n## Note on sources\n\nEverything below is sourced to public reporti
