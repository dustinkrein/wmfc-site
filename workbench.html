ance, Milwaukee 1990, Florida OSP 1999, FTC 2001, Arizona ESA 2011, Florida FES/PEP universal 2023, federal scholarship tax credit effective Jan 2027\n- **District Response** — segregation academies and freedom-of-choice plans, magnet schools, charter conversion, controlled open enrollment, contracted public schools, à la carte services, ESA vendor registration\n- **Postsecondary Response** — program launches/closures, dual-enrollment expansions to non-public students, vendor registrations, admissions policy changes. Sparse *by observation* — the near-empty lane is the finding, rendered structurally rather than asserted.\n- **Rhetoric & Argument** — Mann (1848), Friedman (1955), and the political statements already in the archive; each quoted exactly, dated, linked to recording or transcript.\n\n**Event record:** `date` · `track` · `era` (derived) · `jurisdiction` · `what_happened` (one neutral sentence) · `why_it_mattered` (max two sentences — the only interpretive field) · `connects_to` (IDs of events, districts, institutions, Atlas rows) · `source` (primary URL + title + date checked).\n\n`connects_to` is what makes this a spine rather than a list: a district surfaces its own timeline slice, an Atlas state shows only its jurisdiction's events, a court case shows every program enacted after it that cites it.\n\n## §1 The Atlas — one method, two maps\n\nUnit: one jurisdiction (country **or** US state). 50 states + DC + PR join the existing 175 country rows.\n\n`mechanisms[]` (ESA, voucher, tax-credit scholarship, open enrollment, per-student home-education allocation) · `year_enacted` per mechanism plus year of universal expansion · `eligibility` (universal/means-tested/categorical) · `award` (amount, how set, whether it tracks the state formula) · `setting_neutral` · `district_may_sell` · `intermediary` · `participation` (headcount + share, with year) · `regulatory_floor` (testing, accreditation, background checks, credential requirements) · `sources[]` each with check date.\n\n**Three-variable test becomes a filter, not a paragraph:** setting-neutral funding + statutory permission for districts to sell + an active intermediary. Toggle all three and the map should collapse toward Florida. If it doesn't, the model is wrong and that's worth publishing.\n\nState profile is a real page, not a modal: coded row, chronology slice, districts coded inside it, institutions coded inside it, programs with enrollment history, every source with check date. URLs: `/atlas/us/fl/`, `/atlas/world/nld/`.\n\n## §2 Districts — the Response Index\n\nUnit: one district × one response. Six-type taxonomy:\n\n| Type | What it is | Evidence |\n|---|---|---|\n| Defend | retention marketing, enrollment campaigns, litigation, lobbying for eligibility limits | board minutes, budget lines, filings |\n| Absorb | charter conversion, magnet expansion, in-district choice lotteries | program pages, board resolutions |\n| Unbundle | à la carte courses, part-time enrollment, homeschool support, extracurricular access | enrollment policy, course catalogs |\n| Become a vendor | register on the state ESA marketplace; take scholarship dollars from non-enrolled students | marketplace listing, provider agreement |\n| Restructure | closure and consolidation, portfolio governance, capacity conversion | closure votes, facility plans |\n| No observable response | coded explicitly and counted — an absence you looked for is data | documented search, date checked |\n\n**Record:** `district` (NCES LEA ID, name, state, county) · `enrollment_trend` (5-year series + share of resident students not enrolled) · `response_type` · `first_observed` (date + establishing document) · `mechanism` (plain language) · `dollars` (public figures only, never estimated) · `timeline_events[]` · `source`.\n\nFlorida first — Orange County, Polk, and the districts in the 1976–2026 memo — then the national innovators already researched, including Elizabeth City-Pasquotank.\n\n## §3 Postsecondary — one record, four lenses\n\n| Lens | Question | Sources |\n|---|---|---|\n| A — Preparation | Does any program prepare educators for work outside a district classroom (microschool guide, classical, Montessori, homeschool co-op, tutoring, ESA-vendor instruction, outdoor/nature-based)? | catalogs (2010/2015/2020/2026 via archived editions), Title II reports, IPEDS CIP 13 completions |\n| B — K–12 services to non-public students | Dual enrollment open to homeschoolers and private-school students, enrichment/summer academies, lab schools, à la carte courses, credit-by-exam pathways | registrar policy, dual enrollment articulation agreements, program pages |\n| C — Market behavior | Registered ESA/marketplace vendor? Accepts unaccredited transcripts and portfolio applications? Dual-enrollment revenue from non-public students? | FL EMA and AZ ClassWallet provider lists, admissions policy, state college financial reports |\n| D — Discourse | Centers, symposia, journal special issues, dissertations, faculty senate debate, invited speakers from both directions | event archives, dissertation databases, journal TOCs, center pages |\n\n**Tiering** per lens, 0–3: 0 nothing found · 1 rhetoric or a single course · 2 certificate/concentration/standing program · 3 structural (degree, center, department, or revenue line). Four tiers shown as four marks, never averaged.\n\n**The mirror scan sits beside this, not inside it.** A parallel record set of non-university providers — Prenda, Acton, Wildflower, ACSI, AMI/AMS, Moreland, iTeach, National Microschooling Center — turns the null from \"nobody built it\" into \"it got built off campus.\"\n\n## §4 Leaders — a typed directory\n\nOne directory, four types, filterable. Entry criterion is identical for all: something they did or published that you can link to.\n\n- **Practitioners** — running microschools, ESA vendor businesses, alt-cert programs, district innovation offices\n- **Adapting institutions** — districts, colleges and universities that measurably changed what they offer\n- **Researchers** — who produces the evidence base, where, with what method, including work cutting against the record set here\n- **Policy & advocacy** — legislators, agency heads, intermediaries (Step Up For Students, ExcelinEd, state organizations on every side)\n\n**Record:** `type` · `did_what` (specific, datable — not a biography) · `read_this` (one or two primary things, linked) · `connects_to` · `source`.\n\n## §5 Field Notes — the interpretive layer\n\nNumbered, dated, signed. Everything that is an opinion lives here and nowhere else — which is what lets it be direct. Fixed structure: what I looked at / what I found / how confident I am / what would change my mind. Notes cite records by ID; a contradicted note is amended in place with the amendment dated.\n\nNotes 01–09 carry forward. Next ones already sitting in the research: the Florida three-variable model, the off-campus credential market, employer demand in microschool job postings, and the responsiveness control (did education schools build quickly for *anything* in the last fifteen years?).\n\n## §6 Method, corrections, and what's missing\n\n- **Coding protocol** — decision rules for each tier and response type, written so a second coder would produce the same row\n- **Corrections log** — dated; what was wrong, what it is now, who flagged it. Empty is fine; absent is not.\n- **Known gaps** — states not yet coded, institution types not scanned, questions the data cannot answer\n- **Coverage counters** — jurisdictions/districts/institutions/events coded vs. pending, visible on the homepage\n\n**Citations:** inline only. Superscript marker → small panel with title, publisher, date, date checked, link out. No bibliography page, no references section, no footnote pile. The check date is always visible — it's the difference between a source and a citation.\n\n## Build order\n\n1. **Florida, complete** — chronology with national Law & Courts track plus full Florida track; one Atlas state profile; ~15 district records; ~20 institution records across four lenses; 3 new field notes. JSON-driven; shell built once.\n2. **Florida against comparators** — AZ, TX, WV, OH, IN, AR, UT coded on Atlas variables. Three-variable filter goes live. The Florida model either holds or breaks here.\n3. **All fifty states** — complete Atlas coverage, thin but even. District/institution depth stays where the research is done; coverage counters make the difference visible.\n4. **One comparison surface** — US and world layers merged; geography becomes a facet. Denmark and Alberta are the two known gaps to fill.\n\n## Open decisions (settle before writing code)\n\n1. **Phase 1 timeline event count.** 60–80 populates five tracks and makes era bands mean something; under 40 reads as a sketch.\n2. **Florida district selection criterion.** Largest ten by enrollment / steepest decline / purposive set covering all six response types. Hybrid — largest ten plus any district exhibiting an otherwise-unrepresented response type — probably wins.\n3. **Florida institution list.** 28 state colleges + 12 SUS = a complete public census, a stronger claim than a sample. Privates roughly double it. Recommend: public census in Phase 1, privates in Phase 2.\n4. **How far the Field Notes voice moves.** Range from \"here is what I conclude and why\" to explicit advocacy. The first keeps the records citable by people who disagree — which is what makes them worth building. Decide deliberately rather than drift.\n5. **Archived-catalog panel in Phase 1 or later.** Coding 2010/2015/2020/2026 retroactively turns a snapshot into a four-wave panel and answers \"did they respond?\" rather than \"did they build?\" — but roughly quadruples per-institution work. Possibly run on the 12 SUS institutions only."},{"id":"v2-visual","title":"v2 visual language","group":"Method","blurb":"Three evidence states, six forms.","date":"2026-09-13","file":"claude_WMFC-v2-Visual-Language.md","words":934,"md":"# WMFC v2 — Visual Language\n*Companion to the v2 platform outline · 13 September 2026 · proposal, nothing built*\n\n**Premise: most of what WMFC finds is absence.** A university that built nothing, a district nobody has checked, a lane of history where nothing happened — none of that draws itself. Every form below exists to make an absence visible, countable, and hard to wave away.\n\n## The foundational decision: three evidence states, not two\n\nMost research sites draw two states — a thing, or a blank. That blank does two different jobs, and conflating them is what makes null findings unpublishable.\n\n| State | Mark | Meaning |\n|---|---|---|\n| **Documented** | solid fill | Found, with primary source and check date. The only state carrying a link. |\n| **Searched, none found** | dashed outline | You looked, using a stated method, and there was nothing. A *finding*, not a gap. |\n| **Not yet checked** | thin rule | Nobody has looked. Honest, countable, converts directly into the backlog. |\n\nPayoff: coverage becomes a homepage number — \"218 documented · 96 searched, none found · 412 not yet checked.\" A skeptic sees exactly how much of the claim rests on looking versus on having found.\n\n## Six forms\n\n1. **Track density heatmap** — 5 tracks × 15 decades, sequential ramp. Collapses the chronology into one glance. The Postsecondary row stays at zero through every era where law, legislation and rhetoric are all firing. Four lanes of highway and one never paved.\n2. **Tile-grid collapse** — equal-area US tile grid, three toggles (setting-neutral funding / district may sell / active intermediary). Turn on all three and the map collapses to Florida. The animation *is* the argument — and it can embarrass the model, which is the point. Never a choropleth: land area is not a variable in this research.\n3. **The institution wall** — 40 rows × 4 lens columns (A preparation, B K–12 services, C market behavior, D discourse), each 0–3 on one sequential ramp. Column C dark against column A pale: *institutions take the money without building the program.* One sentence of interpretation, forty rows of evidence, visible from across the room. **If only one thing gets built well, build this.** Never average the four into one score — the finding lives in the disagreement between columns.\n4. **District response matrix** — districts × response types, using the three evidence states. Shape does the encoding, color only reinforces, so it survives greyscale, 1-bit printing and every form of color-blindness. Read across a row (how many distinct moves?) or down a column (is \"become a vendor\" rare because districts won't, or because nobody checked?).\n5. **The divergence** — two lines indexed to 2010 = 100: university education-program completions falling, non-university educator credentials rising. Converts a weak null (\"universities built nothing\") into a strong claim (\"demand rose and was met elsewhere\"). One axis, never dual.\n6. **The lag dumbbell** — enactment year → first observed institutional response, by state. States with no response get an open arrow running to today, not an omitted row, so \"still waiting\" occupies visual space. Companion chart to build next: the same measure for things ed schools *did* respond to (ESL, special-ed shortages, online instruction post-2020) — without that baseline, a long lag may just be how universities always move.\n\n## Encoding rules\n\n- **Two hues only.** Brass `#8A6613` and marine `#006D92` light; `#B08A2E` / `#1495B8` dark. Both validated for color-blind separation and ≥3:1 contrast in both modes. A third hue must earn its way in.\n- **Darker = more.** Every shaded scale is one hue, light to dark. Darkness never means \"a different kind of thing.\"\n- **Never color alone.** Shape, fill style or position always duplicates the color.\n- **Absence is drawn.** Three states, always. A blank cell is a bug.\n- **One axis.** No dual-scale charts, ever.\n- **Equal tiles.** Geographic comparison uses tile grids, not area-weighted maps.\n- **Check date on hover.** Every mark's tooltip carries source and verification date. Provenance one hover from every pixel.\n- **Table underneath.** Every figure has a \"view as table\" toggle over the same JSON — accessibility, citation, and skeptic answer in one control.\n\n## What not to draw\n\n- **A national readiness score** — one number invites a ranking, and the four-lens pattern disappears inside the average.\n- **A geographic choropleth** — area-weighted color makes empty states loud and dense ones invisible.\n- **Sankey diagrams of student flow** — requires enrollment-transition data that doesn't exist; built on estimates it's a confident-looking guess.\n- **Pie or donut charts** — share questions are comparisons, which is a bar chart's job.\n- **Scroll-triggered reveals** — a figure at zero opacity is invisible to thumbnails, shared links, and skimmers.\n- **A live news ticker** — reads as a position regardless of sourcing, and burdens a one-person site. The chronology already does this job, with citations.\n\n## The build note\n\nBefore any of the six: **one shared chart component** reading the same JSON the records read, with the three evidence states and two hues baked in. Six bespoke visualizations drift apart within a month; six configurations of one component don't — and the phone-driven publishing workflow only survives if adding a figure means adding data, never touching code.\n\n## On specimen data\n\nThe published specimen sheet uses invented values with anonymized row labels (`SUS-04`, `FL-D07`). Putting example codings next to real institution names is how a specimen sheet turns into a false finding. Rule going forward: **real names only appear next to real codings, and the check date travels with them.**"}]}</script>

<body>
<div class="top"><div class="rule"></div><header>
  <div class="mast">
    <a class="word" href="#about">When Money <i>Follows</i> the Child</a>
    <span class="sub">Research workbench</span>
    <button class="theme" id="themeBtn" type="button" aria-label="Switch between light and dark"><span data-m="light">Light</span><span data-m="dark">Dark</span></button>
  </div>
  <nav class="main" id="nav">
    <a href="#about">About</a>
    <a href="#problem">Problem</a>
    <a href="#working">What's working</a>
    <a href="#research">Research</a>
  </nav>
</header></div>
<main id="view" tabindex="-1"></main>
<footer><div class="in">
  <div class="legend"><span><i class="ev ev-doc"></i>Documented, with source</span><span><i class="ev ev-none"></i>Searched, none found</span><span><i class="ev ev-unchk"></i>Not yet checked</span></div>
  <div id="foot"></div>
</div></footer>
<div class="toast" id="toast">Link copied</div>
<script>
(function(){
"use strict";
var D;
try{ D = JSON.parse(document.getElementById('wmfc-data').textContent); }
catch(e){ document.getElementById('view').innerHTML='<p>The data block could not be read: '+e.message+'</p>'; return; }

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ev(k,t){var tt={doc:'Documented',none:'Searched, none found',unchk:'Not yet checked'}[k]||'';return '<i class="ev ev-'+k+'" title="'+(t||tt)+'" aria-label="'+tt+'"></i>';}
function srcLink(label,url){
  if(!url) return '<span class="src nolink">'+esc(label)+'</span>';
  if(url.charAt(0)==='#'||url.charAt(0)==='/') return '<a class="src" href="'+esc(url)+'">'+esc(label)+'</a>';
  return '<a class="src" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(label)+' ↗</a>';
}
function srcs(list){ if(!list||!list.length) return ''; return '<div class="srcs">'+list.map(function(s){return srcLink(s[0],s[1]);}).join('')+'</div>'; }
function fmtDate(iso){ if(!iso) return ''; var m=String(iso).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/); if(!m) return esc(iso);
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]; return (m[3]?(+m[3])+' ':'')+mo+' '+m[1]; }
function strip(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent||'';}
function byId(id){return document.getElementById(id);}
function libById(id){for(var i=0;i<D.library.length;i++) if(D.library[i].id===id) return D.library[i]; return null;}
function toast(t){var el=byId('toast');el.textContent=t||'Link copied';el.classList.add('on');setTimeout(function(){el.classList.remove('on');},1400);}
function copyLink(){var u=location.href; if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast();},function(){prompt('Copy this link',u);});} else prompt('Copy this link',u);}
window.WMFCcopy=copyLink;

/* ---------- tiny markdown renderer (no dependencies) ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|#[^\s)]*)\)/g,function(m,t,u){return u.charAt(0)==='#'?'<a href="'+u+'">'+t+'</a>':'<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';});
  s=s.replace(/\*\*\[(DOC|NONE|UNCHK)[^\]]*\]\*\*|\[(DOC|NONE|UNCHK)\]/g,function(m,a,b){var k=(a||b).toLowerCase();return ev(k==='doc'?'doc':k==='none'?'none':'unchk');});
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,'$1<em>$2</em>');
  s=s.replace(/(^|\W)_([^_\n]+)_(?=\W|$)/g,'$1<em>$2</em>');
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,function(m,p,u){return p+'<a href="'+u+'" target="_blank" rel="noopener">'+u.replace(/^https?:\/\//,'').slice(0,48)+(u.length>56?'…':'')+'</a>';});
  return s;
}
function md(src){
  var L=String(src).replace(/\r/g,'').split('\n'),out=[],i=0;
  function para(buf){if(buf.length) out.push('<p>'+inline(buf.join(' '))+'</p>');}
  while(i<L.length){
    var l=L[i];
    if(/^```/.test(l)){var b=[];i++;while(i<L.length&&!/^```/.test(L[i])){b.push(L[i]);i++;}i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue;}
    if(/^\s*$/.test(l)){i++;continue;}
    var h=l.match(/^(#{1,6})\s+(.*)$/); if(h){var n=Math.min(4,Math.max(2,h[1].length));out.push('<h'+n+'>'+inline(h[2].replace(/\*\*/g,''))+'</h'+n+'>');i++;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){out.push('<hr>');i++;continue;}
    if(/^\s*>/.test(l)){var q=[];while(i<L.length&&/^\s*>/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,''));i++;}out.push('<blockquote>'+md(q.join('\n'))+'</blockquote>');continue;}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}/.test(L[i+1])){
      var rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++;}
      function cells(r){return r.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});}
      var head=cells(rows[0]),body=rows.slice(2);
      out.push('<div class="tbl"><table><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>'+body.map(function(r){return '<tr>'+cells(r).map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>');continue;}
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){
      var ordered=/^\s*\d+[.)]/.test(l),items=[];
      while(i<L.length&&(/^\s*([-*+]|\d+[.)])\s+/.test(L[i])||(/^\s{2,}\S/.test(L[i])&&items.length))){
        if(/^\s*([-*+]|\d+[.)])\s+/.test(L[i])) items.push(L[i].replace(/^\s*([-*+]|\d+[.)])\s+/,'')); else items[items.length-1]+=' '+L[i].trim();
        i++;}
      out.push((ordered?'<ol>':'<ul>')+items.map(function(t){return '<li>'+inline(t)+'</li>';}).join('')+(ordered?'</ol>':'</ul>'));continue;}
    var buf=[];
    while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{1,6}\s|```|\s*>|\s*([-*+]|\d+[.)])\s+|\s*\|)/.test(L[i])&&!/^\s*(-{3,}|\*{3,})\s*$/.test(L[i])){buf.push(L[i].trim());i++;}
    if(buf.length) para(buf); else {out.push('<p>'+inline(l)+'</p>');i++;}
  }
  return out.join('\n');
}

/* ---------- derived counts ---------- */
var inst=D.index.institutions;
var tierCount={}; inst.forEach(function(r){tierCount[r.tier]=(tierCount[r.tier]||0)+1;});
var evDoc=D.events.filter(function(e){return e.src;}).length;

/* ---------- views ---------- */
var V={};
var QLINKS=['#research/districts','#research/index','#working','#research/chronology','#working'];
var QLAB=['District responses','Readiness Index','What\'s working','Chronology','What\'s working'];

V.about=function(){
  var A=D.about,h='';
  h+='<div class="kick">Research workbench</div><h1>The money moved. We track what <i>follows</i>.</h1><p class="lede">'+esc(A.line)+'</p>';
  h+='<div class="qs">'+A.questions.map(function(q,i){return '<a href="'+QLINKS[i]+'"><b>'+(i+1)+'</b><span>'+esc(q)+'</span><em>'+QLAB[i]+' →</em></a>';}).join('')+'</div>';
  h+='<h2>Inside</h2><div class="counters">'+
    cnt(D.events.length,'dated events','#research/chronology')+
    cnt(inst.length,'institutions coded','#research/index')+
    cnt(D.atlas.counts[1],'countries coded','#research/atlas')+
    cnt(D.working.length,'verified responses','#working')+
    cnt(D.notes.length,'field notes','#research/notes')+
    cnt(D.library.length,'memos','#research/library')+'</div>';
  var c=D.index.corrections[0];
  if(c) h+='<div class="corr" style="margin-top:28px"><div class="tag">Latest correction · '+esc(c.date)+'</div><p style="margin:6px 0 0"><b>'+esc(c.title)+'</b> <a href="#research/method">All corrections →</a></p></div>';
  h+='<p class="muted small" style="margin-top:28px">'+esc(A.contact)+'</p>';
  return h;
};
function cnt(n,l,href){return '<a href="'+href+'"><b>'+n+'</b><span>'+esc(l)+'</span></a>';}

V.problem=function(){
  var P=D.problem,h='<div class="kick">The problem</div><h1>'+esc(P.headline)+'</h1><p class="lede">'+esc(P.intro)+'</p>';
  P.groups.forEach(function(g){
    h+='<h2>'+esc(g.title)+'</h2><div class="grid">';
    g.items.forEach(function(it){
      var hasUrl=(it.src||[]).some(function(x){return !!x[1];});
      var mk=(it.ev==='doc'&&!hasUrl)?ev('unchk','Source named; link to attach'):ev(it.ev);
      var lib=it.lib&&libById(it.lib);
      h+='<div class="card"><span class="corner">'+mk+'</span><div class="big'+(it.hot?' hot':'')+'">'+esc(it.big)+'</div><div class="lab">'+esc(it.label)+'</div>'+srcs(it.src)+
        (lib?'<a class="more" href="#research/library/'+lib.id+'">Memo →</a>':'')+'</div>';
    });
    h+='</div>';
  });
  h+='<h2>Still open</h2>'+P.open.map(function(o){return '<div style="display:flex;gap:4px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)">'+ev(o[1])+'<span style="font-size:15px">'+esc(o[0])+'</span></div>';}).join('');
  return h;
};

var wFilter='all';
V.working=function(){
  var W=D.working,Dn=D.directions,h='<div class="kick">What\'s working</div><h1>Verified responses</h1><p class="lede">Who changed what they do because the money moved. Inclusion records an action, not an endorsement.</p>';
  var groups=[['all','All'],['post','Colleges'],['district','Districts'],['host','Hosts'],['person','People']];
  h+='<div class="chips" style="margin-top:18px" role="group" aria-label="Filter">'+groups.map(function(g){var n=g[0]==='all'?W.length:W.filter(function(w){return w.who===g[0];}).length;return '<button class="chip" data-wf="'+g[0]+'" aria-pressed="'+(wFilter===g[0])+'">'+g[1]+'<span class="n">'+n+'</span></button>';}).join('')+'</div>';
  h+='<p class="oneline">'+Object.keys(Dn).map(function(k){return '<b>'+esc(Dn[k][0])+'</b> '+esc(Dn[k][1].toLowerCase());}).join(' · ')+'</p>';
  h+=W.filter(function(w){return wFilter==='all'||w.who===wFilter;}).map(function(w){
    var d=Dn[w.dir];var lib=w.lib&&libById(w.lib);
    return '<div class="rec"><div class="meta">'+(d?'<span class="tag">'+esc(d[0])+'</span>':'')+(w.caution?'<span class="tag c">Counterexample</span>':'')+'<span>'+esc(w.state)+(w.year?' · '+w.year:'')+'</span></div><h3>'+esc(w.name)+'</h3><p>'+esc(w.what)+'</p>'+srcs(w.src)+
      (lib?'<div class="srcs"><a href="#research/library/'+lib.id+'">Memo →</a></div>':'')+'</div>';
  }).join('');
  var t1=inst.filter(function(r){return r.tier==='Tier 1';});
  h+='<h2>Readiness Index · built for the sector</h2><p class="oneline">'+t1.length+' institutions. Most entered by authorizing or operating schools, not by adding courses.</p>';
  h+=t1.map(function(r){return '<details class="x"><summary><span class="tier t1"></span><span><b style="font-weight:600">'+esc(r.name)+'</b> <span class="muted small">'+esc(r.state)+'</span></span></summary><div class="in">'+r.evidence+'<div class="srcs">'+srcLink('Source',r.source)+'<span class="checked">Checked '+fmtDate(r.checked)+'</span></div></div></details>';}).join('');
  return h;
};

/* ---------- research ---------- */
var RT=[['chronology','Chronology'],['index','Readiness Index'],['districts','Districts'],['placement','Placement'],['atlas','Atlas'],['notes','Field notes'],['library','Library'],['method','Method']];
V.research=function(parts){
  var sub=parts[1]||'chronology';
  var h='<div class="subnav"><div class="chips">'+RT.map(function(r){return '<a class="chip" href="#research/'+r[0]+'"'+(r[0]===sub?' aria-current="page"':'')+'>'+r[1]+'</a>';}).join('')+'</div></div>';
  return h+(R[sub]||R.chronology)(parts);
};
function head(k,t,l){return '<div class="kick">'+k+'</div><h1>'+t+'</h1>'+(l?'<p class="lede">'+l+'</p>':'');}
var R={};

var cTrack='all',cDocOnly=false;
R.chronology=function(){
  var T=D.tracks,E=D.eras,h=head('Question 4','How we got here','Five tracks, one timeline. The thin postsecondary lane is the finding.');
  function era(y){for(var i=0;i<E.length;i++) if(y>=E[i][1]&&y<=E[i][2]) return i; return E.length-1;}
  var M={};D.events.forEach(function(e){var k=e.t+'|'+era(e.y);M[k]=(M[k]||0)+1;});
  h+='<div class="heat" style="margin-top:22px" role="table" aria-label="Events by track and era"><div class="h"></div>'+E.map(function(e,i){return '<div class="h" title="'+esc(e[0])+'">'+e[1]+'–'+(i===E.length-1?'':e[2])+'</div>';}).join('');
  Object.keys(T).forEach(function(t){
    h+='<div class="r">'+esc(T[t])+'</div>';
    E.forEach(function(e,i){var n=M[t+'|'+i]||0;var c=n===0?0:n<2?1:n<4?2:n<8?3:4;h+='<button class="c c'+c+'" data-track="'+t+'" title="'+esc(T[t])+', '+esc(e[0])+': '+n+'">'+n+'</button>';});
  });
  h+='</div><p class="small muted">Tap a cell to filter. Dashed = nothing recorded yet.</p>';
  h+='<div class="tools"><div class="chips" style="padding:0">'+[['all','All']].concat(Object.keys(T).map(function(k){return [k,T[k]];})).map(function(t){var n=t[0]==='all'?D.events.length:D.events.filter(function(e){return e.t===t[0];}).length;return '<button class="chip" data-ct="'+t[0]+'" aria-pressed="'+(cTrack===t[0])+'">'+esc(t[1])+'<span class="n">'+n+'</span></button>';}).join('')+'</div>'+
    '<label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="docOnly"'+(cDocOnly?' checked':'')+'> Sourced only ('+evDoc+')</label></div>';
  var list=D.events.filter(function(e){return (cTrack==='all'||e.t===cTrack)&&(!cDocOnly||e.src);});
  E.forEach(function(e,i){
    var es=list.filter(function(x){return era(x.y)===i;}); if(!es.length) return;
    h+='<div class="era"><h3>'+esc(e[0])+'</h3><span class="small muted">'+e[1]+'–'+(i===E.length-1?'now':e[2])+'</span></div>';
    h+=es.map(function(x){return '<div class="ev-row" id="'+x.id+'"><div class="y">'+x.y+'</div><div><div class="meta">'+ev(x.src?'doc':'unchk',x.src?'Documented':'Source to attach')+'<span>'+esc(T[x.t])+'</span><span>'+esc(x.j)+'</span></div><h4>'+esc(x.h)+'</h4><p>'+esc(x.x)+'</p>'+(x.src?'<div class="srcs">'+srcLink(x.src[0],x.src[1])+'</div>':'')+'</div></div>';}).join('');
  });
  return h;
};

var iState='all',iTier='all';
R.index=function(){
  var I=D.index,cats=I.categories,h=head('Question 2','The Readiness Index','Has each college of education — or its university — built anything for schooling outside district-run schools?');
  var order=['Tier 1','Tier 2','Tier 3','Tier 0'];
  h+='<div class="tiersum" style="margin-top:22px">'+order.map(function(t){return '<button data-it="'+t+'" aria-pressed="'+(iTier===t)+'" title="'+esc(cats[t].def)+'"><b>'+(tierCount[t]||0)+'</b><span><i class="tier t'+t.slice(-1)+'"></i>'+esc(cats[t].label)+'</span></button>';}).join('')+'</div>';
  var states=[];inst.forEach(function(r){if(states.indexOf(r.state)<0) states.push(r.state);});
  h+='<div class="tools"><select id="iState" aria-label="State"><option value="all">All states ('+inst.length+')</option>'+states.map(function(s){var n=inst.filter(function(r){return r.state===s;}).length;return '<option value="'+esc(s)+'"'+(iState===s?' selected':'')+'>'+esc(s)+' ('+n+')</option>';}).join('')+'</select>'+(iTier!=='all'?'<button class="btn" data-it="all">All tiers</button>':'')+'<a class="small" href="#research/method">Tier definitions →</a></div>';
  if(iState!=='all'&&I.coverage[iState]){var cv=I.coverage[iState];h+='<p class="oneline"><b>'+esc(I.depths[cv.depth].label)+'.</b> '+esc(cv.note)+'</p>';}
  var rows=inst.filter(function(r){return (iState==='all'||r.state===iState)&&(iTier==='all'||r.tier===iTier);});
  rows.sort(function(a,b){return order.indexOf(a.tier)-order.indexOf(b.tier)||a.state.localeCompare(b.state);});
  h+=rows.map(function(r){return '<details class="x"><summary><i class="tier t'+r.tier.slice(-1)+'" title="'+esc(cats[r.tier].label)+'"></i><span><b style="font-weight:600">'+esc(r.name)+'</b> <span class="muted small">'+esc(r.state)+(r.scope==='aggregate'?' · summary row':'')+'</span></span></summary><div class="in"><p>'+r.evidence+'</p><div class="srcs">'+(r.source?srcLink('Source',r.source):'')+'<span class="checked">Checked '+fmtDate(r.checked)+'</span></div></div></details>';}).join('');
  h+='<h2>Who feels prepared, by setting</h2><div class="bars">'+I.preparedness.map(function(p){return '<div class="bar'+(p.highlight?' hl':'')+'"><span>'+esc(p.label)+'</span><span class="t"><i style="width:'+p.value+'%"></i></span><b>'+p.value+'%</b></div>';}).join('')+'</div><p class="small muted" style="margin-top:8px">Teachers who feel prepared to teach there. EdChoice survey data.</p>';
  return h;
};

R.districts=function(){
  var h=head('Question 1','District responses','Florida districts went from denial to selling on the scholarship marketplace in under three years.');
  h+='<h2>Florida districts selling to students they don\'t enroll</h2><div class="vc">'+D.vendor_curve.map(function(p){return '<a href="'+esc(p.url)+'" target="_blank" rel="noopener" title="'+esc(p.lab)+' — source"><b>'+p.v+'%</b><span class="col" style="height:'+(p.v*1.45)+'px"></span></a>';}).join('')+'</div>';
  h+='<div class="vcx">'+D.vendor_curve.map(function(p){return '<div><b>'+esc(p.d)+'</b><br>'+esc(p.lab)+'</div>';}).join('')+'</div><p class="small muted" style="margin-top:8px">Share of 67 districts. Tap a bar for its source.</p>';
  h+='<h2>Why only Florida: three conditions</h2><div class="grid">'+[['1','Setting-neutral funding'],['2','Districts may sell to non-enrolled students'],['3','An intermediary recruiting districts']].map(function(c){return '<div class="card"><div class="big hot">'+c[0]+'</div><div class="lab">'+c[1]+'</div></div>';}).join('')+'</div><p class="oneline" style="margin-top:12px">West Virginia lacks the third — and no district sells. Arizona bars ESA students from public enrollment.</p>';
  h+='<h2>Six ways to respond</h2><div class="tbl"><table><thead><tr><th>Response</th><th>On record</th></tr></thead><tbody>'+D.district_types.map(function(r){return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[2])+'</td></tr>';}).join('')+'</tbody></table></div>';
  h+='<h2>Memos</h2>'+['district-responses','rn-04','rn-05','rn-02','rn-03','rn-06','fl-districts'].map(libCard).join('');
  return h;
};

R.placement=function(){
  var P=D.placement,S=D.postures,h=head('Question 2','The placement survey','Ten Florida prep providers, one statute. Can a candidate student-teach outside a district?');
  var order=['open','practice','district','restrict','silent'],shade={open:'var(--ox)',practice:'var(--ox2)',district:'var(--ox3)',restrict:'var(--ink)',silent:'var(--line)'};
  h+='<div class="pill-row" style="margin-top:22px">'+order.map(function(k){var n=P.filter(function(p){return p.pos===k;}).length;return '<i style="flex:'+n+';background:'+shade[k]+'" title="'+esc(S[k])+': '+n+'"></i>';}).join('')+'</div>';
  order.forEach(function(k){
    var ps=P.filter(function(p){return p.pos===k;});
    h+='<h3 style="margin-top:24px;display:flex;align-items:center;gap:8px;font-size:17px"><i style="display:inline-block;width:13px;height:13px;background:'+shade[k]+'"></i>'+esc(S[k])+' <span class="muted small">'+ps.length+'</span></h3>';
    h+=ps.map(function(p){return '<div style="padding:8px 0 8px 21px;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:baseline"><span style="font-family:var(--f);font-size:17px">'+esc(p.p)+'</span><span class="muted small">'+esc(p.t)+'</span>'+(p.url?'<a class="small" href="'+esc(p.url)+'" target="_blank" rel="noopener">Policy ↗</a>':'<span class="small muted">Not public</span>')+'</div>';}).join('');
  });
  h+='<p class="oneline" style="margin-top:18px">Most permissive: a private Christian university. Most restrictive: a public research university, by its own drafting.</p>';
  h+='<h2>Memos</h2>'+['fl-supply-3','fl-supply-2','fl-supply-1'].map(libCard).join('');
  return h;
};

R.atlas=function(){
  var A=D.atlas,rows=A.rows,h=head('Question 4','The Portable-Funding Atlas','Where money has followed the child, and for how long.');
  h+='<div class="counters" style="max-width:480px;margin-top:22px">'+cnt(A.counts[1],'coded','#research/atlas')+cnt(A.counts[2],'shortlisted','#research/atlas')+cnt(A.counts[3],'not yet coded','#research/atlas')+'</div>';
  var coded=Object.keys(rows).filter(function(k){return rows[k].tier===1;});
  var withYear=coded.filter(function(k){return rows[k].since;}).sort(function(a,b){return rows[a].since-rows[b].since;});
  var y0=1800,y1=2026,pct=function(y){return ((y-y0)/(y1-y0)*100).toFixed(2);};
  h+='<h2>Since…</h2><div class="lolli">'+withYear.map(function(k){var r=rows[k];return '<a class="lp" href="#research/atlas/'+k+'"><span>'+esc(r.name)+'</span><span class="track"><span class="span" style="left:'+pct(r.since)+'%;right:0"></span><span class="dot" style="left:'+pct(r.since)+'%"></span><span class="yr" style="left:'+pct(r.since)+'%">'+r.since+'</span></span></a>';}).join('')+'<div class="axis"><div></div><div><span>1800</span><span>1900</span><span>2026</span></div></div></div>';
  function block(title,keys,mark){ if(!keys.length) return ''; return '<h2>'+title+'</h2>'+keys.map(function(k){var r=rows[k];return '<details class="x" id="atlas-'+k+'"'+(openAtlas===k?' open':'')+'><summary>'+mark+'<span><b style="font-weight:600">'+esc(r.name)+'</b> <span class="muted small">'+esc(r.code_label||'')+'</span></span></summary><div class="in">'+(r.mechanism?'<p><b>'+esc(r.mechanism)+'</b>'+(r.since?' · since '+r.since:'')+'</p>':'')+(r.summary?'<p>'+r.summary+'</p>':'')+(r.shortlist_reason?'<p class="muted">Not coded: '+esc(r.shortlist_reason)+'</p>':'')+(r.findings||[]).map(function(f){return '<div class="fnd">'+f.t+'<div class="srcs"><span class="src nolink">'+esc(f.src)+'</span><span class="checked">Checked '+esc(f.checked)+'</span></div></div>';}).join('')+'</div></details>';}).join(''); }
  h+=block('Coded, with start year',withYear,ev('doc'));
  h+=block('Coded, start year not established',coded.filter(function(k){return !rows[k].since&&rows[k].mech_type!=='none';}),ev('doc'));
  h+=block('Coded: no portable mechanism',coded.filter(function(k){return rows[k].mech_type==='none';}),ev('none'));
  h+=block('Shortlisted',Object.keys(rows).filter(function(k){return rows[k].tier===2;}),ev('unchk'));
  h+='<h2>Memo</h2>'+libCard('intl-precedents');
  return h;
};
var openAtlas=null;

R.notes=function(parts){
  var h=head('Interpretation','Field notes','');
  h+=D.notes.map(function(n){var open=parts[2]===String(n.n);return '<details class="x note" id="note-'+esc(n.n)+'"'+(open?' open':'')+'><summary><span style="font-family:var(--f);font-weight:700;color:var(--ox);min-width:26px">'+esc(n.n)+'</span><span><b style="font-family:var(--f);font-size:18px">'+esc(n.title)+'</b><br><span class="small muted">'+esc(n.tag)+' · '+esc(n.date)+'</span></span></summary><div class="in"><p class="stand">'+esc(n.standfirst)+'</p><div class="body">'+(n.body||[]).map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>'+(n.sources&&n.sources.length?'<div class="srcs">'+n.sources.map(function(s){return srcLink(s.label,s.url);}).join('')+'</div>':'')+'<div class="srcs"><a href="#research/notes/'+esc(n.n)+'" onclick="setTimeout(WMFCcopy,50)">Copy link</a></div></div></details>';}).join('');
  return h;
};

var libQ='';
function libCard(id){var d=libById(id); if(!d) return ''; return '<a class="lib-card" href="#research/library/'+d.id+'"><b>'+esc(d.title)+'</b><span>'+esc(d.blurb)+'</span><em>'+(d.date?fmtDate(d.date)+' · ':'')+Math.max(1,Math.round(d.words/230))+' min</em></a>';}
R.library=function(parts){
  if(parts[2]){var d=libById(parts[2]); if(d){
    return '<div class="doc"><div class="backbar"><a class="btn" href="#research/library">← Library</a><button class="btn solid" onclick="WMFCcopy()">Copy link</button></div><div class="kick">'+esc(d.group)+(d.date?' · '+fmtDate(d.date):'')+'</div>'+
      (/^#\s/.test(d.md)?'':'<h1>'+esc(d.title)+'</h1>')+md(d.md)+'<hr class="r"><a class="btn" href="#research/library">← Library</a></div>';}}
  var h=head('Sources','The library','Every memo behind the records, in full.');
  h+='<div class="tools"><input type="search" id="libQ" placeholder="Search memos" value="'+esc(libQ)+'" style="flex:1;min-width:220px"></div><div id="libList">'+libList()+'</div>';
  return h;
};
function libList(){
  var q=libQ.trim().toLowerCase(),groups=[],h='';
  D.library.forEach(function(d){if(groups.indexOf(d.group)<0) groups.push(d.group);});
  groups.forEach(function(g){
    var ds=D.library.filter(function(d){return d.group===g&&(!q||(d.title+' '+d.blurb+' '+d.md).toLowerCase().indexOf(q)>=0);});
    if(!ds.length) return;
    h+='<div class="lib-grp"><h2>'+esc(g)+'</h2>'+ds.map(function(d){return libCard(d.id);}).join('')+'</div>';
  });
  return h||'<p class="muted">Nothing matches.</p>';
}

R.method=function(){
  var I=D.index,A=D.about,h=head('Method','Method & corrections','');
  h+='<h2 style="margin-top:20px">Corrections</h2>'+I.corrections.map(function(c){return '<div class="corr"><div class="tag">Correction '+esc(c.id)+' · '+esc(c.date)+'</div><p style="margin:6px 0 6px"><b>'+esc(c.title)+'</b></p><p class="small" style="margin:0">'+c.detail+'</p></div>';}).join('');
  h+='<h2>Principles</h2>'+A.principles.map(function(p){return '<p><b>'+esc(p[0])+'.</b> <span class="muted">'+esc(p[1])+'</span></p>';}).join('');
  h+='<h2>Index tiers</h2><div class="tbl"><table><tbody>'+['Tier 1','Tier 2','Tier 3','Tier 0'].map(function(t){return '<tr><td style="white-space:nowrap"><i class="tier t'+t.slice(-1)+'"></i><b>'+esc(I.categories[t].label)+'</b></td><td>'+esc(I.categories[t].def)+'</td></tr>';}).join('')+'</tbody></table></div>';
  h+='<h2>Coverage</h2><div class="tbl"><table><thead><tr><th>State</th><th>Depth</th></tr></thead><tbody>'+Object.keys(I.coverage).map(function(s){var c=I.coverage[s];return '<tr><td>'+esc(s)+'</td><td>'+esc(I.depths[c.depth].label)+'</td></tr>';}).join('')+'</tbody></table></div>';
  h+='<h2>Hypotheses</h2>'+I.hypotheses.map(function(x){return '<details class="x"><summary><span><b>'+esc(x.id)+'</b> '+esc(x.name)+' <span class="tag">'+esc(x.status)+'</span></span></summary><div class="in">'+x.detail+'</div></details>';}).join('');
  h+='<h2>The field</h2><div class="tbl"><table><thead><tr><th>Organization</th><th>Measures</th></tr></thead><tbody>'+A.field.map(function(f){return '<tr'+(f.url?'':' class="hl"')+'><td>'+(f.url?srcLink(f.org,f.url):'<b>'+esc(f.org)+'</b>')+'</td><td>'+esc(f.measures)+'</td></tr>';}).join('')+'</tbody></table></div>';
  h+='<h2>Method documents</h2>'+['coding-protocol','roadmap','v2-outline','v2-visual'].map(libCard).join('');
  return h;
};

/* ---------- router ---------- */
function route(){
  var hash=decodeURIComponent(location.hash.replace(/^#/,''))||'about';
  var parts=hash.split('/'),view=parts[0];
  if(!V[view]){view='about';parts=['about'];}
  if(view==='research'&&parts[1]==='atlas'&&parts[2]) openAtlas=parts[2];
  var el=byId('view');
  el.innerHTML=V[view](parts);
  document.querySelectorAll('nav.main a').forEach(function(a){a.setAttribute('aria-current',a.getAttribute('href')==='#'+view?'page':'false');});
  var titles={about:'About',problem:'Problem',working:"What's working",research:'Research'};
  document.title=(titles[view]||'')+' — When Money Follows the Child';
  bind();
  var target=null;
  if(view==='research'&&parts[1]==='notes'&&parts[2]) target=byId('note-'+parts[2]);
  if(view==='research'&&parts[1]==='atlas'&&parts[2]) target=byId('atlas-'+parts[2]);
  if(target) target.scrollIntoView({block:'start'}); else if(!route.keep) window.scrollTo(0,0);
  route.keep=false;
}
function rerender(){var y=window.scrollY;route.keep=true;route();window.scrollTo(0,y);}
function bind(){
  document.querySelectorAll('[data-wf]').forEach(function(b){b.onclick=function(){wFilter=b.getAttribute('data-wf');rerender();};});
  document.querySelectorAll('[data-ct]').forEach(function(b){b.onclick=function(){cTrack=b.getAttribute('data-ct');rerender();};});
  document.querySelectorAll('.heat .c').forEach(function(b){b.onclick=function(){cTrack=b.getAttribute('data-track');rerender();};});
  var d=byId('docOnly'); if(d) d.onchange=function(){cDocOnly=d.checked;rerender();};
  document.querySelectorAll('[data-it]').forEach(function(b){b.onclick=function(){var t=b.getAttribute('data-it');iTier=(iTier===t?'all':t);rerender();};});
  var s=byId('iState'); if(s) s.onchange=function(){iState=s.value;rerender();};
  var q=byId('libQ'); if(q) q.oninput=function(){libQ=q.value;byId('libList').innerHTML=libList();};
}
window.addEventListener('hashchange',route);

/* theme */
var root=document.documentElement;
function curTheme(){return root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
function paintTheme(){var c=curTheme();document.querySelectorAll('#themeBtn span').forEach(function(s){s.classList.toggle('on',s.getAttribute('data-m')===c);});}
try{var th=localStorage.getItem('wmfc-theme'); if(th) root.setAttribute('data-theme',th);}catch(e){}
byId('themeBtn').onclick=function(){var nx=curTheme()==='dark'?'light':'dark'; root.setAttribute('data-theme',nx); try{localStorage.setItem('wmfc-theme',nx);}catch(e){} paintTheme();};
paintTheme();

var m=D.meta,v=m.data_vintage||{};
byId('foot').innerHTML='When Money Follows the Child · research workbench · built '+fmtDate(m.updated)+' · <a href="mailto:'+esc(D.about.contact)+'">'+esc(D.about.contact)+'</a>';
route();
})();
