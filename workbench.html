country overview","checked":"Aug 2026"},{"t":"<b>Limit.<\/b> Uruguay's Notre Dame Education Law Project country report is listed but not yet published, and no Uruguay-specific subsidy category appears in the IDB regional classification. Coded as none found rather than none possible.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"Public financing, no portability found","shortlist_reason":null},"USA":{"name":"United States of America","tier":1,"since":1990,"mech_type":"voucher","mechanism":"State vouchers, tax-credit scholarships and education savings accounts","summary":"The young case. Milwaukee's 1990 voucher programme was the first modern instance; thirty states now fund students rather than systems and eighteen do so universally. The United States has moved faster than any country in this Atlas and has had the least time to discover what the mature systems already show.","findings":[{"t":"Roughly 750,000 American children learn in microschools, and more than 70% of the people running them are current or former licensed teachers — the sector is staffed by the preparation system's own graduates.","src":"WMFC Readiness Index, 2026 Baseline","checked":"Aug 2026"},{"t":"87% of teachers report feeling prepared to teach in a district school; 34% for a microschool. The 53-point gap has not moved since 2023.","src":"EdChoice survey data, via the WMFC Readiness Index","checked":"Aug 2026"},{"t":"<b>The institutional response.<\/b> Across 39 coded institutions in 9 states, exactly one preparation programme built for the sector was found — Central Michigan's Charter School Leadership M.A. Where universities have entered, they have done it by authorizing or operating schools, not by building degrees. Completing Michigan's eight university authorizers produced no further programmes.","src":"WMFC Readiness Index, 2026 Baseline","checked":"Aug 2026"}],"code_label":"Fastest adoption, least workforce answer","shortlist_reason":null},"VEN":{"name":"Venezuela","tier":1,"since":null,"mech_type":"none","mechanism":"Private schools under state curricular control","summary":"Venezuela's private schools operate under a state that has repeatedly asserted the power to close or take over schools that decline its curriculum and inspection regime. The governing question here is control of content and continued permission to operate, not funding.","findings":[{"t":"All schools, public and private, must admit state inspectors and adopt the government's educational system or face closure and nationalization, a position asserted publicly by the government during the curriculum reforms of the late 2000s.","src":"NBC News; Fox News reporting","checked":"Aug 2026"},{"t":"<b>Limit.<\/b> Venezuela does not appear in the IDB's regional classification of subsidized private-school categories, and no current national subsidy mechanism was identified. Current administrative practice was not verified from primary Venezuelan sources in this pass.","src":"WMFC coding, Aug 2026","checked":"Aug 2026"}],"code_label":"Permission to operate is the live variable","shortlist_reason":null}}},"notes":[{"n":"09","slug":"09","tag":"The seam","date":"August 2026","iso":"2026-08-15","title":"A Florida district needed a school model. It bought one from a microschool operator.","standfirst":"Polk County contracted a private microschool founded by two teachers who had left a Polk County public school. The Index has coded 21 Florida institutions and found no education-school program built for this sector. Both facts describe the same state in the same year.","body":["This Index's Florida finding is an absence: the most portable education money in America, and no education-school program built for the sector it funds. This note records what filled that absence in one district.","In 2025 the Polk County school board unanimously approved a two-year contract with <b>WonderHere<\/b> to bring its microschool model into Philip O'Brien Elementary. WonderHere was founded in 2016 by two teachers who had left a Polk County public school. It now runs a state-approved private school of roughly 120 full-time students, plus about 300 students in weekly homeschool enrichment, with additional locations in Florida and South Carolina. Its founders have said since the beginning that their aim was to influence public education.","<b>A public district bought instructional design and staff training from a private microschool operator.<\/b> It did not buy them from a college of education, a state research arm, or a regional service agency.","The sourcing pattern is not confined to Florida. <b>Elizabeth City-Pasquotank Public Schools<\/b> in North Carolina — about 4,800 students, roughly 70% economically disadvantaged — opened a 26-student middle-grades microschool where students help run an Airbnb and learn with AI tutoring. The design came from visits to more than 40 schools, including private microschools in Texas. The staffing arithmetic is why design was the binding problem: three teachers and one support staffer are meant eventually to cover four grade levels and about 65 students. Superintendent Keith Parker put it plainly — three people are not going to be able to teach four grade levels.","<b>The limit, before the conclusion.<\/b> One contract and one out-of-state case are not a pattern. We have not established that any Florida college of education declined this work, was approached, or knew it was available. We have established only where two districts went. Neither school has achievement data, and this note makes no claim about whether either model works. Florida is a systematic pass in the 2026 baseline, but <a href=\"/notes/06/\">Field Note 06<\/a> records that 25 Florida state colleges remain unscanned. A program could exist that we have not found.","<b>What it does establish is a dated demand signal.<\/b> Districts in the state with the most portable funding in the country are purchasing school-model design on the open market. Somebody is being trained and paid to do that work. Identifying who — and whether any postsecondary institution is among them — is a supply-and-workforce question rather than a program-catalog one, which is the seam this Index was built to watch."],"sources":[{"label":"FEE — Why one school district is launching new microschool-inspired classrooms","url":"https://fee.org/articles/why-one-school-district-is-launching-new-microschool-inspired-classrooms/"},{"label":"EdSurge — At this rural microschool, students will study with AI and run an Airbnb","url":"https://www.edsurge.com/news/2025-09-22-at-this-rural-microschool-students-will-study-with-ai-and-run-an-airbnb"},{"label":"EdTech Magazine — Rural school districts embrace artificial intelligence","url":"https://edtechmagazine.com/k12/article/2025/12/rural-school-districts-embrace-artificial-intelligence"},{"label":"Getting Smart, Learner-Centered Collaborative & Transcend — The Public Microschool Playbook","url":"https://www.gettingsmart.com/2025/05/14/the-public-microschool-playbook-a-new-actionable-guide-for-system-leaders/"},{"label":"WMFC Field Note 06 — Florida built a second door, and we walked past it","url":"/notes/06/"}]},{"n":"08","slug":"08","tag":"Institutions","date":"August 2026","iso":"2026-08-15","title":"Three-quarters of Florida districts now sell to students they do not enroll","standfirst":"District participation in Florida's part-time scholarship marketplace went from roughly one in three to about 75% of 67 districts in twelve months. Texas districts, offered state money for a comparable arrangement, mostly declined. The contrast is the finding.","body":["<b>The limit, before the conclusion.<\/b> These are participation counts, not revenue. No Florida district has published what it earns from this channel, and a district can be an approved provider with two listed courses and no students. Until district Annual Financial Reports separate the line, “districts are becoming vendors” is a behavioural claim and not a financial one.","Florida's Step Up For Students operates a <b>Contracted Public Schools<\/b> channel that lets districts and charter schools sell part-time services — courses, tutoring, therapy, assessments — directly to scholarship families, paid from scholarship funds. One administrative detail makes it work: a student receiving contracted services is not considered enrolled in the public school for scholarship-eligibility purposes. A district can sell instruction to a child it does not enroll and does not count.","The adoption curve is dated and public. Roughly one in three of Florida's 67 districts by the August 2025 school-year start. More than half by October 2025, including Miami-Dade, Orange, Hillsborough and Duval. Fifty of 67 approved as providers by April 2026. About 75% by May 2026, with 52 partnered including Hillsborough, Pinellas and Pasco. Fifty-three approved or in process by July 2026. Miami-Dade opened more than 95 classes to students not enrolled in the district.","The surrounding context is a state where roughly 53% of K-12 students — about 1.9 million children — use an education option other than their assigned district school, and where districts are closing buildings. Orange County closed seven schools at the end of 2025-26 after a single-year enrollment decline of roughly 6,600 to 7,000 students, redirected $211 million to scholarships in 2025-26 against $152 million the prior year, and will open no new campuses until 2031 after opening 28 in ten years. Broward is down about 37,000 students over a decade. Escambia projected losing about 7,000 students to scholarships heading into 2026-27.","<b>The behaviour is not universal, and the exceptions are what give it meaning.<\/b> Texas has paid districts a Foundation School Program allotment of $1,500 per University Interscholastic League activity for each participating non-enrolled homeschool student since 2023. Under the original opt-in rule, 45 districts participated in 2024-25 — about 4% of districts statewide. When a 2025 law flipped the default to automatic participation, Dallas, Fort Worth, Arlington and Katy opted out anyway. A Katy trustee's stated reason was that non-district students participating could take opportunities away from enrolled students.","West Virginia is a third case. Its Hope Scholarship pays every student the same base amount regardless of setting, and state law lists individual classes and extracurricular activities provided by a public school district among qualifying expenses. Joining as a provider is free. Reading the state's participating-provider directory as of 10 August 2026, we found no county school district listed across the school block from roughly M through Y. <b>That is a near-zero, not a verified zero.<\/b> The directory's search function could not be queried programmatically, and a district could in principle be registered elsewhere in the list. We record it as unfinished rather than settled.","Three states, three outcomes, and the variation tracks policy design rather than district disposition. Florida pays the same amount regardless of setting, permits sales to non-enrolled students, and has a scholarship funding organisation actively recruiting districts as providers. Texas tiers its homeschool award far below its private-school award. West Virginia has both the funding parity and the statutory permission but, as far as we can find, no organisation selling districts on selling.","<b>Why this sits in a postsecondary index.<\/b> Districts in one state have spent a year learning to price, list and staff part-time instruction for families they do not enroll. That is new work, and someone is preparing the people who do it. This note records the demand. It does not yet identify the supply."],"sources":[{"label":"Step Up For Students — Contracted Public Schools","url":"https://www.stepupforstudents.org/contracted-public-schools/"},{"label":"NextSteps — More Florida districts take the lead in developing learning options for part-time public school students","url":"https://nextstepsblog.org/2026/05/more-florida-districts-take-the-lead-in-developing-learning-options-for-part-time-public-school-students/"},{"label":"NextSteps — Panel shares Florida à la carte learning story with lawmakers from across America","url":"https://nextstepsblog.org/2026/07/panel-shares-florida-a-la-carte-learning-story-with-lawmakers-from-across-america/"},{"label":"Yahoo News — Florida school choice is redefining public education","url":"https://www.yahoo.com/news/politics/articles/florida-school-choice-redefining-public-160001588.html"},{"label":"Yahoo News — Central Florida school districts brace for enrollment declines","url":"https://www.yahoo.com/news/articles/central-florida-school-districts-brace-100000829.html"},{"label":"Texas Legislature — HB 3708 bill analysis, 88th Legislature","url":"https://capitol.texas.gov/tlodocs/88R/analysis/pdf/HB03708H.pdf"},{"label":"The Texan — Prominent Texas school districts opt out of homeschool participation in UIL events","url":"https://thetexan.news/issues/education/prominent-texas-school-districts-opt-out-of-homeschool-participation-in-uil-athletic-academic-events/article_9f598392-291a-4c1b-b6b0-4b50535f9613.html"},{"label":"Covering Katy — Katy ISD opts out, Lamar CISD opts in for homeschool UIL participation","url":"https://coveringkaty.com/news/fort-bend/katy-isd-opts-out-lamar-cisd-opts-in-for-homeschool-uil-part/"},{"label":"WV State Treasurer — Hope Scholarship participating schools and service providers","url":"https://hopescholarshipwv.gov/Home/Schools/Participating-Schools"}]},{"n":"07","slug":"07","tag":"The seam","date":"August 2026","iso":"2026-08-08","title":"In much of the Americas, the money follows the teacher","standfirst":"Coding North and South America turned up a mechanism the school-choice literature barely names: public money paid not per pupil, but against a private school's teaching payroll. Five systems in this hemisphere work that way.","body":["The Atlas now codes every country in North and South America. The expected finding was a spread from Chile's voucher to Cuba's monopoly, and that spread is there. The unexpected finding is what sits in the middle.","<b>Argentina<\/b> subsidises private schools as a percentage of teachers' salary costs. Fee-free schools run by non-profit entities can receive up to 100%; fee-charging schools are banded at 80%, 60% or 40%. To be paid, a school submits its teaching payroll — staff, posts, hours, salaries — to the education authority. Just over 70% of private schools receive it, covering about 22% of all Argentine students.","<b>Ecuador<\/b> runs <i>fiscomisional<\/i> schools: religious schools holding a government agreement, subsidised specifically to pay teacher salaries. <b>Belize<\/b> funds denominational and community grant-aided schools — about 62% of all institutions — through direct payment of teachers' salaries, and from 2024 covers 100% of salaries, pensions and benefits for 879 grant-aided secondary and tertiary staff. <b>Trinidad and Tobago<\/b> has paid salaries at denominational schools since the Concordat of 1960, sixty-six years, while the denominations retain ownership, management and a right to request a teacher's removal on moral or religious grounds. <b>French Guiana<\/b>, as a French département, sits under the 1959 Loi Debré, where schools under contract teach the national programme and the state pays their teachers.","<b>Five systems, one mechanism, and it is not a voucher.<\/b> The unit of funding is a teaching post, not a pupil.","That distinction is not cosmetic, and it cuts directly at the question this organisation exists to ask. A voucher moves money and leaves the labour market to sort itself out — which is how the United States arrived at 750,000 children in microschools and 34% of teachers feeling prepared to teach in one. A payroll subsidy puts the workforce inside the funding formula. The state that writes the cheque for the teacher holds a lever on who may teach, whoever owns the school.","We are not claiming the payroll model performs better. Nobody has run that comparison, which is the point. The demand-side literature measures what families do with vouchers in exhaustive detail; there is no comparable body of work on what happens to teacher supply, preparation and credentialing under salary-side subsidy, despite Trinidad having run one for sixty-six years and Belize for longer.","<b>Two more things the region gave up.<\/b> <b>Bolivia<\/b> kept church-run schools and nationalised teacher preparation outright — Law 070 of 2010 made the State solely responsible for producing new teachers, and the Catholic training institute Sedes Sapientiae was closed. <b>Guyana<\/b> went the other way in 1976, taking close to 696 church and private schools into state control, and the stated justification was a staffing question: the churches had held major influence over who taught in their schools. Both countries legislated about who is permitted to make and place teachers. Neither measured what happened next.","<b>The limit.<\/b> Six countries — Honduras, Nicaragua, the Bahamas, Suriname, Greenland and the Falkland Islands — are shortlisted rather than coded, each with a stated reason on its panel. Suriname is the one to watch: it inherited the Dutch <i>bijzonder onderwijs<\/i> model, which would make it a direct sibling of the Netherlands entry, and no Surinamese source was located in this pass."],"sources":[{"label":"The Portable-Funding Atlas — Americas, coded August 2026","url":"/atlas/"},{"label":"IDB — Elacqua, Iribarren & Santos, Private Schooling in Latin America","url":"https://publications.iadb.org/publications/english/document/Private-Schooling-in-Latin-America-Trends-and-Public-Policies.pdf"},{"label":"Notre Dame Education Law Project — Latin America country reports","url":"https://educationalpluralism.nd.edu/about/international-education/research-reports/"},{"label":"Concordat Watch — text of the 1960 Trinidad and Tobago Concordat","url":"https://www.concordatwatch.eu/showtopic.php?org_id=911&kb_header_id=40771"}]},{"n":"06","slug":"06","tag":"Institutions","date":"August 2026","iso":"2026-08-08","title":"Florida built a second door, and we walked past it","standfirst":"A 2021 law let Florida colleges sponsor charter schools. Four institutions now do. We had coded one of them \"nothing found\" — because we read its course roster and stopped.","body":["Florida is the state this Index covers most heavily, and the state whose headline finding is the starkest: the most portable education money in America, and not one education-school program built for the sector it funds. That finding still stands.","What we missed is that a second pathway opened alongside it. A 2021 statutory change let Florida College System institutions sponsor charter schools within their service areas, and state universities sponsor them statewide. Four Florida institutions are now approved sponsors: <b>Tallahassee State College<\/b>, first approved in January 2023, which went on to open the first college-sponsored charter school in the state; <b>Miami Dade College<\/b>, whose board approved its first six charter applications in February 2026; <b>Pasco-Hernando State College<\/b>, which issued its first charter to a school that had spent a decade under the Pasco County school board; and the <b>University of West Florida<\/b>.","Miami Dade College went furthest. It does not merely sponsor — it powers the Florida Charter Institute, whose authorizing division reviews applications and conducts oversight on behalf of other higher-education authorizers, Pasco-Hernando among them. One college now runs the apparatus the others use.","<b>Every one of these moves happens outside the college of education.<\/b> That is the same pattern the Index found in Michigan, in Arizona and in Indiana, and it is the pattern the Index was built to catch.","<b>Which makes our error the point of this note.<\/b> We coded the University of West Florida Tier 0 — nothing found — on the strength of its School of Education roster, which contains nothing built for the sector. UWF is listed as an approved sponsor in the Florida Department of Education's own directory, and its trustees approved it as authorizer of a Somerset Academy charter school. We made the catalog-scan mistake that this Index exists to correct, in our best-covered state.","The row is recoded and <a href=\"/method/#corrections\">Correction 02<\/a> is permanent. The method has changed too: for every state, the official sponsor or authorizer registry is now checked before any institution can be coded Tier 0. That one change is what surfaced Miami Dade and Pasco-Hernando.","<b>The limit worth carrying.<\/b> Twenty-five Florida state colleges are not sponsors and their education units remain unscanned. A college can build a program without ever holding a charter, so the coverage gap has narrowed and changed shape rather than closed. And for Miami Dade and Pasco-Hernando, this note codes the authorizing move only — neither education unit has been enumerated to our standard, and we make no claim about their teaching programs in either direction."],"sources":[{"label":"FLDOE — Directory of Charter School Sponsoring Entities","url":"https://web01.fldoe.org/CSA/PostToWeb/CharterSchoolSponsoringEntities"},{"label":"Florida Charter Institute — HEI Authorizers","url":"https://flcharterinstitute.org/authorize/hei/"},{"label":"WMFC Method — Correction 02","url":"/method/#corrections"}]},{"n":"05","slug":"05","tag":"Institutions","date":"August 2026","iso":"2026-08-08","title":"The program that was built and stopped","standfirst":"Every other null in the Index records an institution that never built for this sector. Nova Southeastern built one and no longer offers it — documented in the university's own archive.","body":["The WMFC Readiness Index codes 14 institutions Tier 0 — nothing found. Until now every one of them meant the same thing: this education unit has not built anything for the portable-funding sector. Nova Southeastern University means something different.","NSUWorks, NSU's own institutional repository, holds a Program Overview titled <i>NSU Master's Degree in Charter School Education/Leadership<\/i>, attributed to the Fischler Graduate School of Education and Human Services and indexed under keywords including <i>charter school<\/i>, <i>Miami-Dade<\/i>, <i>specialization<\/i> and <i>modified core<\/i>. It is a real program document, deposited by the university.","The current master's roster of the Abraham S. Fischler College of Education &amp; School of Criminal Justice was read in full on 8 August 2026. It offers Applied Behavior Analysis, Child Protection, Criminal Justice, Developmental Disabilities, Education, Educational Leadership and Leadership. There is no charter or choice-sector program.","<b>What we cannot say.<\/b> The repository dates the document only approximately — 2002, deposited 2016 — and holds no discontinuation record. We can document that the program existed and that it is now absent. We cannot say when it ended, and no one should cite a year. We had published this as an unproven suspicion since July; it is now proven in one direction and still open in the other.","<b>Why the distinction matters.<\/b> The Index offers four competing explanations for why education colleges have built so little. Every one of them is a theory about non-construction. A program that was built and did not survive is a different event, and it points at questions none of the four currently ask: who bought it, how many, and what stopped."],"sources":[{"label":"NSUWorks — NSU Master's Degree in Charter School Education/Leadership","url":"https://nsuworks.nova.edu/abe_pgcoursecatalogs/237/"},{"label":"Current NSU master's roster, read 8 August 2026","url":"https://education.nova.edu/degrees/masters/index.html"}]},{"n":"04","slug":"04","tag":"Institutions","date":"August 2026","iso":"2026-08-08","title":"Eight authorizers, one program","standfirst":"Michigan is the deepest university-charter ecosystem in the country. All eight public university authorizers are now coded. Between them they hold well over 200 schools and exactly one preparation program.","body":["The working hypothesis was simple and testable: universities build for this sector when they hold schools in it. Michigan was the place to test it, because Michigan universities have chartered schools since 1994 and eight of them still do.","Six were unexamined until this edition — Oakland, Saginaw Valley State, Northern Michigan, Eastern Michigan, Ferris State and Lake Superior State. All six are now coded. None has built a preparation program for the sector. Central Michigan's Charter School Leadership M.A. remains the only one in a scan of 39 institutions.","<b>The result is not that nothing happens.<\/b> Three of the six reach the education college directly, and each does it in a different way. <b>Oakland University<\/b> houses its Office of Public School Academies <i>inside<\/i> the School of Education and Human Services and states the reason plainly — the placement exists &ldquo;marshalling the strength of its programs and faculty to increase the proficiency and expertise of Academy teachers and administrators.&rdquo; Its leadership degrees still prepare principals and deans of students, with no charter or choice content. <b>Saginaw Valley State<\/b> gives teachers and administrators of its 17 academies 50–75% tuition remission to complete a College of Education program — a change in the price of the standard degree, not in its contents. <b>Northern Michigan<\/b> describes its nine academies as providing &ldquo;hands-on classroom experience for NMU's hundreds of elementary and secondary education majors&rdquo; — the charter schools are practicum sites feeding conventional licensure.","Proximity, subsidy and access were each present. None produced a program.","<b>The hypothesis does not survive in its simple form.<\/b> Scale does not rescue it either: Grand Valley State holds 78 schools and more than 34,000 students, more than Central Michigan, and has built no degree. Holding schools, holding many schools, and holding them inside the education college were all insufficient.","That leaves a sharper question than the one we started with. Michigan is complete and the answer is no. The open problem is no longer whether the Central Michigan pattern repeats — it does not — but why it happened once."],"sources":[{"label":"Oakland University — Office of Public School Academies","url":"https://www.oakland.edu/psa/about-us/"},{"label":"Saginaw Valley State University — PSA Teacher/Administrator Scholarships","url":"https://www.svsu.edu/supo/opportunities/psateacherleaderscholarships/"},{"label":"Northern Michigan University — Charter Schools, School Information","url":"https://nmu.edu/charterschools/school-information"},{"label":"Eastern Michigan University — Charter Schools Office","url":"https://www.emich.edu/charter-schools/index.php"},{"label":"Ferris State University — About the Charter Schools Office","url":"https://www.ferris.edu/administration/academicaffairs/charterschools/about.htm"},{"label":"Lake Superior State University — Charter Schools","url":"https://www.lssu.edu/charter-schools/"}]},{"n":"03","slug":"03","tag":"The seam","date":"July 2026","iso":"2026-07-26","title":"Nobody owns the workforce question","standfirst":"Demand is measured. Policy adoption is measured. Preparation quality is measured. Whether the workforce exists to staff what policy enables falls between every organization in the field.","body":["The organizations working in this space each measure their own side of the ledger, and measure it well. EdChoice counts families, programs and fiscal effects. ExcelinEd tracks policy adoption across some forty areas. NCTQ measures the quality of teacher preparation. NACSA tracks authorizers. AACTE represents and advocates for the preparation pipeline.","Put those five together and one question still has no owner: as public money becomes portable, does the educator workforce exist to staff what the policy has enabled?","It is nobody's failure. Each organization is doing its own job, and the question sits outside all of their remits — it requires demand-side data from one, policy data from another, and institution-level observation that none of them collects. It falls in the seam.","WMFC exists to occupy that seam. This is not a criticism of the field; it is the reason there is room for another instrument in it."],"sources":[{"label":"EdChoice — Surfing the Pipeline (McShane, 2023)","url":"https://www.edchoice.org/wp-content/uploads/2023/10/Surfing-the-Pipeline.pdf"},{"label":"The WMFC Readiness Index — research gaps","url":"/research/"}]},{"n":"02","slug":"02","tag":"Institutions","date":"July 2026","iso":"2026-07-26","title":"Where universities engage, they operate","standfirst":"Most confirmed university entries into the choice sector took the form of running or authorizing a school rather than building a degree. A catalog scan would miss all of them.","body":["The obvious way to ask whether education colleges have responded to portable funding is to search their course catalogs. It is also the way to get the wrong answer.","Across the states examined, the confirmed university entries into this sector are overwhelmingly <i>operating<\/i> moves — running a school, or holding the charter for one. Arizona State operates schools. Indiana University East engages through its region's charter environment. Florida's universities hold lab-school charter authority, and both UF and FSU run lab schools. Michigan's eight public university authorizers hold hundreds of schools between them.","None of that appears in a course listing. An institution can be deeply committed to this sector, in public, at scale, for thirty years, and register as a null in any catalog-based scan.","This is the methodological difference the Readiness Index is built around: <b>operating and authorizing moves are coded, not just programs.<\/b> Both are institutional responses. Counting only one of them produces a picture that is not merely incomplete but backwards — it makes the most engaged institutions look like the least."],"sources":[{"label":"The WMFC Readiness Index — coded scan","url":"/research/"},{"label":"WMFC Method — coding scheme","url":"/method/"}]},{"n":"01","slug":"01","tag":"Workforce","date":"July 2026","iso":"2026-07-26","title":"The 53-point preparedness cliff","standfirst":"87% of teachers feel prepared to teach in a district school. 34% feel prepared for a microschool — the sector now serving more than 750,000 children.","body":["Teachers were asked how prepared they felt to teach in each kind of school. The answers fall in a straight line away from the model their preparation was built around:","<b>Public district 87% · Private 74% · Charter 67% · Religious 49% · Microschools 34%.<\/b>","The gap between the first and the last is 53 points. It is not a gap between good schools and bad ones; it is a gap between the setting preparation programs are designed for and the setting growing fastest.","Two things make the number worse than it looks. More than 70% of the people running microschools are current or former licensed teachers — these are not outsiders to the profession, they are its own graduates reporting that their training did not cover where they went. And the figure has not moved since 2023.","The data is EdChoice's own. That matters: the organization that most consistently documents the demand side published the clearest available statement of the supply-side problem, and the field has not yet answered it."],"sources":[{"label":"EdChoice teacher survey data, as reported in the WMFC Readiness Index","url":"/research/"},{"label":"EdChoice — Surfing the Pipeline (McShane, 2023)","url":"https://www.edchoice.org/wp-content/uploads/2023/10/Surfing-the-Pipeline.pdf"},{"label":"National Microschooling Center — sector size","url":"/data/"}]}],"library":[{"id":"fl-supply-1","title":"The supply side: Florida's educator pipeline","group":"Supply side","blurb":"Every route into a Florida classroom, and where each one ends.","date":"2026-09-16","file":"claude_WMFC-FL-Supply-Side-Educators.md","words":2451,"md":"# The Supply Side of Education Freedom: Florida's Educator Pipeline\n**WMFC research memo · 16 September 2026 · Florida focus**\n\n*Prompted by Jeb Bush's call for attention to the \"supply side\" of school choice. Families now have options. This memo asks whether the people who teach them do.*\n\nEvidence states: **[DOC]** documented · **[NONE]** searched, nothing found · **[UNCHK]** not yet checked.\n\n---\n\n## THE FINDING, UP FRONT\n\nFlorida has built an impressive number of routes into teaching. **Every single one of them terminates in a school district, a charter school, or a charter management organization.** Not one route contemplates a private school, a microschool, a learning pod, a homeschool co-op, or a nature school as the place a candidate is prepared, placed, mentored, or employed.\n\nMeanwhile, those same settings are where Florida's students are increasingly going — and § 1002.421(2) asks their teachers for **a bachelor's degree in anything, or three years of experience, or \"special skills, knowledge, or expertise.\"** **[DOC]**\n\nSo Florida has produced an unusual asymmetry: **the fastest-growing part of the K-12 market has the lowest credential requirement and no pipeline built for it, while the entire preparation apparatus is aimed at the part of the market that is shrinking.** That is the supply-side problem, stated precisely.\n\n---\n\n## PART 1 — Every current route to a Florida classroom\n\n### 1.1 Routes to a Professional Certificate **[DOC]**\n\n| Route | Provider | Core requirement |\n|---|---|---|\n| **Initial Teacher Preparation (ITP)** | State-approved program at a college/university | Degree program + GK, Prof Ed, SAE exams |\n| **Educator Preparation Institute (EPI)** | State-approved EPI (mostly Florida College System) | Already hold a bachelor's; complete EPI + exams |\n| **Professional Learning Certification Program (PLCP)** | **School district, charter school, or CMO** | Employment on a Temporary Certificate; competency-based |\n| **Professional Training Option (PTO)** | Florida school district | Temporary Certificate + 1 yr teaching or 6 hrs student teaching + exams |\n| **Out-of-state certificate** | Another U.S. state/territory | Valid standard certificate |\n| **Out-of-state program** | Accredited program outside Florida | Program completion + Florida exams |\n| **NBPTS** | National Board | Valid National Board certificate |\n| **ABCTE** | American Board | ABCTE certificate + Temporary Certificate + demonstrated competency |\n| **College teaching experience** | Any academic institution | Two semesters full-time college teaching + Prof Ed + SAE |\n| **College coursework** | Accredited college/university | 15+ education semester hours + Temporary Certificate + teaching or student teaching |\n| **STEM track** | High school district | Master's in a STEM field + effective rating on student assessment performance |\n\n([FLDOE Certificate Pathways & Routes](https://www.fldoe.org/teaching/certification/pathways-routes/), [Routes to a Florida Professional Certificate](https://www.fldoe.org/core/fileparse.php/9915/urlt/RoutesEdPrep.pdf))\n\n### 1.2 Routes to a Temporary Certificate (the on-ramp) **[DOC]**\n\nBachelor's degree plus **any one of**: passing the Subject Area Exam · a valid ABCTE certificate · a content-area major · required coursework with a 2.5 content GPA.\n\n### 1.3 The newer alternative routes **[DOC]**\n\n- **Teacher Apprenticeship Program** (§ 1012.555, Rule 6A-5.067) — for **paraprofessionals employed by school districts, charter schools, or CMOs** holding an associate degree. On-the-job training plus instruction toward a baccalaureate and certification. FLDOE reports **more than 80 individuals in training, nearly 500 applied.** ([FLDOE Apprenticeship](https://www.fldoe.org/teaching/preparation/apprenticeship.stml), [FLDOE vacancy release](https://www.fldoe.org/newsroom/latest-news/florida-department-of-education-announces-17-7-reduction-in-teacher-vacancies-for-the-2025-2026-school-year.stml))\n- **Military Veterans Certification Pathway** — **more than 100 veterans have begun teaching; nearly 700 applied.** **[DOC]**\n- **Schools of Hope exemption** — instructional personnel at Schools of Hope, including lead classroom teachers, need not meet standard public school teacher requirements. ([PolitiFact, reviewing § 1002.33 and HB 7069](https://politifact.com/factchecks/2018/aug/15/gwen-graham/graham-misspeaks-charter-school-teacher-certificat/)) **The only existing statutory carve-out from certification — and it is tied to a school type, not to an educator.**\n\n### 1.4 The credential map by setting — this is the table that matters **[DOC]**\n\n| Setting | Credential required to teach | Is it a certification-route destination? |\n|---|---|---|\n| District public school | Florida certificate (Ch. 1012) | **Yes — all routes** |\n| Charter school | Florida certificate (§ 1002.33) | **Yes — PLCP, apprenticeship** |\n| Charter management organization | Florida certificate | **Yes — PLCP, apprenticeship** |\n| School of Hope | **Exempt** | No |\n| Scholarship-accepting private school | **Bachelor's in any field, OR 3 years' experience, OR \"special skills, knowledge, or expertise\"** (§ 1002.421(2)) | **No** |\n| Microschool (registered as private school) | Same as private school | **No** |\n| Home education program (§ 1002.41) | **Parent-directed; no credential** | **No** |\n| Learning pod / co-op | No state credential requirement found | **No** |\n\n([FLDOE private school scholarship requirements](https://www.fldoe.org/schools/school-choice/private-schools/requirements-for-participating-in-state-scholarship-programs.stml), [Florida School Choice, § 1002.421(2)](https://www.floridaschoolchoice.org/information/private_schools/teacher_qualification.asp))\n\n> **Read the right column down.** Every \"Yes\" is a district or a charter. Florida built eleven doors into teaching and every one of them opens into the same building.\n\n---\n\n## PART 2 — How Florida's postsecondary institutions are changing preparation\n\n### 2.1 The system as it stands **[DOC]**\n\n**383 approved educator preparation programs** in Florida:\n- **311 Initial Teacher Preparation programs**\n- **26 Educator Preparation Institutes**\n- **46 Professional Learning Certification Programs** — operated by **districts, charter schools and CMOs**\n\n([FLDOE 2024 Teacher Preparation Programs Performance Report](https://www.fldoe.org/file/7502/25AnnTeachPrepReport.pdf))\n\nNote what the 46 PLCPs represent: **employers have become preparation providers.** That is the most consequential structural change in Florida educator preparation, and universities did not initiate it.\n\n### 2.2 What institutions have actually built\n\n- **The largest single preparation program in Florida is an alternative one at a regional public university.** The **University of West Florida's Educator Preparation Institute produced 735 completers in 2021-22** — more than any other program in the state. **[DOC]** (FLDOE report, above)\n- **UF launched a teacher apprenticeship** and graduated its first cohort in **May 2024** — online coursework plus on-the-job training with district-appointed mentor teachers, initially for candidates who already held a bachelor's degree, with a bachelor's-seeking version \"coming soon.\" **[DOC]** ([UF College of Education](https://education.ufl.edu/teacher-apprenticeship/), [UF News](https://news.ufl.edu/2024/05/teacher-apprentices/))\n- **EPIs sit largely in the Florida College System** (§ 1004.85), giving state colleges a statutory role in post-baccalaureate certification. **[DOC]** ([FLDOE EPI](https://www.fldoe.org/teaching/preparation/epi.stml), [MDC EPI](https://www.mdc.edu/educatorpreparation/))\n- **Rule 6A-5.066 now permits EPI candidates who are teachers of record to complete their 60 required field-experience hours \"within the candidate's school setting.\"** **[DOC]** ([Rule 6A-5.066](https://www.law.cornell.edu/regulations/florida/Fla-Admin-Code-Ann-R-6A-5-066))\n\n### 2.3 What has *not* changed **[NONE, this round]**\n\nNo Florida institution surfaced offering: a preparation pathway designed for microschool, classical, Montessori, nature-based or homeschool-cooperative settings; a credential for learning-pod facilitators or education navigators; or a program marketed to the choice sector as such. **The 2026 legislative session is active on educator policy — a teacher mentoring program for D and F schools (CS/HB 157) and a school counselor certification change (CS/CS/HB 753) — and neither touches the supply side of choice.** **[DOC]** ([HB 157 analysis](https://www.flsenate.gov/Session/Bill/2026/157/Analyses/h0157d.EEC.PDF), [HB 753 analysis](https://www.flsenate.gov/Session/Bill/2026/753/Analyses/h0753b.EAS.PDF))\n\n---\n\n## PART 3 — The structural lock (and the specific clause that holds it)\n\nThis is the most important thing in the memo, and it is more precise than the usual \"universities are slow\" story.\n\n**§ 1004.04(5)(d) already opens the door.** Verbatim:\n\n> \"Postsecondary teacher preparation programs in cooperation with **district school boards and approved private school associations** shall select the school sites for preservice field experience activities based upon the qualifications of the supervising personnel as described in this subsection and the needs of the candidates. These sites must represent the full spectrum of school communities... In order to be selected, school sites must demonstrate **commitment to the education of public school students** and to the preparation of future teachers.\"\n\nTwo things are true at once: **private school associations are explicitly named as partners**, and **the qualifying test is commitment to the education of public school students** — a standard a microschool or private school cannot obviously meet on its face.\n\n**§ 1004.04(5)(b) then closes it.** Supervising personnel must hold **a valid Florida professional certificate**, have **at least 3 years of PreK-12 teaching experience**, have earned an **effective or highly effective rating on a performance evaluation**, and have completed **clinical educator training** (plus a reading endorsement for K-3 placements).\n\n> **An effective/highly-effective performance rating is an artifact of a district or charter personnel evaluation system. It does not exist for a private school teacher, a microschool founder, a Montessori guide, or a homeschool-cooperative instructor — no matter how good they are.**\n\n**Therefore:** even where (d) permits a private placement, (b) makes it nearly impossible to staff. **The binding constraint is not the placement clause. It is the supervising-teacher definition.** That is a two-sentence statutory fix, and as far as this round can tell, nobody has named it. **[DOC]**\n\n### 3.1 The consequence — a one-way career door\n\nA Florida teacher who leaves a district to open or join a microschool:\n\n- keeps their certificate, but **loses the evaluation rating** that certificate's supervisory value depends on;\n- **cannot serve as a directing teacher** for the next generation of candidates;\n- **cannot host an intern**, because their setting cannot easily qualify as a site;\n- is invisible to every one of the 383 approved preparation programs as a mentor, a partner, or a placement.\n\n**Mobility runs one direction.** A teacher can move from the district sector to the choice sector, but their professional standing cannot move with them. Money follows the child; professional standing does not follow the teacher.\n\n---\n\n## PART 4 — What is at risk if postsecondary institutions do nothing\n\nNot a sudden collapse. Something slower and worse: **the credential quietly stops mattering, and the institutions that issue it lose relevance before they lose enrollment.**\n\n### 4.1 The mechanism, step by step\n\n1. **The credential's addressable market shrinks.** Every certification route leads to districts and charters. As students move to settings that require no certificate, the share of teaching jobs that *require* the university's product falls.\n2. **Employers become the preparation providers.** Florida already has **46 district/charter/CMO-run PLCPs**. **[DOC]** Employers who can prepare their own teachers do not need an education school; they need a transcript evaluator.\n3. **The largest programs are already the alternative ones.** UWF's EPI out-produced every ITP in the state. **[DOC]** Volume has already shifted to the fast route.\n4. **The off-campus market fills the gap.** The microschool and classical/Montessori credentialing world prepares teachers for exactly the settings Florida law excludes from university clinical placement. **[UNCHK for Florida specifically — this is the highest-value next scan.]**\n5. **What remains for the university** is compliance training for a shrinking employer, taught by faculty whose field placements can only occur in that same employer's buildings.\n\n### 4.2 The counter-evidence to hold honestly\n\nFLDOE reports vacancies **down 17.7% for 2025-26 and nearly 30% over two years**, crediting **$5.9 billion in pay increases** plus the apprenticeship and veterans pathways. **[DOC]** The Florida Education Association counters that **31% of teachers had fewer than four years of experience**, and that **replacements of certified teachers have nearly doubled over five years**, pointing to churn rather than recovery. **[DOC]** ([FEA](https://feaweb.org/release/floridas-teacher-and-staff-vacancies-signal-a-retention-crisis-at-a-breaking-point/))\n\n**Both can be true, and their coexistence is itself the finding:** vacancies fall while the workforce gets less experienced. Filling seats is not the same as building a profession — and neither measure tells you anything about the choice sector, because nobody counts it.\n\n### 4.3 The reputational risk, stated plainly\n\nFlorida is the national leader in education freedom on the demand side. If its public universities, state colleges and community colleges are seen to have built nothing for the supply side, the argument that follows is not \"universities are slow.\" It is **\"public institutions declined to serve the public's actual choices\"** — which is a far harder charge for a public university to answer, and it is the charge WMFC's framing already implies.\n\n---\n\n## PART 5 — Policy that could be revised, with the mechanism each change opens\n\nOrdered by leverage per word changed.\n\n### 5.1 Amend § 1004.04(5)(b) — the supervising-teacher definition **← highest leverage**\nAdd an alternative qualification for non-district settings: e.g. three years of documented PreK-12 teaching experience plus a recognized sector credential (Montessori AMI/AMS, classical certification, National Board, or an approved microschool-network credential), in place of the district performance rating. **Opens:** legal clinical placement in private schools, microschools and co-ops — immediately, without touching the placement clause at all.\n\n### 5.2 Amend § 1004.04(5)(d) — the site standard\nReplace \"commitment to the education of public school students\" with \"commitment to the education of Florida students.\" **Opens:** removes the facial disqualification of non-public sites, and makes the existing reference to \"approved private school associations\" operative rather than decorative.\n\n### 5.3 Extend § 1012.555 apprenticeship eligibility beyond districts, charters and CMOs\nAllow scholarship-accepting private schools and registered microschools to sponsor apprentices with an approved institution. **Opens:** a paid, earn-while-you-learn route into the choice sector — and gives Florida College System institutions a new partner class for EPI and apprenticeship enrollment.\n\n### 5.4 Create a portable \"clinical educator\" designation that travels with the teacher\nToday the qualification to mentor is an attribute of the employer's evaluation system. Make it an attribute of the educator, renewable on evidence rather than on an employer's rating. **Opens:** two-way career mobility — the supply-side analogue of portability.\n\n### 5.5 Authorize a setting-specific endorsement\nA microschool / multi-age / independent-setting endorsement on the Florida certificate, built by an EPI or ITP and approved by the State Board. **Opens:** a reason for a choice-sector teacher to want a Florida credential at all — which is the only durable way to keep the credential relevant as the sector grows.\n\n### 5.6 Require the data that would settle the argument\nAdd to the annual teacher preparation report: completer placement **by setting**, including private, microschool and home-education. **Opens:** the entire question becomes measurable. **Right now, Florida cannot answer \"where did our graduates go?\" beyond the district sector — and neither can anyone else.**\n\n---\n\n## NEXT RESEARCH\n\n1. **[UNCHK]** Do any of Florida's 311 ITPs or 26 EPIs hold a field-placement agreement with a private school association, a microschool network, or a classical/Montessori school? A single documented example would change the story from \"structurally blocked\" to \"possible but unused.\"\n2. **[UNCHK]** Has any Florida institution asked FLDOE for a placement waiver in a non-district setting? A denial letter would be the strongest single document in this file.\n3. **[UNCHK]** Scan the Florida off-campus credential market — who is preparing microschool and classical teachers in this state, and at what volume?\n4. **[UNCHK]** Title II completer trend for Florida specifically, 2015–2024, ITP versus EPI versus PLCP. National completions fell **more than 25%** over a decade; whether Florida tracks or diverges is unverified. ([NCTQ](https://www.nctq.org/research-insights/data-brief-how-do-trends-in-teacher-preparation-enrollment-and-completion-vary-by-state/))\n5. **[UNCHK]** How many Schools of Hope now operate, and has the certification exemption been used at any scale? It is the one existing precedent for uncoupling teaching from certification in Florida law."},{"id":"fl-supply-2","title":"Five open questions, answered","group":"Supply side","blurb":"Round 2 — includes a correction to round 1.","date":"2026-09-16","file":"claude_WMFC-FL-Supply-Side-Round2.md","words":1982,"md":"# Five Open Questions, Answered\n**WMFC research memo · 16 September 2026 · follow-up to the Florida supply-side memo**\n\nEvidence states: **[DOC]** documented · **[NONE]** searched, nothing found · **[UNCHK]** not yet checked.\n\n---\n\n## ⚠ CORRECTION TO THE PRIOR MEMO — issued before the findings\n\nThe 14 September memo argued that Florida's educator pipeline was **structurally blocked** from non-district settings, on the strength of § 1004.04(5)(b)'s requirement that supervising teachers hold an \"effective or highly effective\" performance rating.\n\n**That claim was too strong, and this round falsifies it.** Two documents settle it:\n\n1. **UCF's Student Teaching Handbook contains this FAQ, verbatim: \"Can my placement be at a Charter of Private School? A: Yes.\"** ([UCF Student Teaching Handbook](https://ccie.ucf.edu/wp-content/uploads/sites/8/2017/09/StudentTeachingHandbook.pdf))\n2. The same handbook renders the supervising-teacher standard as **\"Completed three years of successful teaching with effective/highly effective, _or the equivalent_, ratings.\"** The phrase **\"or the equivalent\"** is the accommodation I said did not exist.\n\n**Revised claim, which the evidence supports:** non-district clinical placement in Florida is **legally permitted and institutionally available — and appears to be almost entirely unused.** That is a weaker structural claim and a much more interesting institutional one. Blocked is an excuse; available-and-unused is a choice.\n\n*Log as Correction #1 against the 14 Sept memo, Part 3.*\n\n---\n\n## Q1 — Do any Florida ITPs or EPIs place candidates in private, classical, Montessori or microschool settings?\n\n### **RESOLVED: YES. [DOC]**\n\n**University of Central Florida — open by policy.** UCF's teacher education internships describe \"hands-on experience with children in a variety of settings — **public, private and charter schools**, museums, libraries, science centers, hospitals and more.\" The program names **Internship I** (two days weekly in a classroom) and **Internship II** (full-time, 14 weeks, full teaching responsibility) — the certification-track sequence. The only stated placement restriction is a conflict-of-interest rule: \"you cannot intern at a school where you or your family members attend(ed) or work(ed).\" ([UCF STE Internships](https://ccie.ucf.edu/teachered/internships/))\n\n**Florida Virtual School — a non-traditional host at scale.** FLVS runs instructional internships \"tailored to meet Florida Educator Accomplished Practices,\" led by certified Clinical Educator instructors, and states the internship **\"satisfies the Florida state requirement for certification.\"** FLVS reports **30+ partner institutions, including the University of Florida, Florida State University, UCF and USF.** Open to candidates in a degree program requiring an instructional internship **or completing an EPI.** ([FLVS Internships](https://www.flvs.net/about-us/who-we-are/careers/internships))\n\n> FLVS is not a school district. It is a statewide virtual school, and four of Florida's largest preparation programs already place certification-track candidates there. **The precedent for non-district clinical placement is not hypothetical — it is a decade old and operating.**\n\n### But institutional practice varies sharply — and that is the new codeable variable\n\n| Institution | Placement posture | Evidence |\n|---|---|---|\n| **UCF** | **Explicitly open** to private and charter schools | [DOC] — handbook FAQ + internships page |\n| **FLVS** (as host) | Hosts certification-satisfying internships, 30+ partners | [DOC] |\n| **FAU** | Six named partner districts (Broward, Palm Beach, Indian River, St. Lucie, Martin, Okeechobee); \"All placements must be arranged through our office.\" Private/charter **not addressed** | [DOC] — silent, not prohibitive ([FAU](https://www.fau.edu/education/students/school-engagement/programs/studentteaching/)) |\n| **FIU** | \"FIU collaborates with Miami-Dade and Broward County school districts.\" Private/charter **not addressed** | [DOC] — silent ([FIU](https://case.fiu.edu/opportunities/internships-jobs/clinical-experiences/educator-preparation-internships/)) |\n| **UWF** | Placement page names only Escambia, Okaloosa, Santa Rosa counties for fingerprinting; no policy stated | [UNCHK] ([UWF](https://uwf.edu/soe/resources/office-of-clinical-placements-and-partnerships/student-teaching-and-internship/)) |\n\n**The finding is the variance.** Same statute, same rule, same state — one institution advertises private-school placement, others describe themselves entirely in district terms. **Nothing in law explains the difference. Institutional choice does.**\n\n### Still open\n- **[UNCHK]** How many UCF candidates actually intern in private or charter schools each year? A policy that permits something is not evidence anyone uses it. **This single number is now the highest-value data point in the entire supply-side file.**\n- **[NONE]** No Florida ITP or EPI surfaced with a named placement agreement with a *classical*, *Montessori*, or *microschool* provider specifically. Permitted ≠ practiced.\n\n---\n\n## Q2 — Has any Florida institution sought an FLDOE placement waiver for a non-district setting?\n\n### **RESOLVED AS MOOT. [NONE]**\n\nNo waiver mechanism, request, or denial surfaced in public sources. **The likely reason is now clear: no waiver is required.** Rule 6A-5.066 defines field experiences as activities \"conducted in prekindergarten through Grade 12 classroom settings as directed by a state-approved teacher preparation program\" — it does not restrict the setting's governance. § 1004.04(5)(d) names \"approved private school associations\" as co-selectors of sites. UCF simply does it.\n\n**An absence of waiver traffic is consistent with permission, not prohibition.** The hoped-for denial letter probably does not exist — which is itself the answer.\n\n**If pursued anyway**, the path is a public-records request to FLDOE's Bureau of Educator Certification / educator preparation office for correspondence regarding non-district clinical placements. **Recommendation: deprioritize.** Q1's usage numbers are worth far more.\n\n---\n\n## Q3 — Florida's off-campus credential market\n\n### **RESOLVED — and the finding is an inversion. [DOC]**\n\n**The off-campus market is not outside Florida's system. Part of it holds a state approval.**\n\n**Teachers of Tomorrow — a for-profit national company operating as a Florida state-approved Educator Preparation Institute.** Self-paced online, roughly nine months, candidates \"begin teaching on a permit and receive full-time pay while you complete your training.\" **More than 90,000 educators certified nationally.** Ranked in the top 4% of Florida EPIs on Annual Program Performance Report data. ([Teachers of Tomorrow Florida](https://www.teachersoftomorrow.org/florida/))\n\n> Florida has **26 EPI approvals**. One of them belongs to a national for-profit. The \"alternative market\" and the \"state-approved system\" are not separate categories in Florida — they overlap, and nobody has mapped the overlap.\n\n**FACCS Professional Educator Certification** — a credential for Christian-school educators from the Florida Association of Christian Colleges and Schools. Requires employment at a FACCS member or accredited school with leadership endorsement, transcripts, and a Philosophy of Christian Education course, plus subject-area endorsements for middle/secondary. FACCS states it **\"doesn't replace or compete with state certification — it stands alongside it.\"** ([FACCS](https://faccs.org/certification-program-info/))\n\n**Prenda (Florida)** — microschool network. **\"About half of all guides are certified teachers and the other half are passionate parents or community members.\"** No credential required. Prenda supplies a \"Beginner's Guide to Microschooling\" course and guide coaches. **Accepts PEP and FES-UA at $2,199 per student per year**, plus a guide-set fee. ([Prenda Florida](https://www.prenda.com/states/florida))\n\n**Sarasota University — MA in Montessori Education.** 36 credits, fully online plus blended courses with short intensive residencies. Partners with MACTE-accredited Montessori Teacher Education Programs. Explicitly **\"does not lead to a Montessori credential or state licensure\"** on its own. ([Sarasota University](https://www.sarasotauniversity.edu/masters-programs/montessori-education/))\n\n**National providers serving the sector** (Florida volume **[UNCHK]**): Hillsdale College Graduate School of Classical Education; Great Hearts' Academy for Classical Teachers; KaiPod Learning's microschool founder programs; AMS and AMI Montessori teacher education programs.\n\n### The structure this reveals\n\nFlorida's educator preparation market has **four tiers**, and only the first two are counted anywhere:\n\n1. **University ITPs** — 311 programs, the traditional route\n2. **EPIs** — 26 approvals, now including at least one national for-profit\n3. **Employer-run PLCPs** — 46 programs run by districts, charters and CMOs\n4. **Uncounted sector credentials** — FACCS, Montessori, classical, microschool-network training: **real preparation, real volume, zero visibility in any state dataset**\n\n**Tier 4 is where the choice sector's teachers are actually being prepared, and Florida's reporting system cannot see it.**\n\n---\n\n## Q4 — Florida Title II completer trend, 2015–2024\n\n### **PARTIALLY RESOLVED. National yes; Florida-specific [UNCHK] with a known address.**\n\n**National, Title II 13th Report (2012-13 → 2019-20):** enrollment **692,840 → 601,467** (−13.2%); completers **192,334 → 152,939** (**−20.5%**). ([Title II 13th Report](https://title2.ed.gov/Public/TitleIIReport23.pdf))\n\n**National, NCTQ (2010-11 → 2020-21):** enrollment **880,000 → 591,000** (≈−30%); completions **~214,000 → ~160,000** (**−25%**). An 8% recovery from pandemic lows between 2018-19 and 2020-21. NCTQ names twelve states with enrollment decreases — **Florida is not among them.** ([NCTQ](https://www.nctq.org/research-insights/data-brief-how-do-trends-in-teacher-preparation-enrollment-and-completion-vary-by-state/))\n\n**Florida figures exist in Title II Supplemental Tables S1.1 (enrollment by state and program type) and S1.4 (completions by state)** — named in the report, not reproduced in the narrative, and not extractable from the PDF in this round. **That is the exact address for the next attempt.**\n\n**What Florida-specific data this round did establish [DOC]:**\n- **383 approved programs**: 311 ITP · 26 EPI · 46 PLCP\n- **The largest single producer in the state is an alternative route**: University of West Florida's EPI, **735 completers in 2021-22** — more than any ITP\n- Ranked programs prepared **97.4%** of all completers in the last two years with data\n- Programs with enough performance data to receive a summative ranking rose from **30% in 2023 to 55% in 2024**\n\n([FLDOE 2024 Teacher Preparation Programs Performance Report](https://www.fldoe.org/file/7502/25AnnTeachPrepReport.pdf))\n\n> **Florida's absence from NCTQ's declining-enrollment list is a lead, not a conclusion.** If Florida held enrollment while the nation fell 30%, the reason matters enormously — and the most likely explanation is that Florida's growth is in EPIs and PLCPs, not in university ITPs. **That hypothesis is testable the moment S1.1 and S1.4 are in hand.**\n\n---\n\n## Q5 — Schools of Hope: how many, and has the certification exemption been used?\n\n### **PARTIALLY RESOLVED. [DOC] on operators; [UNCHK] on scale and exemption use.**\n\n**Six designated hope operators in Florida:** Mater Academy · RCMA · IDEA Public Schools · Success Academy · Renaissance/Warrington Preparatory Academy · KIPP New Jersey. ([FLDOE Schools of Hope](https://www.fldoe.org/schools/school-choice/other-school-choice-options/schools-of-hope/))\n\nA School of Hope is a charter operated by a hope operator serving students from one or more persistently low-performing schools, located in the attendance zone or within a five-mile radius, and Title I eligible.\n\n**FLDOE does not publish an operating school count** on that page. **[UNCHK]**\n\n**The exemption** — instructional personnel at Schools of Hope, including lead classroom teachers, need not meet standard public school teacher requirements (HB 7069, § 1002.33). ([PolitiFact](https://politifact.com/factchecks/2018/aug/15/gwen-graham/graham-misspeaks-charter-school-teacher-certificat/)) **No evidence surfaced that it has been used at any scale. [NONE, provisional]**\n\n**Current context:** hope operators are reported to be claiming tens of thousands of seats in Florida public school facilities, with county school boards raising objections and the state tightening rules in response. Primary sourcing on this is behind a paywall and remains **[UNCHK]**. ([Florida Politics](https://floridapolitics.com/archives/765971-schools-of-hope-charter-operators-claim-tens-of-thousands-of-seats-in-florida-public-schools/) — 402 paywall, not retrieved)\n\n**Why this matters to the supply-side file:** the Schools of Hope exemption is Florida's only existing statutory precedent for uncoupling teaching from certification. **If it has gone essentially unused, that is evidence the credential is not actually the binding constraint anyone assumes it is** — operators with permission to hire uncertified teachers apparently still hire certified ones. That would be a significant, counterintuitive finding and it is worth resolving.\n\n---\n\n## WHERE THIS LEAVES THE ARGUMENT\n\nThe 14 September memo said: *the pipeline is structurally blocked from the choice sector.*\n\n**The corrected claim is sharper and harder to dismiss:**\n\n> Florida law permits non-district clinical placement. At least one major university advertises it. A statewide virtual school has hosted certification-track interns from thirty-plus institutions for years. **The infrastructure exists. Almost nobody is using it for the choice sector — and Florida's reporting system is built so that nobody can tell.**\n\nThat is not a story about legal barriers. It is a story about **institutional attention**, and it survives the obvious rebuttal (\"the law won't let us\") that the earlier version invited.\n\n### Next five, ranked\n\n1. **[UNCHK]** UCF's actual count of private/charter internship placements per year. One number. Decides whether \"available\" means anything.\n2. **[UNCHK]** Title II Supplemental Tables S1.1 and S1.4 — Florida, 2015–2024, by route type. Known address; tests the EPI-growth hypothesis.\n3. **[UNCHK]** Schools of Hope: operating count and whether the certification exemption has ever been used.\n4. **[UNCHK]** Survey the other 310 ITPs' placement language. UCF open / FAU and FIU district-framed is a 3-institution sample; the variance is the finding and it deserves a real N.\n5. **[UNCHK]** Volume in tier 4 — FACCS certificate holders, Florida Montessori and classical credentials issued, Prenda guide count in Florida. The uncounted sector, counted."},{"id":"fl-supply-3","title":"The placement survey: N=10","group":"Supply side","blurb":"Ten providers, one statute, four postures.","date":"2026-09-16","file":"claude_WMFC-FL-Supply-Side-Round3.md","words":2094,"md":"# The Placement Survey: N=10\n**WMFC research memo · 16 September 2026 · round 3**\n\nEvidence states: **[DOC]** documented · **[NONE]** searched, nothing found · **[UNCHK]** not yet checked.\n\n**Collection note:** web fetching hit a session rate limit partway through this round. Two identified sources (EdChoice's Prenda guide survey, Nova Southeastern's placement policy) were not retrieved. They are marked and carried forward rather than guessed at.\n\n---\n\n## THE HEADLINE\n\n**Ten Florida educator preparation providers, same statute, same rule — and they split almost evenly on whether a candidate may student-teach outside a school district.**\n\n| | Providers | Share |\n|---|---|---|\n| **Explicitly open to private schools** | UCF, Valencia College, Southeastern University | 3 / 10 |\n| **Open in practice** (named non-district partners) | UNF | 1 / 10 |\n| **District-framed** (names only districts) | FAU, FIU, St. Petersburg College | 3 / 10 |\n| **Restrictive via mentor definition** | USF | 1 / 10 |\n| **Silent / not public** | FSU, UWF | 2 / 10 |\n\n**Nothing in Florida law explains this split.** Every one of these programs operates under § 1004.04 and Rule 6A-5.066. The variance is institutional policy, written institution by institution.\n\n### And the direction of the split is the story\n\n> **The most permissive program in the sample is a private Christian university. The most restrictive is a public research university.**\n\n**Southeastern University** (Lakeland, FLDOE state-approved, also recognized by FLOCS and ACSI) places candidates in \"pre-kindergarten, elementary, middle grades, or secondary **public or private schools** according to the major and area(s) of certification,\" and permits distance placements \"globally throughout the world\" with prior approval. Its cooperating teacher standard: three years of successful teaching experience, Clinical Educator training, and a Florida Professional Teaching Certificate — **no performance-evaluation rating required.** ([SEU College of Education Policy Handbook](https://library.seu.edu/sites/default/files/2023-10/COE%20Policy%20Handbook%202023%20pdf.pdf))\n\n**USF** requires that the collaborating teacher \"meet certification standards of the State of Florida in the area of the intern's major\" and have **\"at least three years of service in the Florida state school system.\"** ([USF Handbook for Final Internship](https://www.usf.edu/education/documents/academics/internship-requirements/coedu-handbook-for-final-internship.pdf))\n\n**\"Service in the Florida state school system\" is stricter than the statute requires.** § 1004.04(5)(b) asks for three years of PreK-12 teaching experience; USF asks for three years *inside the public system*. A twenty-year private school teacher is disqualified as a mentor at USF and qualified at Southeastern.\n\n**This is WMFC's thesis, evidenced:** the institutions least able to serve the choice sector are the public ones, and they got that way by their own drafting.\n\n---\n\n## Q4 — The survey, institution by institution **[DOC]**\n\n### Open\n\n**University of Central Florida** — Student Teaching Handbook FAQ: *\"Can my placement be at a Charter of Private School? A: Yes.\"* Internships page lists placements across \"public, private and charter schools, museums, libraries, science centers, hospitals and more.\" Mentor standard rendered as three years with \"effective/highly effective, **or the equivalent**, ratings.\" ([Handbook](https://ccie.ucf.edu/wp-content/uploads/sites/8/2017/09/StudentTeachingHandbook.pdf), [Internships](https://ccie.ucf.edu/teachered/internships/))\n\n**Valencia College (EPI)** — field experience may be completed in **\"your own classroom, area public schools, approved private schools.\"** Named partners: Brevard, Lake, Orange, Seminole and Osceola districts **plus FLVS**. For placements outside partner districts, the site must comply with § 1004.04. Mentor standard includes \"an effective or highly effective rating on the prior year's performance evaluation\" **or equivalent peer evaluator status.** ([Valencia EPI Field Experience](https://valenciacollege.edu/academics/programs/educator-preparation-institute/field-experience.php))\n\n**Southeastern University** — see headline above. ([SEU Handbook](https://library.seu.edu/sites/default/files/2023-10/COE%20Policy%20Handbook%202023%20pdf.pdf))\n\n**University of North Florida** — field experience partner list spans **Duval County Public Schools, KIPP Jacksonville (charter), Edward Waters College, Jacksonville University, UNF Preschool, All About Kids Center, Crawford Early Learning Center, Boys and Girls Clubs, libraries, Head Start, Episcopal Children's Services, Communities in Schools.** Non-district partners are named, not implied. ([UNF Partners](https://www.unf.edu/fie/partners.html))\n\n### District-framed\n\n**Florida Atlantic University** — six named partner districts (Broward, Palm Beach, Indian River, St. Lucie, Martin, Okeechobee); *\"All placements must be arranged through our office.\"* Private and charter not addressed. ([FAU](https://www.fau.edu/education/students/school-engagement/programs/studentteaching/))\n\n**Florida International University** — *\"FIU collaborates with Miami-Dade and Broward County school districts to provide these internship opportunities.\"* Private and charter not addressed. ([FIU](https://case.fiu.edu/opportunities/internships-jobs/clinical-experiences/educator-preparation-internships/))\n\n**St. Petersburg College (EPI)** — 60-hour fall practicum plus a *\"full-day, 10-week internship in your final semester that you can finish in any school district in Florida.\"* Private and charter not addressed. ([SPC EPI](https://www.spcollege.edu/future-students/degrees-training/education/paths-to-teacher-certification/educator-preparation-institute-certificate))\n\n### Restrictive\n\n**University of South Florida** — setting not addressed; the constraint sits in the mentor definition (above). Also requires state-endorsed Clinical Educator Training, and notes that \"the principal works closely with the designated representative of the school system in placing interns.\" ([USF Handbook](https://www.usf.edu/education/documents/academics/internship-requirements/coedu-handbook-for-final-internship.pdf))\n\n### Silent\n\n**Florida State University** — the student teaching page covers eligibility (GPA, exams, insurance, coursework) and names a Field Experience Coordinator; placement policy is not published. Handbooks referenced are 2020-21. ([FSU](https://annescollege.fsu.edu/academics/office-academic-services-and-intern-support-oasis/student-teaching)) **[UNCHK]**\n\n**University of West Florida** — placement page names only Escambia, Okaloosa and Santa Rosa counties, and only in the context of fingerprinting. No placement policy stated. Notable because UWF's EPI is the largest single producer of completers in Florida. ([UWF](https://uwf.edu/soe/resources/office-of-clinical-placements-and-partnerships/student-teaching-and-internship/)) **[UNCHK]**\n\n### One host worth its own row\n\n**Florida Virtual School** — not a preparation program, but a placement site. Hosts instructional internships that \"satisfy the Florida state requirement for certification,\" led by certified Clinical Educator instructors, with **30+ partner institutions including UF, FSU, UCF and USF.** Open to candidates in a degree program requiring an internship **or completing an EPI.** ([FLVS](https://www.flvs.net/about-us/who-we-are/careers/internships)) **[DOC]**\n\n> USF's own handbook restricts mentors to the \"Florida state school system\" — and USF is listed among FLVS's partner institutions. Those two facts reconcile only because FLVS is a public entity. **Which is exactly the line the choice sector cannot cross.**\n\n### Survey limits, stated plainly\n\nN=10 of roughly 337 ITP and EPI providers. The sample is purposive, not random: it covers most of the State University System plus two large Florida College System EPIs and one private university. It is enough to establish that **variance exists and is large**; it is not enough to estimate the statewide distribution. A census would need all 311 ITPs and 26 EPIs.\n\n---\n\n## Q1 — UCF's actual placement count by setting\n\n### **NOT PUBLIC. [NONE]**\n\nNo UCF publication, annual report, or FLDOE dataset surfaced that reports internship placements broken out by school type. FLDOE's Annual Program Performance Report ranks programs on candidate and workforce outcomes; it does not report placement setting.\n\n**This is a reportable gap, not just a research obstacle.** Florida requires programs to report completer performance but not where candidates were prepared. The state cannot answer \"how many Florida teachers trained outside a district school?\" for any institution, including its own.\n\n**Path forward:** UCF is a public university subject to Florida's public records law (Ch. 119). A records request to the College of Community Innovation and Education for internship placements by site type, by term, for the last five years is the cleanest route — and a single institution's answer would be publishable on its own. **Recommend as the highest-value next action in the file.**\n\n---\n\n## Q2 — Florida Title II completers by route, 2015–2024\n\n### **STILL OPEN, with the obstacle documented. [UNCHK]**\n\n`title2.ed.gov` **disallows automated retrieval via robots.txt**, so supplemental tables S1.1 (enrollment) and S1.4 (completions) could not be pulled this round. This is a tooling limit, not an absence of data — the tables exist and are public. **Manual download required.**\n\n**What is established:**\n\n- **National (Title II 13th Report, 2012-13 → 2019-20):** enrollment 692,840 → 601,467 (−13.2%); completers 192,334 → 152,939 (**−20.5%**)\n- **National (NCTQ, 2010-11 → 2020-21):** enrollment ~880,000 → 591,000 (≈−30%); completions ~214,000 → ~160,000 (−25%). **Florida is not among the twelve states NCTQ names as having enrollment decreases.**\n- **Florida institutional data point [DOC]:** the University of Florida reported **106 Title II completers in 2023-24.** ([UF Title II data](https://education.ufl.edu/educator-quality/files/2025/08/2023-2024-Title-II-data-for-COE-website.pdf))\n\n> **106.** Florida's flagship land-grant research university produced roughly a hundred certified teachers in a year, while UWF's Educator Preparation Institute produced 735 in 2021-22. The volume has moved to the alternative route, and it is not close.\n\n---\n\n## Q3 — Schools of Hope: count and exemption use\n\n### **PARTIALLY RESOLVED. [DOC] on operators and activity; [UNCHK] on operating count and exemption use.**\n\n**Seven designated Hope Operators** (one more than FLDOE's page lists): Mater Academy · RCMA · **Democracy Prep Public Schools** · IDEA Public Schools · Success Academy · Renaissance/Warrington Preparatory Academy · KIPP New Jersey. ([WUSF](https://www.wusf.org/education/2026-02-20/florida-board-of-education-trims-schools-of-hope-law-districts-still-pay), [FLDOE](https://www.fldoe.org/schools/school-choice/other-school-choice-options/schools-of-hope/))\n\n**Scale of intent:** within a week of the 2025 expansion, operators sent **690 letters of intent to co-locate in public schools across 22 counties.** ([Florida Phoenix](https://floridaphoenix.com/2026/02/20/state-responds-to-schools-of-hope-outcry-tightens-rules/))\n\n**Rules tightened 21 February 2026**, after the Education Commissioner acknowledged the program had caused \"a stir\": no more than five notices per operator per 12 months; operators must attest genuine intent to open; districts get 20 business days to object; target schools must be more than four years old and either under 75% facility utilization or carrying 400+ surplus student stations; notices must precede opening by one to two years; services negotiated by mutual agreement; districts may charge incremental utility costs. **[DOC]**\n\n**Still open:**\n\n- **[UNCHK]** How many Schools of Hope actually operate. FLDOE does not publish the count.\n- **[NONE]** No evidence that the § 1002.33 / HB 7069 certification exemption for Schools of Hope instructional personnel has been used at any scale.\n\n> The second null still matters most. **If operators legally permitted to hire uncertified lead teachers are hiring certified ones anyway, the credential is not the binding constraint the supply-side debate assumes it is.** That reframes the policy question from \"loosen certification\" to \"certification isn't what's stopping anyone.\"\n\n---\n\n## Q5 — Tier 4 volume: the uncounted credential market\n\n### **MOSTLY UNRESOLVED — and the nulls are themselves the finding. [NONE]**\n\n**FACCS (Florida Association of Christian Colleges and Schools)** — publishes **no** count of member schools, accredited schools, or certificates issued. Certification structure is documented: three types (Teacher, Administrator, Professional Services); professional certificates valid five years, renewable; temporary valid three years, non-renewable; requires employment at a FACCS member or accredited school with leadership endorsement, transcripts, and the Philosophy of Christian Education course. Founded 1968 with 10 schools. ([FACCS Who We Are](https://faccs.org/who-we-are/), [Certification FAQs](https://faccs.org/certification/faqs/), [Program Info](https://faccs.org/certification-program-info/))\n\n**Prenda Florida** — \"about half of all guides are certified teachers and the other half are passionate parents or community members.\" **No Florida guide or microschool count published.** Accepts PEP and FES-UA at $2,199/student/year plus a guide-set fee. ([Prenda Florida](https://www.prenda.com/states/florida))\n\n**Montessori** — Sarasota University's MA in Montessori Education (36 credits, online plus residencies) partners with MACTE-accredited programs and explicitly \"does not lead to a Montessori credential or state licensure\" on
