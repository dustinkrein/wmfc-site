s are now law for roughly half of all U.S. K-12 children.\n\n**30+**states with portable-funding programs in 2026\n\nVerify current-cycle figures — this space moves monthly\n\nHow the rest of the world emboldened the idea\n\n## The mechanism was proven abroad — and so were its warnings.\n\nAmerican choice did not develop in isolation. Other countries had run the experiment for decades, and their records became reference points for advocates and skeptics alike. Three systems mattered most.\n\n#### Netherlands — stability\n\nA century of constitutionally funded choice (since 1917), with roughly two-thirds of pupils in privately-run, publicly-funded schools. The proof that near-universal portability can be institutionally durable when quality standards and inspection grow up alongside it.\n\nThe \"it can last\" case\n\n#### Sweden — the caution\n\nOne of the world's most sweeping voucher systems (1992). Two decades on, its role in Sweden's PISA decline is fiercely debated — with independent schools found to employ fewer qualified teachers and higher student ratios. The warning that generous funding does not by itself supply a qualified workforce.\n\nThe \"watch the teachers\" case\n\n#### Chile & England — scale and design\n\nChile ran a national voucher system from 1981, a decades-long dataset on stratification and later corrective reform. England deliberately moved teacher training out of universities toward schools — the closest natural experiment to the workforce question now facing the U.S.\n\nThe \"design decides outcomes\" case\n\nWhere this leaves us\n\n## Three centuries got the money moving. One question is still unanswered.\n\nThe through-line is clear: portable funding was invented for practical and pluralist reasons, given a market theory in 1955, enacted state by state after 1990, cleared by the courts, and made universal in the 2020s. An entire field now measures what families do with that money and which states adopt it.\n\nBut every mature system abroad points back to the same variable the American debate rarely names: whether the **workforce** exists to staff the new schools all this choice enables. Sweden's caution, England's experiment, and the U.S. preparedness gap all converge there.\n\nThe money moved. An entire field tracks what families do with it. When Money Follows the Child measures what colleges and universities do about it — whether the people who will teach in this new landscape are being prepared for it at all."},{"id":"oldest-argument","title":"The oldest argument","group":"History","blurb":"234 years of the case for portable funding.","date":"","file":"the-oldest-argument.html","words":1657,"md":"When Money *Follows* the Child\n\nHistory brief · 2026\n\nYears between the first proposal and the first universal program\n\n234\n\nThomas Paine proposed paying families directly to educate their children in 1792. No American state made that funding available to every child until 2022.\n\nPart one\n\n## Who actually made this argument\n\nEach entry below is a person or ruling that advanced the idea that public funds should reach a family rather than a building. Their politics are listed because their politics are the point.\n\n1792\n\nThomas Paine\n\nRevolutionary pamphleteer\n\nIn *Rights of Man*, Part II, proposed paying poor families four pounds a year per child on the condition the child attend school — with ministers of any denomination certifying attendance. Public money, private provision, parental control, denominational neutrality. His stated purpose was dismantling aristocratic privilege.\n\n1840\n\nBishop John Hughes\n\nImmigrant Catholic New York\n\nDemanded that public school funds reach Catholic schools, because New York's public schools taught the Protestant Bible to Irish Catholic children. He lost. The loss built the American parochial school system.\n\n1859\n\nJohn Stuart Mill\n\nLiberal philosopher\n\nArgued in *On Liberty* that the state may legitimately require education without monopolizing its supply — a state-run system, he warned, is a mold for making people alike.\n\nThe interruption\n\n### 1875: America closes the door for 145 years\n\nCongressman James G. Blaine proposed a constitutional amendment barring public aid to “sectarian” schools. It failed federally. Versions of it were then written into roughly 37 state constitutions, in a period whose anti-Catholic politics historians have documented at length.\n\nThis is the fact that reframes everything. The United States did not fail to invent school choice. It *prohibited* it — at the state constitutional level, for a century and a half. The line below runs dashed until the Supreme Court dismantles those provisions in 2020 and 2022.\n\n1925\n\nPierce v. Society of Sisters\n\nSupreme Court · unanimous\n\nOregon, under Klan-backed legislation, tried to compel every child into public school. The Court struck it down: a child is not the mere creature of the state. Choice becomes a constitutional right — but an unfunded one.\n\n1955\n\nMilton Friedman\n\nEconomist\n\nSeparated two things that had been treated as one: financing education and operating schools. Widely treated as the origin of the idea. He is the seventh entry on this list, not the first.\n\n1956–68\n\nSegregationist tuition grants\n\nThe abuse of the idea\n\nSouthern states adopted “freedom of choice” plans and tuition grants explicitly to evade *Brown*. Prince Edward County, Virginia closed its public schools entirely for five years. The Supreme Court ended the practice in *Green v. New Kent County* (1968). Any honest account of school choice in America has to carry this.\n\n1968\n\nKenneth B. Clark\n\nPsychologist whose research underpinned *Brown v. Board*\n\nWeeks after the segregationist plans were struck down, Clark argued that Black children in northern cities were trapped in a public monopoly that had no incentive to serve them, and called for competing alternatives — including private and federally run schools.\n\n1970\n\nChristopher Jencks\n\nHarvard sociologist · of the left\n\nDesigned the first federally funded voucher demonstration for the Office of Economic Opportunity — an anti-poverty agency. It ran in Alum Rock, California through 1976.\n\n1978\n\nJohn Coons & Stephen Sugarman\n\nBerkeley law professors\n\nIn *Education by Choice*, argued that assigning children to schools by home address is itself a wealth transfer: the affluent already choose, by moving. Choice as an equity remedy, not a market one.\n\n1988\n\nAlbert Shanker\n\nPresident, American Federation of Teachers\n\nProposed the charter school — teacher-run public schools operating outside district rules. The head of a national teachers' union invented the most widespread form of American school choice. He later turned against what it became.\n\n1990\n\nAnnette “Polly” Williams\n\nBlack Democrat · Wisconsin State Assembly\n\nWrote the first modern voucher law in the United States, for low-income Milwaukee families. She had chaired Jesse Jackson's Wisconsin presidential campaigns. She later broke with the movement over its expansion beyond the poor families she wrote it for.\n\n1991\n\nMinnesota's charter law\n\nDemocratic-led legislature\n\nAuthored by DFL senator Ember Reichgott Junge, the nation's first charter statute passed under Democratic control and turned Shanker's idea into law.\n\n2000\n\nHoward Fuller\n\nFormer Milwaukee superintendent\n\nFounded the Black Alliance for Educational Options, organizing Black parent demand as a constituency independent of either party.\n\n2002\n\nZelman v. Simmons-Harris\n\nSupreme Court · 5–4\n\nAid that reaches religious schools through the private choices of parents does not establish religion. The federal constitutional objection ends here. The state Blaine provisions survive another eighteen years.\n\n2020  \n2022\n\nEspinoza v. Montana · Carson v. Makin\n\nSupreme Court · the door reopens\n\nA state that funds private education options may not exclude religious ones. The Blaine-era provisions, written in the 1870s, stop functioning. The line is continuous again for the first time since 1875.\n\n### What this record does not show\n\nThat the idea is old and cross-ideological is not evidence that any particular program works. Research on academic outcomes is genuinely mixed — Louisiana and Indiana produced significant negative results; Florida and Milwaukee produced positive attainment effects. Lineage is not proof.\n\nEvery ballot measure asking voters directly has recently failed: Kentucky, Nebraska and Colorado all rejected choice measures in November 2024. Legislative wins have consistently outrun popular votes. That gap is real and this page does not resolve it.\n\nPart one, continued\n\n## America was *late*, not first\n\nThe claim that choice is uniquely American does not survive contact with the record. Most wealthy democracies funded non-state schools generations before the United States did. What is genuinely American is the fight — and what came after it.\n\n| Country       | Since | Mechanism                                                                                                                                                                                                             |\n|---------------|-------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Denmark       | 1850s | State covers the majority of costs at independent “free schools,” which any group of parents may start                                                                                                                |\n| Netherlands   | 1917  | Constitutional funding parity between state and religious schools; most Dutch pupils attend privately run, publicly funded schools                                                                                    |\n| Belgium       | 1958  | The School Pact settled the funding question with parity across networks                                                                                                                                              |\n| Chile         | 1981  | National per-pupil voucher covering state and private subsidised schools                                                                                                                                              |\n| Sweden        | 1992  | Universal vouchers open to for-profit operators                                                                                                                                                                       |\n| United States | 2022  | First states reach universal eligibility — and pair it with the education savings account, which unbundles funding beyond tuition into therapy, curriculum, tutoring and assessment. No other country has built this. |\n\nThe honest version of the claim is stronger than the flattering one: the United States spent 145 years constitutionally blocking what its peers had already done — then, once the block was removed, built something none of them have.\n\nPart two\n\n## How Florida came to *lead*\n\nFlorida is not first because it passed the most laws. It is first because it lost in court, rebuilt, and then spent twenty years constructing the administrative machinery that portable funding actually requires.\n\n1999\n\nThe A+ Plan\n\nGovernor Jeb Bush\n\nTwo programs at once: Opportunity Scholarships, tied to failing school grades, and the McKay Scholarship for students with disabilities. McKay is the quiet landmark — it made disability the first broadly accepted basis for public funds leaving a district.\n\n2001\n\nFlorida Tax Credit Scholarship\n\nA different funding route\n\nCorporate tax credits fund a nonprofit scholarship organization rather than the state cutting checks. Step Up For Students becomes that organization — the decision that shapes everything after.\n\n2006\n\nBush v. Holmes\n\nFlorida Supreme Court · the defeat\n\nThe state's own high court struck down Opportunity Scholarships under Florida's uniformity clause. The flagship voucher program died. Tax credit and McKay survived, because they were built differently. Florida's advantage begins with this loss.\n\n2014\n\nPersonal Learning Scholarship Account\n\nThe first Florida ESA\n\nLater renamed Gardiner. Funds stopped being a tuition certificate and became an account: therapy, curriculum, specialists, technology. This is the invention the rest of the country later copies.\n\n2019\n\nFamily Empowerment Scholarship\n\nState funding restored\n\nA directly state-funded scholarship returns, structured to survive the objection that killed the 1999 program.\n\n2023\n\nHB 1\n\nUniversal eligibility\n\nIncome tests removed. Existing programs converted to education savings accounts. Every K–12 student in Florida becomes eligible for portable funding.\n\n2026\n\nSB 318\n\nThe next phase: oversight\n\nAfter a critical Auditor General operational audit, an oversight and fraud-control bill passed the Florida Senate unanimously — then died without a House companion. Expect it back. Scale has moved the argument from access to administration.\n\nFlorida, 2025–26\n\n## What half a million students looks like\n\nEnrollment across Florida's three largest scholarship programs. These are students whose education funding is portable today.\n\nFES-EO and Tax Credit286,284\n\nPrivate school tuition, with income priority for lower-income and foster families. Average award around \\$8,000.\n\nFES-UA · Unique Abilities140,147\n\nStudents aged 3–22 with a diagnosed disability. Around \\$10,000 average, with rollover. The broadest allowable-use category and the direct descendant of McKay.\n\nPEP · Personalized Education76,274\n\nFamilies educating outside public or private school. Capped at 100,000 — and now at capacity for new students, with renewals prioritized.\n\nThe number that matters is not the total. It is that a state built an approved-provider system, a quarterly disbursement platform, and a marketplace — and then hit a cap. Florida leads because it is the first place where portable funding stopped being a policy and became an operating system, with the queues, audits and vendor rules that implies.\n\n### Limits of this brief\n\n- Enrollment figures are 2025–26 and cover the three largest programs; Florida operates six. Amounts and caps are set annually by the Legislature and change.\n- Nothing here measures whether students learn more. It measures who argued for portability, when, and what Florida built.\n- The historical entries are selected, not exhaustive. Selection is an argument, and this one is stated openly: to show ideological range across time.\n- Verify current-cycle figures with Step Up For Students and the Florida Department of Education before citing them."},{"id":"coe-costs","title":"The cost of declining education-program enrollment","group":"College of Education case","blurb":"Dollars and data for the COE case.","date":"","file":"Quantifying_enrollment_decline_costs_in_teacher_education_programs.docx","words":825,"md":"Are you able to generate real numbers, in terms in of dollars and other data points that really hammer home the paint points, of the cost of declining enrollment in education -focused programs within postsecondary education institutions (College and Departments of Education), and start with public universities? I'm trying to find data that shows if a College of Education within a major public research university doesn't change and adapt, we can see and forecast the impact? I'm trying to find and show negative, painful data so leadership would be willing to rethink and change\n\nSearched the web, read a page\n\nHere's what I found. Two things up front: there is no published statistic called \"revenue lost by Colleges of Education\" — I have to build that from enrollment counts times price. And the numbers that will actually move your leadership are your own institution's, pulled from IPEDS. But the national data is brutal enough to open the conversation.\n\n**The core number, and it's the one to lead with**\n\nUniversity-based teacher prep enrollment fell from 611,296 students in 2012-13 to 407,556 in 2022-23. That's a 33% collapse in a decade. Completers fell from 163,851 to 112,913. [Higher Ed Dive](https://www.highereddive.com/news/fewer-people-seeking-education-degrees-aacte/803436/)[Higher Ed Dive](https://www.highereddive.com/news/fewer-people-seeking-education-degrees-aacte/803436/)\n\nBut here's the part that reframes it from \"demographics\" to \"we lost the market.\" Over the same decade, enrollment in alternative prep programs *not based at colleges* went from 43,099 to 124,428 — up 189%. And completers of alternative programs housed at colleges grew 44%. [Higher Ed Dive](https://www.highereddive.com/news/fewer-people-seeking-education-degrees-aacte/803436/)[Higher Ed Dive](https://www.highereddive.com/news/fewer-people-seeking-education-degrees-aacte/803436/)\n\nThe demand didn't vanish. It moved to providers who redesigned delivery. That's your whole argument.\n\n**Translating that into dollars**\n\n~204,000 fewer candidates in university-based prep. At a conservative $10,000/year in net tuition per candidate, that's roughly **$2 billion in annual recurring tuition revenue** that left university-based teacher prep — not cumulative, annual.\n\nFor a single flagship COE, apply the national -33% to a hypothetical 900-student prep enrollment:\n\n- 300 fewer students × 24 credit hours × $450/hour ≈ **$3.2M/year, recurring**\n\n- Cumulatively over the decade: **$30M+ foregone**\n\n- At ~$145K loaded cost per tenured line, $3.2M/year is **roughly 22 faculty lines** the college is carrying without the revenue behind them\n\nThat last framing is the one deans respond to. The cuts already happened financially; they just haven't been booked yet.\n\n**The graduate side, where COEs ****actually make**** money**\n\nEducation master's degrees fell from 162,632 to 143,669 between 2003-04 and 2022-23, with a 5% drop in a single year from 2021-22 to 2022-23. Bachelor's went 109,622 to 90,710. A college awarding 400 M.Ed.s a year losing 5% annually is ~$500K/year gone at typical program cost — from the highest-margin product line. [Where are tomorrow’s teachers? Education degrees drop over 2 decades. | Higher Ed Dive +2](https://www.highereddive.com/news/fewer-people-seeking-education-degrees-aacte/803436/)\n\n**The forecast, which is worse than the history**\n\nWICHE projects high school graduates peaked at 3.9 million in 2025 and decline to 3.4 million by 2041 — a 13% drop, with 38 states declining and New York down 27%, Pennsylvania down 17%. [WICHE](https://www.wiche.edu/resources/report-u-s-high-school-graduates-will-peak-next-year-then-most-states-will-see-steady-declines-through-2041/)[WICHE](https://www.wiche.edu/knocking/key-findings/geography/)\n\nStack that on the 33% already lost: a COE holding its current market share lands at **roughly 58% of its 2013 pipeline by 2041**. A 42% structural contraction, with no single year dramatic enough to trigger a crisis response.\n\n**What happens to colleges that wait**\n\n- Buffalo State is merging its School of Education into Professions after headcount fell 43% in ten years while staffing dropped only 22% [Bryan Alexander](https://bryanalexander.org/horizon-scanning/campus-cuts-mergers-and-closures-from-spring-2025/)\n\n- Indiana's higher ed commission eliminated more than 400 degrees across public universities — 75 killed outright, 333 merged [Bryan Alexander](https://bryanalexander.org/horizon-scanning/academic-closures-mergers-cuts-summer-2025-update/)\n\n- Portland State entered formal retrenchment against a $35 million structural deficit after a 23% enrollment decline since 2019 [Forbes](https://www.forbes.com/sites/michaeltnietzel/2026/03/16/more-universities-hit-with-another-round-of-faculty-and-program-cuts/)\n\n- North Texas consolidated over 70 low-enrollment programs against a $45 million deficit [Jobs AC UK](https://www.academicjobs.com/en-us/higher-education-news/colleges-layoffs-buyouts-budget-deficits-us-2026-academicjobs-16339)\n\nThe pattern: low-completion programs get eliminated by provosts and state boards, not by deans. The college that doesn't restructure itself gets restructured.\n\n**Getting your institution's numbers**\n\nPull IPEDS Completions (CIP 13) for your institution and 5-8 peers, 2013 to present, and your Title II institutional report. Local numbers with peer comparison are what break through — \"we declined 38% while our peer at [X] declined 12%\" is a very different meeting than a national average.\n\nI can build you a model where you drop in your COE's actual enrollment, credit hours, and tuition rate and it outputs the recurring revenue gap, FTE-equivalent, and a 2041 forecast line — usable as a board or cabinet one-pager.\n\nA deeper investigation could pull IPEDS completions for a full peer set, state-level Title II trends, and the actual budget documents from COEs that have already been consolidated, which would let you show leadership exactly where on that curve your college currently sits.\n\nSuggested research\n\nPeer benchmarking across many institutions' enrollment and budget data requires a broad multi-source investigation.\n\n(5–10 minutes)\n\nI've laid out the data above — the 33% enrollment collapse, the 189% growth in non-university competitors, the dollar translation, and the 2041 forecast."},{"id":"teacher-pipeline","title":"The teacher pipeline, 2010–2024","group":"College of Education case","blurb":"Teacher-prep enrollment fell by about a third.","date":"","file":"education-enrollment-analysis.html","words":819,"md":"Teacher Pipeline Report · 2010–2024\n\n# Who's still training to *teach*?\n\nWhile overall college enrollment grew for decades, the number of students entering education programs and teacher-preparation pathways went the other way — falling by roughly a third, bottoming out mid-decade, and only recently showing signs of life. Here's the shape of the teacher pipeline, and what's moving underneath it.\n\nStudents enrolled in U.S. teacher-preparation programs\n\nTHOUSANDS OF CANDIDATES\n\nTeacher-prep enrollment (traditional + alternative) Reporting-definition change (2018–19)\n\nSource: U.S. Dept. of Education, Title II Higher Education Act reporting system; Penn State CEEPA and NCTQ analyses of Title II data. Counts cover the 50 states + D.C.\n\n−33%\n\nFewer students enrolled in teacher-prep programs in the early 2020s than in 2010–11\n\n2015\n\nThe year enrollment \"hit bottom\" after a steep post-recession slide, then stabilized\n\n+8%\n\nRecovery in enrollment by AY 2020–21 versus the pre-pandemic 2018–19 low\n\nThe opposite of the overall trend\n\n## As colleges filled up, education programs emptied out.\n\nThis is the crucial contrast: total U.S. college enrollment peaked in 2010 at 21 million and stayed near 19–20 million for a decade. Teacher preparation did the reverse — it fell off a cliff right at that same 2010 peak and never fully climbed back. The pipeline for the teaching profession narrowed even as higher education overall held steady.\n\n2010–11~880K enrolled · the high-water mark\n\n### The peak — and the start of the slide\n\nTeacher-prep enrollment stood near 880,000 candidates nationally. From here it fell steadily for years, as recession-era pressures, pay concerns, and a dimming public image of the profession pushed students toward other fields.\n\n2012–13 → 2014–15≈ −100K · −15%\n\n### The steepest drop\n\nEnrollment fell by roughly 100,000 candidates in just two years, with 40 states declining. This was the sharpest stretch of the decline — the moment the teacher-shortage alarm bells started ringing nationally.\n\n2015 → 2018~590K · flat at the floor\n\n### Bottoming out\n\nEnrollment \"hit bottom\" around 2015 and held roughly flat near 590,000 — no longer collapsing, but nowhere near recovering. Traditional campus-based education programs bore the brunt; alternative routes started picking up share.\n\n2018–19further dip · definition shifts\n\n### A further dip — and a data caveat\n\nEnrollment dipped again to its lowest point in many states. Note: Title II changed how it defines an \"enrolled\" student beginning in 2018–19 (folding completers into the count), so figures before and after this line aren't perfectly comparable.\n\n2019–20 → 2023–24modest, uneven recovery\n\n### Signs of life\n\nEnrollment ticked back up — about 8% above the 2018–19 low by 2020–21, with the recovery led largely by alternative-route programs rather than traditional schools of education. The latest Title II collection reports 2023–24 data, and modest growth has continued in many states.\n\nUnderneath the pipeline number\n\n## The rebound isn't the same profession that declined.\n\nA stabilizing headcount hides real changes in *how* people become teachers and *who* they are. For anyone advising families or building education services, these shifts matter more than the aggregate.\n\nTraditional vs. alternative\n\n### Campus programs shrank; alternative routes surged\n\nTraditional program enrollment was about 31% lower in 2019–20 than in 2012–13, while alternative non-university routes grew dramatically — up roughly 177% over a comparable span.\n\nThe Texas effect\n\n### One state now bends the national curve\n\nAlternative programs expanded so fast in Texas that by 2019–20 about three-quarters of the state's teacher-prep students were in them — enough that national totals look very different with Texas removed.\n\nWho enrolls\n\n### A slowly diversifying candidate pool\n\nThe share of white enrollees fell from 75% in 2010–11 toward 65% later in the decade, as Hispanic, Asian, Black, and multiracial candidates made up a growing portion of the pipeline.\n\nCompletion, not just enrollment\n\n### Fewer finishers, too\n\nProgram completers fell from nearly 214K in 2010–11 to about 160K a decade later — a 25%+ drop — meaning the shortfall shows up in classrooms, not just applications.\n\nThe underlying series\n\n## Enrollment by academic year\n\n| Academic year | Enrollment | Note |\n|---------------|------------|------|\n\nU.S. teacher-preparation enrollment, traditional + alternative, 50 states + D.C. Figures are rounded; values from AY 2018–19 onward follow a revised Title II definition and are not strictly comparable to earlier years.\n\nWhy this matters for families\n\n## A narrower pipeline shapes the choices in front of every family.\n\nThe decade-long contraction in teacher preparation is the supply side of the teacher-shortage story — **fewer new teachers trained means larger classes, more turnover, and thinner specialist coverage**, especially in rural areas and in high-need subjects. That's precisely the environment that pushes families to look harder at their options.\n\nFor a platform like Wayfinder, it's also a supply signal on the **navigator side**: the same credentialed educators whose numbers are recovering slowly are the people qualified to guide families. A thin, slowly-rebuilding teacher pipeline means recruiting credentialed talent is a real constraint — and worth planning around from day one."},{"id":"college-enrollment","title":"Thirty years of U.S. college enrollment","group":"College of Education case","blurb":"The overall trend teacher prep diverged from.","date":"","file":"enrollment-analysis.html","words":701,"md":"Enrollment Report · 1994–2024\n\n# Thirty years of American college enrollment, in *one long arc*.\n\nTotal enrollment climbed for two decades, peaked in 2010, and has been reshaping itself ever since. Here's the shape of the trend — and the shifts underneath the headline number that matter most for families weighing their options today.\n\nTotal fall enrollment, all degree-granting institutions\n\nMILLIONS OF STUDENTS\n\nTotal enrollment All-time peak (fall 2010)\n\nSource: NCES Digest of Education Statistics, Table 303.25 (1994–2020); National Student Clearinghouse & NCES projections (2021–2024). Figures are all-level, public + private, degree-granting institutions.\n\n+47%\n\nGrowth from the 1994 low to the 2010 peak — roughly 14.3M to 21.0M students\n\n−6.7%\n\nDecline from the 2010 peak to 2024, even as the applicant pool held up\n\n+5.5%\n\nFirst-year enrollment rebound in fall 2024 — the clearest post-pandemic recovery signal\n\nThe arc in five-year blocks\n\n## One big hump: a slow start, an explosive climb, then a long reshaping.\n\nBroken into five-year stretches, the same national number tells six very different stories — each driven by demographics, the economy, or a shock no one planned for.\n\n1994–199914.3M → 14.9M · +4%\n\n### The demographic lull\n\nEnrollment barely moved, hovering around 14.3–14.9M. This was the quiet before the \"echo boom\" of baby-boomer children reached college age.\n\n1999–200414.9M → 17.3M · +16%\n\n### The echo boom arrives\n\nThe children of baby boomers hit campus in force, driving enrollment up more than 16% in five years — the start of the steepest sustained climb in modern record.\n\n2004–200917.3M → 20.3M · +18%\n\n### The recession surge\n\nThe largest run-up in the series. When the 2008 downturn erased jobs, people enrolled instead — and for-profit colleges roughly doubled, from about 1.0M students in 2005 to over 2.0M by 2010.\n\n2009–201420.3M → 20.2M · peak & turn\n\n### Peak and reversal\n\nEnrollment topped out at 21,019,438 in fall 2010 — the all-time high — then began falling as the economy recovered and workers returned to jobs. For-profits led the collapse.\n\n2014–201920.2M → 19.6M · −2.9%\n\n### The steady erosion\n\nA slow, consistent decline on the surface. Underneath: four-year enrollment kept rising while community colleges fell sharply, and for-profits kept shrinking.\n\n2019–202419.6M → ~19.6M · shock & rebound\n\n### The COVID shock and recovery\n\nEnrollment fell hard early — undergraduate numbers were 15% below 2010 by fall 2021, with 42% of that drop landing during the pandemic. The floor came around 2021–2022, and a rebound has been building since.\n\nUnderneath the headline number\n\n## The national total hid four shifts that changed who goes to college.\n\nA flat or falling top-line number can disguise a great deal of movement. These four compositional shifts matter more for a family's real choices than the aggregate ever did.\n\nTwo-year vs. four-year\n\n### Community colleges took the hardest hit\n\nPublic two-year enrollment fell from a 2010 peak near 7.2M to 4.7M by fall 2020 — the single biggest driver of the overall national decline.\n\nUndergrad vs. graduate\n\n### Graduate school quietly kept growing\n\nPostbaccalaureate enrollment rose from 2.9M in 2010 to 3.2M by 2021 — climbing straight through the undergraduate decline rather than following it down.\n\nGender divergence\n\n### The gap between men and women widened\n\nBetween 2010 and 2021, male undergraduate enrollment fell 17% and female enrollment fell 13% — pushing women to 58% of all undergraduates.\n\nThe for-profit bubble\n\n### A sector that doubled, then deflated\n\nFor-profit enrollment surged past 2.0M around 2010 amid the recession, then fell by more than half over the decade that followed as scrutiny and the recovery reshaped it.\n\nWhat comes next\n\n## A modest recovery, running straight into the enrollment cliff.\n\nNCES projects undergraduate enrollment will grow about **9% between 2021 and 2031**, and the fall 2024 first-year rebound of 5.5% is an early sign that projection is holding. Fall 2025 undergraduate enrollment is expected to tick up to roughly 19.6M.\n\nBut that recovery meets a demographic headwind: the **\"enrollment cliff\"** — a coming drop in the college-age population traceable to the decline in U.S. births after 2008. The next decade is a contest between a rebounding participation rate and a shrinking pool of 18-year-olds, and the balance will vary sharply by region and by sector."},{"id":"fl-gaps","title":"Where the gaps are in Florida","group":"Adjacent questions","blurb":"Research and tool opportunities.","date":"","file":"Education_gaps_and_school_choice_in_Florida.docx","words":547,"md":"Within all the areas of education, where are the gaps, and where could I build research and digital tools to help, especially in the state of Florida and related to school choice\n\nThe field's imbalance is your opening. Nearly all school-choice research measures the demand side — what families choose, whether test scores move. The supply side is close to empty: who is *allowed* to operate, who is *trained* to staff it, and what it *costs*. That's already WMFC's lens. Almost everything below is an extension of it rather than a new bet.\n\n**Research gaps, Florida-first**\n\n- **Provider deserts.** Nobody has mapped EMA-approved provider density by county against student counts. FES-UA is the richest per-pupil category (140K students, ~$10K each) and therapy capacity outside the three metros is thin — but no one has published the number. This is a countable dataset and a natural third data product beside the Index and the Atlas.\n\n- **Who staffs the sector.** Florida certification rules don't bind private schools or PEP tutors. NCTQ and AACTE measure district-bound preparation. The Readiness Index covers what universities offer; nothing covers the actual workforce flow — how many people enter this sector each year and from where.\n\n- **Price.** Navigator, tutoring, and therapy rates are all provider-set and unpublished. There is no price index for ESA-eligible services anywhere in the country.\n\n- **Administrative burden as a measured variable.** The Auditor General found serious operational problems; reimbursement lag went from ~2 weeks to ~60 days. Nobody tracks denial rates, appeal outcomes, or lag longitudinally. FLDOE is subject to public records; SUFS is a private contractor — that boundary is itself a finding worth testing.\n\n- **Postsecondary as ESA vendors.** Dual enrollment, ESA-approved universities, workforce credentials purchased with portable funds. This sits directly in your seam and is the one gap only WMFC is positioned to own.\n\n**Tools that are also research artifacts**\n\nThe strongest ones are datasets with a front end — the tool is how people use it, the dataset is what you publish.\n\n- A **provider/desert map** (county × program × modality), rendered from JSON exactly like the Atlas.\n\n- A **versioned eligible-expense record** — rules change annually and no one keeps a dated, machine-readable copy. Version history alone answers \"what did they quietly tighten this year.\"\n\n- A **US states index** — the Atlas's domestic sibling, coded on supply and workforce rather than program generosity.\n\n- A **canonical facts file** the site, any brief, and Wayfinder all read from. Your own pre-build doc names keeping program facts current as an ongoing maintenance cost; solving it once makes everything downstream cheaper.\n\n**What I'd do first**\n\nProvider deserts. It's countable from public listings, it extends the Index's method rather than inventing one, no peer organization has it, and it produces a number you can set huge on a page. The postsecondary-vendor question is higher-value long-term but needs records requests that take months — start those now, in parallel, so they're returning while the desert map ships.\n\nOne caution: the site has open items already — the signup form still discards addresses, and most of the Atlas is uncoded. Adding a fourth data product before those close would spread thin. Depth is the defensible thing here; anyone can launch a directory, almost nobody maintains one."},{"id":"homeschool-return","title":"Do homeschooled students return to public school?","group":"Adjacent questions","blurb":"Nobody publishes a direct measure.","date":"","file":"Homeschool_to_public_school_transition_rates.docx","words":532,"md":"> **The question asked:** Is there any research or data to suggest at the national level in America at the state level in Florida or at the local level in Hillsborough County Florida that families that decide to homeschool their child that at some point within the academic year that they send their kid back to public school?\n\nShort answer: no one publishes a direct measure of mid-year homeschool-to-public-school return at any of the three levels. But the raw data exists at all three, and at the Hillsborough level it's obtainable.\n\n**National — closest available evidence**\n\nThe best work is Albert Cheng's homeschool persistence research using five nationally representative datasets. In the Understanding America Study, 36 percent of adults who were ever homeschooled did so for only one or two years, while 17 percent were homeschooled for all of primary and secondary school. Nearly one-third of adults who were homeschooled in eighth grade exited for ninth grade. The pattern suggests the choice to homeschool is under continuous re-evaluation rather than settled once. Angela Watson's Homeschool Research Lab at Johns Hopkins is the other serious node here. Both measure year-to-year transitions, not mid-year. NHES and the Household Pulse Survey are point-in-time snapshots and structurally cannot capture within-year re-entry. [The Thomas B. Fordham Institute](https://fordhaminstitute.org/ohio/commentary/findings-homeschool-persistence-can-help-researchers-going-forward)[The Thomas B. Fordham Institute](https://fordhaminstitute.org/ohio/commentary/findings-homeschool-persistence-can-help-researchers-going-forward)\n\n**Florida — the mechanism exists, the report doesn't**\n\nFLDOE home education enrollment rose 37 percent in five years, from 97,261 in 2018-19 to 152,871 in 2024-25, and Hillsborough County has the highest number of home-education students in the state. Two state systems already capture what you're asking about: [Spectrum News](https://mynews13.com/fl/orlando/news/2026/08/05/homeschool-enrollment-rises-across-central-florida)\n\n- **FTE Survey 2 (October) vs. Survey 3 (****February)** — a student appearing in Survey 3 district membership who wasn't in Survey 2 and has a prior home-ed record is exactly a mid-year returner. FLDOE can run this; it isn't in the standard publications.\n\n- **The scholarship attestation trail.** Step Up requires a Public School Attestation, and funds for students whose attestation is not submitted are returned to the funding source. Because funding is quarterly (Aug/Nov/Feb/Apr), SUFS and FLDOE necessarily hold quarter-by-quarter counts of students who dropped off because they enrolled full-time in public school. Not published disaggregated — but it's the single best proxy in the country for ESA-to-district mid-year churn. [Step Up For Students](https://www.stepupforstudents.org/)\n\n**Hillsborough — ****actually obtainable**\n\nHCPS requires a **Letter of Termination** including the child's legal name and **date of termination**, after which the parent must re-enroll the child in a public or private school if they are of compulsory school age. That is a dated administrative record sitting in the district's Home Education Office. A public records request for termination counts by month and school year, cross-referenced against district re-enrollment dates, would give you a clean mid-year return rate — probably the first one published for any large Florida district. [Hillsborough County Public Schools](https://www.hillsboroughschools.org/Page/4995)\n\nOne caution for WMFC framing: churn cuts both directions. Some mid-year returns are failures of the homeschool attempt; others are families using portability as designed. Cheng's data suggests fluidity is the normal state, not a defect signal. Whichever way the Hillsborough number lands, you'll want to pair it with mid-year *departure* counts so it isn't read one-sidedly."},{"id":"community-engagement","title":"How universities measure community engagement","group":"Adjacent questions","blurb":"Carnegie and the anchor-institution frame.","date":"","file":"University_community_engagement_innovation.docx","words":1249,"md":"> **The question asked:** What universities are most innovative in terms of community engagement, how is that defined and tracked, and measured, and what does it help the universities and public do?\n\n**How it's defined.** The dominant definition comes from Carnegie: community engagement means collaboration between an institution and its surrounding communities for *mutual* benefit and reciprocal exchange of knowledge — not outreach, not charity, not volunteering. The related \"anchor institution\" framing treats a university as a permanently rooted economic actor whose hiring, purchasing, and real estate decisions shape local prosperity whether or not anyone plans it.\n\n**How it's tracked.** Four frameworks do most of the work:\n\n- **Carnegie Elective Classification for Community Engagement** — the sector standard. It's awarded through institutional self-study and has run in cycles since 2006; the 2026 cohort added 237 institutions to 40 classified in 2024, for 277 currently holding it — 157 public, 80 private, 81 minority-serving. [Buffalostate](https://cce.buffalostate.edu/carnegie-elective-classification-community-engagement-0) Administrative hosting moves to the University of San Diego for the 2029 and 2032 cycles. [Carnegie Classification](https://carnegieclassifications.acenet.edu/news/carnegie-2026-community-engagement-classifications/) Notably, it's explicitly not a ranking or award — it's evidence-based and peer-reviewed, and institutions must document how engagement is embedded in mission and academic programs. [CSUN Today](https://newsroom.csun.edu/2026/01/21/csun-earns-2026-carnegie-elective-classification-for-community-engagement/)\n\n- **APLU's Innovation ****&**** Economic Prosperity designation** — the economic-engagement counterpart. Institutions complete a rigorous self-assessment with on- and off-campus stakeholders to identify strengths and growth areas, with the explicit aim of helping them know, measure, and tell the story of their economic engagement impact. [APLU](https://www.aplu.org/our-work/5-archived-projects/economic-development-and-community-engagement/)\n\n- **Times Higher Education Impact Rankings**, which score institutions against the UN Sustainable Development Goals — the closest thing to a global league table for public benefit.\n\n- **The Democracy Collaborative's Anchor Dashboard**, which is the most serious attempt at *outcome* metrics — local hiring rates, procurement spend with local and minority-owned vendors, community investment dollars, health and housing indicators in adjacent neighborhoods.\n\n**Who's actually innovative.** The interesting cases are ones that moved money, not just programs. Brown committed $50 million over ten years to Rhode Island workforce development in 2026, including $3 million in anchor grants. [Modern Campus](https://moderncampus.com/blog/how-universities-are-measuring-student-engagement-in-2026.html) Cleveland's Evergreen Cooperatives model routed hospital and university purchasing into worker-owned local businesses. UCF's Center for Social and Civic Prosperity does co-created research and outreach aimed at measurable community well-being. [UND Today](https://blogs.und.edu/press-releases/2026/04/und-is-named-an-innovation-and-economic-prosperity-university/) Syracuse, IUPUI, and Cleveland State pioneered treating engagement as tracked institutional data rather than anecdote.\n\n**What it buys each side.** For universities: accreditation evidence (SACSCOC, HLC and peers increasingly want documented engagement data), a political defense of public funding, student recruitment and retention, and faculty-tenure legitimacy for applied work. For the public: local jobs and procurement dollars, free professional services, research that answers locally-asked questions, and a seat at the table over campus expansion.\n\n**The honest caveat** — and this matters for WMFC: nearly all of this is self-reported input measurement. Carnegie counts whether engagement is institutionalized, not whether the surrounding community got measurably better off. The Anchor Dashboard was built precisely because that gap exists, and it still isn't the norm. Any framework you build for portable-funding institutions should learn from that failure mode rather than repeat it.\n\nKeep going\n\n**The international picture — where the measurement is actually more advanced**\n\nThe U.S. frameworks are largely voluntary and self-certified. Several other systems tie engagement to money, which changes behavior far more sharply.\n\n- **UK — Research Excellence Framework.** This is the most consequential model in the world, because REF results drive block research funding to universities. In REF 2029 the old \"impact\" profile has been reframed as \"Engagement and Impact,\" signaling that engagement is recognized as part of how impact happens rather than an optional extra. [Ref](https://2029.ref.ac.uk/guidance/section-7-strategy-people-and-research-environment-guidance/) Engagement and Impact holds a 25% weighting, alongside 55% for Contribution to Knowledge and Understanding and 20% for the renamed Strategy, People and Research Environment element. [Jisc](https://www.jisc.ac.uk/future-research-assessment-programme/initial-decisions) One recent change is quietly important: the requirement that underpinning research meet a 2-star quality threshold has been removed, on the reasoning that excellent impact can come from research that doesn't clear that bar. That is a direct concession that academic prestige and public usefulness are not the same variable.\n\n- **The Netherlands' Strategy Evaluation Protocol** dropped numerical scoring altogether and asks units to define their own societal relevance goals, then be judged against them — a narrative model rather than a metric one.\n\n- **Australia** ran a national Engagement and Impact Assessment alongside its research-quality exercise, pairing engagement (are you working with end-users?) with impact (did anything change?). It's a useful conceptual split most U.S. frameworks blur.\n\n- **The Talloires Network** is the global civic-engagement association, with several hundred member institutions across dozens of countries; it's more a community of practice than an assessment regime.\n\n**The mechanics: what a serious measurement system actually collects**\n\nFour tiers, roughly in ascending order of difficulty and descending order of how often they're done:\n\n- **Inputs** — dollars budgeted, staff FTE, offices established, courses designated service-learning. Easy, and the most gamed.\n\n- **Outputs** — student contact hours, number of partnerships, people served, publications co-authored with community partners. This is where most institutions stop.\n\n- **Institutional embedding** — whether engaged scholarship counts toward tenure and promotion, whether there's a line in the strategic plan with a budget attached, whether partnerships survive a change of president. Carnegie probes this hardest, and it's the best available proxy for durability.\n\n- **Community outcomes** — did local employment, health, housing stability, or educational attainment measurably shift? Almost nobody does this well, because it requires baseline data, a comparison group, and a willingness to publish bad news.\n\nThe infrastructure layer matters too: platforms like GivePulse and Collaboratory exist specifically because universities couldn't otherwise inventory their own engagement activity across hundreds of departments. GivePulse hosts the application process for Carnegie's elective classifications. [Ufl](https://leadershipandservice.ufl.edu/carnegie-elective-classification/)\n\n**The critiques worth knowing**\n\n- **Self-report bias.** Institutions write their own case; peer reviewers assess the writing, not the community.\n\n- **Community voice is structurally absent.** Nearly all frameworks survey the university. Very few require partner-side evaluation of the partnership, and almost none let partners score it.\n\n- **Reciprocity is asserted, rarely demonstrated.** The word appears in every definition; the metrics rarely test it.\n\n- **Rankings distortion.** Where engagement becomes rankable, it gets optimized — REF has spawned an entire consulting industry around writing impact case studies.\n\n- **The anchor paradox.** A university can win engagement recognition while simultaneously driving displacement through campus expansion and tax exemption. The two are measured by different offices.\n\n**What this means for WMFC**\n\nSeveral of these translate directly to a portable-funding readiness framework:\n\n- **Carnegie's elective, self-study, non-ranking posture** is the model to copy for an index that wants institutional participation rather than defensiveness. Framing it as diagnostic (\"here's where you're weak\") rather than competitive gets you cooperation and data.\n\n- **The UK's engagement/impact split** maps cleanly onto your Readiness Index: *is the institution structurally capable of receiving portable funds* (engagement/readiness) versus *did students and families actually get better outcomes* (impact). Keeping those as separate scored dimensions prevents the common failure where good process gets scored as good results.\n\n- **The community-voice gap is your differentiation opportunity.** If the Readiness Index collects family-side evidence rather than only institution-side self-report, it does something the incumbent frameworks explicitly don't — and that's a defensible methodological claim, not just a marketing one.\n\n- **The Anchor Dashboard's indicator design** is worth reading closely before you finalize your own indicator set; it's the most rigorous attempt to convert institutional behavior into community-level metrics, and its published limitations will save you a year of rediscovery."},{"id":"etymology","title":"Where “school,” “learning” and “education” come from","group":"Adjacent questions","blurb":"School began as leisure.","date":"","file":"Etymology_of_education_and_learning.docx","words":206,"md":"> **The question asked:** Where does the words \"school\" \"learning\" \"education\" come from?\n\nAll three come from surprisingly different places:\n\n**School** — via Latin *schola* from Greek *skholē*, which originally meant **leisure** or free time. The logic: leisure was what you spent on philosophical discussion, so the word slid from \"free time\" → \"lecture/discussion\" → \"the place where lectures happen.\" Its deeper root means \"to hold back, stop\" — time held back from work.\n\n**Learning** — the native English word, from Old English *leornian*. The Germanic root probably meant **\"to follow a track\"** (related to Gothic *laists*, \"footprint,\" and to English *last*, the shoemaker's foot-form). Knowledge as something you trail after. *Lore* and German *lernen/lehren* are cousins.\n\n**Education** — from Latin *educare*, \"to rear, bring up, train,\" first used in English in the 1530s for child-rearing generally, then narrowing to formal schooling by about 1610. You'll often hear it means \"to draw out\" (*e-* \"out\" + *ducere* \"to lead\") — that's *educere*, a closely related but distinct verb. The two share a root, so the claim isn't nonsense, but \"education\" descends from the rearing sense, not the drawing-out one.\n\nNice contrast in there: *school* comes from idleness, *learning* from tracking prey, *education* from raising a child."},{"id":"coding-protocol","title":"The coding protocol","group":"Method","blurb":"How to code one institution, step by step.","date":"2026-07","file":"WMFC-Coding-Protocol.docx","words":1745,"md":"The Coding Protocol · WMFC Readiness Index · v1.0\n\n**WHEN MONEY FOLLOWS THE CHILD**\n\n**The Coding Protocol**\n\n*How to code one institution for the Readiness Index — a repeatable, defensible procedure*\n\nInternal working document · v1.0 · July 2026\n\nCompanion to scan-2026.json and the Method & Corrections page\n\n# **Contents**\n\n# **What this document is for**\n\nThis is the operating manual for coding an institution. The method page states the principles; this states the procedure — the exact steps a coder follows so that two different people coding the same institution reach the same result, and so that any row can be defended when someone challenges it.\n\nConsistency is the whole point. An index that codes the same evidence differently on different days is worth nothing, no matter how neutral its intentions. Follow the steps in order, record what the fields ask for, and when a call is genuinely ambiguous, use the tie-breakers in Section 4 and mark it boundary_call. Everything here maps directly to a field in scan-2026.json.\n\n| **The one rule that overrides all others** Code only what the institution's own published materials say. Never infer, never fill in what you assume must be true, never code from reputation or from a program you remember existing. If you cannot point to the specific text, it did not happen. 'Nothing found' is always an acceptable answer; a guess never is. |\n| --- |\n\n# **1. Before you code: set the unit**\n\nThe single most common coding error is coding the wrong thing. The unit of analysis is the **education unit** — the college, school, or department of education that prepares educators — not the university as a whole.\n\n### **Fix the unit first**\n\n- Identify the specific college/school/department of education (e.g. “College of Education,” “Peabody College,” “Department of Teaching & Learning”). Record it in the unit field exactly as the institution names it.\n\n- If the institution has multiple relevant units (a College of Education *and* a separate education-policy institute), code the unit that prepares educators. Note the other in detail.\n\n- Assign a permanent id slug (lowercase, hyphenated, e.g. univ-florida). Once assigned it is never reused or renumbered — the display files and every future correction reference it.\n\n| **Why the unit matters** A university may run a charter school through its administration while its College of Education teaches an entirely district-oriented curriculum. Those are two different observations: the institution 'operates' (the operating flag), but the education unit may still code 'incidental.' Keeping the unit tight is what lets the Index separate these signals instead of blurring them. |\n| --- |\n\n# **2. Run the structured search**\n\nEvery coding rests on a documented search of the unit’s own materials. The search is “structured” because it uses the same terms every time — this is what makes “nothing found” a defensible finding rather than a shrug.\n\n### **2.1 Where to look, in order**\n\n- The unit’s program and degree listings (the authoritative source).\n\n- The graduate/undergraduate catalog course descriptions.\n\n- Any named centers, institutes, or departments within the unit.\n\n- The institution’s charter-authorizing office, if one exists (for the operating flag).\n\n### **2.2 The search terms**\n\nSearch each of these against the unit’s site and catalog. They are stored in coding_scheme.search_terms so they never drift between coders:\n\nmicroschool · learning pod · homeschool support · ESA / education savings account · school choice · education entrepreneurship · private school leadership · classical education · charter school leadership · non-traditional settings · hybrid school\n\n### **2.3 Record as you go**\n\nFor every term that returns a hit, copy the specific sentence and its URL. You will need the strongest single piece of text for the evidence field and the location for source. If nothing hits, that itself is the finding — proceed to code none, and record which terms you searched in source.\n\n# **3. Assign exactly one coding**\n\nWork *down* the ladder from the strongest category. Assign the first one the evidence genuinely supports. When in doubt between two, the lower (weaker) code is the safer default — over-coding engagement is the failure mode that costs credibility.\n\n| **Code** | **Assign it when…** | **Do NOT assign it when…** |\n| --- | --- | --- |\n| Built for sector | The unit states a PURPOSE to prepare educators for, or operate within, non-district settings — a named pathway, credential, department, or explicit program mission. | A single elective or one sentence mentions the sector. That is 'names,' not 'built for.' |\n| Names sector | The materials NAME private/classical/charter/microschool/non-traditional settings inside a broader program. | The naming is only in a mission statement or marketing with no curricular substance behind it — consider 'incidental.' |\n| Incidental | No sector-naming text exists; graduates simply happen to enter these settings via general certification. | You found sector-naming text (use 'names') OR found nothing at all (use 'none'). |\n| Nothing found | A full structured search returned no relevant offering. | You did not actually run the structured search. 'Nothing found' requires the search to have happened. |\n\n| **Nothing found is not nothing there** A 'none' code means your structured search returned no match — never that the offering does not exist. It is an honest report of the limit of your search, not a verdict on the institution. Every 'none' row stays verified=false unless and until someone reviews the unit's entire catalog, not just the search terms. |\n| --- |\n\n# **4. Set the operating flag and resolve ties**\n\n## **4.1 The operating / authorizing flag**\n\nIndependently of the coding, set operating to true only if the institution runs or authorizes a school in the sector — most commonly, it is a charter-school authorizer. If you have not checked authorizing status, set it to the string “unexamined” and add the partial_scan flag. When operating is true, add the authorizer flag.\n\n## **4.2 Tie-breakers for close calls**\n\n- **Built vs. names? **Ask: is there a dedicated pathway/credential/unit, or just mentions? Dedicated → built. Mentions, however enthusiastic → names. Mark boundary_call.\n\n- **Names vs. incidental? **Ask: does the text actually name a non-district setting, or are you inferring it? Named → names. Inferred → incidental.\n\n- **Incidental vs. nothing found? **Did your structured search run fully and return zero? Zero → none. Search incomplete → don’t code yet; finish the search.\n\n- **Any unresolved tie **defaults to the weaker code and gets a boundary_call flag with your reasoning in detail.\n\n# **5. Verification, provenance, and flags**\n\n### **Set verified honestly**\n\nSet verified: true only when you have reviewed the unit’s **full catalog**, not just run the search terms. A structured-search-only coding is verified: false. Two flags force false automatically — partial_scan and possible_retrenchment — and the validator will reject the row if you set them otherwise.\n\n### **Write the evidence and source**\n\nThe evidence field is one-to-two sentences of the actual text that drove the coding — this is the first thing a challenger reads. The source field must be precise enough for a stranger to re-find the page, and always includes the date read. The checked field is that date in ISO form.\n\n### **Apply flags from the controlled list only**\n\n| **Flag** | **Use when** | **Effect** |\n| --- | --- | --- |\n| possible_retrenchment | Evidence suggests an offering existed and was withdrawn. | Forces verified=false. NEVER citable until archives confirm. |\n| authorizer | The institution authorizes charter schools. | Pairs with operating=true. |\n| watch_case | Likely to change soon (e.g. new state ESA program). | Prioritized for next edition. |\n| boundary_call | The coding was a close call between two categories. | Detail must explain the decision. |\n| partial_scan | Only part of the unit was examined. | Forces verified=false. |\n\n# **6. A worked example, start to finish**\n\nCoding Central Michigan University, to show every step producing one JSON row.\n\n- **Set the unit. **The education unit is the College of Education. But CMU also has a prominent Center for Charter Schools — note it; it will matter for the operating flag.\n\n- **Run the search. **Search terms against the College of Education return references to charter settings, but no dedicated pathway. The Center for Charter Schools confirms CMU authorizes charters statewide.\n\n- **Assign the coding. **The education unit’s curriculum names charter settings without a dedicated offering → names.\n\n- **Set the operating flag. **CMU authorizes charter schools → operating: true, add the authorizer flag.\n\n- **Verify and record. **Full program list reviewed → verified: true. Write evidence, source, and date.\n\n**The resulting row:**\n\n{\n\n  \"id\": \"central-michigan\",\n\n  \"institution\": \"Central Michigan University\",\n\n  \"unit\": \"College of Education\",\n\n  \"control\": \"public\",  \"state\": \"MI\",\n\n  \"coding\": \"names\",  \"operating\": true,\n\n  \"verified\": true,  \"checked\": \"2026-07-09\",\n\n  \"evidence\": \"Authorizes charter schools statewide through a\n\n     prominent charter-authorizing office, distinct from the\n\n     education unit's curriculum.\",\n\n  \"detail\": \"Operating/authorizing move present; unit 'names'\n\n     rather than 'builds for' the sector.\",\n\n  \"source\": \"CMU Center for Charter Schools + College of\n\n     Education pages; read 2026-07-09.\",\n\n  \"flags\": [\"authorizer\"],  \"coder\": \"YOUR-INITIALS\"\n\n}\n\n# **7. After you code: validate and commit**\n\nNever edit the summary block by hand and never trust your own counts. After adding or changing any rows:\n\n- Run the validator: node build-summary.js scan-2026.json. It checks every field, enforces the method rules (a retrenchment can’t be verified, flags must be from the controlled list), and recomputes every rollup.\n\n- **If it fails, **it writes nothing and lists the errors. Fix them and re-run. A failing file never ships.\n\n- **If it passes, **the summary is regenerated and the display files (Index, report appendix, landing-page numbers) can all read the same source — no hand-copying, no drift.\n\n- **Heed the warnings. **A “nothing found marked verified” warning is the validator asking you to confirm you really reviewed the whole catalog. Don’t dismiss it reflexively.\n\n| **The discipline this enforces** The validator is the method made mechanical. It cannot be argued with, it treats every coder the same, and it makes the cheap mistakes — a typo'd state code, a retrenchment marked citable, a summary that drifted from the rows — impossible to ship. Run it every time. It is faster than checking by hand and it never gets tired. |\n| --- |\n\n*Every row you code the right way is a claim WMFC can stand behind when challenged. That is the entire asset. The polish is done; this is the part that makes the Index real.*"},{"id":"roadmap","title":"The complementary-fit roadmap","group":"Method","blurb":"Where WMFC fits alongside the field.","date":"2026-07","file":"WMFC-Complementary-Roadmap.docx","words":2088,"md":"When Money Follows the Child · Complementary-Fit Roadmap\n\n**WHEN MONEY FOLLOWS THE CHILD**\n\n**The Complementary-Fit Roadmap**\n\n*Where the field**'**s gaps are — and how WMFC fills them alongside EdChoice, ExcelinEd, CRPE, NCTQ and the National Microschooling Center, not against them*\n\nPrepared July 2026 · Strategy brief\n\nwhenmoneyfollowsthechild.org\n\n# **Contents**\n\n# **The organizing principle**\n\nThe school-choice research field is crowded on the **demand and policy** side and nearly empty on one specific **supply** question. Every major organization measures something real and does it well — but they all stop at the same edge. WMFC's opportunity is not to build a better version of what EdChoice or CRPE already do; it is to occupy the one seam none of them own and to make its data *plug into* theirs. This brief maps that seam precisely and lays out a roadmap to fill it as a complement, not a competitor.\n\n| **The seam, in one line** The field measures what families choose, which states adopt choice, and whether teacher-prep is good in general. Nobody systematically measures whether the institutions that produce educators are building anything for the choice sector specifically. That is WMFC's lane — and it makes everyone else's work more actionable rather than duplicating it. |\n| --- |\n\n# **1. What each organization already owns**\n\nTo find genuine white space, you first have to be honest about how much ground is already covered. Here is what each major player does — and, just as importantly, where each one stops.\n\n### **EdChoice**\n\nThe movement's data spine. Its *ABCs of School Choice* catalogs every program in the country; its *123s of School Choice* synthesizes 200+ empirical studies across eight outcomes (test scores, attainment, parent satisfaction, fiscal effects, integration, safety). It runs monthly parent and teacher polling with Morning Consult. Notably, McShane's *Surfing the Pipeline* — the workforce-preparedness work WMFC builds on — lives here, but as a one-off scan, not a tracked annual series.\n\n**Where it stops: **EdChoice measures the outcomes of choice, not the institutional supply of educators for it. The pipeline work is a side project, not a standing index.\n\n### **ExcelinEd**\n\nThe model-policy shop. Its *School Choice Matters* tool codes 40 choice-policy areas across all 50 states; it also runs a serious Human Capital workstream — reciprocal teacher licensure, apprenticeships, Advanced Teaching Roles, and even Educator Preparation Program (EPP) report cards and pipeline dashboards.\n\n**Where it stops: **ExcelinEd's teacher-pipeline work is framed around district/state shortages and model legislation. It asks how to fill vacancies and raise EPP quality for the traditional system; it does not ask whether prep programs serve non-district settings. Its choice work and its workforce work run in parallel lanes that rarely cross.\n\n### **Center on Reinventing Public Education (CRPE, at ASU)**\n\nThe closest neighbor — and therefore the boundary to draw most carefully. CRPE studies teacher-workforce innovation, microschool and learning-pod sustainability (its community-led-innovation work found many pods fragile), and staffing-model redesign through ASU's Next Education Workforce (team-based teaching). It maps innovations in teacher pipelines, including out-of-system operators.\n\n**Where it stops: **CRPE studies how the teaching role is redesigned (team staffing, working conditions, operator innovation) and whether pods survive. It does not code whether degree-granting education schools are building programs, courses, or credentials for the choice sector — the exact institutional-response question WMFC's method defines. CRPE looks at the job; WMFC looks at the pipeline that feeds it.\n\n### **NCTQ (National Council on Teacher Quality)**\n\nThe teacher-prep auditor. Its *Teacher Prep Review* rates 1,200+ programs against research-based standards — reading, math, clinical practice, classroom management — and its state yearbooks track prep-program accountability.\n\n**Where it stops: **NCTQ measures whether prep is good at preparing teachers for conventional classrooms. Its standards are silent on non-district settings. A program could score perfectly on NCTQ and still prepare zero teachers for a microschool, a classical academy, or a homeschool-support role.\n\n### **National Microschooling Center**\n\nThe sector's own hub. It publishes the annual Sector Analysis (enrollment, tuition, demographics), and — critically — runs a Training Institute that trains founders and facilitators directly.\n\n**Where it stops: **This is the improvised pipeline itself. The Center trains people because the institutions don't — which is evidence for WMFC's thesis, not competition with it. The Center serves operators; it does not measure the degree-granting system's response.\n\n# **2. The five gaps WMFC can own**\n\nReading across the landscape, five specific gaps emerge. Each is real, each is unowned, and — the test that matters — each makes the other organizations' work more useful rather than redundant.\n\n| **Gap** | **Why it****'****s open** | **Whose work it completes** |\n| --- | --- | --- |\n| 1. The institutional-response index | Everyone measures teacher-prep quality; nobody measures teacher-prep relevance to the choice sector, tracked over time. | Turns McShane's one-off EdChoice scan into a standing longitudinal series. |\n| 2. The 'operating vs. teaching' distinction | Catalog scans miss that universities engage the sector by running/authorizing schools, not listing courses. | Adds the behavior CRPE and NCTQ don't code to the institutional picture. |\n| 3. The permissibility layer | No one has established whether a choice-sector credential is even allowed under CAEP accreditation + state licensure. | Gives ExcelinEd's model-policy work an evidence base for EPP reform. |\n| 4. The international-lesson translation | No US choice org systematically reads mature foreign systems for the workforce lesson specifically. | Complements EdChoice's occasional Sweden report with a standing comparative lens. |\n| 5. The neutral shared-fact layer | Advocacy framing colors most workforce numbers; a source both sides cite is missing. | Gives every org — and their critics — a citable, provenance-first baseline. |\n\n### **Why these are complements, not competition**\n\nThe distinction is clean and defensible. Everyone else measures the **demand side** (what families and states do) or the **quality of the existing supply** (is teacher-prep good for conventional schools). WMFC measures the **relevance and responsiveness of the supply institutions to the new sector** — a variable that sits downstream of policy adoption and upstream of school quality, which is precisely why it has been nobody's job. Filling it doesn't take a single reader away from EdChoice or CRPE; it hands them a number they currently lack.\n\n# **3. The roadmap**\n\nThree horizons, sequenced so that each phase deepens the moat and each deliverable is designed to slot into a partner organization's existing product. Timeframes are indicative for a small research shop.\n\n## **Horizon 1 (0–6 months) — Own the seam, prove the method**\n\nGoal: convert the 2026 baseline from a single scan into a defensible, repeatable instrument, and close the most-cited internal limitations first.\n\n- **Complete the Florida state-college scan. **27 of 28 are unscanned, and that system runs the charter-authorizing pathway. This is the highest-value gap and the fastest credibility win.\n\n- **Finish Michigan****'****s authorizers. **Six more university charter-authorizers to test whether the Central Michigan pattern repeats — turning a two-institution anecdote into a finding.\n\n- **Lock the coding scheme publicly. **Publish the 'built-for / names / incidental / nothing-found' rubric and the 'operating vs. teaching' distinction as a citable method note, so the Index is inspectable from day one.\n\n- **Re-measure the 2023 four-state baseline inside the Index. **Fully attributed to Surfing the Pipeline — this is what makes WMFC longitudinal rather than a second snapshot.\n\n| **Complementary move** Offer EdChoice the re-measured pipeline series as an annual companion to the 123s — WMFC supplies the supply-side row their outcomes synthesis doesn't cover. Frame it as 'the 123s measures what choice does; the Readiness Index measures whether the workforce exists to do it.' |\n| --- |\n\n## **Horizon 2 (6–18 months) — Establish permissibility and go national**\n\nGoal: answer the question underneath the whole thesis — is a choice-sector credential even allowed? — and expand coverage to the states where the policy is hottest.\n\n- **Read CAEP standards and two state licensure codes. **Establish whether an education school could build a choice-sector credential without losing accreditation. This is the permissibility layer no one has mapped.\n\n- **Expand the Index to the universal-choice states. **Prioritize Arizona, Texas, Florida, Indiana, and the 2025–26 adopters — the states where the demand/supply mismatch is largest and most newsworthy.\n\n- **Publish state deep-dive briefs. **One per priority state, structured so a policymaker or funder can read their own service area — the format ExcelinEd's audience already expects.\n\n| **Complementary move** Hand ExcelinEd the permissibility findings as the evidence base for an EPP-reform model policy: 'here is what accreditation currently blocks, here is what a state could change.' WMFC supplies the diagnosis; ExcelinEd writes the prescription. Neither duplicates the other. |\n| --- |\n\n## **Horizon 3 (18–36 months) — Become the shared reference layer**\n\nGoal: institutionalize WMFC as the neutral source every side cites, and add the international lens that no US org maintains.\n\n- **Launch the comparative-systems brief. **A standing 'what the mature systems already learned' product — Netherlands, Sweden, Chile, England — read specifically for the workforce lesson. This is genuinely differentiated and hard to copy.\n\n- **Open the dataset. **Citable CSV/JSON with per-claim provenance, so researchers, journalists, and both advocacy sides pull from the same rows — the neutrality architecture becomes a distribution strategy.\n\n- **Stand up the institutional-brief line. **Bespoke WMFC Briefs for university leadership and funders (service area, peer set, program feasibility) — the revenue model that funds the free public Index.\n\n| **Complementary move** Position the open dataset as infrastructure CRPE, NCTQ, and EdChoice can all build on — WMFC becomes the workforce-response layer beneath the field's existing tools, the way a shared data standard sits beneath many applications. The goal is to be cited by everyone, competitive with no one. |\n| --- |\n\n# **4. Partnership posture and what to avoid**\n\n### **The three rules that keep WMFC complementary**\n\n- **Never re-catalog. **The moment WMFC lists programs or synthesizes outcome studies, it competes with the ABCs and 123s and loses. Stay strictly on the institutional-response variable.\n\n- **Cite partners generously and first. **Every Index edition should open by pointing to EdChoice for outcomes, ExcelinEd for policy, CRPE for staffing models — establishing WMFC as the piece that completes the set, not the piece that replaces one.\n\n- **Hold the neutral line hardest where it****'****s tempting to editorialize. **The shared-fact value evaporates the instant the Index reads as pro- or anti-choice. Coding engagement as behavior, not virtue, is the whole product.\n\n### **Risks to manage**\n\n| **Risk** | **Mitigation** |\n| --- | --- |\n| CRPE expands into institutional-response coding | Move first and publish the standing Index; make WMFC the obvious citation before the overlap forms. Offer to collaborate rather than parallel-build. |\n| Perceived as advocacy by association | Keep funding transparent; keep the both-sides-can-cite-it architecture literal and visible on every page. |\n| Thin coverage read as 'nothing there' | Always distinguish 'nothing found' from 'nothing there,' as the method already does — publish limits before conclusions. |\n| Partner orgs see it as competitive | Lead every outreach with the completes-your-work framing and a concrete plug-in (a row for the 123s, an evidence base for a model policy). |\n\n*Bottom line: the field is dense with organizations measuring demand, policy, and generic teacher-prep quality — and empty at the one point where those three meet. WMFC**'**s job is not to out-EdChoice EdChoice. It is to become the workforce-response layer every one of these organizations is currently missing, so that filling the gap makes the whole field more complete rather than more crowded.*\n\n# **Sources ****&**** notes**\n\n*Organizational scans conducted July 2026 from each group**'**s own published materials; figures shift and should be re-verified before external use.*\n\nEdChoice: ABCs of School Choice (2026 ed.), 123s of School Choice (2025 ed.), 2026 Annual Report, teacher polling with Morning Consult (April 2026), and M. Q. McShane, Surfing the Pipeline (Oct 2023).\n\nExcelinEd: School Choice Matters tool; 2026 Education Policy Playbook (Human Capital workstream); 2026 policy-trends briefs; Cracking the Code (educator-pipeline data); reciprocal-licensure and EPP model policies.\n\nCRPE (ASU Mary Lou Fulton College): Teacher Workforce Innovation and Next Education Workforce pages; Community-Led Innovation project; Strengthening the Teacher Workforce project description; research-reports index.\n\nNCTQ: Teacher Prep Review methodology and state Yearbook (Teacher Preparation Program Accountability); Decoding Progress in Reading Preparation (2026). AACTE responses for the counter-perspective on prep-quality measurement.\n\nNational Microschooling Center: organization overview, Sector Analysis, and Training Institute pages. New America / Digital Promise micro-credential reviews for the operator-side credentialing context.\n\nWMFC internal: 2026 Readiness Index baseline and Method & Corrections page (whenmoneyfollowsthechild.org/method)."},{"id":"v2-outline","title":"v2 platform outline","group":"Method","blurb":"The chronology spine and four record sets.","date":"2026-09-13","file":"claude_WMFC-v2-Platform-Outline.md","words":1765,"md":"# WMFC v2 — Platform Outline\n*whenmoneyfollowsthechild.org · 13 September 2026 · outline only, nothing built*\n\nA research workbench built on one spine — the chronology — with four record sets hanging off it. First job: make Dustin expert. Second: be useful to anyone else who finds it.\n\n## The five questions\n\n1. When funding becomes portable, how do school districts respond — and which of them actually innovate?\n2. How do postsecondary institutions respond: universities, state colleges, community colleges?\n3. Who are the leaders — the people and institutions doing the work, not narrating it?\n4. How did we get here, from the first compulsory schooling law to universal eligibility?\n5. What is anyone doing about it right now?\n\n## What changes from v1\n\n- **Spine** — the chronology is the trunk. Districts, institutions, programs and people attach as the present-day branch.\n- **Argument** — no claims ledger, no rebuttal page. Verified examples only; the record set is the argument.\n- **Atlas** — one coding method, two geographies. World map stays; a US map joins it, states coded on the same variables.\n- **Postsecondary** — one institution record, four lenses.\n\n**Carried forward:** Atlas world layer (175 country rows), scan-2026 institution coding, Field Notes 01–09, the three-variable Florida model, JSON-driven publishing.\n**Retired:** seven flat sections, Readiness Index as front door, bibliography/references page, nonpartisan-signaling constraints.\n\n*On the nonpartisan constraint:* dropping it changes the Field Notes and section framing, not the records. Verified-examples-only still holds — a claim without a dated primary source doesn't ship, whatever it supports.\n\n## §0 The Spine — five-track chronology, 1642 to now\n\nFive parallel lanes on one time axis; filter by track, era, jurisdiction; zoom century → year.\nEras: Common School (1642–1875) · Blaine & Consolidation (1875–1954) · Desegregation (1954–1990) · Vouchers & Charters (1990–2011) · Portability (2011–2026).\n\n- **Law & Courts** — Blaine Amendments (1875–), *Pierce* (1925), *Everson* (1947), *Brown* (1954), *Green* (1968), *Zelman* (2002), *Espinoza* (2020), *Carson v. Makin* (2022)\n- **Legislation & Programs** — Massachusetts 1642/1647, compulsory attend
