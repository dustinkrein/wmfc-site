ber 15 — who applied to operate out-of-boundary, and how many are district-run versus private-operator-behind-a-district."},{"id":"rn-03","title":"Research note 03 — the counter-mechanism","group":"Districts","blurb":"Florida starts paying districts for students they no longer have.","date":"2026-08-15","file":"research-note-03-counter-mechanism.md","words":1464,"md":"# Research Note 03 — The Counter-Mechanism, and a Correction\n\nFollow-on to Research Note 02. August 15, 2026.\n\n---\n\n## 1. Florida has started paying districts for students they no longer have\n\nThis is the most consequential thing I found today, and it cuts against the whole \"portability forces adaptation\" story.\n\nThe 2026 session created an enrollment-decline supplement. The FSBA's appropriations summary describes [recurring funds for school districts where there is a decline in the unweighted public FTE between 2024–25 and 2025–26](https://fsba.org/wp-content/uploads/2026/02/2026-2027-Proposed-Senate-and-House-Education-Appropriation-Summary-Highlights-2.18.pdf). SB 2514 as filed would [provide a supplement for districts with an enrollment decline, with fiscally constrained districts receiving a higher calculation](https://www.flsenate.gov/Session/Bill/2026/2514). The FEA's post-session statement confirms something along these lines passed, describing a [Public School Enrollment Stabilization Fund offering limited help with enrollment declines, with the state's liability capped and trigger conditions that make district budgets unpredictable](https://feaweb.org/release/florida-budget-again-shortchanges-public-school-students-puts-politics-over-people/).\n\n**Why this matters more than it looks.** Every mechanism I proposed in Note 02 for why Florida districts became vendors — loss magnitude above all — runs through the assumption that district revenue tracks enrollment. A stabilization supplement partially severs that link. If districts are held harmless for a share of the loss, the competitive signal that produced the à la carte response is being damped at exactly the moment the response is scaling.\n\nThat sets up a genuine prediction: **if the loss-magnitude mechanism is the real driver, à la carte adoption growth should flatten in 2026–27** now that 75% of districts are in and the marginal loss is partially cushioned. If it keeps climbing, the driver was something else — probably intermediation or peer norms.\n\n**A naming discrepancy worth resolving before citing any of this.** The FSBA summary notes the House implementing bill [changed the \"Educational Enrollment Stabilization program\" to the \"Family Empowerment Scholarship Stabilization program,\" a change not in the Senate's implementing bill](https://fsba.org/wp-content/uploads/2026/02/2026-2027-Proposed-Senate-and-House-Education-Appropriation-Summary-Highlights-2.18.pdf). The FEA calls the enacted thing a \"Public School Enrollment Stabilization Fund.\" Those are three different names for what may be one or two funds, and one of them points at districts while another points at the scholarship program. **Someone needs to read the enrolled GAA and implementing bill.** This is exactly the kind of drafting detail that determines who actually bears the cost of portability.\n\n## 2. The structural fight nobody outside Florida noticed: siloing FES out of the FEFP\n\nSB 318 as filed would have created [a new categorical fund for the Family Empowerment Scholarship Program under s. 1011.687, with the amount set by the GAA — siloing FES-UA off from the FEFP](https://www.flhef.org/post/senate-bill-318-educational-scholarship-programs). The House response, per the same analysis: they saw it as [\"a kiss of death for the Choice Programs as a whole\"](https://www.flhef.org/post/senate-bill-318-educational-scholarship-programs) and would not support it.\n\nThat exchange is the entire \"when money follows the child\" question compressed into one procedural fight. Keeping scholarships inside the FEFP means the money is definitionally the child's share of the education formula. Moving them to a categorical line means they become an appropriation the legislature sets each year, subject to caps — which is what the Auditor General recommended for accountability reasons and what choice advocates read as an existential threat. Both sides understand that **the accounting location determines whether portability is a right or a program.**\n\nThe FEA separately notes the Legislature [declined the Auditor General's recommendation to separate voucher and public school funding](https://feaweb.org/release/florida-budget-again-shortchanges-public-school-students-puts-politics-over-people/), so the silo did not happen this year. It will be back.\n\n## 3. The Tebow-law comparison — strongest evidence yet for the invisible-cost hypothesis\n\nNote 02 proposed that districts adapt where the marginal cost of serving a non-enrolled child is invisible and refuse where it is visible. Florida supplies a within-state controlled comparison across thirty years.\n\n**Visible-cost channel:** extracurricular access. Florida [passed the original law requiring public schools to allow homeschooled students into extracurriculars without enrolling full-time in 1996](https://liveordiehere.com/blog/homeschooling-laws-by-state-a-full-guide); it took a statutory mandate, and [more than 30 states have since passed similar access laws](https://liveordiehere.com/blog/homeschooling-laws-by-state-a-full-guide) — meaning roughly 20 still haven't, and in the ones that have, it was compelled rather than adopted.\n\n**Invisible-cost channel:** à la carte course and service sales. Voluntary, unmandated, and 75% of Florida districts in about twelve months.\n\nSame students. Same districts. Same state. The difference is whether the district has to give up a roster spot or sell a marginal seat. Texas's UIL numbers — 4% opt-in under the old regime, and Dallas, Fort Worth, Arlington, and Katy opting out even with $1,500 per activity on offer — are the same finding in a second state.\n\nI'd now state the hypothesis with more confidence, and with a name: **districts sell surplus, they don't share scarcity.**\n\n## 4. A correction: Texas Channel B is a confounded test\n\nI proposed in Note 02 that Texas fee-for-service uptake would test the hypothesis. On closer reading, it partly won't, because the demand side is crippled.\n\nTexas homeschool families receive [$2,000 annually, with technology capped at 10% of the award](https://numaschool.com/states/texas/homeschool-funding) — against roughly $10,474 for private school students. Florida, by contrast, funds à la carte families at parity. Step Up's own panel made the point explicitly: [students receive equal scholarship funding regardless of whether they use it for traditional private school or à la carte programs](https://nextstepsblog.org/2026/07/panel-shares-florida-a-la-carte-learning-story-with-lawmakers-from-across-america/), and the founders of one Florida provider were asked to replicate in Alabama but couldn't, because [scholarship amounts for homeschool families there were significantly lower than for private school families](https://nextstepsblog.org/2026/07/panel-shares-florida-a-la-carte-learning-story-with-lawmakers-from-across-america/).\n\n$2,000 minus curriculum, testing, and materials does not buy many district course seats. So if Texas district uptake stays near zero, I will not be able to distinguish \"districts refused\" from \"no one could afford to buy.\"\n\n**The design principle this exposes is worth stating on its own, because it's the most portable finding in three days of research:** the à la carte market only exists where scholarship amounts are setting-neutral. Tiered ESAs that pay homeschoolers a fraction of the private-school rate do not just disadvantage homeschoolers — they foreclose the district-vendor channel entirely, and with it the main mechanism by which incumbents have found a stake in portable funding. Alabama and Texas built tiers. Florida didn't. That single design choice may explain more of the variance than anything about district culture.\n\n**Cleaner tests to substitute:**\n- Texas *disability* accounts at up to $30,000, where districts already hold the IEP and the related-services capacity. If any Texas district sells therapy or assessment services into TEFA, it will be here. This is also where Florida's channel is quietly interesting — Step Up lists therapy and assessments among contracted services.\n- Florida's own charter à la carte participation versus district participation. Charters face the same statutory opening with a different cost structure.\n\n## 5. Arizona confirmed as a clean control\n\nArizona's ESA runs on ClassWallet, and the vendor-registration guidance enumerates who can register: [microschools, tutors, therapists, curriculum and resource sellers, and private schools](https://getesapaid.com/arizona/become-an-esa-vendor). Districts are absent from the category list, consistent with the statutory bar that [ESA students cannot in almost all situations be enrolled in a public school, including district, charter, and public online programs](https://www.azed.gov/esa/esa-support). Enrollment is [roughly 92,000 as of September 2025](https://getesapaid.com/arizona/become-an-esa-vendor), rising to [100,000+ by January 2026](https://www.12news.com/article/news/education/arizona-empowerment-scholarship-program-hits-milestone/75-8de790a6-5e16-43cc-aaa5-f4867acea017).\n\nSo the three-state picture is now: **Florida** (parity funding + district channel + active intermediary) = 75% adoption. **Texas** (tiered funding + district channel + no intermediary) = zero observed. **Arizona** (parity-ish funding + no district channel) = structurally impossible. The variance is explained by policy design at every step, not by district disposition.\n\n## 6. Minor find: Florida legislated hybrid attendance in 2024\n\nWorth logging because it's the statutory basis for a lot of what follows. The 2024 legislation [authorizes a PEP student to also enroll in a private school if the student attends classes in person at least two days a week, with the remaining days following the PEP learning plan](https://www.flsenate.gov/Committees/DownloadBillSummary/2992). Florida wrote part-time private attendance into statute two years before the district channel scaled. The unbundling of *attendance* preceded the unbundling of *provision*.\n\n---\n\n## Where I'd go next\n\n1. **Read the enrolled 2026 GAA and implementing bill** for the stabilization fund — its actual name, trigger, cap, and formula. This determines whether Florida has begun insulating districts from portability, which would be the single most important development in the state since HB 1 and is currently described three different ways in three sources.\n2. **Texas TEFA disability accounts.** Up to $30,000, districts hold the IEPs, and TEA already built the APEX-ESA pipeline to move those IEPs. If a district-vendor channel opens in Texas, it opens here first.\n3. **The parity/tier variable across all 18-plus universal-choice states.** Which pay setting-neutral amounts and which tier homeschoolers down? Cross that against whether any district-vendor channel has emerged. This is a tractable 50-state table and, if the pattern holds, it's the finding: *funding parity, not district willingness, determines whether incumbents can participate in portable funding.*"},{"id":"rn-04","title":"Research note 04 — why only Florida","group":"Districts","blurb":"The three-variable model.","date":"2026-08-15","file":"research-note-04-why-only-florida.md","words":1329,"md":"# Research Note 04 — Why Only Florida\n\nThe three-variable model, and the West Virginia case that isolates the missing one.\n\nAugust 15, 2026.\n\n---\n\n## The question this round answers\n\nNote 03 proposed that funding parity — paying homeschool and private-school students the same — is what makes a district-vendor channel possible. That's right but incomplete. **West Virginia has parity, has an explicit statutory district channel, and has no observable district participation.** Which means parity isn't the binding constraint either.\n\n## West Virginia: everything Florida has, except one thing\n\n**Parity, unusually pure.** The Hope Scholarship pays [100% of West Virginia's statewide average per-pupil funding — every student receives the same base amount, with no grade-level weights or regional variations](https://www.learner.com/blog/west-virginia-hope-scholarship-complete-guide). Roughly $5,267 in 2025–26, [$5,435.62 for 2026–27](https://miacademy.co/homeschool-curriculum/state-funding-for-miacademy/the-west-virginia-hope-scholarship/). No homeschool tier. No private-school premium.\n\n**An explicit statutory district channel — including the visible-cost item.** Qualifying expenses include [individual classes and extracurricular activities provided by a public school district](https://wvcea.info/west-virginia-hope-scholarship/), alongside private tuition, tutoring, assessments, credential courses, and therapies. West Virginia went further than Florida or Texas: it wrote *extracurriculars* into the purchasable list, meaning a district could in principle sell the exact good that Texas districts refuse to give away for $1,500.\n\n**Zero entry cost.** [There is no cost to participate as a provider](https://www.wvfue.org/blog/hope-scholarship-participating-schools-providers-and-suppliers) — review the handbook, create an EMA account, add your services.\n\n**Real and growing demand.** ~19,000 students in 2025–26, with [universal eligibility arriving in 2026–27](https://www.learner.com/blog/west-virginia-hope-scholarship-complete-guide) and [more than 20,000 applying in the first six weeks of the 2026–27 window](https://everyhomeschool.com/guides/esa-by-state-2026).\n\n**And the rhetoric is already there.** WV Board of Education President Paul Hardesty is the man who said public schools are [\"competing for enrollment, whether we want to believe it or not\"](https://www.educationnext.org/parental-choice-is-sending-public-schools-a-message-are-they-listening/) and must become more accommodating. West Virginia's system leadership has *said* the thing Florida superintendents say.\n\n**Now the finding.** Searching the Hope provider ecosystem surfaces private and out-of-state operators — [Outschool, approved by the Treasurer's Office](https://www.yahoo.com/news/articles/california-online-learning-company-receive-100022394.html), Huntington Learning Center, Miacademy, Williamsburg Academy, and West Virginia Academy (a charter). **I found no county school district selling classes into Hope.** That's an absence-of-evidence finding rather than a proven zero, and it should be verified directly against the Hope provider directory before publication. But the contrast with Florida — where district participation is the headline story its own SFO promotes — is stark enough that I'd be surprised by a large hidden number.\n\n## The variable West Virginia is missing\n\nFlorida has a scholarship funding organization running **business development into districts.** Step Up publishes a district-specific onboarding one-pager, maintains a [Community of Practice for institutional providers](https://www.stepupforstudents.org/contracted-public-schools/), pitches districts on reaching families [\"in your local community and beyond,\"](https://www.stepupforstudents.org/contracted-public-schools/) and — the detail I keep coming back to — **arms families with a sample email to send to districts that haven't joined yet**, telling them to [contact that district or charter school and express your interest](https://www.stepupforstudents.org/contracted-public-schools/).\n\nThat is a demand-generation campaign aimed at converting a reluctant institutional seller. West Virginia's Treasurer's Office approves vendors who apply. Texas has a CEAO administering accounts. Neither is *selling districts on selling.*\n\nSo the model is three variables, all necessary:\n\n| | Setting-neutral funding | Statutory district channel | Intermediary recruiting districts | Observed district participation |\n|---|---|---|---|---|\n| **Florida** | Yes | Yes | **Yes** | ~75% of 67 districts |\n| **West Virginia** | Yes (purest) | Yes, incl. extracurriculars | No | None found |\n| **Texas** | No (5:1 tier) | Yes (§29.358(b)(3)) | No | None found |\n| **Arizona** | Yes | No (statutory bar) | n/a | Structurally impossible |\n| **Colorado** | n/a (direct part-time FTE, not ESA) | Yes | Not needed — districts bill the state directly | $100M+, 18,695 students |\n\nColorado is the informative outlier at the bottom: no ESA and no intermediary, but districts participate heavily because **they bill the state directly rather than selling to families.** That suggests the intermediary's real function is not persuasion but *transaction design* — converting a retail sales problem (find parents, price a service, invoice, collect) into something that resembles the categorical-funding process districts already know how to run.\n\nIf that's right, the intermediary variable and the invisible-cost variable are the same variable seen from two sides: **districts participate when someone else absorbs the market-facing work.**\n\n## The demand-side floor, now with a full ladder\n\nNote 03 flagged Texas's 5:1 tier. Extending across states, there are four regimes, not two, and only the first can support a district channel at all:\n\n1. **Parity.** Florida (equal funding regardless of setting), West Virginia (flat statewide average), Arizona (~90% of state per-pupil).\n2. **Tiered.** Texas: [$2,000 homeschool vs. $10,474 private, with technology capped at 10% of the award](https://numaschool.com/states/texas/homeschool-funding) — described by one tracker as [a 5-to-1 gap making Texas simultaneously the largest ESA launch in history and one of the weakest for homeschoolers](https://everyhomeschool.com/guides/esa-by-state-2026).\n3. **Excluded.** Programs where homeschoolers cannot participate at all. Per one 50-state tracker: [Iowa's ESA requires full-time enrollment in an accredited nonpublic school with 75% attendance, making homeschoolers flatly ineligible; South Carolina's ESTF participants cannot homeschool under Options 1, 2, or 3; Ohio's EdChoice is private school tuition only; and North Carolina's Opportunity Scholarship pays tuition directly to registered private schools](https://numaschool.com/learn/guides/funding-esa/homeschool-grants). **These are secondary-source claims about statutory eligibility and each needs verification against the program's own rules before citing.**\n4. **Status-forfeiting.** Programs where accepting money means giving up legal homeschool status — [Louisiana's LA GATOR requires withdrawing from BESE-approved or non-public homeschool registration](https://everyhomeschool.com/guides/state-laws-2026), and Colorado's SB 26-023 now [requires a Notice of Intent and bars umbrella-school enrollment for anyone in a publicly funded enrichment program](https://www.theumbrellaschool.com/post/sb26-023-homeschool-enrichment-funding).\n\nRegimes 3 and 4 are where the argument gets genuinely uncomfortable for both camps. If homeschoolers are excluded from the ESA, there is no part-time market, no district-vendor channel, and no mechanism by which the incumbent system acquires a financial stake in portable funding. **Programs designed as private-school tuition vouchers wearing ESA clothing foreclose the very outcome that would reconcile districts to portability.** Iowa, Ohio, South Carolina, and North Carolina have all built systems where the district can only lose.\n\n## What I'd now argue\n\nAcross four notes, the district-response literature's framing — are districts adapting or resisting? — is mostly the wrong question. District behavior in this domain is close to fully determined by three policy design choices made by legislatures:\n\n1. **Does the money pay the same regardless of setting?** If no, no market exists to sell into.\n2. **May a district sell to a child it does not enroll?** If no, participation is illegal.\n3. **Does someone convert the retail transaction into an administrative one?** If no, districts don't do it — even when it's legal, funded at parity, free to join, and their own board president has publicly said they must compete.\n\nFlorida is not the state whose districts are most entrepreneurial. It's the state that happens to have all three, and the third one exists because a scholarship funding organization with 20 years of infrastructure decided to build it.\n\n**That is the falsifiable version of the thesis and it makes a prediction anyone can check:** if West Virginia's Treasurer's Office (or a Love Your School-type navigator) starts doing district business development, WV county participation should climb toward Florida's rate within about eighteen months, without any change in funding or statute.\n\n---\n\n## Next\n\n1. **Verify the West Virginia zero** against the official Hope provider directory at hopescholarshipwv.gov. If even three or four counties are selling, the intermediary hypothesis weakens considerably and I'd want to know what those counties have in common.\n2. **Verify the exclusion list** — Iowa, South Carolina, Ohio, North Carolina — against primary program rules. Everything in regime 3 above currently rests on one secondary tracker.\n3. **Interview target, if you ever do primary collection:** whoever at Step Up designed the Contracted Public Schools channel. The sample-email-to-pressure-your-district tactic is the kind of thing that doesn't appear in any policy paper and probably explains more of the Florida adoption curve than the statute does."},{"id":"rn-05","title":"Research note 05 — the West Virginia zero, verified","group":"Districts","blurb":"Checked against the live Hope Scholarship directory.","date":"2026-08-15","file":"research-note-05-wv-verified.md","words":1197,"md":"# Research Note 05 — The West Virginia Zero, Verified\n\nPrimary-source check against the live Hope Scholarship provider directory. August 15, 2026.\n\n---\n\n## The verification\n\nNote 04 rested on an absence-of-evidence claim: no West Virginia county school district appears to be selling classes into the Hope Scholarship, despite parity funding, an explicit statutory channel including extracurriculars, and zero cost to join. I flagged it as needing a direct check. Here it is.\n\n**Source:** the official participating schools and providers list at hopescholarshipwv.gov, [last updated 8/10/26](https://hopescholarshipwv.gov/Home/Schools/Participating-Schools). 26 pages, roughly 1,250–1,300 entries. The list covers [all participating schools and those educational service providers with approved services available in the online marketplace](https://hopescholarshipwv.gov/Home/Schools/Participating-Schools) — note that providers who have started account creation but not yet had services approved are excluded, so the list understates registrations in progress.\n\n**What I checked.** The directory sorts by type, with the Provider block first (pages ~1–21) and the School/Microschool block last (pages ~22–26). I read page 1 of the Provider block and pages 24 and 26 of the School block, covering school entries alphabetically from roughly M through Y.\n\n**Result: zero county school districts.** Page 24 covers the M–P range with no Marion, Marshall, Mason, McDowell, Mercer, Mineral, Mingo, Monongalia, Monroe, Morgan, Nicholas, Ohio, Pendleton, Pleasants, Pocahontas, Preston, or Putnam County Schools. Page 26 covers S–Y with no Summers, Taylor, Tucker, Tyler, Upshur, Wayne, Webster, Wetzel, Wirt, Wood, or Wyoming County Schools. The one near-miss is instructive: [Wood County Christian School in Williamstown](https://hopescholarshipwv.gov/Home/Schools/Participating-Schools) is a private school, not the district.\n\n**Scope of the claim, stated precisely.** Verified absent across the School/Microschool block for roughly M–Y. Not exhaustively checked across the full Provider block, where a district could theoretically register as a service provider rather than a school. Completing this is a ten-minute job in a browser, since the directory has a working search box that runs on a JavaScript postback my fetch tool can't trigger — type \"County Schools\" and \"Board of Education\" and you'll have a definitive answer.\n\n**Effect on the model:** the intermediary hypothesis from Note 04 survives its first real test. West Virginia has every condition Florida has except an organization selling districts on selling, and its district participation is at or near zero while Florida's is at 75%.\n\n## What the directory shows instead — three findings I wasn't looking for\n\n### 1. West Virginia is running Colorado's experiment two years behind, and hasn't noticed\n\nColorado's legislature just spent a session restricting homeschool enrichment programs after [revelations that some funded sports camps, martial arts lessons, and ski passes](https://sentinelcolorado.com/state-and-region-news/colorado-news-state-and-region-news/new-law-restricts-erboces-homeschool-enrichment-programs-saving-millions/), and now [bars enrichment programs from providing activities not generally available to public school students](https://sentinelcolorado.com/state-and-region-news/colorado-news-state-and-region-news/new-law-restricts-erboces-homeschool-enrichment-programs-saving-millions/).\n\nThe WV Hope provider list is full of exactly that category. From a single alphabetical page: [24/7 Fitness Club, 304 Elite Athletics, 4 Star Gymnastics, A Broken Spur Riding Academy, ABC Dance, Adagio Academy of the Performing Arts, Airborne Tumbling and Cheer of WV, Almost Heaven Riding](https://hopescholarshipwv.gov/Home/Schools/Participating-Schools) — and that's just the A's and numerals.\n\nWest Virginia has already built the defensive instrument Colorado lacked: a published [Non-Qualifying Expense List](https://hopescholarshipwv.gov/Home/Parents-Students) and a [Hope Reimbursement Policy](https://hopescholarshipwv.gov/Home/Parents-Students). Whether that's enough to prevent a Colorado-style scandal is an open question — Colorado's problem wasn't the absence of a list, it was that authorizers approved things anyway. **Prediction worth logging: West Virginia faces an enrichment-spending controversy within two legislative sessions of going universal.** The program went universal for 2026–27, and universal eligibility plus a recreation-heavy provider base is the exact Colorado precondition.\n\n### 2. \"Microschool\" is now a formal state registration category\n\nThe directory's Type column has three values: Provider, School, and **Microschool**. West Virginia has given microschools their own regulatory classification inside an ESA program, distinct from both private schools and service providers — [The Clarksburg Childrens House, The Copper Penny Schoolhouse, The Kaizen School, Vandalia Microschool, WV Highlands Academy, Mountain Laurel Learning Cooperative](https://hopescholarshipwv.gov/Home/Schools/Participating-Schools), and dozens more.\n\nThis matters against the Stateline reporting that [microschools defy easy classification and advocates warn against fixed legal definitions](https://stateline.org/2025/08/08/microschools-are-growing-in-popularity-but-state-regulations-havent-caught-up/). West Virginia has quietly done the thing the sector's own trade body cautioned against — created an administrative category — and it appears to be working as a routing mechanism rather than a constraint. Worth a look at how the ESP Handbook defines the boundary between Microschool and School, since that definition is now doing real regulatory work.\n\n### 3. The Alpha School model has entered West Virginia as a registered vendor\n\n[2hr Learning WV, Inc., of Elkins, WV, linked to 2hourlearning.com](https://hopescholarshipwv.gov/Home/Schools/Participating-Schools) is registered as a Hope provider. That is the same model Elizabeth City-Pasquotank's district microschool was [consciously modeled on](https://www.edsurge.com/news/2025-09-22-at-this-rural-microschool-students-will-study-with-ai-and-run-an-airbnb).\n\nThe pattern across three notes now: the AI-compressed-instruction model is simultaneously being (a) purchased by a rural NC district as a design template, (b) sold directly to WV families through state ESA funds, and (c) copied by Florida districts via the WonderHere-style contracting route. **The same instructional model is reaching families through three different institutional channels in three states.** That is the clearest evidence yet that the supply side is converging while the funding mechanisms diverge.\n\n### Bonus: the market is substantially out-of-state\n\nScanning any page, a large share of providers are headquartered outside West Virginia — New York, California, Georgia, Maryland, Minnesota, Wisconsin, Colorado, Florida, New Hampshire, Arizona, Texas, New Mexico, Illinois, Pennsylvania, Ohio, Virginia, Kentucky. [Outschool, a California company, was approved by the Treasurer's Office](https://www.yahoo.com/news/articles/california-online-learning-company-receive-100022394.html) and now has its own dedicated page in the parent navigation.\n\n**The competitive irony is sharp.** West Virginia county school boards are declining to sell into a marketplace where a California company has a promoted listing on the state's own website. Whatever is stopping WV districts, it isn't that the market is closed to newcomers.\n\n---\n\n## Methodology notes for anyone repeating this\n\n- The pagination parameter behaves unexpectedly: `?udt_2338_param_page=12` returns page 24, and `=13` returns page 26. It appears to roughly double. Verify which page you actually got from the footer before recording results.\n- The search box is a JavaScript postback (`__doPostBack`), so it cannot be driven from a URL. It does support prefix/suffix matching with `|`, which makes an exact-phrase search for \"County Schools\" trivial from a browser.\n- The list explicitly excludes providers whose services aren't yet approved in the marketplace, so it is a lower bound on registrations.\n- Snapshot the list. It's updated continuously and this is the kind of dataset that will look very different in twelve months — which is exactly why a dated snapshot now is worth having.\n\n---\n\n## Revised open items\n\n1. **Finish the WV search** — \"County Schools\" and \"Board of Education\" across the full directory. Five minutes, and it converts my near-zero into a real zero or overturns the model.\n2. **The regime-3 exclusion list** (Iowa, South Carolina, Ohio, North Carolina) still rests on one secondary tracker. This is now the weakest load-bearing claim across all five notes.\n3. **The Florida enrolled GAA** — the stabilization fund's actual name, trigger, and formula, still described three different ways in three sources.\n4. **New:** WV's ESP Handbook definition of \"Microschool.\" If a state has drawn an administrative boundary around the category, that definition will get copied, and it's worth knowing what it says before it is."},{"id":"rn-06","title":"Research note 06 — the exclusion regimes","group":"Districts","blurb":"States that exclude homeschoolers from ESAs.","date":"2026-08-15","file":"research-note-06-exclusion-regimes.md","words":1399,"md":"# Research Note 06 — The Exclusion Regimes, Verified (and One Big Surprise)\n\nClosing out the weakest load-bearing claim across Notes 01–05. August 15, 2026.\n\n---\n\n## Verification results\n\nNote 04 listed four states as excluding homeschoolers from ESA participation, all on the authority of a single secondary tracker. All four check out, two against primary sources — but one is in the wrong category, and the reason why is the most interesting thing in this note.\n\n| State | Claim | Status | Best source |\n|---|---|---|---|\n| Iowa | Homeschoolers ineligible | **Confirmed, primary** | Iowa DOE |\n| South Carolina | Cannot homeschool under Options 1/2/3 | **Confirmed, primary — but miscategorized** | Official ESTF program site |\n| Ohio | EdChoice private-school tuition only | Confirmed, secondary | School Choice Ohio |\n| North Carolina | Opportunity Scholarship private tuition only | Confirmed, secondary | EdChoice |\n\n**Iowa.** The state agency's own FAQ is unambiguous: a homeschooled student is [eligible to apply only as long as they are enrolled as a full-time student at an Iowa accredited nonpublic school](https://educate.iowa.gov/pk-12/educational-choice/education-savings-accounts). EdChoice states it flatly — [participating students must enroll in an accredited private school; homeschoolers cannot participate](https://www.edchoice.org/school-choice/programs/education-savings-account-program/). The award is [$8,158 per student for 2026–27](https://www.iowaace.org/education-savings-accounts/), universal by income, with no enrollment cap.\n\n**EdChoice's own scorecard for Iowa is worth stealing as an analytic frame:** [Universal Eligibility ✅, Universal Usage ❌, Universal Funding ✅, Truly Universal ❌](https://www.edchoice.org/school-choice/programs/education-savings-account-program/). The movement's own research arm distinguishes eligibility from usage. That distinction is precisely the one that determines whether a district-vendor channel can exist, and it's already in their vocabulary.\n\n**South Carolina.** The official program site lists among eligibility conditions: [cannot homeschool under Option 1, Option 2, or Option 3 for the 2026–2027 school year](https://sc-estf-program.com/en), alongside a requirement to withdraw from the resident public school and an income ceiling of 500% FPL. The program is [capped at 15,000 awarded students, a cap already reached for 2026–27](https://outschool.com/articles/unbundled-education-in-south-carolina-how-to-use-esa-funds-to-build-school-at-home), with awards of roughly [$7,634](https://numaschool.com/states/south-carolina/homeschool-laws).\n\n**Ohio and North Carolina.** Ohio's [EdChoice scholarships are only accepted at participating chartered private schools and are used to pay tuition](https://scohio.org/education-options/scholarship-programs/edchoice-scholarship-program/); the modest ACE program that homeschoolers could use [closed applications in 2025 with reimbursements due by October 15, 2025, and nothing replaced it](https://everyhomeschool.com/guides/esa-by-state-2026). North Carolina's Opportunity Scholarship [funds tuition at participating private schools](https://www.edchoice.org/school-choice/programs/north-carolina-opportunity-scholarships/); homeschoolers reach state money only through ESA+, which [requires a disability eligibility determination issued by a North Carolina public school within the last three years — the only documentation the program accepts](https://www.homeschoolteacherguide.com/blog/north-carolina-homeschool-funding/).\n\nThat NC detail deserves its own line. **The only route to homeschool funding in North Carolina runs through a public school district's evaluation.** The incumbent is the gatekeeper to the portable funding, which is a structural position no other state I've looked at gives districts.\n\n## The correction: South Carolina is regime 4, not regime 3\n\nI had SC filed as an exclusion state. It isn't. ESTF recipients [either attend a participating private school or educate at home under a separate ESTF-only track that is legally distinct from homeschooling](https://homeschoolfox.com/states/sc/esa) — satisfying compulsory attendance under §59-8-115 rather than §59-65-47, and picking up [mandatory annual testing in grades 3–11](https://homeschoolstartguide.com/blog/south-carolina-homeschool-requirements-2026).\n\nSo South Carolina is **status-forfeiting**, not excluding — same category as Louisiana's GATOR and Colorado post-SB 26-023. And that matters materially, because a status-forfeiting state *can* support an unbundled market. Outschool publishes [a guide to using ESTF funds to build school-at-home in South Carolina](https://outschool.com/articles/unbundled-education-in-south-carolina-how-to-use-esa-funds-to-build-school-at-home). The market exists; only the legal label changed.\n\n## The surprise: South Carolina's homeschoolers asked to be excluded\n\nThe exclusion of Options 1, 2, and 3 was, per one tracker, [requested by South Carolina homeschool organizations who wanted to preserve regulatory independence](https://everyhomeschool.com/guides/esa-by-state-2026).\n\n**This inverts the frame I have been using for five notes.** I have been treating homeschool exclusion as a design flaw — an artifact of programs built as private-school tuition vouchers, foreclosing the district-vendor channel and denying incumbents a stake in portable funding. That reading assumes everyone wants in.\n\nSome of the choice sector does not want the money. SC's Option 3 associations offer [no standardized testing and minimal oversight](https://numaschool.com/states/south-carolina/homeschool-laws); ESTF brings state testing, vendor approval, and program reporting. Given that trade, organized homeschoolers lobbied to keep the two systems separate — and Colorado's SB 26-023 shows why, since accepting public part-time money there now [pulls families into the full homeschool statute including periodic testing or evaluation](https://www.theumbrellaschool.com/post/sb26-023-homeschool-enrichment-funding).\n\nThis claim is load-bearing enough that it needs primary sourcing before publication — the legislative history of the ESTF's homeschool provisions, or contemporaneous testimony from SCAIHS or the state's Option 3 associations. **If it holds, it's a Field Note on its own:** portable funding is not universally desired by the sectors it's meant to serve, and the most regulation-averse providers may rationally decline it. That is a real limit on how far \"money follows the child\" can travel, and it has nothing to do with district resistance.\n\n## The expanded exclusion map\n\nBeyond the original four, the same tracker identifies several more programs that are private-school-only or otherwise closed to home education, each worth verifying independently:\n\n- **Indiana** — Choice Scholarship went universal for 2026–27, but [\"universal\" refers to income eligibility for private-school vouchers, not expansion to homeschooling](https://everyhomeschool.com/guides/esa-by-state-2026).\n- **Louisiana GATOR** — applicants [must attest they will not concurrently participate in a state-approved home study program](https://numaschool.com/learn/guides/funding-esa/homeschool-grants).\n- **Idaho Parental Choice Tax Credit** — the statute [expressly bars claiming the credit for academic instruction provided by the parent](https://numaschool.com/learn/guides/funding-esa/homeschool-grants).\n- **Wisconsin Special Needs Scholarship** — [requires attendance at a participating private school](https://numaschool.com/learn/guides/funding-esa/homeschool-grants).\n\nThe pattern across the whole map: **\"universal\" in the advocacy literature almost always means universal *eligibility by income*, not universal *usability across settings*.** Roughly thirty-plus states run choice programs; [homeschoolers qualify in fewer than a dozen](https://everyhomeschool.com/guides/esa-by-state-2026).\n\n## Revised taxonomy\n\n| Regime | Definition | States | District-vendor channel possible? |\n|---|---|---|---|\n| **1. Parity** | Same award regardless of setting | FL, WV, AZ | Yes — and FL is the only one where it happened |\n| **2. Tiered** | Homeschool award a fraction of private | TX (5:1) | Technically, but market too thin |\n| **3. Excluded** | Homeschoolers ineligible; program is a tuition voucher | IA, OH, IN, NC (Opportunity), WI (SN) | **No** |\n| **4. Status-forfeiting** | Money available, but only by exiting statutory homeschool status | SC, LA, CO | Yes — SC and CO both have live unbundled markets |\n\nThe revision matters for the thesis. Regime 4 is not a dead end for unbundling, only for *homeschooling as a legal category*. Regime 3 is the true dead end — and Ohio, Indiana, and North Carolina's flagship programs all sit there, which means their districts will experience portable funding purely as loss, with no available channel for recapturing any of it. **Those are the states where district-versus-choice politics should be most zero-sum, and that is a testable prediction about political behavior, not just fiscal outcomes.**\n\n## New item on the horizon: the federal credit\n\nOne forward-looking thing surfaced that none of my notes has addressed: [a federal $1,700 scholarship tax credit begins January 1, 2027, funding scholarship organizations rather than family accounts, with states required to opt in](https://everyhomeschool.com/guides/esa-by-state-2026). Step Up's own site now advertises a [Coming Soon: Federal Scholarship Tax Credit](https://www.stepupforstudents.org/contracted-public-schools/).\n\nIf it routes through scholarship organizations rather than state accounts, then **the intermediary variable from Note 04 becomes a federal policy question.** SFOs are exactly the institutions that built Florida's district-vendor channel. A federal program that funds and empowers SFOs in states that currently have none could export the Florida model without any state passing a Florida-style ESA. That is the single highest-leverage thing to be watching between now and January 2027, and it deserves its own research pass.\n\n---\n\n## Status of open items across all six notes\n\n**Closed:** exclusion-list verification (this note); WV district participation (Note 05, near-verified).\n\n**Still open, in priority order:**\n1. **The federal 2027 scholarship tax credit** — new, and potentially the biggest structural variable of all. Nothing in my notes covers it.\n2. **SC legislative history** — did homeschool organizations really request their own exclusion? Primary sourcing needed.\n3. **Florida's enrolled GAA** — stabilization fund name, trigger, formula. Still described three ways in three sources.\n4. **The WV \"County Schools\" search** — five minutes in a browser to convert near-zero to zero.\n5. **Florida district à la carte revenue** — still nowhere published; district AFRs or targeted records requests."},{"id":"k12-history","title":"How K–12 became what it is","group":"History","blurb":"From Prussia to the present.","date":"","file":"History_of_K-12_education_system_development.docx","words":1923,"md":"Do some research on how k-12 education got to be the industry and part of modern life that it has\n\n**The model was imported.** The common school wasn't invented in Massachusetts. Horace Mann toured Prussia in 1843 and came back evangelizing its system — age-graded classrooms, a state-trained teaching corps, a prescribed curriculum, centralized inspection. Prussia had built it for reasons that had nothing to do with democratic equality: a 1763 compulsory-schooling edict, massively expanded after the humiliation at Jena in 1806 as a nation-building and loyalty-manufacturing project. Mann's *Seventh Annual Report* praising it was controversial enough that Boston schoolmasters published a book-length rebuttal. The point isn't that American schools are secretly authoritarian; it's that the *form* — the grade, the bell, the trained teacher, the inspector — arrived as a package designed for state formation, and the democratic justification was retrofitted onto it.\n\n**The religion track, which is the legal precondition for everything happening now.** Mann's \"non-sectarian\" schools were in practice Protestant — King James Bible, Protestant hymns. Catholics responded by building an entire parallel system, which became and remains the largest private school network in America. The backlash produced the Blaine amendments: a failed federal attempt in 1875, after which 37 states wrote into their constitutions bans on public funding of \"sectarian\" institutions — a word that in the 19th century meant Catholic. [The 74 Million](https://www.the74million.org/article/chronic-absenteeism-achievement-gap-lowest-naep-scorers-missed-the-most-class/) Then *Pierce v. Society of Sisters* (1925) established that states can't compel attendance at public schools specifically [Cocatholic](https://cocatholic.org/ccc-statements/supreme-court-decision-in-carson-a-victory-for-religious-liberty-school-choice/) — the constitutional root of both private schooling and homeschooling as protected choices.\n\nThose Blaine amendments were the main legal obstacle to vouchers for a century, and the Court dismantled them in three moves: *Trinity Lutheran* (2017) held Missouri couldn't disqualify a religious preschool from a playground-resurfacing grant based on religious character; *Espinoza* (2020) extended that to a tax-credit scholarship program; and *Carson v. Makin* (2022, 6-3) closed the remaining \"status vs. use\" loophole. [USCCB](https://www.usccb.org/committees/religious-liberty/religious-liberty-backgrounder-blaine-amendments) After Carson, a state cannot bar a parent from directing school-choice funds to a religious school on the basis of either the school's religious identity or its religious instruction. [Public School Review](https://www.publicschoolreview.com/blog/15-failures-of-us-public-education-in-2025)\n\nWhether you read that as correcting a legacy of anti-Catholic bigotry (the majority's framing, and Alito's concurrence in Espinoza) or as collapsing a meaningful establishment-clause boundary (the dissents' framing), the practical effect is the same: the universal-ESA wave of 2021–2026 was legally possible in a way it wasn't in 2015. The policy wave followed the doctrinal wave by about two years.\n\n**The bureaucracy got built, then partly unbuilt.** The \"administrative progressives\" of 1900–1930 — Ellwood Cubberley and company — deliberately replaced ward-based lay school committees with small expert boards and professional superintendents, explicitly modeled on the corporation. That project also consolidated districts relentlessly: roughly 117,000 school districts in 1940 down to about 13,000 today. David Tyack called the result \"the one best system,\" and the phrase carries the critique — a structure optimized for uniformity, built by people who thought uniformity was the goal.\n\n**The teaching labor force.** Teaching was masculinized and low-status, then feminized in the mid-1800s partly as a cost measure — women could be paid roughly a third to a half of men's wages, which is a substantial part of how universal schooling was made affordable at all. Unionization came later (NEA 1857 as a professional association, AFT 1916, real collective bargaining only from the 1960s). The pipeline is now the binding constraint: the Learning Policy Institute counts more than 411,000 teaching positions nationally either unfilled or held by someone without full certification.\n\n**Where the institution actually stands in 2026.** Three numbers, and they point the same direction.\n\nAchievement: the most recent NAEP results showed 12th grade reading and math at their lowest points since those assessments began — 32% of seniors below Basic in reading, 45% below Basic in math, the largest such share ever recorded — with 8th grade science declining for the first time since 2009 and the steepest drops among the lowest performers. Only about a third of seniors met NAEP's college-readiness benchmarks in either subject.\n\nAttendance: chronic absenteeism went from about 15% pre-COVID to 28% in 2022 and remains around 24%. NCES attributes a meaningful share of the score declines to it — 27% of the 4th-grade math drop and 45% of the reading drop between 2019 and 2022. [eSchool News](https://www.eschoolnews.com/educational-leadership/2025/02/06/naep-scores-disheartening-trends-lowest-performing-students/)\n\nEnrollment: public K-12 registration has fallen 2.3% over five years, about 1.18 million students, driven primarily by births — 690,000 fewer children born in 2024 than in 2007. NCES projects the decline continuing to 47.2 million by 2031. [NCES Kids' Zone](https://nces.ed.gov/pubs2024/2024301.pdf)\n\n**The synthesis.** The institution was built on two pillars: *compulsion* (the state requires attendance) and *monopoly* (the state is essentially the only provider). Both are eroding at once, and mostly independently of each other. Absenteeism is compulsion failing enforcement — not a policy repeal, just mass quiet non-compliance that no district has found a lever for. Choice policy is monopoly being dismantled deliberately. Demographics are shrinking the base underneath both.\n\nThat's genuinely without precedent in the 180-year history. Every prior crisis — Sputnik, desegregation, *A Nation at Risk* — was answered by adding something *to* the common-school structure: more federal money, more standards, more testing. This is the first one where the structural response is subtraction: unbundling the per-pupil dollar and letting families reassemble something from parts. Nobody knows what the reassembled thing looks like at scale, because no system this size has tried it. Chile and Sweden are the closest analogues and neither is a country of 50 million students with 50 separate regulatory regimes.\n\nKeep going 💪\n\nTwo more structural pieces, then the international case I think is actually the closest analogue.\n\n**Money: the system is unequal by architectural choice, and the Supreme Court blessed it.** American schools run on local property taxes, which means school quality is downstream of local wealth by design. That got challenged directly in *San Antonio ISD v. Rodriguez*. A three-judge federal panel had ruled Texas's system unconstitutional and held education to be a fundamental right; [Substack](https://danlewis8.substack.com/p/the-curse-of-the-hagwon-koreas-self) on March 21, 1973, the Supreme Court reversed 5-4, holding the system didn't violate the federal constitution and the issue belonged to Texas. [EdWeek](https://www.edweek.org/policy-politics/after-50-years-a-u-s-supreme-court-decision-on-educational-equity-is-still-debated/2023/03) Powell's majority wrote that equal protection \"does not require absolute equality of precisely equal advantages.\" [Substack](https://danlewis8.substack.com/p/the-curse-of-the-hagwon-koreas-self) Marshall called it a retreat from the commitment to equal educational opportunity.\n\nThe consequence was procedural and enormous: Brennan responded by publicly urging litigants to take constitutional claims to *state* supreme courts instead, and since then a number of state high courts have held unequal school funding to violate their own state constitutions. [PubMed Central](https://pmc.ncbi.nlm.nih.gov/articles/PMC5869025/) That's why school finance law is a fifty-state patchwork of \"equity\" and \"adequacy\" rulings rather than one federal standard — and why there's no federal right to education to anchor arguments about what ESAs owe anyone. The whole fight is state-level because Rodriguez put it there.\n\n**The school absorbed the welfare state.** The other thing that happened quietly: schools became the delivery mechanism for everything else society decided children needed. The National School Lunch Act (1946) was justified explicitly on national-security grounds — too many WWII draftees were rejected for malnutrition. Then breakfast, then summer meals. Then IDEA (1975) attached therapy, speech, OT, and psychological services. Then health screenings, counseling, dental vans, English-language services, and — never stated but universally relied upon — nine hours of custodial childcare enabling two-earner households.\n\nThis matters for the unbundling story because none of it unbundles cleanly. A per-pupil dollar amount that follows a child out of a district doesn't carry the fixed cost of the building, the bus route, the cafeteria, or the special-education staff the district must still maintain. That's the actual mechanism behind the fiscal arguments on both sides: choice advocates say the money is the child's, district advocates say marginal cost per departing student is far below average cost. Both are describing the same accounting reality from different ends.\n\n**Charters, briefly.** Minnesota 1991, then explosive bipartisan growth — Clinton and Obama both funded them, which is easy to forget now. CREDO's national studies moved from \"no better on average, high variance\" (2009) to more favorable in the 2023 update, with urban charters, particularly \"no-excuses\" networks serving low-income students, showing real gains. Then the politics realigned around 2016 and charters lost their Democratic support without gaining much on the right, which had moved on to private choice. They're now roughly 3.7 million students and no longer the center of the argument.\n\n**The analogue nobody uses: shadow education.** Everyone reaches for Chile and Sweden, but those are *school-switching* voucher systems. ESAs are different — they fund à la carte purchases of tutoring, curriculum, therapy, classes, testing. The closest existing thing at scale is East Asian shadow education.\n\nSouth Korea had over 70,000 registered hagwons in 2023 — more than its total number of public schools — with participation at 78% of primary students, 72% of middle schoolers, and 61% of high schoolers. [University of Chicago Press](https://www.journals.uchicago.edu/doi/10.1086/648186) By 2006, Korean household spending on private tutoring equaled about 80% of government spending on public education for those students. [Taylor & Francis Online](https://www.tandfonline.com/doi/full/10.1080/03054985.2021.1917352) Kim and Lee put household tutoring spend at 2.57% of GDP against government spending of ~3.5%, [repec](https://ideas.repec.org/a/ucp/ecdecc/v58y2010i2p259-296.html) and argue it emerged as a market response to a rigid, uniform state system. Japan's juku serves over 15 million students; China's tutoring market topped $100 billion before Beijing's 2021 crackdown. [University of Chicago Press](https://www.journals.uchicago.edu/doi/10.1086/648186)\n\nThree findings from that literature are directly relevant:\n\n*It's irreversible.* Korea banned private tutoring in 1980 out of exactly the inequality and burnout concerns you'd expect; legal challenges forced reversal, and the ban was fully gone by 2001. [University of Chicago Press](https://www.journals.uchicago.edu/doi/10.1086/648186) Researchers describe these markets as \"locked in\" — once parents believe non-participation is a competitive disadvantage, no government has successfully unwound one. China's 2021 crackdown mostly drove tutoring underground and offshore.\n\n*It amplifies rather than levels.* Spending tracks family income and parental education. Korean researchers coined \"edupoverty\" for households impoverished by education spending, affecting more than four in ten families, and have linked the pressure to fertility decline and adolescent mental health.\n\n*High test scores don't settle the question.* Korea and Japan sit near the top of international benchmarks, and it's genuinely unclear how much of that is the shadow system versus what the shadow system costs.\n\nThe disanalogy is real too — Korea's shadow market is privately funded and driven by a single high-stakes university exam; America's is publicly funded with no comparable exam gate. But the structural resemblance is the point: a large, fragmented, lightly-regulated market of individual educational service vendors selling directly to anxious parents, sitting alongside a public system that continues to exist. That is what an ESA state looks like at maturity, and Korea has forty years of data on what happens next that nobody in American education policy is reading.\n\n**The live front is AI**, and it's arriving into all of this simultaneously — as a tutoring substitute (which would collapse the marginal cost of the thing shadow education sells), as a grading and lesson-planning tool inside districts already short 411,000 qualified teachers, and as a fresh cheating crisis that undermines the assessment infrastructure the whole accountability era was built on. Every previous technology promised to transform schooling and was absorbed without much trace — film, radio, television, computers, MOOCs. The base rate says absorption. The difference this time is that the labor input AI substitutes for is the single largest line item in the $857 billion, which no prior technology could touch."},{"id":"intl-precedents","title":"When the money followed for decades","group":"History","blurb":"Netherlands, Sweden, Chile, England — the workforce question at scale.","date":"2026-07","file":"wmfc-international-precedents.html","words":2030,"md":"WMFCWhen Money Follows the Child International Precedents · Working Brief · July 2026\n\nThe workforce question, tested at scale\n\n# When the money followed for decades\n\nFour countries let public funding follow the child for 30 to 100 years. The domestic debate measures what families and test scores did. This brief asks the question WMFC exists to ask: what happened to the **workforce and the institutions that train it** — the part that falls between every organization in the field.\n\n**Independent · Nonpartisan** Netherlands · Sweden · Chile · England Sources checked July 2026\n\nWhy this brief, and why now\n\nWMFC's domestic Index measures whether U.S. colleges of education have built anything to staff portable-funding schooling. The four systems below are the closest thing to a completed experiment: places where money has followed the child long enough that the workforce effects are visible, not projected.\n\nThey are read here through one lens only — **supply and workforce**, not demand, not parental satisfaction, not test scores except where those bear directly on how the teaching profession and its training institutions changed. The reader who supports portable funding and the reader who opposes it should be able to cite the same rows.\n\n## 01 · What each system did to the supply side\n\nEach card states the mechanism, then — set apart — the single workforce finding most relevant to what WMFC follows.\n\n1917≈109 years\n\n### The Netherlands\n\nConstitutional equal funding · Article 23\n\nThe oldest case. After a century of political conflict — the *Schoolstrijd* — the 1917 \"Pacification\" amended the constitution so privately governed schools receive the same public funding as state schools, provided they meet statutory requirements on pupil numbers, hours, and quality inspection.^([6](#s6)) The result: **roughly 70% of Dutch schools are run by private boards, all funded equally**.^([13](#s13)) Crucially, funding portability here is inseparable from a strong central Inspectorate — freedom to establish is paired with an obligation to be inspected.^([9](#s9))\n\nWMFC lens · workforce & institutions\n\nA century of the most pluralistic provider system in the world did not immunize the teaching workforce. The Netherlands entered a significant structural teacher shortage — *lerarentekort* — flagged by researchers since 2011, driven by workload, pay, an ageing workforce, and teachers' reported lack of professional autonomy.^([63](#s63)[67](#s67)) The OECD and EU monitors record the shortage as significant but improving under close monitoring as of 2025.^([66](#s66)) **Observation:** provider pluralism and workforce sufficiency are separate problems; solving portability did not solve supply. Coded: portability ≠ workforce sufficiency\n\n1992≈34 years\n\n### Sweden\n\nUniversal voucher · for-profit friskolor\n\nThe purest market design in Europe. A 1992 reform let independent \"free schools\" — including for-profit chains, some stock-market-listed — open with light regulatory requirements, charge no tuition, follow the national curriculum, and be funded per student on equal terms with municipal schools.^([18](#s18)) Free schools now enroll roughly 18% of students.^([18](#s18))\n\nWMFC lens · workforce & institutions\n\nSweden is where the incentive structure reached the workforce directly. Because per-student funding rewards enrollment and grades are set locally, researchers and even center-right politicians have debated a documented pattern of grade inflation as a competitive response — an effect that runs *through* teachers' professional judgment.^([44](#s44)) Early cuts fell heaviest on special-education and language teachers.^([16](#s16)) By 2025 the government's own inquiry proposed barring new operators from extracting profit for five years and giving municipal schools more per-student funding to reflect their obligation to staff places for every child.^([43](#s43)[48](#s48)) Coded: re-regulating the provider side\n\n1981≈45 years\n\n### Chile\n\nNationwide voucher · then major re-regulation\n\nThe longest-running universal voucher, and the most complete arc from deregulation to re-regulation. Introduced in 1981 under the Pinochet government on a Chicago-school design, it built a system in which around 91% of enrollment sat under a voucher scheme by 2018 and for-profit operation was permitted for almost 30 years.^([25](#s25)) The widely cited verdict: unregulated choice produced flat scores and widening rich–poor gaps, and only *added* regulation began to deliver gains.^([28](#s28))\n\nWMFC lens · workforce & institutions\n\nThe 2015 *Ley de Inclusión* is the most instructive institutional event for a portability system anywhere: it banned profit-taking in publicly funded schools (two-thirds of private-voucher schools were for-profit), ended copayments, and replaced school-side selection with a centralized admissions lottery.^([53](#s53)[54](#s54)) For the provider and workforce side this meant a large share of institutions had to convert to non-profit status or lose funding — a forced restructuring of who is allowed to operate.^([56](#s56)) Segregation remains high; the mechanism that moved it was fee rules, not choice itself.^([25](#s25)) Coded: re-regulating the provider side\n\n2010≈16 years\n\n### England\n\nTeacher training moved school-led, by design\n\nThe one case that speaks to WMFC's exact institutional question — where the *training* of teachers is done. From 2010 the Coalition government deliberately shifted initial teacher training away from universities and toward schools, treating university-led training as \"the problem,\" via the School Direct route and a target of at least 50% school-led places.^([33](#s33)[35](#s35)) This is the direct analogue to a portable-funding system relocating credentialing out of the traditional college of education.\n\nWMFC lens · workforce & institutions\n\nThe relocation produced a supply problem, not just an ideological one. As places moved from universities (which were simultaneously capped) to schools, School Direct ran well below capacity — about 45% of places filled in an early year, projected to yield thousands fewer trained teachers — and prestigious university providers exited or scaled back.^([36](#s36)[39](#s39)) The lesson most transferable to the U.S.: decentralizing credentialing does not automatically create throughput, and can suppress it unless deliberately resourced.^([37](#s37)) Coded: credentialing moved, throughput fell\n\n## 02 · The four systems, in one frame\n\nRead down the last column. It is the WMFC column — the only one the domestic field currently leaves unowned.\n\n| System                | Portability mechanism                               | Provider market                              | Direction of travel         | Workforce signal                                              |\n|-----------------------|-----------------------------------------------------|----------------------------------------------|-----------------------------|---------------------------------------------------------------|\n| Netherlandssince 1917 | Constitutional equal funding, all schools inspected | ~70% privately governed, non-profit          | Stable, inspection-anchored | Structural teacher shortage despite mature pluralism          |\n| Swedensince 1992      | Universal voucher, for-profit permitted             | ~18% free schools, chains listed on exchange | Re-regulating               | Competition reached teacher judgment (grade-inflation debate) |\n| Chilesince 1981       | Nationwide voucher, later centralized admissions    | ~91% under voucher; for-profit banned 2015   | Re-regulating               | Forced non-profit conversion restructured who may operate     |\n| Englandsince 2010     | Academies + school-led teacher training             | Academy trusts; school-based training routes | Supply-constrained          | Credentialing moved off campus, throughput fell               |\n\nPortable-funding systems compared on the supply and workforce axis · WMFC International Precedents, July 2026\n\nDirection-of-travel labels are coarse directional observations, not scores. \"Re-regulating\" means the system has legislated meaningful new constraints on providers since its founding reform.\n\nAcross every mature system, the domestic argument was about families and test scores. The durable action was on the supply side — **who is allowed to operate, and who is trained to staff it** — and in three of four cases the state came back years later to re-regulate exactly there.\n\n## 03 · What transfers to the U.S. workforce question\n\nFour coded observations, written so either side of the choice debate can cite them.\n\nSeparable\n\n**Portability and workforce sufficiency are separate problems.** The Netherlands solved funding portability a century ago and still faces a structural teacher shortage. A U.S. state can get money-follows-the-child right and still have no one trained to staff the schools it enables — the seam WMFC measures.\n\nRe-regulation\n\n**Mature systems re-regulate the provider side.** Sweden (2025 inquiry) and Chile (2015 Inclusion Law) both legislated new constraints on who may operate and how, years after founding. Any U.S. institution building for this sector is building toward a regulated end-state, not today's looser one.\n\nCredentialing\n\n**Moving credentialing off the university campus can suppress supply.** England's deliberate shift of teacher training to schools cut throughput when university places were capped faster than school routes filled. The U.S. analogue — alternative-certification routes for choice-sector teachers — carries the same throughput risk.\n\nIncentives\n\n**Per-student funding creates incentives that reach the classroom.** Sweden's grade-inflation debate shows competition pressures can act through teachers' own professional judgment, not just around it. Where U.S. programs tie provider revenue to enrollment or outcomes, the workforce is inside the incentive, not outside it.\n\n## Limits that bind hard\n\nPublished before the conclusions. A finding you cannot check is not a finding.\n\n- **Four cases are not a sample.** These systems were selected because they are mature and frequently cited, not drawn at random. They can show that an effect has occurred somewhere; they cannot establish base rates or prove what would happen in a U.S. state.\n- **Institutions differ more than the frame admits.** Dutch pillarized funding, Swedish for-profit chains, Chilean municipal-plus-voucher structure, and English academy trusts are not the same instrument. Cross-country workforce comparisons should be read as directional, not equivalent.\n- **Attribution is contested at the source.** Sweden's grade-inflation and segregation findings, and Chile's segregation trend, are actively debated in the cited literature; some studies find modest positive achievement effects. This brief reports the debate, and does not resolve it.\n- **Teacher-shortage causation is not isolated to choice.** The Dutch and English shortages have demographic, pay, and labor-market drivers that would exist without portable funding. The claim here is narrow: pluralism did not prevent them — not that choice caused them.\n- **Secondary and translated sources.** Several Swedish and Chilean policy details are read through English-language secondary reporting. Primary-source verification in Swedish and Spanish would strengthen every row and has not yet been done.\n- **Single point in time.** Checked July 2026. The Swedish for-profit inquiry and Chilean admissions rules are live policy and may move.\n\n**On neutrality — a design requirement, not a disclaimer**\n\nA reader who believes portable-funding policies strengthen education can read these rows as systems maturing toward sensible regulation and pluralism worth the effort. A reader who believes they harm public education can read the same rows as evidence that markets in schooling require repeated state correction. The coded observations — re-regulating, supply-constrained, separable — describe observable policy behavior, not virtue. Both readings use the same table. That is the point.\n\n## 04 · Sources\n\nEvery claim above carries a numbered source checked in July 2026. Where a source is a secondary report of primary legislation, that is noted in the limits. Numbering is non-sequential to match in-text citation IDs.\n\n1.  **Government of the Netherlands** — Public-authority and private schools / Freedom of education (Article 23). [government.nl](https://www.government.nl/topics/freedom-of-education/public-authority-and-private-schools)\n2.  **Dutch Inspectorate of Education** — The Dutch educational system; freedom of establishment, organization, conviction. [onderwijsinspectie.nl](https://english.onderwijsinspectie.nl/inspection/the-dutch-educational-system)\n3.  **Patrinos, H. A. / World Bank (2010)** — Private Education Provision and Public Finance: The Netherlands. [openknowledge.worldbank.org](https://openknowledge.worldbank.org/entities/publication/8db8f305-697b-5bfb-8b1a-a3a8d181296e)\n4.  **ASCD, Educational Leadership** — Free Choice and Vouchers Transform Schools. [ascd.org](https://www.ascd.org/el/articles/-free-choice-and-vouchers-transform-schools)\n5.  **Cuban, L. (blog, S. Hjelm)** — Vouchers and Market-Driven Schools in Sweden. [larrycuban.wordpress.com](https://larrycuban.wordpress.com/2020/12/31/vouchers-and-market-driven-schools-in-sweden-sara-hjelm/)\n6.  **Gutiérrez et al., British Educational Research Journal (2021)** — Chile's enduring educational segregation. [bera-journals.onlinelibrary.wiley.com](https://bera-journals.onlinelibrary.wiley.com/doi/10.1002/berj.3746)\n7.  **FutureEd, Georgetown** — What Chile Teaches Us About School Vouchers. [future-ed.org](https://www.future-ed.org/what-chile-teaches-us-about-school-vouchers/)\n8.  **Newman, S., Journal of Education for Teaching (2025)** — University-led teacher training treated as \"the problem.\" [tandfonline.com](https://www.tandfonline.com/doi/full/10.1080/02607476.2025.2590049)\n9.  **Journal of Education for Teaching (2024)** — Role of schools in England's ITE; School Direct; ≥50% school-led target. [tandfonline.com](https://www.tandfonline.com/doi/full/10.1080/02607476.2024.2413167)\n10. **The Conversation (2025)** — Why UK policies failed to recruit enough teachers. [theconversation.com](https://theconversation.com/why-uk-government-policies-have-failed-to-recruit-enough-teachers-for-years-230586)\n11. **The Conversation (2021)** — Major teaching reform will erode the intellectual basis of the profession. [theconversation.com](https://theconversation.com/major-teaching-reform-in-england-will-erode-the-intellectual-basis-of-the-profession-165102)\n12. **BBC News** — England's teacher training system 'broken down'. [bbc.co.uk](https://feeds.bbci.co.uk/news/education-23491085)\n13. **The Local Sweden (Apr 2025)** — Free-school profit-curb inquiry; five-year profit-extraction ban proposed. [thelocal.se](https://www.thelocal.se/20250408/will-swedens-new-free-school-inquiry-disarm-the-issue-before-the-election)\n14. **Institute of Economic Affairs** — For-profit free schools: the evidence from Sweden. [iea.org.uk](https://iea.org.uk/blog/for-profit-free-schools-the-evidence-from-sweden)\n15. **The Local Sweden (Apr 2025)** — How far-reaching are the government's free-school reforms. [thelocal.se](https://www.thelocal.se/20250410/how-far-reaching-are-the-governments-proposals-to-reform-free-schools)\n16. **Bellei / Review of Education (2023)** — Chile's Inclusion Law: for-profit ban, copayment removal. [tandfonline.com](https://www.tandfonline.com/doi/full/10.1080/00131911.2023.2234661)\n17. **Harvard Kennedy School / CID** — Rethinking Education Governance: Chile's reform journey. [hks.harvard.edu](https://www.hks.harvard.edu/centers/cid/voices/rethinking-education-governance-insights-chiles-reform-journey-through-systems)\n18. **Educators Perspective** — Education Policy in Chile. [educatorsperspective.com](https://educatorsperspective.com/education-policy-in-chile/)\n19. **Primary-schooling study (2022)** — Dutch teachers' reasons for leaving: workload, pay, lack of autonomy. [researchgate.net](https://www.researchgate.net/publication/364402152_Understanding_teacher_shortages_Analysis_of_teachers'_reasons_for_leaving_primary_schooling_in_the_Netherlands)\n20. **European Commission — Education & Training Monitor 2025 (Netherlands)** — Staff shortages significant but improving. [op.europa.eu](https://op.europa.eu/webpub/eac/education-and-training-monitor/en/country-reports/netherlands.html)\n21. **Algemene Onderwijsbond (AOb)** — Teacher shortage spreading nationwide; warnings since 2011. [aob.nl](https://www.aob.nl/en/actueel/artikelen/lerarentekort-wordt-snel-voelbaar-in-heel-nederland/)"},{"id":"roots","title":"The roots of school choice","group":"History","blurb":"Three origins, 1869 to today.","date":"","file":"roots-of-school-choice.html","words":1287,"md":"A nonpartisan history · When Money Follows the Child\n\n# The idea that *money can follow a child* is older than the fight over it.\n\nThree separate impulses — rural practicality, religious pluralism, and free-market theory — arrived at the same mechanism from different directions, sometimes a century apart. This is how public money learned to travel with the student, traced from 1869 to today.\n\nScroll the spine ↓  ·  the amber line is the money; each node is a moment it moved\n\nThree origins An idea takes shape A country builds it The U.S. enacts it\n\nShow all\n\nIdeas\n\nAbroad\n\nUnited States\n\nBefore there was a movement\n\nLong before \"school choice\" was a slogan, two societies made public money portable — one to solve geography, one to keep the peace between churches.\n\n1869 · 1873\n\n1869 · 1873 U.S. — first in practice\n\n### Vermont & Maine invent \"town tuitioning\"\n\nRural towns too small to run their own schools simply paid tuition for their children to attend a public or private school elsewhere. No theory, no ideology — just the oldest working voucher in America, still operating today.\n\nVermont 1869 · Maine 1873 — practical, geographic\n\n1917\n\n1917 Netherlands — constitutional\n\n### The Dutch settle a 70-year \"school struggle\"\n\nAfter decades of conflict (the *schoolstrijd*) over whether the state should fund religious schools, the Pacification of 1917 amended the constitution to fund **every** school equally — public and private — so long as it met national standards. Portable funding as a peace treaty, not a market.\n\nArticle 23 · pluralism & religious liberty\n\nThe idea gets a theory\n\nIn the mid-20th century an economist gave the old practice a new rationale: not geography or faith, but competition.\n\n1955\n\n1955 The idea\n\n### Milton Friedman reframes the question\n\nIn *The Role of Government in Education*, Friedman drew one distinction that would organize the next 70 years: paying for education is not the same as running the schools. Government could fund students with vouchers and let families choose. Widely called the intellectual start of the *modern* movement — though, as historians note, the practice predated him by 86 years.\n\nChicago · free-market rationale\n\n1974\n\n1974 The idea\n\n### Ray Budde imagines the \"charter\"\n\nAn education professor proposed letting small groups of teachers run schools under a public \"charter\" — accountable for results, free from bureaucracy. The word sat dormant for years before Minnesota reformers picked it up.\n\nA public-school route to choice\n\nFrom theory to law\n\nTwo states, two years apart, turned ideas into working programs — and notably, both began as bipartisan or left-of-center reforms.\n\n1990\n\n1990 United States\n\n### Milwaukee launches the first modern voucher\n\nChampioned by Polly Williams — a Black Democratic state representative — and signed by a Republican governor, the Milwaukee Parental Choice Program let low-income families use public funds at private schools. It began with just 341 students in seven schools. Its origin was a cross-partisan alliance for poor city kids, not a party plank.\n\n**341**students in year one, 1990 → nearly 30,000 today\n\nWisconsin · anti-poverty framing\n\n1991\n\n1991 United States\n\n### Minnesota passes the first charter-school law\n\nState Senator Ember Reichgott Junge, a Democrat, shepherded the nation's first charter statute, turning Budde's word into a public-school model of choice. Within a decade the idea spread to most states — the fastest-growing branch of choice for years.\n\nThe public-school branch of the movement\n\nThe courts weigh in\n\nChoice's expansion ran straight into the Constitution. A series of rulings cleared the legal path for public money to reach religious schools.\n\n2002\n\n2002 United States\n\n### Zelman v. Simmons-Harris\n\nThe Supreme Court ruled 5–4 that Cleveland's voucher program did not violate the Establishment Clause, because aid flowed to *families* who then chose schools — not to churches directly. The decision removed the largest constitutional cloud over vouchers nationwide.\n\nChurch-state question, resolved for vouchers\n\n2020 · 2022\n\n2020 · 2022 United States\n\n### Espinoza & Carson go further\n\nThe Court held that once a state funds private-school choice, it **cannot exclude** religious schools from participating. Carson v. Makin (2022) applied this directly to Maine's 149-year-old town-tuitioning program — closing the loop between the oldest choice policy and the newest legal doctrine.\n\nFrom \"may include\" to \"may not exclude\"\n\nThe universal era\n\nPrograms shed their income and eligibility limits. Money didn't just follow some children — it began to follow every child.\n\n2011\n\n2011 United States\n\n### Arizona invents the education savings account\n\nRather than a voucher tied to tuition, the ESA put funds in a family-controlled account usable for tuition, tutoring, therapy, curriculum, and more. It started small — students with disabilities only — the same \"targeted-to-universal\" arc many states would later repeat.\n\nThe ESA: money unbundled from any single school\n\n2021–23\n\n2021–23 United States\n\n### The dam breaks: universal eligibility\n\nWest Virginia (2021) enacted the first near-universal ESA; Arizona went universal in 2022; Florida's HB 1 (2023) converted its programs into universal ESAs. What had been targeted, means-tested aid became an entitlement open to every K-12 family.\n\n**500K+**Florida scholarship students today — the largest ecosystem\n\nTargeted → universal, in under three years\n\n2025–26\n\n2025–26 United States — now\n\n### Portability becomes the norm\n\nBy 2026 at least 18 states run universal or near-universal programs, and 30-plus have some portable-funding program. Tennessee and Pennsylvania enacted universal choice in spring 2026; Texas launched with a \\$1 billion cap. By some estimates, universal program
