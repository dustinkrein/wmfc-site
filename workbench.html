ng, statute, or agency documents, linked inline. A handful of figures (marked ◆) come from research conducted for a related project in early August 2026 and were not re-verified today; treat those as needing a confirmation pass before publication.\n\n---\n\n# PART I — FLORIDA: FIFTY YEARS OF DISTRICT RESPONSE\n\nFlorida is the most useful longitudinal case in the country because the pressure arrived in distinct, datable waves, and each wave produced a different institutional reflex. The arc runs: **districts as monopoly choice provider → reluctant authorizer → program differentiator → litigant → retrenchment → marketer → vendor.**\n\n## Era 1 (1970s–1995): Districts *are* the choice sector\n\nBefore any competitor existed, Florida districts were already running choice programs — magnets, built originally as a desegregation tool. [Magnet schools emerged in the late 1960s as districts sought voluntary desegregation by attracting diverse groups around academic specialties](https://www.usnews.com/education/high-schools/articles/magnet-schools-vs-charter-schools-differences-explained), and Florida built out heavily: [495 magnet schools by 2013–14, serving roughly 562,000 students](https://ballotpedia.org/School_choice_in_Florida).\n\n**The analytically important point:** districts had four decades of experience running differentiated, application-based, marketed programs *before* they faced any external competitor. The later claim that districts \"don't know how to compete\" is not supported by their own history. What they lacked was not capability but necessity.\n\n## Era 2 (1996–2005): Charters arrive; districts become gatekeepers\n\n[The Legislature authorized charter schools in 1996](https://oppaga.fl.gov/ProgramSummary/ProgramDetail?programNumber=2118) after a failed 1995 attempt, passing 96–18 in the House and 32–8 in the Senate; [Liberty City Charter School in Miami opened that year as the state's first](https://stateimpact.npr.org/florida/2011/09/28/from-minnesota-to-miami-the-history-of-florida-charter-schools). Critically, Florida made **districts themselves the primary authorizers** — a structural decision that shaped twenty years of behavior.\n\nDistrict response in this era was procedural rather than programmatic:\n\n- **Gatekeeping.** Denial, conditions, and contract negotiation became the main lever. [Statute requires a board to specify reasons for denial within 10 days and to propose an initial charter contract within 30 days of approval](https://oppaga.fl.gov/ProgramSummary/ProgramDetail?programNumber=2118) — the compliance architecture built up around this is where district energy went.\n- **Conversion charters.** Some districts converted existing schools rather than lose them to outside operators — an early, underexamined instance of the \"if you can't beat them, become them\" reflex that returns in 2025.\n- **Charters were tolerated as the lesser evil.** As UCF's Michele Gill put it, [charters became the politically acceptable compromise precisely because they didn't provoke the opposition vouchers did](https://stateimpact.npr.org/florida/2011/09/28/from-minnesota-to-miami-the-history-of-florida-charter-schools).\n\nGrowth was slow enough to absorb: [~500 charters and 154,000 students by 2010–11](https://stateimpact.npr.org/florida/2011/09/28/from-minnesota-to-miami-the-history-of-florida-charter-schools), reaching [~282,500 students, 10.4% of public enrollment, by 2015](https://ballotpedia.org/Charter_schools_in_Florida).\n\n## Era 3 (1999–2006): The \"Florida Formula\" and differentiation-by-accountability\n\nThe 1999 A+ Plan, Opportunity Scholarships, and McKay Scholarships arrived bundled with school grades. [The reform package combined test-based accountability, competition, and choice](https://www.shankerinstitute.org/resource/evidence-florida-formula-education-reform).\n\nDistrict response was mostly *defensive program expansion*: IB, AP, Cambridge/AICE, dual enrollment, and career academies grew as ways to hold high-performing families and lift school grades simultaneously. This is the origin of a pattern that recurs: **Florida districts respond to competitive pressure by adding differentiated programs at the top of the market first**, where the flight risk is most visible.\n\nThe Supreme Court's 2006 *Bush v. Holmes* decision striking Opportunity Scholarships briefly validated litigation as a strategy — a lesson districts and the FEA are still drawing on (the FEA's current suit seeking to invalidate the scholarship programs and charters is a direct descendant).\n\n## Era 4 (2011–2019): Tax credits, ESAs, and the capacity fight\n\nTax-credit scholarships and the Personal Learning Scholarship Account/Gardiner program grew steadily. Two 2016–17 laws changed district behavior more than the scholarships did:\n\n**HB 7029 (2016) — controlled open enrollment.** Beginning 2017–18, [every district and charter must adopt a plan letting a parent from *any* district in the state enroll their child in any public school that has not reached capacity](https://www.fldoe.org/core/fileparse.php/7513/urlt/7029-16.pdf), subject to class-size limits.\n\nThis produced the single most instructive district behavior of the decade: **capacity became a strategic variable.** Because districts define and publish their own capacity determinations, [incorporating their facilities plans and long-term work programs](https://www.fldoe.org/schools/school-choice/other-school-choice-options/controlled-open-enrollment.stml), the constraint on choice became a number districts largely control. Contemporary reporting found parents in Seminole County told no intra-district transfers were available while the district simultaneously rezoned 1,000 elementary students — with one parent alleging districts were [using the discretion the law affords to balance school grades](https://floridapolitics.com/archives/232176-hurdles-school-choice-remain-despite-floridas-open-enrollment-law/).\n\nThat is the template: **when choice is mandated, districts respond by controlling the parameter that governs it.** The same reflex reappears in 2026 with Schools of Hope co-location and facility utilization rates.\n\n**HB 7069 (2017) — Schools of Hope and shared capital outlay.** Districts sued, lobbied, and largely lost. Litigation and legislative defense consumed the response capacity that might have gone into programs.\n\n## Era 5 (2019–2023): Family Empowerment and consolidation\n\nFES launched in 2019 and the programs consolidated. Districts absorbed the losses without structural change — still treating choice as a policy problem to be reversed rather than a market to be operated in. **This is the era where the response lag is clearest.** All the demand signals were visible; almost no district built product against them.\n\n## Era 6 (2023–present): HB 1, universality, and the three-phase adaptation\n\nHB 1 (2023) made every K–12 student eligible regardless of income. The Personalized Education Program made non-enrolled students fundable. The result, as of the 2025–26 year: [53% of Florida's K–12 students — about 1.9 million children — are using an education option other than their assigned district school](https://www.yahoo.com/news/politics/articles/florida-school-choice-redefining-public-160001588.html).\n\nDistrict response has moved through three phases in roughly three years.\n\n### Phase 1 — Retrenchment (2024–2026)\n\nThe losses are now large enough to force facility decisions:\n\n- **Orange County** closed seven schools (six elementary, one middle) at the end of 2025–26 after [a decline of about 6,600–7,000 students in a single year](https://mynews13.com/fl/orlando/news/2026/08/05/students-in-central-florida-go-back-to-school-amid-districts-seeing-lower-enrollment-numbers); [enrollment fell more than 8,300 over three years, and OCPS lost more than $40 million in state funding in one year](https://www.yahoo.com/news/articles/save-beloved-schools-orange-parents-120000448.html). The district attributes the decline to vouchers, birth rates, neighborhood aging, and federal immigration policy. Its voucher redirection: [$211 million in 2025–26, up from $152 million the prior year](https://www.yahoo.com/news/articles/central-florida-school-districts-brace-100000829.html).\n- **Construction pause.** OCPS, which [opened 28 campuses in ten years, will open no new schools until 2031](https://www.yahoo.com/news/orange-schools-delay-campus-construction-100000759.html) — its facilities chief: they don't want to open empty schools. For a district that had opened at least one school almost every year since the 2003 sales-tax referendum, this is a genuine regime change.\n- **Broward** is [down about 37,000 students over a decade, roughly 10,000 in a single year](https://www.cbsnews.com/amp/miami/news/plantation-middles-future-in-doubt-as-broward-weighs-school-closures-amid-enrollment-decline), and is weighing closures including an IB middle school. ◆ Six consolidations approved January 2026; long-range plan contemplates up to 34.\n- **Escambia** projects [a loss of about 7,000 students to scholarships heading into 2026–27, up from hundreds a few years ago](https://www.aol.com/articles/florida-school-closures-spread-enrollment-090931000.html) — the clearest single illustration of the slope change.\n- ◆ **Pinellas** (16.8% decline, two closures Feb 2026) and **Miami-Dade** (nine closures) follow the same pattern.\n\nStatewide, [enrollment was projected to drop by more than 70,000 students](https://www.yahoo.com/news/articles/central-florida-school-districts-brace-100000829.html).\n\n**Coding caution:** districts consistently separate *demographic* loss (birth rates, out-migration, immigration enforcement) from *competitive* loss. Only the second is winnable, and districts know it. Any analysis that attributes the whole decline to portability will be wrong and will be attacked as wrong.\n\n### Phase 2 — Marketing as an institutional function\n\nDistricts began buying enrollment marketing. ◆ Leon County hired Caissa K12 to recruit students back, with Superintendent Rocky Hanna framing public schools as now operating in an age of competition. This mirrors the national pattern (see Part II).\n\n### Phase 3 — Becoming a vendor in the choice marketplace\n\nThis is the genuinely new institutional form, and it happened fast.\n\nStep Up For Students' **Contracted Public Schools** channel lets districts and charters [sell part-time services — courses, tutoring, therapy, assessments — directly to scholarship families through the EMA platform, paid from ESA funds with no out-of-pocket cost](https://www.stepupforstudents.org/contracted-public-schools/). The mechanism that makes it work: a student receiving contracted services is **not** considered enrolled in the public school for scholarship-eligibility purposes. A district can sell instruction to a child it does not enroll and does not count.\n\nThe adoption curve is the finding:\n\n| Date | Districts participating |\n|---|---|\n| June 2025 | [~1 in 3 of 67 districts by August start](https://nextstepsblog.org/2025/06/charter-schools-usa-and-step-up-for-students-join-forces-to-expand-options-for-florida-students/) |\n| Oct–Nov 2025 | [more than 50%, including Miami-Dade, Orange, Hillsborough, Duval](https://nextstepsblog.org/2025/10/florida-school-districts-usher-in-the-future-with-options-for-part-time-public-school-students/) |\n| April 2026 | [50 of 67 approved as providers](https://www.city-journal.org/article/florida-school-choice-education) |\n| May 2026 | [75% of 67 districts offering à la carte services](https://nextstepsblog.org/2026/05/more-florida-districts-take-the-lead-in-developing-learning-options-for-part-time-public-school-students/); [52 partnered, including Hillsborough, Pinellas, Pasco](https://www.yahoo.com/news/politics/articles/florida-school-choice-redefining-public-160001588.html) |\n| July 2026 | [53 either approved or in process](https://nextstepsblog.org/2026/07/panel-shares-florida-a-la-carte-learning-story-with-lawmakers-from-across-america/) |\n\n[Miami-Dade opened more than 95 classes to students not enrolled in the district](https://www.city-journal.org/article/florida-school-choice-education).\n\n◆ The barrier to entry is four documents: an EMA business account, a W-9, EIN, bank details, and a service description. Set that against what a private provider must clear — or what it would take a college of education to stand up an equivalent program — and the \"institutions this size can't move fast\" explanation for non-response elsewhere collapses.\n\n### Phase 4 (emerging) — Buying model R&D from the choice sector\n\n**Polk County** unanimously approved a two-year contract with **WonderHere** to bring its microschool model into Philip O'Brien Elementary. WonderHere was [founded in 2016 by two teachers who left a Polk County public school; it now runs a state-approved private school of 120 full-time students plus ~300 in weekly homeschool enrichment, with additional locations in Florida and South Carolina](https://fee.org/articles/why-one-school-district-is-launching-new-microschool-inspired-classrooms/). The founders' stated goal from the outset was to influence public education.\n\nThe district went to a private microschool operator — not a college of education, not a state R&D arm — for instructional design and staff training. That is the single most citable instance of the new supply chain.\n\n### Phase 5 — Defensive/political (running in parallel throughout)\n\n◆ Schools of Hope co-location (690 notices statewide; February 2026 State Board rules defining \"vacant, underused or surplus\" as utilization under 75% or 400 surplus student stations; Orange and Seminole rejecting all applications). Plus count-date mechanics, audit leverage, and property-tax defense. The state audit found [\"the state lost track of $398 million in voucher funding and thousands of students\"](https://www.aol.com/articles/florida-school-closures-spread-enrollment-090931000.html) — districts have used this to argue for separating voucher and public-school funding streams, which [the Legislature declined to do in the 2026 budget while creating a capped Public School Enrollment Stabilization Fund](https://feaweb.org/release/florida-budget-again-shortchanges-public-school-students-puts-politics-over-people/).\n\n---\n\n# PART II — THE NATIONAL INNOVATION FRONTIER\n\nRanked roughly by how much they change the institution, not by how much attention they get.\n\n## 1. Unbundling: districts selling services to students they don't enroll\n\nThe most consequential shift nationally, and it is now being written into statute in more than one state.\n\n**Texas.** SB 2's implementation letter is explicit: ESA funds may purchase goods and services [\"including from school districts, should school districts choose to offer fee-for-service offerings for non-enrolled students, as allowed under Texas Education Code §29.358(b)(3)\"](https://tea.texas.gov/taa-letters/senate-bill-2-education-savings-accounts-and-children-disabilities). Texas built the Florida channel into the law from day one rather than discovering it. The program is live for 2026–27 with [more than 53,000 additional accounts awarded in May on top of 42,000+ Tier 1 awards](https://www.kvue.com/article/news/education/schools/texas-awards-53k-more-education-savings-accounts-for-2026-2027/269-c5e110d1-706c-4ea6-849c-a8abc934db1b), at [$10,474 per student, up to $30,000 for students with disabilities, $2,000 for homeschoolers](https://educationfreedom.texas.gov/).\n\n**Colorado** — the most mature version of this market anywhere, and the cautionary tale. Colorado has long allowed districts and the Charter School Institute to claim partial funding for homeschool and private-school students accessing public school part-time. Scale: [approximately $100 million for 18,695 part-time homeschool and private-school students in 2025–26](https://go.boarddocs.com/co/cde/Board.nsf/files/DQD82R1C3A03/$file/2026.01.13%20January%20Bd%20Mtg%20Part-Time%20Programs%20Presentation.pdf). The exemplar is **APEX in St. Vrain** — district-run, district-staffed, K–8 students attending one full day per week, [783 funded students](https://go.boarddocs.com/co/cde/Board.nsf/files/DQD82R1C3A03/$file/2026.01.13%20January%20Bd%20Mtg%20Part-Time%20Programs%20Presentation.pdf). Statute now explicitly contemplates a program subcomponent being [\"a campus, a microschool, or any other component\"](https://ed.cde.state.co.us/cdefinance/school-finance-act-updates).\n\nThe backlash is the interesting part. When BOCES-authorized programs began funding [sports camps, martial arts, and ski passes, lawmakers moved to restrict](https://www.chalkbeat.org/colorado/2026/05/19/lawmakers-make-homeschool-enrichment-changes-but-not-to-funding-rate/); SB 26-023 restricts districts from operating part-time homeschool programs outside their own geographic boundaries — a rule that [threatens established programs like Aurora's Options, which operates outside APS under state waivers](https://denveroptions.aurorak12.org/). **Colorado shows what Florida's channel looks like at maturity: districts capture real market share, an arbitrage economy grows around them, and the state re-regulates.**\n\n**Washington** offers the inverse: Alternative Learning Experience allows part-time home-based enrollment, but [districts are statutorily prohibited from advertising or providing unsolicited information about those programs to families who have filed a homeschool declaration of intent](https://lawfilesext.leg.wa.gov/Biennium/2011-12/Htm/Bill%20Reports/House/5142-S%20HBA%20ED%2011.htm). A state that built the channel and then banned the marketing.\n\n**Arizona is the counterexample worth naming.** Despite [100,000+ ESA students](https://www.12news.com/article/news/education/arizona-empowerment-scholarship-program-hits-milestone/75-8de790a6-5e16-43cc-aaa5-f4867acea017), Arizona districts *cannot* run the Florida play: [in almost all situations, ESA students cannot be enrolled in a public school, including district, charter, and public online programs](https://www.azed.gov/esa/esa-support). The district-vendor response is a **policy artifact, not an inevitability.** Whether districts can adapt this way is determined by statutory design, not district ambition.\n\n## 2. District-operated microschools\n\nDistricts building small, distinctive, purpose-built schools inside the public system — explicitly as a retention play.\n\n- **Elizabeth City-Pasquotank, NC** (~4,800 students, 13 schools, ~70% economically disadvantaged): a [26-student middle-grades microschool where students help run an Airbnb through a partnership with a local real estate company and learn via AI tutoring (Khanmigo)](https://www.edsurge.com/news/2025-09-22-at-this-rural-microschool-students-will-study-with-ai-and-run-an-airbnb). Consciously modeled on Alpha School. Staffing is the point: [three teachers and one support staffer to eventually cover four grade levels and ~65 students](https://edtechmagazine.com/k12/article/2025/12/rural-school-districts-embrace-artificial-intelligence) — \"clearly, three people are not going to be able to teach four grade levels,\" per Superintendent Keith Parker. The design came from \"inspiration visits\" to 40+ schools, including private microschools in Texas. The stated intent is to import what works back into the traditional schools.\n- **Indiana Microschool Collaborative.** A rural district leader won state charter board approval to [incubate a statewide network of microschools operating as charters, targeting 10+ schools and ~6,000 students by 2030](https://hechingerreport.org/are-microschools-a-solution-to-falling-public-school-enrollment-one-district-thinks-so/). The first, Nature's Gift, on a 12-acre youth camp, twice expanded past its original 50 seats and still has a waiting list. The rationale is precise: [more than 40% of microschool students in a 2025 analysis of 800+ microschools previously attended district schools or were homeschooled](https://hechingerreport.org/are-microschools-a-solution-to-falling-public-school-enrollment-one-district-thinks-so/). \"It's going to feel like a small private school, but it's public.\"\n- **A broader roster** worth coding: [Pitt County NC (blended microschools for chronically absent students), Los Angeles (students experiencing homelessness and newcomers), Myrtle Elementary in Lamont CA, Escondido Union in San Diego County (out-of-school suspensions down 60%, attendance up 10% at Hidden Valley), Kettle Moraine WI (three interdisciplinary PBL microschools inside one high school), Edgecombe County NC](https://www.the74million.org/article/microschools-are-not-just-a-trend-theyre-a-turning-point/).\n- **Infrastructure now exists.** The [Public Microschool Playbook](https://www.gettingsmart.com/2025/05/14/the-public-microschool-playbook-a-new-actionable-guide-for-system-leaders/), from Getting Smart Collective, Learner-Centered Collaborative, and Transcend, is a 75+ page guide with editable workbooks aimed at district and charter-network system leaders. The named barrier is not imagination but [seat-time rules, Carnegie units, and compliance-based accountability](https://www.gettingsmart.com/2025/10/27/small-by-design-what-big-systems-can-learn-from-microschools/).\n\n**Watch item:** the sector's own conference circuit now markets [\"boutique public microschools\" as a school-within-a-school model to \"reclaim families, fill empty classrooms,\" complete with marketing and recruitment components](https://instructionalempowermentconference.com/session/district-operated-microschools-boutique-public-options-to-win-back-families/). Marketed retention, not pedagogy, is becoming the sales frame.\n\n## 3. Portfolio governance and unified enrollment\n\nThe oldest structural response — districts managing a mixed portfolio of operators rather than running every school directly.\n\nDenver, Indianapolis, New Orleans, and DC are the canonical cases; [Atlanta (partnership schools), Camden (renaissance schools), Newark, Lawrence MA, and San Antonio adopted parts](https://www.chalkbeat.org/2019/3/8/21107014/a-chalkbeat-explainer-what-is-the-portfolio-model-of-running-schools/). Indianapolis's Innovation Network Schools use four pathways — new, restart, conversion, and partnership — and [EnrollIndy's OneMatch unified application covers neighborhood, magnet, charter, and innovation schools with a single ranked-choice match](https://www.ednc.org/a-new-recipe-for-a-school-model-innovation-network-schools-in-indianapolis/).\n\nTwo findings matter for anyone treating this as a model:\n\n- **It worked where sustained.** [Denver's student achievement moved from the 5th to the 60th percentile and graduation rates from 43% to 71% over a decade](https://bipartisanpolicy.org/issue-brief/reimagining-school-improvement-what-are-portfolio-districts/).\n- **It usually isn't sustained.** [A 10-year study of 52 districts that adopted the portfolio strategy found few sustained it](https://bipartisanpolicy.org/issue-brief/reimagining-school-improvement-what-are-portfolio-districts/); [Denver repealed aspects after a 2019 board turnover](https://bipartisanpolicy.org/issue-brief/reimagining-school-improvement-what-are-portfolio-districts/). Governance innovation reverses at the ballot box in a way that vendor participation probably does not — vendor revenue creates a constituency inside the district; portfolio governance creates opponents.\n\n## 4. Career pathways as the differentiation strategy\n\nThe most consensus-backed district play. [Jefferson County, Alabama Superintendent Walter B. Gonsoulin Jr. launched over 20 high school career academies awarding industry certifications](https://www.edweek.org/leadership/superintendents-say-public-schools-can-compete-with-school-choice-heres-how/2025/01); his framing — \"I don't have a particular problem with school choice. I have a problem that public schools have been left out of the discussion\" — is the cleanest statement of the shift. Bentonville's Debbie Jones argues superintendents must reframe as chief executives and build choice *inside* public education. [Wake and Guilford County NC career academies](https://www.edsurge.com/news/2025-09-22-at-this-rural-microschool-students-will-study-with-ai-and-run-an-airbnb) are the scale versions.\n\n## 5. Marketing, brand, and state-level choice navigation\n\n[Des Moines hired a marketing firm to win students back after enrollment fell from ~33,000 in 2019 to ~30,000](https://www.edweek.org/leadership/public-schools-launch-marketing-campaigns-to-compete-with-school-choice/2024/08). The researcher's read in that piece is the useful frame: it signals that public schools want to be *schools of choice in a choice environment*. By 2026 this is [no longer a novelty, with districts integrating marketing into enrollment forecasting and strategic planning](https://www.publicschoolreview.com/blog/why-public-schools-are-launching-marketing-campaigns-in-2026).\n\nThe most interesting version is **state-level**: North Carolina DPI's [\"Find Your Fit, Build Your Future\"](https://www.dpi.nc.gov/blog/2026/01/27/find-your-fit-build-your-future-nc-public-schools) markets the full menu inside public education — early colleges, CTE credentials, gifted programs, magnets, charters, virtual, specialized programs. A state education agency running a choice-navigation campaign for its own sector is a genuinely novel institutional behavior.\n\n## 6. Demand intelligence — treating exit as data\n\nThe most underrated and, in my view, the highest-leverage innovation.\n\nNorth Carolina's homeschool registration asks parents to select a reason. The 2025–26 results: [51.5% cited public school dissatisfaction, 20.6% special needs, 6.4% an advanced learner, 4.1% private-school dissatisfaction](https://www.educationnext.org/parental-choice-is-sending-public-schools-a-message-are-they-listening/). The trend line is the story — [dissatisfaction rose from 25.6% in 2020–21 to 51.5% in 2025–26 while \"pandemic\" nearly vanished](https://www.educationnext.org/parental-choice-is-sending-public-schools-a-message-are-they-listening/), against [95,190 homeschools serving ~152,897 students and 12,643 new openings in 2025–26, still well above pre-pandemic levels](https://www.educationnext.org/parental-choice-is-sending-public-schools-a-message-are-they-listening/).\n\nEgalite's proposal: add optional follow-up questions to homeschool registration — if dissatisfaction, was it safety, academics, culture, special education, flexibility, or program options? NC has also stood up a statewide **Parent Advisory Council**, and its predecessor commission [reserved seats for traditional public, charter, private, *and* homeschool parents](https://www.educationnext.org/parental-choice-is-sending-public-schools-a-message-are-they-listening/) — former Superintendent Truitt: if we're going to be the first choice, we need to understand why some families choose not to send us their kids.\n\nWest Virginia BOE President Paul Hardesty's framing is the era's plainest: public schools are [\"competing for enrollment, whether we want to believe it or not,\"](https://www.educationnext.org/parental-choice-is-sending-public-schools-a-message-are-they-listening/) and the only viable response is to become more accommodating, receptive, and accessible.\n\n---\n\n## Synthesis: a ladder of district response\n\nOrdered by institutional depth. Most districts are on rungs 1–3; the interesting ones are on 4–6.\n\n| # | Response | What it changes | Reversibility |\n|---|---|---|---|\n| 1 | Litigation / lobbying | Nothing internally | n/a |\n| 2 | Retrenchment (closures, construction pauses) | Cost base only | Very hard to reverse |\n| 3 | Marketing | Message, not product | Fully reversible |\n| 4 | Program differentiation (magnets, career academies, IB) | Product at the margins | Sticky |\n| 5 | New model creation (microschools, hybrids) | Product core; staffing model | Sticky, small scale |\n| 6 | Unbundling / vendor participation | **Business model and the meaning of enrollment** | Creates internal revenue constituency |\n| 7 | Portfolio governance | Who operates schools | Reverses with board turnover |\n\n**Three patterns worth carrying forward:**\n\n**Speed is not the constraint.** Florida districts went from denial to statewide vendor participation in under three years — 1-in-3 districts to 75% in roughly twelve months. Any argument that large, unionized, procedurally encumbered public institutions cannot adapt quickly to portable funding is falsified by this record.\n\n**Statutory design determines the response set.** Florida and Texas permit fee-for-service to non-enrolled students; Arizona forbids it; Washington permits the service but bans the marketing; Colorado permits it and is now re-regulating the geography. Districts adapt into whatever opening the statute leaves. Where the opening doesn't exist, the \"innovation\" doesn't appear — regardless of how much competitive pressure the district is under.\n\n**The seam is being occupied by the choice sector, not the incumbent.** Districts are buying model design from microschool operators (Polk/WonderHere), routing services through a scholarship funding organization's platform and its community of practice, and importing designs from private schools they visited (Elizabeth City-Pasquotank → Alpha, Ascent, Long-View). The R&D and professional-learning functions are flowing *toward* the choice sector even as districts capture revenue *from* it.\n\n---\n\n## What I'd check next\n\n1. **The Florida district roster.** The machine-readable list of participating districts sits behind a Datawrapper embed (`bX34V`) on Step Up's Contracted Public Schools page. Pulling it gives an exact, citable district-level dataset — and would answer whether any district sells *navigation or consultation* rather than instruction. That would be an incumbent capturing a statutorily created role.\n2. **Texas district uptake of §29.358(b)(3).** As of August 2026 the program is only weeks old. Whether Texas districts opt in as fast as Florida's did is the cleanest natural experiment available on whether the Florida adoption curve generalizes.\n3. **Colorado's SB 26-023 aftermath.** Which programs die, which relocate, and whether the $100M figure contracts. This is the only place in the country with a decade of data on what happens to a mature district-run part-time market.\n4. **Revenue magnitude.** No one has published what districts actually *earn* from à la carte channels. Until that number exists, \"districts are becoming vendors\" is a behavioral claim, not a financial one.\n5. **Who staffs district microschools, and under what credential.** Elizabeth City-Pasquotank runs three teachers plus AI across four grade levels; Orange's baseball microschool used two teachers and two coaches. The certification pathway question lives here.\n6. **Whether any district has closed a school and reopened the building as a microschool or à la carte hub.** That would be the first genuine consolidation-to-reinvention case, and I found none."},{"id":"fl-districts","title":"Florida districts: denial, retrenchment, participation","group":"Districts","blurb":"The three phases since HB 1.","date":"","file":"how_school_districts_are_responding_to_school_choice_in_Florida.docx","words":3904,"md":"> **The question asked:** Do an analysis of what / how school districts are responding to school choice in Florida?\n\nFlorida districts have moved through three distinct phases since HB 1: denial, retrenchment, and — increasingly — participation in the very marketplace that's draining them. Here's where things stand as of mid-2026.\n\n**The pressure**\n\nThe losses are now large enough to force structural decisions. Broward, the nation's sixth-largest district, approved consolidating six schools in January 2026 after enrollment fell 5% — nearly 10,000 students — in a single year, with a decade-long drop of about 17% that has cost roughly $342 million in funding. [Northfortmyersneighbor](https://www.northfortmyersneighbor.com/news/community-news/2026/05/school-district-addresses-declining-enrollment/) Pinellas posted the state's steepest percentage decline among large districts at 16.8% and voted in February 2026 to close Cross Bayou Elementary and Disston Academy under a \"Planning for Progress\" restructuring. [browardschools](https://www.browardschools.com/cms/lib/FL01803656/Centricity/domain/13425/projections/2021-22%20through%202025-26%20School%20by%20School%20Five%20Year%20Enrollment%20Projections%20Key%20Considerations%20Memo.pdf) Miami-Dade closed nine schools this year; Broward's longer plan contemplates closing or consolidating up to 34. [Substack](https://thomasaugustus.substack.com/p/breaking-school-enrollment-declines)\n\nCritically, districts distinguish *demographic* loss from *competitive* loss, and only the second is winnable. In Leon County, district money redirected to vouchers grew from $3.2 million in 2020–21 to nearly $38 million this year. [Florida Daily](https://floridadaily.com/25-years-of-school-choice-for-florida-parents-and-students/)\n\n**Four responses, in rough order of sophistication**\n\n**1. Retrenchment.** Closures and consolidations above, plus construction pauses. Orange County — which opened 28 campuses in ten years — paused new school construction until 2031, with its facilities chief saying they don't want to open empty schools. [The School House](https://www.theschoolhouse.org/post/school-choice-benefits-homeschoolers)\n\n**2. Marketing and recruitment.** This is the most visible cultural shift. Leon County hired Caissa K12 to recruit students back, with Superintendent Rocky Hanna saying public schools are now in an age of competition and have to recruit too. [My School Choice](https://myschoolchoice.com/opportunities/florida-education-savings-account) The contract is performance-based — the firm is paid from state funds only after enrolled students generate revenue. [YourSun](https://www.yoursun.com/arcadia/news/school-district-to-launch-fundraising-campaign-to-compete-with-vouchers/article_da772402-3b29-4b9d-b164-863ef9b60c74.html) Orange County hired the same firm after projecting a 25% drop in kindergarten enrollment, with Superintendent Maria Vazquez conceding the district hasn't told its own story well. [WCTV](https://www.wctv.tv/2026/07/16/leon-county-schools-hires-firm-recruit-students-public-schools/) At the school level, principals now describe themselves as salespeople — one Tallahassee elementary principal operating at 61% capacity gives parents his cell number and calls customer service the key. [Florida Daily](https://floridadaily.com/25-years-of-school-choice-for-florida-parents-and-students/)\n\n**3. Joining the marketplace — the most consequential shift for anyone building in this space.** Districts have become ESA vendors themselves. As of July 2026, 53 of Florida's 67 districts are either approved à la carte providers or in the process of becoming providers on Step Up's platform, offering unbundled courses and services. [Step Up For Students](https://www.stepupforstudents.org/newsroom/) Step Up now runs a \"Contracted Public Schools\" channel where PEP, private school, and Unique Abilities families can buy part-time courses, tutoring, therapy, and assessments from participating districts directly through EMA with no out-of-pocket cost. [Feaweb](https://feaweb.org/action-center/2026-legislative-session/) Miami-Dade opened more than 95 classes to students not enrolled in the district, including automotive, aviation, AP, and performing arts. [Step Up For Students](https://www.stepupforstudents.org/contracted-public-schools/) Osceola listed its entire K–12 catalog; a year of elementary math in Miami runs about $1,028, science or P.E. about $514. [Florida Daily](https://floridadaily.com/25-years-of-school-choice-for-florida-parents-and-students/) The logic is explicitly a funnel — Leon's board vice chair framed à la carte as a chance for a family to \"sniff the culture\" and possibly return full-time. [Florida Daily](https://floridadaily.com/25-years-of-school-choice-for-florida-parents-and-students/)\n\n**4. Product differentiation.** Sarasota's superintendent is running a \"Future Focused\" initiative — a Junior Achievement-run Discovery Center and a 3DE project-based high school program — plus a fundraising campaign explicitly framed as competing with vouchers. [The 74 Million](https://www.the74million.org/article/florida-school-choice-bill-has-a-hidden-reform-part-time-enrollment/) Lee County's superintendent puts the posture plainly: they want to be parents' first choice. [Pineapple Report](https://pineapplereport.com/double-digit-enrollment-drops-hit-five-florida-school-districts/)\n\n**The political and fiscal track**\n\nSuperintendents have largely stopped arguing against choice on principle. Hillsborough's Van Ayres treats the competition as a feature rather than a threat, and Broward's Howard Hepburn frames it as an expansion of parent options — the operative question for every superintendent is no longer whether to compete but how. [Outschool](https://outschool.com/homeschool/how-to-use-esa-to-homeschool-in-florida) The fight has shifted to mechanics:\n\n- **Count-date timing.** Allocations run on October and February counts, but Leon enrolled 2,513 students — 8% of its enrollment — after February, generating no funding. [Florida Daily](https://floridadaily.com/25-years-of-school-choice-for-florida-parents-and-students/)\n\n- **Accountability leverage.** A December state audit found the voucher program couldn't fully account for $270 million in 2024–25 spending, with roughly 23,000 students double-counted as families moved between sectors midyear. [Outschool](https://outschool.com/homeschool/how-to-use-esa-to-homeschool-in-florida) That audit is what put SB 318 on the table (it passed the Senate but died without a House companion — expect a 2027 successor).\n\n- **Revenue defense.** Lawmakers scaled back DeSantis's property-tax proposal specifically to shield the school levies that fund nearly half of district budgets, [Property Exemption](https://www.propertyexemption.com/guides/florida-property-tax-elimination-desantis/) and the FY26–27 budget included funds to mitigate enrollment-decline effects, though Democrats argued the cushion still leaves districts like Orange short. [Florida Policy](https://www.floridapolicy.org/posts/map-projected-revenue-loss-for-florida-school-districts-and-counties-under-governors-property-tax-reform-proposal)\n\n**Why this matters for Wayfinder**\n\nTwo implications worth folding into the analysis docs:\n\n**Districts are now competitors *****and***** inventory.** If 53 of 67 districts are EMA providers selling courses and services to PEP/FES families, a navigator's job now includes advising on public-school à la carte options — which is a genuine differentiator versus navigators who only know private/homeschool vendors. It also means \"which programs can we combine\" is a real, growing question, not a hypothetical.\n\n**Districts are a plausible B2B customer.** Districts are already paying performance-based fees to recruitment firms and struggling to get listed and discovered on EMA. That's adjacent to opportunity #6 in your ranked list (EMA-readiness consulting) — with a customer base of dozens of districts rather than hundreds of micro-vendors, and public procurement dollars behind it.\n\nOne caution: the \"recruit them back\" motive means districts have an incentive to market their à la carte offerings as an on-ramp to full enrollment, which is a subtly different interest than a family's. A navigator who is honest about that is more valuable — and a navigator paid by a district would have a conflict worth disclosing.\n\nWant me to write this up as a proper project doc alongside the other two analyses?\n\nThis is for WhenMoneyFollowstheChild.org NOT Wayfinderand then keep going with the research and see what else you can\n\nUnderstood — reframing for WMFC. The district story matters to your thesis in a specific way: districts are the *other* incumbent facing portable funding, and unlike colleges of education, they have already responded — visibly, expensively, and within roughly two years. That contrast is itself a finding, and it gives you a comparison case for the \"why haven't universities moved\" question.\n\nHere's what the record shows, sorted into the kind of behavioral categories your coding scheme uses.\n\n**1. Retrenchment (the response that is *****not***** engagement)**\n\nBroward — the sixth-largest district in the country — approved consolidating six schools in January 2026 after losing 9,987 students, about 5%, in one year; the decade-long decline of roughly 17% has cost about $342 million in funding. [Northfortmyersneighbor](https://www.northfortmyersneighbor.com/news/community-news/2026/05/school-district-addresses-declining-enrollment/) Pinellas posted the steepest large-district percentage decline in the state, 16.8%, and voted in February 2026 to close two schools under a \"Planning for Progress\" restructuring. [browardschools](https://www.browardschools.com/cms/lib/FL01803656/Centricity/domain/13425/projections/2021-22%20through%202025-26%20School%20by%20School%20Five%20Year%20Enrollment%20Projections%20Key%20Considerations%20Memo.pdf) Miami-Dade closed nine schools this year; Broward's longer plan contemplates up to 34 closures or consolidations. [Substack](https://thomasaugustus.substack.com/p/breaking-school-enrollment-declines) Orange County, which opened 28 campuses in ten years, paused new construction until 2031 — its facilities chief said they don't want to open empty schools. [The School House](https://www.theschoolhouse.org/post/school-choice-benefits-homeschoolers)\n\nWorth coding carefully: much of this is birthrate, not portability. Districts themselves distinguish the two, because only one is winnable.\n\n**2. Marketing as institutional function**\n\nLeon County hired Caissa K12 to recruit students back, with Superintendent Rocky Hanna saying public schools are now in an age of competition and must recruit too. [My School Choice](https://myschoolchoice.com/opportunities/florida-education-savings-account) The contract is performance-based — no money up front, with the firm paid from state funds only after enrolled students generate revenue. [YourSun](https://www.yoursun.com/arcadia/news/school-district-to-launch-fundraising-campaign-to-compete-with-vouchers/article_da772402-3b29-4b9d-b164-863ef9b60c74.html) Orange County hired the same firm after projecting a 25% kindergarten drop, with Superintendent Maria Vazquez conceding the district has not told its own story well. [WCTV](https://www.wctv.tv/2026/07/16/leon-county-schools-hires-firm-recruit-students-public-schools/) At the building level, a Tallahassee elementary principal operating at 61% capacity gives parents his cell number and calls customer service the key. [Florida Daily](https://floridadaily.com/25-years-of-school-choice-for-florida-parents-and-students/)\n\n**3. Entering the marketplace as a vendor — the largest and least-covered shift**\n\nThis is the one I'd flag hardest for the Index. As of July 2026, 53 of Florida's 67 districts are either approved à la carte providers or in the process of becoming providers on Step Up For Students' platform, offering unbundled courses and services. [Step Up For Students](https://www.stepupforstudents.org/newsroom/) Step Up runs a dedicated \"Contracted Public Schools\" channel where PEP, private-school and Unique Abilities scholarship families buy part-time district courses, tutoring, therapy and assessments directly through their ESA accounts. [Feaweb](https://feaweb.org/action-center/2026-legislative-session/)\n\nMiami-Dade opened more than 95 classes to students not enrolled in the district, including automotive, aviation, AP and performing-arts courses. [Step Up For Students](https://www.stepupforstudents.org/contracted-public-schools/) Osceola listed its entire K–12 catalog; a year of elementary math in Miami prices at roughly $1,028, science or P.E. at about $514. [Florida Daily](https://floridadaily.com/25-years-of-school-choice-for-florida-parents-and-students/) The motive is stated openly as a funnel — Leon's board vice chair described à la carte as a chance for a family to \"sniff the culture\" and possibly return full-time. [Florida Daily](https://floridadaily.com/25-years-of-school-choice-for-florida-parents-and-students/)\n\nFiscal context for why: in Leon County alone, district money redirected to vouchers grew from $3.2 million in 2020–21 to nearly $38 million this year. [Florida Daily](https://floridadaily.com/25-years-of-school-choice-for-florida-parents-and-students/)\n\n**4. Operating new models — including buying pedagogy from the choice sector**\n\nTwo observations here that bear directly on your workforce question:\n\nOrange County opened a district \"microschool\" in August 2026 focused on baseball and softball — 48 students in grades 3–6 at Cheney Elementary, staffed by two teachers and two coaches, explicitly framed as an attempt to attract parents amid voucher competition; parent interest was high enough to require a waiting list. [Biggie Platform](https://www.biggieschools.com/blog/florida-microschool-regulations-complete-2026-guide-for-educators)\n\nMore significant: Polk County's school board unanimously approved a two-year pilot bringing WonderHere's microschool-inspired model into a district-operated classroom, with deep collaboration on implementation, hiring, purchasing, training, and family communication. [San Antonio Report](https://sanantonioreport.org/florida-based-primer-microschools-new-texas-education-freedom-accounts/) WonderHere was founded in 2016 by two teachers who left a Polk County public school, and now runs a state-approved private school of 120 full-time students plus roughly 300 more in weekly homeschool enrichment. [Microschoolflorida](https://www.microschoolflorida.com/) Superintendent Heid's framing at a November 2025 board work session was a question: why aren't they innovating where there's high demand for a different approach? [Central Florida Public Media](https://www.cfpublic.org/education/2026-05-21/ocps-will-open-a-microschool-focused-on-baseball-and-softball)\n\n**The district went to a microschool operator for instructional R****&****D and staff training — not to a college of education.** That is a clean, citable instance of the seam you're describing.\n\n**5. Defensive/political response**\n\nDistricts are also fighting on terrain that has nothing to do with families choosing:\n\n- **Facilities.** A 2025 expansion of Schools of Hope let certain charter chains set up inside struggling or under-enrolled public schools; when it took effect, 690 co-location notices went out statewide. [yahoo](https://www.yahoo.com/news/florida-finally-clearing-way-more-090502298.html) New Board of Education rules in February 2026 defined \"vacant, underused or surplus\" as a facility utilization rate under 75% or 400 surplus student stations. [yahoo](https://www.yahoo.com/news/florida-finally-clearing-way-more-090502298.html) Orange and Seminole rejected all applications submitted to them, on grounds that the space was in use, the school was ineligible, or the operator was not allowed. A Suncoast Searchlight analysis found Sarasota's public schools ran at a median 82% utilization against 84% at the county's 14 charters — near-identical underuse on both sides. [yahoo](https://www.yahoo.com/news/articles/charter-operators-wanted-classroom-space-000345316.html)\n\n- **Count-date mechanics.** Allocations run on October and February counts, but Leon enrolled 2,513 students — about 8% of enrollment — after February, generating no revenue. [Florida Daily](https://floridadaily.com/25-years-of-school-choice-for-florida-parents-and-students/)\n\n- **Audit leverage.** A December state audit found the voucher program could not fully account for $270 million in 2024–25 spending, with roughly 23,000 students double-counted as families moved between sectors midyear. [Outschool](https://outschool.com/homeschool/how-to-use-esa-to-homeschool-in-florida)\n\n- **Revenue floor.** Lawmakers scaled back the governor's property-tax proposal specifically to shield the school levies that fund nearly half of district budgets. [Property Exemption](https://www.propertyexemption.com/guides/florida-property-tax-elimination-desantis/)\n\n**Why this matters to the WMFC research question**\n\n**Response speed is the comparison.** Florida's Index row shows policy penetration A+, programs built for the sector 0, across 19 institutions. Districts — larger, more procedurally encumbered, unionized, politically constrained — moved from denial to vendor status in under three years. Whatever explains university non-response, \"institutions this size can't move fast\" isn't it. That's a falsification worth stating plainly.\n\n**Districts are becoming credentialing bodies.** Florida already authorizes district- and charter-run Professional Development Certification Programs as a certification route, alongside university programs and Educator Preparation Institutes. Meanwhile completers of teacher education programs at Florida universities and colleges fell from 6,270 in 2022 to 5,655 in 2023. [Teacher Certification Degrees](https://www.teachercertificationdegrees.com/certification/florida/) If the question is *who prepares the workforce*, districts and alternative providers are gaining share in the traditional sector at the same time universities are absent from the choice sector.\n\n**The choice-sector workforce is being trained by the sector itself.** Launch Your Kind, a Florida-based nonprofit microschool accelerator founded by a former public school teacher, provides the business skills and entrepreneurial support its founder wished she'd had; one participant grew a microschool from one student in January 2024 to 26 today, including students with special learning needs. [iteach](https://iteach.net/alternative-teacher-certification/florida-alternative-teacher-certification/) That's the preparation function your Index is looking for — happening entirely outside postsecondary.\n\n**A coding boundary problem you should resolve before the 2026 Index publishes.** Your scheme codes programs \"explicitly built around district partnership\" as *incidental*. But with 53 of 67 Florida districts selling into the ESA marketplace, a district-partnership program may now reach choice-sector families through its district partner. The category still holds — the *stated purpose* test is what does the work — but the rationale needs a sentence, because a skeptical reader will spot it. I'd suggest coding on stated purpose and adding a note that district partnership is no longer a clean proxy for district-only reach in Florida.\n\n**What I'd check next**\n\n- **Does any Florida district's à la carte catalog include Choice Navigator or consultation services?** If districts are selling advisory services into EMA, that's an incumbent capturing a statutorily created role.\n\n- **Who staffs the district microschools?** Orange's baseball microschool used two teachers and two coaches — were the coaches certified, and under what pathway? That's the workforce question in miniature.\n\n- **The Polk/WonderHere pilot's training component.** If a private microschool operator is training district staff, get the terms. That's a Field Note.\n\n- **PDCP completion counts by district, 2019–2026.** If district-run certification is growing while university completers fall, you have the share-shift chart the workforce argument needs.\n\n- **The 27 unscanned Florida state colleges.** Your own method flags this as where the charter-authorizing pathway is actually used — and state colleges are also the likeliest home for a short-cycle choice-sector credential.\n\nOne caveat on sourcing: the enrollment and closure figures above come largely from local and trade outlets. Before any of it goes into a row, the district counts should be re-pulled from FLDOE membership survey data and board agendas, with your usual checked-date discipline.\n\nWant me to draft this as a Field Note in your house format — findings-first, provenance links, limits published before conclusions?\n\nKeep going with the research\n\nRound two. I pulled primary sources this time rather than trade press, and one thread turned into something that bears directly on your Index rather than just adjacent to it.\n\n**A. The district-vendor channel, from the primary source**\n\nStep Up's own \"Contracted Public Schools\" page (published Feb 25, 2026; read Aug 1, 2026) is more consequential than the trade coverage suggested.\n\nThe channel covers districts *and* charter schools, offering courses, tutoring, therapy, assessments and other approved services, with direct payment; participation is optional. [WTXL](https://www.wtxl.com/news/local-news/tcc-first-college-in-florida-approved-as-charter-school-authorizer) Crucially, a student receiving contracted services is not considered enrolled in the public school for scholarship eligibility purposes [WTXL](https://www.wtxl.com/news/local-news/tcc-first-college-in-florida-approved-as-charter-school-authorizer) — that clause is the whole mechanism. It lets a district sell instruction to a child it does not enroll and does not count.\n\nTwo details worth coding:\n\n**The barrier to entry is four documents.** Becoming a contracted provider takes two steps: create an EMA business account, then submit a W-9, EIN, bank account details, and a description of services rendered. [WTXL](https://www.wtxl.com/news/local-news/tcc-first-college-in-florida-approved-as-charter-school-authorizer) Set that against the vetting a private provider faces, and against what it would take a college of education to stand up a program. The institutional-inertia explanation for university non-response gets weaker the more you look at what districts actually had to do.\n\n**Step Up is running the professional-learning function.** The provider resources include a \"Community of Practice\" alongside the onboarding one-pager. An SFO is convening and training the institutional providers in its own marketplace. That is the seam you named in Field Note 03, occupied by the scholarship administrator.\n\nThe family-facing one-pager markets CTE programs, electives, AP courses, career training and clubs, virtual or in-person, from any participating school or district statewide regardless of the family's location. [Model Law](https://modellaw.publiccharters.org/states/florida) Statewide reach without enrollment is a genuinely new institutional form.\n\nThere is a machine-readable roster of participating districts behind a Datawrapper embed on that page (bX34V). I couldn't pull it directly — it needs to be fetched from the embed host — but it's the citable list for a Florida district row, and it would answer whether any district sells *consultation* or navigation services rather than instruction.\n\n**B. Your Florida state-college gap: the census is three**\n\nYour method flags 27 of 28 state colleges unscanned, and correctly identifies that system as where the authorizing pathway is used. Here is the count, from the authorizing body itself.\n\nThree higher-education institutions are currently approved to sponsor charter schools in Florida: Miami Dade College, Pasco-Hernando State College, and Tallahassee State College. [University of Pennsylvania](https://catalog.upenn.edu/graduate/programs/educational-entrepreneurship-msed/) All three are Florida College System institutions. No state university appears on the list, even though statute lets universities authorize statewide while colleges are limited to their service area [University of Pennsylvania](https://catalog.upenn.edu/graduate/programs/educational-entrepreneurship-msed/) — the broader authority is the one nobody is using.\n\nTallahassee State College was the first Florida college authorized to sponsor charters and opened the first college-sponsored charter school, Tallahassee Collegiate Academy. [University of Pennsylvania](https://catalog.upenn.edu/graduate/programs/educational-entrepreneurship-msed/) FDOE approved it in January 2023, and it was one of five Florida College System colleges selected by the governor to create career and technical education charter schools. [Florida Senate](https://www.flsenate.gov/Session/Bill/2026/824/Analyses/2026s00824.pre.ed.PDF)\n\nThat five-versus-three gap is a codable finding. The five colleges receiving $10 million to establish and operate CTE charter schools were Miami Dade, Northwest Florida State, Tallahassee Community College, Santa Fe, and St. Petersburg College. [Model Law](https://modellaw.publiccharters.org/states/florida) Two of the funded five (Santa Fe, Northwest Florida State) do not appear as approved authorizers, and one current authorizer (Pasco-Hernando) was not among the funded five. Money and behavior diverged. Worth establishing whether that's retrenchment, a different operating route, or just lag.\n\nOne statutory thread you'll want: the 2019 bill authorizing state universities and FCS institutions to sponsor charters also repealed the existing limitations on charter schools operated by an FCS institution with a teacher preparation program. [Florida Department of Education](https://www.fldoe.org/schools/school-choice/charter-schools/charter-school-reference/) That is, so far as I can find, the only place in Florida code where teacher preparation and school operation are explicitly linked — and the link was written as a *removal* of restriction. If you want a legal spine for the argument that nothing prevents ed units from entering this sector, that's the citation.\n\n**C. The finding I'd lead with: Miami Dade College's Florida Charter Institute**\n\nThe Florida Charter Institute is powered by Miami Dade College, and manages charter authorization on the college's behalf. [Unc](https://ed.unc.edu/program/educational-innovation-technology-and-entrepreneurship/) It also partners with Pasco-Hernando State College to review that college's charter applications. [University of Pennsylvania](https://catalog.upenn.edu/graduate/programs/educational-entrepreneurship-msed/)\n\nBut authorizing is the smallest part of it. The FCI also runs, from inside a college: workshops, fellowships, instructional consulting, professional learning, a governance board program, school operations and facilities planning support, a research function, and a charter jobs board at flcharterjobs.org. Its stated mission is to be Florida's premier hub for charter excellence, providing research-based best practices, resources, and support. [Unc](https://ed.unc.edu/program/educational-innovation-technology-and-entrepreneurship/)\n\nNot one piece of that is a degree program. **A catalog scan of Miami Dade College's education unit would return nothing.** This is the strongest confirmation I've found of your Field Note 02 claim — and it also stretches it. MDC hasn't merely operated or authorized a school. It has built the sector's *preparation, placement, and professional-learning infrastructure* and housed it at a college, in a form that no course-level enumeration will ever detect.\n\nI'd suggest that implies a fourth code alongside *built for sector / names sector / incidental*: something like **sector infrastructure** — authorizing, professional learning, placement, or research services provided to non-district schools without a corresponding academic program. Coding MDC as \"nothing found\" would be technically defensible and substantively false, and a skeptical reader will notice that before you do.\n\n**D. Confirmatory nulls on the degree side**\n\nEducation-entrepreneurship master's degrees do exist. Penn's M.S.Ed. in Education Entrepreneurship describes itself as the nation's first master's degree in the field, built at the intersection of education, business, and entrepreneurship. [aud](https://www.aud.edu/all-news/aud-and-amazon-uae-launch-micromaster-in-entrepreneurship-and-innovation) Harvard's ELOE program and UNC's MEITE occupy similar ground. None are Florida, and none are built for the ESA/microschool sector as such — they're general innovation-and-venture programs that a microschool founder could use incidentally. That's a *names sector* or *incidental* coding at best, and it's useful precisely because it shows the degree infrastructure isn't absent in general — it's absent for this sector, in this state.\n\n**E. Two workforce numbers that need a primary source before you cite either**\n\nOne account has Florida teacher-preparation completers falling from 6,270 in 2022 to 5,655 in 2023, and midyear instructional vacancies dropping from 4,096 to 3,197. [Teacher Certification Degrees](https://www.teachercertificationdegrees.com/certification/florida/) Another has roughly 4,300 vacancies at the start of the year, down from 4,776 the prior year. [Learn.org](https://learn.org/accelerated-degrees/alternative-teacher-certification-florida) Both trace to FEA and FLDOE reporting but count different things at different moments. Neither should go in a row until pulled from FLDOE directly — the completer series in particular is the backbone of any share-shift argument about who prepares the workforce.\n\n**Revised \"what would move this forward fastest\"**\n\n- **Fetch the Contracted Public Schools roster** (Datawrapper bX34V) and code participating districts by service type. Specifically: does any district sell advisory, consultation, or navigation services rather than instruction? If so, an incumbent has entered a statutorily created advisory role.\n\n- **Resolve the five-funded / three-authorized gap.** Ask Santa Fe and Northwest Florida State directly. A documented decision *not* to authorize is as codable as a decision to do so, and you'd have it on the record rather than inferred.\n\n- **Get FCI participation counts** — fellowships enrolled, professional-learning attendance, jobs-board postings. That converts \"sector infrastructure exists at a college\" into a measured quantity.\n\n- **Read the repealed FCS teacher-prep clause in HB 1197 (2019)** against current 1002.33. It's the closest thing to a legal answer on whether an ed unit may operate in this sector.\n\n- **Check whether any State University System institution has ever applied to authorize.** FDOE requires approval, and authorizers file annual reports — so applications and withdrawals should be traceable. This is the cleanest available test of \"nothing found\" versus \"nothing there,\" and it addresses the sampling-on-the-outcome bias you flag in your own limits.\n\n- **Pull FLDOE's completer and vacancy series** directly, with definitions.\n\nAll of the above checked Aug 1, 2026. The FCI and Step Up pages are live institutional sources read in full; the district enrollment and closure figures from round one are still trade press and shouldn't enter a row until re-pulled from FLDOE membership surveys and board agendas.\n\nI can draft the FCI finding as Field Note 04 in your format — finding first, provenance links, limits before conclusions — or write the coding-scheme amendment as a method note. Which is more useful right now?"},{"id":"rn-02","title":"Research note 02 — the vendor hypothesis","group":"Districts","blurb":"Texas falsifies the simple version.","date":"2026-08-15","file":"research-note-02-vendor-hypothesis.md","words":2051,"md":"# Research Note 02 — Testing the \"Districts Become Vendors\" Hypothesis\n\nFollow-on to the August 15 memo. August 15, 2026.\n\n---\n\n## The headline: Texas falsifies the simple version of the thesis\n\nThe memo argued that Florida districts adapted fast, and that statutory design determines the response set. Texas turns out to be a much sharper test than I realized, because **Texas has been paying districts to serve non-enrolled students since September 2023 — and most districts have refused the money.**\n\n### Channel A: the UIL allotment (three years of data, largely rejected)\n\nHB 3708 (88th Legislature, 2023) entitles a district to [an annual Foundation School Program allotment of $1,500 per UIL activity in which a non-enrolled homeschool student participates](https://capitol.texas.gov/tlodocs/88R/analysis/pdf/HB03708H.pdf). The bill analysis is explicit about the rationale: districts extending services to homeschoolers \"receive no additional funding to accommodate the increased number of participants.\"\n\nThis is a cleaner instrument than Florida's channel. It is not a marketplace fee — it is **state formula money paid to a district for a child it does not enroll.** No platform, no vendor onboarding, no W-9.\n\nUptake under the opt-in regime: in 2024–25, [45 school districts opted in — about 4% of districts statewide](https://thetexan.news/issues/education/prominent-texas-school-districts-opt-out-of-homeschool-participation-in-uil-athletic-academic-events/article_9f598392-291a-4c1b-b6b0-4b50535f9613.html), per UIL's own communications office.\n\nFour percent. With money on the table.\n\nSB 401 (2025) flipped the default: [participation is now standard policy unless the board takes an affirmative vote to opt out](https://capitol.texas.gov/tlodocs/89R/analysis/pdf/SB00401F.pdf), by September 1, 2025 and August 1 in subsequent years. If a district opts out, the student may participate at the [closest district that allows it](https://www.uiltexas.org/policy/2025-26-policy-info/homeschool-faq).\n\nAnd the large districts opted out anyway. [Dallas ISD, Fort Worth ISD, and Arlington ISD had opted out as of the 2025 deadline](https://homeschoolstartguide.com/blog/new-texas-homeschool-laws-2025). [Katy ISD voted 4–3 to opt out on July 28; Lamar CISD voted to opt in on June 17](https://coveringkaty.com/news/fort-bend/katy-isd-opts-out-lamar-cisd-opts-in-for-homeschool-uil-part/).\n\n**The Katy debate is the most valuable artifact I found today.** Trustee Rebecca Fox's stated reason was that non-KISD students shouldn't participate because [doing so could take opportunities away from KISD students](https://coveringkaty.com/news/fort-bend/katy-isd-opts-out-lamar-cisd-opts-in-for-homeschool-uil-part/). Other board members noted that no data existed yet because the automatic-participation regime was new; supporters proposed opting in and reevaluating with data. Fox said she'd reconsider next year.\n\nThat is a **scarcity frame** beating a **revenue frame** in an open board vote, on the record, with the dollar amount known.\n\n### Channel B: TEFA fee-for-service (live now, untested)\n\nThe Florida-style channel exists in Texas statute from day one: ESA funds may buy goods and services [including from school districts that choose to offer fee-for-service offerings for non-enrolled students under TEC §29.358(b)(3)](https://tea.texas.gov/taa-letters/senate-bill-2-education-savings-accounts-and-children-disabilities). Approved expenses explicitly include [classes and services provided by a school district or open-enrollment charter school](https://www.edchoice.org/school-choice/programs/texas-education-savings-account-program/), and the unbundling condition is the same as Florida's — [the offering must not count the ESA student as a full-time student](https://myschoolchoice.com/opportunities/texas-education-savings-account), because [participating students cannot be counted toward a district's average daily attendance](https://www.texaspolicyresearch.com/texas-releases-final-esa-rules-what-families-need-to-know/).\n\nYear-one scale, as of July 29: [85,344 students confirmed and funded, from ~274,000 applications and 248,000+ determined eligible, with more than 121,000 on a waiting list](https://www.kxan.com/news/texas/more-than-85000-students-in-texas-received-school-voucher-funding-for-new-academic-year/). Notably, [895 districts have at least one participating student](https://www.kxan.com/news/texas/more-than-85000-students-in-texas-received-school-voucher-funding-for-new-academic-year/) — meaning nearly every district in the state has a demand signal in its own attendance zone.\n\nI found **no evidence of any Texas district launching a fee-for-service catalog.** The program is roughly two weeks into year one, so absence is not yet evidence. But given Channel A's record, the prior should be low.\n\n### What this does to the framework\n\nThe memo's third pattern — statutory design determines the response set — survives but needs a second condition. Statutory permission is **necessary and not sufficient.** Texas grants permission on two channels and pays cash on one, and district behavior on the tested channel is refusal by the largest systems.\n\nSo what actually explains Florida's 75%? Candidate mechanisms worth testing, in rough order of my confidence:\n\n1. **Loss magnitude.** Florida districts are shedding FTE at a rate that makes marginal revenue existential (Escambia projecting ~7,000 students lost to scholarships; Orange redirecting $211M). Texas districts have not yet felt year one. Adaptation may require crisis, not opportunity.\n2. **Cost visibility.** UIL participation consumes a visibly scarce good — a roster spot, a coach's time, a band chair. Selling a seat in an existing online AP course consumes something the district perceives as free. **Districts adapt where the marginal cost is invisible, not where the marginal revenue is largest.** This is my leading hypothesis and it's testable: if it's right, Texas district uptake on TEFA fee-for-service will substantially exceed 4% even though UIL didn't.\n3. **Intermediation.** Step Up packaged the Florida channel — onboarding one-pager, W-9/EIN/bank details, a Community of Practice, a sample email families can send to non-participating districts. Texas has a CEAO but no comparable district-facing sales motion that I can find. Someone had to sell districts on being vendors.\n4. **Political cover.** In Florida, participation is now normal — three-quarters of peers are in. In Texas, a board vote to serve homeschoolers is still a solo, attributable act.\n\nMechanism 2 vs. 4 is the fork worth resolving. It's the difference between \"districts respond to incentives with a lag\" and \"districts respond to visible zero-sum competition by refusing revenue.\"\n\n---\n\n## Colorado: the contraction has started, and it is measurable\n\nThe memo flagged Colorado as the mature version of the market and SB 26-023 as the re-regulation. That bill is now law and the consequences are landing.\n\n**What the act does.** It [prohibits a BOCES from acting as a statewide authorizer and limits a BOCES to operating a school or program outside its member districts' boundaries only under specified conditions; permits a local education provider to offer part-time homeschool programs if conditions are satisfied; and requires an authorizer contracting with an education management provider to maintain independence from and oversight of that provider](https://leg.colorado.gov/bills/sb26-023). It also [bars enrichment programs from providing activities not generally available to students attending public schools](https://sentinelcolorado.com/state-and-region-news/colorado-news-state-and-region-news/new-law-restricts-erboces-homeschool-enrichment-programs-saving-millions/).\n\n**The \"contract school\" shutdown is the sharpest piece.** CDE now states plainly that private entities contracting with a BOCES to deliver *full-time* education while drawing full-time funding was never permitted, and [the legislature has clarified that creating such \"contract schools\" is not allowed](https://ed.cde.state.co.us/cdefinance/school-finance-act-updates). CDE's suggested off-ramps for those programs: integrate into a district or charter program, seek a charter contract, or seek authorization as a part-time homeschool program.\n\n**Rate and scale, for the record.** The state pays [roughly $6,000 a year on average per part-time student, typically for one day a week of classes](https://sentinelcolorado.com/state-and-region-news/colorado-news-state-and-region-news/new-law-restricts-erboces-homeschool-enrichment-programs-saving-millions/), against [$100M+/year and 18,695 part-time students](https://go.boarddocs.com/co/cde/Board.nsf/files/DQD82R1C3A03/$file/2026.01.13%20January%20Bd%20Mtg%20Part-Time%20Programs%20Presentation.pdf). That per-student rate is the number to compare against Florida's à la carte pricing and Texas's $1,500/activity — it is the closest thing anyone has to a market price for unbundled public instruction.\n\n**The contraction, quantified two ways:**\n\n- The fiscal note projects an [appropriation *decrease* of about $8.3 million in FY 2026–27, on the expectation that the new rules lead to significantly fewer students enrolling in these hybrid public programs](https://www.assemblyrequired.co/bills/SB26-023). The state budgeted for the market to shrink.\n- ERBOCES executive director Ken Witt says [\"very few\" programs will open this fall and \"dozens\" cannot continue](https://gazette.com/2026/07/05/homeschool-enrichment-programs-in-limbo-following-state-funding-changes/).\n\n**The authorizer arbitrage, named.** ERBOCES has [only two member districts — District 49 in El Paso County and Elizabeth School District in Elbert County](https://sentinelcolorado.com/state-and-region-news/colorado-news-state-and-region-news/new-law-restricts-erboces-homeschool-enrichment-programs-saving-millions/) — and authorized programs across the state from that base. That is the structural loophole the legislature closed, and it's a pattern worth watching for in any state that lets a small local authorizer operate statewide. [D-49's board spent its June meeting debating whether to continue the partnership at all](https://gazette.com/2026/07/05/homeschool-enrichment-programs-in-limbo-following-state-funding-changes/).\n\n**A live process to track.** CDE opened applications June 15 for out-of-boundary part-time programs; as of [July 15 the department had received 47 applications, under a 30-business-day review clock, with rulemaking to follow in the fall](https://ed.cde.state.co.us/newsbureau/newsrelease/updates-on-budget-and-part-time-homeschool-programs). The September 15 deadline and the fall rulemaking are the next two decision points. **47 is a real number and it will be resolvable into a list.**\n\n**Second-order effect worth noting:** the act reaches families, not just providers. Students in a publicly funded enrichment program [may no longer use umbrella-school enrollment to satisfy compulsory attendance; they must file a Notice of Intent with a district](https://www.theumbrellaschool.com/post/sb26-023-homeschool-enrichment-funding) — which pulls them into the full homeschool statute including periodic testing or evaluation. Accepting public money for part-time services now imports regulatory status. That is the regulatory-capture-by-funding dynamic in its cleanest observable form, and it happened to *families*, not institutions.\n\n---\n\n## The roster: blocked, with a workaround\n\nStep Up's Contracted Public Schools page confirms the structure but I could not retrieve the list. The page carries **three** separate data objects:\n\n- A districts map: `api.ultimaps.com/player/e4fad24a-8ca9-4ce4-bfc8-04ff3af6af5a`\n- A charter schools map: `api.ultimaps.com/player/ae3faa0d-4322-496a-a6be-352fe0afaac6`\n- The list table: `datawrapper.dwcdn.net/bX34V/1/`\n\nAll three are on embed hosts my fetch tool refuses. The Datawrapper chart ID resolves to a CSV at the standard `dataset.csv` path under that chart directory — trivially retrievable from a browser or `curl`, and probably a two-minute job for you directly.\n\nThe page also confirms two details worth quoting exactly in any writeup:\n\n- Services offered are [\"courses, tutoring, therapy, assessments and other approved services, while receiving direct payment\"](https://www.stepupforstudents.org/contracted-public-schools/) — therapy and assessments are on that list, which means districts are selling *related services*, not just instruction. Given that related services are the expensive part of IDEA compliance, this deserves its own look.\n- Step Up markets district participation as a chance to reach families [\"in your local community and beyond\"](https://www.stepupforstudents.org/contracted-public-schools/) — the statewide-reach pitch is explicit.\n\n**Also new since my last pass:** the site now carries a Public School Attestation notice — families who were considered for Quarter 1 funding must complete an attestation regarding public school enrollment status. This is almost certainly the operational fix for the double-counting problem the Auditor General flagged. Worth confirming whether it was imposed by the 2026 legislation or adopted by Step Up voluntarily; the answer says something about who is actually regulating this market.\n\n---\n\n## Revenue magnitude: I now know where the number lives\n\nStill unpublished. But the reporting path is identifiable: district à la carte receipts would appear as local revenue in the [School District Annual Financial Report](https://www.fldoe.org/finance/fl-edu-finance-program-fefp/school-dis-annual-financial-reports-af.stml), which details revenue by federal, state, and local source and is submitted by every district, and in the [District Summary Budget](https://www.fldoe.org/finance/fl-edu-finance-program-fefp/school-dis-summary-budget.stml).\n\nTwo cautions before anyone tries to extract it: the amounts are almost certainly small enough in year one to be buried in a miscellaneous local-revenue line, and there is no reason to expect a consistent object code across 67 districts. A cleaner first cut would be three or four public-records requests to districts already known to be selling at scale — Miami-Dade (95+ classes), Hillsborough, Duval, Orange.\n\n**Until that number exists, \"districts are becoming vendors\" remains a behavioral claim, not a financial one.** With Texas Channel A in hand, I'd now go further: participation counts may substantially overstate commitment. A district can be an approved provider with two courses listed and no students.\n\n---\n\n## Revised summary judgment\n\nThe August 15 memo said Florida proves districts can adapt fast. That's still true. But the correct generalization is narrower and more interesting:\n\n> **Districts adapt into channels where the marginal cost of serving a non-enrolled student is invisible, and refuse channels where it is visible — even when the visible-cost channel pays cash and the invisible-cost channel doesn't.**\n\nFlorida's 75% and Texas's 4% are the two endpoints, and both involve serving students the district does not enroll. If that framing holds up, the policy implication is uncomfortable for both camps: choice advocates should design channels that look like surplus-capacity sales rather than shared-resource access, and district advocates should notice that their institutions are revealing a preference for revenue that doesn't require them to share anything scarce.\n\n---\n\n## Next three\n\n1. **Pull the Datawrapper CSV** and cross it against FLDOE district enrollment — is participation correlated with enrollment loss, or with district size? If it tracks loss, the crisis-driven hypothesis gains. If it tracks size, it's administrative capacity.\n2. **Texas TEFA district uptake, checked at the October and January marks.** This is the live falsification test of the invisible-cost hypothesis, and the window to establish a baseline is now, before anyone else is counting.\n3. **The Colorado 47.** Get the application list when CDE publishes decisions after Septem
